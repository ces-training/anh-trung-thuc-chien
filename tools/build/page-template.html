<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Anh – Trung Thực Chiến · Học trên web</title><link rel="canonical" href="https://ces-training.github.io/anh-trung-thuc-chien/tuan-1/"><link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>body{padding-bottom:env(safe-area-inset-bottom)}</style></head><body><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;700&display=swap">
<style>
/* Khung học theo kiểu chuỗi bài 21 ngày: Hành trình tuần (tuyến tàu) → Trang buổi học (thẻ chính + lưới bài) → Trình làm bài (cách làm → từng câu → màn kết).
   Xanh = tiếng Anh, đỏ = tiếng Trung, vàng = điểm và nút hành động phụ. */
:root{
  --bg:#F5F6FA; --surface:#FFFFFF; --soft:#EEF1F8; --ink:#0E1730; --muted:#515B70; --line:#DDE2EC;
  --en:#1F44D6; --en-soft:#E7ECFF; --zh:#D3271E; --zh-soft:#FDECEA; --sun:#FFD43B; --sun-soft:#FFF4C7; --sun-ink:#3B2F00;
  --green:#15803D; --green-soft:#E3F5E9; --slate:#334155; --slate-soft:#E8ECF3;
  --good:#146C43; --good-bg:#E5F4EB; --bad:#B42318; --bad-bg:#FFF1EF; --mark:#FFD6CF;
  --acc:var(--en); --acc-soft:var(--en-soft);
  --font:"Be Vietnam Pro","Segoe UI",system-ui,-apple-system,sans-serif;
  --han:"Noto Sans SC","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --shadow:0 1px 2px rgba(14,23,48,.06),0 6px 18px -8px rgba(14,23,48,.18);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1020; --surface:#131B31; --soft:#18223C; --ink:#EEF2FA; --muted:#A9B3C7; --line:#283553;
  --en:#8EA2FF; --en-soft:#1B2858; --zh:#FF8475; --zh-soft:#3A1B17; --sun:#FFD43B; --sun-soft:#3A3212; --sun-ink:#FFE89A;
  --green:#5BD38C; --green-soft:#10301F; --slate:#C3CCDD; --slate-soft:#1E2945;
  --good:#5BD38C; --good-bg:#0F2D1E; --bad:#FF8A7E; --bad-bg:#33171A; --mark:#6B2620; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px -10px rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0B1020; --surface:#131B31; --soft:#18223C; --ink:#EEF2FA; --muted:#A9B3C7; --line:#283553;
  --en:#8EA2FF; --en-soft:#1B2858; --zh:#FF8475; --zh-soft:#3A1B17; --sun:#FFD43B; --sun-soft:#3A3212; --sun-ink:#FFE89A;
  --green:#5BD38C; --green-soft:#10301F; --slate:#C3CCDD; --slate-soft:#1E2945;
  --good:#5BD38C; --good-bg:#0F2D1E; --bad:#FF8A7E; --bad-bg:#33171A; --mark:#6B2620; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px -10px rgba(0,0,0,.6); color-scheme:dark }
:root[data-track="zh"]{--acc:var(--zh);--acc-soft:var(--zh-soft)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.6 var(--font);-webkit-font-smoothing:antialiased}
[lang="zh"]{font-family:var(--han)}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance}
p{margin:0} a{color:var(--acc)} button{font:inherit;color:inherit}
.muted{color:var(--muted)} .small{font-size:16.5px}
.eyebrow{font-size:15.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}
.lead{font-size:18.5px;color:var(--muted);max-width:62ch}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

/* nút */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1.5px solid transparent;font-weight:700;font-size:17.5px;cursor:pointer;background:var(--soft);color:var(--ink);text-decoration:none;transition:transform .08s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--acc);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--acc) 60%,#000)}
.btn.huge{min-height:56px;padding:0 24px;font-size:19px;border-radius:14px}
.btn.ghost{background:var(--surface);border-color:var(--line)}
.btn.small{min-height:38px;padding:0 12px;font-size:16.5px}
.btn.sound{background:var(--acc);color:#fff;border-radius:999px;min-height:40px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.center{justify-content:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-weight:700;font-size:16.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.star{background:var(--sun);color:#3B2F00}
.pill.ok{background:var(--good-bg);color:var(--good)}
.pill.lock{background:var(--soft);color:var(--muted)}
.pill.go{background:var(--acc);color:#fff}

/* thanh trên */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:9;background:var(--surface);box-shadow:0 1px 0 var(--line)}
.bar1{display:flex;align-items:center;gap:10px 14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;margin-right:auto;font-weight:800;letter-spacing:-.01em}
.brand small{display:block;font-weight:500;font-size:15.5px;color:var(--muted)}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--soft);gap:2px}
.seg button{min-height:34px;padding:0 10px;border:0;border-radius:8px;background:transparent;font-weight:700;font-size:16.5px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(14,23,48,.15)}
.seg button[data-lang="en"][aria-pressed="true"]{color:var(--en)} .seg button[data-lang="zh"][aria-pressed="true"]{color:var(--zh)}
.icbtn{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted)}
.pill.strk{background:var(--zh-soft);color:var(--zh)}
.nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nv{flex:none;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--soft);color:var(--muted);text-decoration:none;font-weight:700;font-size:16.5px}
.nv span{display:inline-flex;align-items:center;font-size:15px;font-weight:700;padding:1px 6px;border-radius:999px;background:var(--surface);font-variant-numeric:tabular-nums}
.nv.full span{background:var(--good-bg);color:var(--good)}
.nv.on{background:var(--ink);color:var(--bg)} .nv.on span{background:color-mix(in srgb,var(--bg) 20%,transparent);color:var(--bg)}
@media (max-width:720px){.top{position:static}.brand small{display:none}.bar1{gap:8px}}

main{padding-block:22px 90px;outline:none}
main:focus,main:focus-visible{outline:none}

/* trang chủ */
.home{display:flex;flex-direction:column;gap:20px}
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;background:var(--surface);border-radius:22px;padding:clamp(18px,3vw,30px);box-shadow:var(--shadow)}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero-txt{display:flex;flex-direction:column;gap:12px;align-items:flex-start;min-width:0}
.hero h1{font-size:clamp(26px,3.6vw,38px);font-weight:800;letter-spacing:-.02em}
.bar{width:100%;height:10px;border-radius:999px;background:var(--soft);overflow:hidden}
.bar.big{height:14px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),color-mix(in srgb,var(--acc) 60%,var(--sun)));border-radius:999px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-content:start}
.stat{display:flex;flex-direction:column;gap:2px;padding:14px;border-radius:16px;background:var(--soft);text-decoration:none;color:var(--ink)}
.stat b{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.stat small{color:var(--muted);font-size:16px}
.ic{width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:4px}
.ic.sun{background:var(--sun);color:#3B2F00}.ic.zh{background:var(--zh-soft);color:var(--zh)}.ic.en{background:var(--en-soft);color:var(--en)}.ic.green{background:var(--green-soft);color:var(--green)}
.journey{background:var(--surface);border-radius:22px;padding:clamp(18px,3vw,26px);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.journey h2,.livecard h2{font-size:22px}
.line{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;position:relative}
.line::before{content:"";position:absolute;left:4%;right:4%;top:17px;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--en),var(--zh))}
.stn{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.stn a{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:var(--ink)}
.stn .dot{width:40px;height:40px;border-radius:50%;background:var(--surface);border:5px solid var(--slate);display:flex;align-items:center;justify-content:center;color:#fff;position:relative;z-index:1}
.stn.done .dot{background:var(--good);border-color:var(--good)}
.stn.cur .dot{border-color:var(--acc);box-shadow:0 0 0 6px var(--acc-soft)}
.stn.live .dot{background:var(--ink);border-color:var(--sun);width:44px;height:44px;margin-top:-2px}
.stn b{font-size:17px}
.stn small{font-size:15.5px;color:var(--muted);line-height:1.35}
.stn em{font-style:normal;font-size:15px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:760px){
  .line{grid-template-columns:minmax(0,1fr);gap:0}
  .line::before{left:19px;right:auto;top:10px;bottom:10px;width:6px;height:auto;background:linear-gradient(180deg,var(--en),var(--zh))}
  .stn,.stn a{flex-direction:row;align-items:center;text-align:left;gap:12px;padding-block:6px}
  .stn small{display:block}
  .stn a>b,.stn>b{min-width:62px}
  .stn.live{padding-left:0}
}
.livecard{background:var(--ink);color:var(--bg);border-radius:22px;padding:clamp(18px,3vw,26px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:center}
.livecard .eyebrow{color:var(--sun)} .livecard p{color:color-mix(in srgb,var(--bg) 80%,transparent)}
.livecard .keys{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.livecard .keys li{background:color-mix(in srgb,var(--bg) 10%,transparent);border:1px solid color-mix(in srgb,var(--bg) 25%,transparent);border-radius:12px;padding:10px 14px;font-weight:600;font-size:18px}
@media (max-width:760px){.livecard{grid-template-columns:minmax(0,1fr)}}
.donebanner{background:var(--sun-soft);color:var(--ink);border-radius:12px;padding:10px 14px;font-weight:700}

/* trang buổi học */
.dayview{display:grid;grid-template-columns:minmax(0,370px) minmax(0,1fr);gap:20px;align-items:start}
.dayview.one{grid-template-columns:minmax(0,1fr)}
@media (max-width:900px){.dayview{grid-template-columns:minmax(0,1fr)}}
.dhero{background:var(--surface);border-radius:22px;padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;position:sticky;top:130px}
@media (max-width:900px){.dhero{position:static}}
.dhero h1{font-size:clamp(24px,3vw,30px);font-weight:800;letter-spacing:-.02em}
.chip{align-self:flex-start;background:var(--acc);color:#fff;font-weight:700;font-size:16px;padding:4px 12px;border-radius:999px}
.who{display:flex;gap:12px;align-items:center;background:var(--soft);border-radius:14px;padding:10px 12px}
.who small{display:block;font-size:15px;color:var(--muted)}
.av{width:44px;height:44px;border-radius:50%;background:var(--acc-soft);color:var(--acc);font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.note{font-size:16.5px;color:var(--muted);border-left:3px solid var(--sun);padding-left:10px}
.tiles{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;height:100%;border-radius:20px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow);text-decoration:none;color:var(--ink);border:3px solid transparent;position:relative;transition:transform .12s}
.tile:hover{transform:translateY(-2px)}
.tile .art{height:118px;display:flex;align-items:center;justify-content:center;background:var(--tile-bg);color:var(--tile-fg)}
.tile .tmeta{display:flex;flex-direction:column;gap:2px;padding:12px 14px 14px;background:var(--tile-band);color:#fff;flex:1}
.tile .tmeta small{font-size:15.5px;font-weight:700;opacity:.9}
.tile .tmeta b{font-size:19px;line-height:1.25}
.tile .tmeta em{font-style:normal;font-size:15.5px;opacity:.9}
.tile .st{position:absolute;top:10px;right:10px}
.tile.cur{border-color:var(--sun)}
.tile.locked{opacity:.55}
.tile.locked:hover{transform:none}
.t-en{--tile-bg:var(--en-soft);--tile-fg:var(--en);--tile-band:#1F44D6}
.t-zh{--tile-bg:var(--zh-soft);--tile-fg:var(--zh);--tile-band:#C2271F}
.t-sun{--tile-bg:var(--sun-soft);--tile-fg:#B07D00;--tile-band:#A16207}
.t-green{--tile-bg:var(--green-soft);--tile-fg:var(--green);--tile-band:#15803D}
.t-slate{--tile-bg:var(--slate-soft);--tile-fg:var(--slate);--tile-band:#334155}

@media (max-width:600px){
  .tiles{grid-template-columns:minmax(0,1fr);gap:10px}
  .tile{flex-direction:row;border-radius:16px}
  .tile .art{height:auto;width:78px;flex:none}
  .tile .art svg{width:36px;height:36px}
  .tile .tmeta{padding:10px 12px;padding-right:64px}
  .tile .tmeta b{font-size:18px}
}
.qt.sm{font-size:17.5px;font-weight:600;color:var(--muted)}
/* trình làm bài */
.player{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.ptop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.crumb{font-weight:700;color:var(--muted);font-size:16.5px;margin-right:auto}
.spd[aria-pressed="true"]{background:var(--sun-soft);border-color:var(--sun)}
.pcard{background:var(--tile-bg);border-radius:24px;padding:clamp(12px,2.4vw,20px);display:flex;flex-direction:column;gap:14px}
.phead{display:flex;align-items:center;gap:12px}
.phead>div{flex:1;min-width:0}
.phead small{font-size:15.5px;font-weight:700;color:var(--tile-fg);text-transform:uppercase;letter-spacing:.08em}
.phead h1{font-size:clamp(19px,2.6vw,24px);font-weight:800}
.art.sm{width:48px;height:48px;border-radius:14px;background:var(--surface);color:var(--tile-fg);display:flex;align-items:center;justify-content:center;flex:none}
.pbody{background:var(--surface);border-radius:20px;padding:clamp(16px,3vw,28px);display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow);min-height:280px}
.intro{display:flex;flex-direction:column;gap:14px}
.rulecard ol{margin:6px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:4px;font-size:18.5px}
.rulebox{background:var(--soft);border-radius:14px;padding:12px 16px;font-size:18px}
.rulebox p:last-child{margin-top:4px}

/* câu hỏi */
.items{display:flex;flex-direction:column;gap:14px}
.prog{display:flex;gap:5px;flex-wrap:wrap}
.prog i{width:26px;height:8px;border-radius:4px;background:var(--line)}
.prog i.now{background:var(--acc);width:40px} .prog i.ok{background:var(--good)} .prog i.fix{background:var(--sun)}
.stage{display:flex;flex-direction:column;gap:14px}
.qhead{display:flex;justify-content:space-between}
.qn{font-size:16px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.q{display:flex;flex-direction:column;gap:14px;margin:0;align-items:stretch}
.qt{font-size:clamp(19px,2.4vw,23px);font-weight:700;text-align:center;line-height:1.35}
.q .au{align-self:center}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;min-height:64px;padding:12px 14px;border:2px solid var(--line);border-radius:16px;background:var(--surface);cursor:pointer;font-size:19px;font-weight:600;box-shadow:0 3px 0 var(--line)}
.opt .badge{flex:none;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16.5px;color:#fff;background:var(--en)}
.opt:nth-child(2) .badge{background:#C2410C} .opt:nth-child(3) .badge{background:var(--green)} .opt:nth-child(4) .badge{background:#7C3AED}
.opt .ot[lang="zh"]{font-size:23px}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);box-shadow:0 3px 0 color-mix(in srgb,var(--bad) 40%,transparent)}
.opt.wrong .ot{text-decoration:line-through;text-decoration-color:var(--bad)}
.opt.right{border-color:var(--good);background:var(--good-bg);box-shadow:0 3px 0 color-mix(in srgb,var(--good) 40%,transparent)}
.opt.hint{border-color:var(--good);border-style:dashed}
.opt:disabled{cursor:default}
.inp{flex:1 1 220px;min-width:0;min-height:56px;padding:0 16px;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font:600 19px var(--font);text-align:center}
.inp:focus{border-color:var(--acc);outline:none;background:var(--surface)}
.area{width:100%;flex-basis:100%;min-height:150px;padding:14px 16px;line-height:1.6;resize:vertical;text-align:left;font-weight:500;font-size:19px}
.ans,.pool{display:flex;flex-wrap:wrap;gap:10px;min-height:64px;align-items:center;justify-content:center;padding:10px;border-radius:16px}
.ans{background:var(--soft);border:2px dashed var(--line)}
.tok{min-height:52px;padding:0 16px;border-radius:14px;border:2px solid #E6B800;background:var(--sun);color:#3B2F00;cursor:pointer;font-size:21px;font-weight:700;display:inline-flex;align-items:center;gap:6px;box-shadow:0 3px 0 #C99A00}
.ans .tok{background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:0 3px 0 var(--line)}
.tok small{font-size:14px;color:var(--muted);font-weight:700}
.tok.right{border-color:var(--good);box-shadow:0 3px 0 var(--good)}
.tok.wrong{border-color:var(--bad);background:var(--bad-bg);box-shadow:0 3px 0 var(--bad)}
.crit{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:17.5px}
.crit li::before{content:"○ ";color:var(--muted)}
.crit li.ok::before{content:"✓ ";color:var(--good);font-weight:800}
.crit li.no{color:var(--bad)} .crit li.no::before{content:"✗ ";font-weight:800}
.next{align-self:center;min-height:56px;padding:0 30px;font-size:19px;border-radius:14px}

/* phản hồi */
.fb{border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;font-size:18px;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.98);opacity:.6}to{transform:none;opacity:1}}
.fb.good{background:var(--good-bg);border:2px solid color-mix(in srgb,var(--good) 45%,transparent)}
.fb.bad{background:var(--bad-bg);border:2px solid color-mix(in srgb,var(--bad) 40%,transparent)}
.fbt{font-weight:800;font-size:18.5px}
.fb.good .fbt{color:var(--good)} .fb.bad .fbt{color:var(--bad)}
.lab{font-weight:700;color:var(--muted);font-size:16.5px}
.where{font-size:20px}
mark.bad{background:var(--mark);color:var(--ink);border-radius:5px;padding:0 4px;text-decoration:underline wavy var(--bad);text-underline-offset:4px}
.gap{display:inline-block;min-width:1.4em;text-align:center;color:var(--bad);font-weight:800;border-bottom:2px solid var(--bad);margin:0 2px}

/* ---------- dựng bài theo ngày ---------- */

  if (typeof COURSE !== "undefined" && cweekOf(day)) { const cx = courseEx(ex, day, base); return L === "zh" && S.level === 1 ? easyZH(cx) : cx; }

  } else if (base === "C") { ex.kind = "shadow"; ex.lines = D.shadow; }
  else if (base === "D") ex.items = pickMC(D.sound);

  else if (base === "F") ex.items = D.order.map(o => Object.assign({ k: "order" }, o));
  else if (base === "G") ex.items = pickType(code === "G1" ? D.cloze.slice(0, 6) : D.cloze.slice(6));

  else if (base === "L") { ex.items = D.test.map(o => Object.assign({}, o)); ex.test = true; }

/* ---------- tiếng Trung Mức 1: nhận diện và xếp chữ thay cho gõ ---------- */
function zhDict() {

  learnedPool("zh").forEach(c => { const w = String(c.w).replace(/[，。！？、\s]/g, ""); if (/^[\u4e00-\u9fff]{1,6}$/.test(w) && c.py && !d[w]) d[w] = { py: c.py, m: c.m }; });

    "阮安": { py: "Ruǎn Ān", m: "Nguyễn An" }, "王丽": { py: "Wáng Lì", m: "Vương Lệ" }, "阮明": { py: "Ruǎn Míng", m: "Nguyễn Minh" } });

}

}
function zhPy(w) { const d = zhDict(), k = String(w).replace(/[，。！？、]/g, ""); if (d[k]) return d[k].py; return zhSeg(k).map(t => (d[t.replace(/[，。！？、]/g, "")] || {}).py || "").join(" ").trim(); }

    if (han <= 3) {

      const why = {}; (it.diag || []).forEach(d => { if (typeof d[1] === "string") why[d[1]] = d[2]; });
      const pool = seeded(bank.filter(w => w !== model && !wrong.includes(w) && [...w].length === han), i * 5 + model.length).map(x => x[0]);

/* ---------- chạy các câu hỏi ---------- */
const AUTO_MS = 1200, SHOW_ANS_MS = 2000, MAX_ROUNDS = 4;
/* nghĩa song ngữ: tiếng Anh trước, tiếng Việt sau */
function bi(en, vi) { en = String(en || "").trim(); vi = String(vi || "").trim(); return en && vi && en.toLowerCase() !== vi.toLowerCase() ? en + " · " + vi : (en || vi); }
function biHTML(en, vi, tag) { tag = tag || "span"; en = String(en || "").trim(); vi = String(vi || "").trim(); if (en && vi && en.toLowerCase() === vi.toLowerCase()) vi = ""; return (en ? `<${tag} class="men" lang="en">${esc(en)}</${tag}>` : "") + (vi ? `<${tag} class="mvi" lang="vi">${esc(vi)}</${tag}>` : ""); }
/* đoạn chữ lẫn Việt – Hán: chữ Hán luôn kèm bính âm (trừ khi ngay sau đã có bính âm trong ngoặc) */
function zhMixed(L, text) { return L === "zh" && typeof glossMixed === "function" ? glossMixed(text) : esc(text); }
const autoOn = () => S.autoplay !== false;
/* câu tương tự để làm lại: dùng phương án có sẵn (alts) hoặc xáo lại đáp án */
function similarItem(it, round) {
  if (it.alts && it.alts.length) return Object.assign({}, it.alts[(round - 1) % it.alts.length], { alts: it.alts });
  const c = Object.assign({}, it);
  if (it.k === "mc") {
    const perm = seeded(it.opts.map((_, i) => i), round * 7 + it.opts.length).map(x => x[0]);
    c.opts = perm.map(i => it.opts[i]); c.a = perm.indexOf(it.a);
    if (it.optsPy) c.optsPy = perm.map(i => it.optsPy[i]);
    if (it.optsEn) c.optsEn = perm.map(i => it.optsEn[i]);
    if (it.optsArt) c.optsArt = perm.map(i => it.optsArt[i]);

  }

}
function answerText(L, it) { return it.k === "mc" ? it.opts[it.a] : it.k === "order" ? it.tokens.join(L === "zh" ? "" : " ").replace(/ ([?!.,])/g, "$1") : it.model; }
function runItems(ex, body, finish) {
  const L = S.lang, n0 = ex.items.length, flow = !ex.items.some(it => it.k === "free");
  const res = ex.items.map(() => ({ first: null, done: false, fixed: false, gaveUp: false }));
  const queue = ex.items.map((it, i) => ({ it, src: i, round: 0 }));
  let qi = 0, autoT = null;
  const wrap = el(`<div class="items"><div class="prog" aria-hidden="true">${ex.items.map(() => "<i></i>").join("")}</div><div class="stage"></div></div>`);
  body.appendChild(wrap);
  const stage = $(".stage", wrap), dots = [...wrap.querySelectorAll(".prog i")];
  const paintDots = cur => dots.forEach((d, i) => d.className = res[i].done ? (res[i].first ? "ok" : "fix") : res[i].first === false ? "redo" : i === cur ? "now" : "");
  function next() {
    clearTimeout(autoT); stopAudio();
    qi++;
    if (qi < queue.length) { show(); return; }
    const first = res.filter(r => r.first).length, repair = res.filter(r => !r.first && r.done && !r.gaveUp).length;
    let extra = "";
    if (ex.test) {
      const by = {}; ex.items.forEach((it, i) => { const k = it.s; by[k] = by[k] || [0, 0]; by[k][1]++; if (res[i].first) by[k][0]++; });
      extra = "Theo kỹ năng: " + Object.keys(by).map(k => `${k} ${by[k][0]}/${by[k][1]}`).join(", ");
    } else if (repair) extra = `Làm lại đúng ${repair} câu từng sai`;
    if (ex.openScript) ex.openScript();
    finish({ total: n0, first, repair, extra, firstFlags: res.map(r => !!r.first) });
  }
  function show() {
    const q = queue[qi], it = q.it, r = res[q.src], st = { tries: 0, hints: 0, done: false, revealed: false };
    paintDots(q.src);
    stage.innerHTML = "";
    const left = queue.length - qi - 1;
    stage.appendChild(el(`<div class="qhead"><span class="qn">${q.round ? `<span class="redo-tag">🔁 Làm lại câu tương tự</span>` : `Câu ${q.src + 1}/${n0}`}${it.s ? " · " + esc(it.s) : ""}</span>${left > 0 && qi >= n0 ? `<span class="small muted">còn ${left} câu</span>` : ""}</div>`));

      st.done = true;

      r.done = true; if (q.round > 0) r.fixed = true;
      paintDots(q.src);

      const nextBtn = el(`<button type="button" class="btn primary next">${last ? "Hoàn thành bài" : "Câu tiếp →"}</button>`);
      stage.appendChild(nextBtn); nextBtn.onclick = next;
      if (flow && !last && clean1(st)) { const note = el(`<p class="autonote small muted">Tự sang câu tiếp…</p>`); stage.appendChild(note); autoT = setTimeout(next, AUTO_MS); }
      else nextBtn.focus();

    const ctx = { L, ex, st, it, onDone, stage, idx: qi + q.round * 3 };
    if (flow && !ex.test && q.round < MAX_ROUNDS) {
      if (q.round === 0) {
        /* sai lần đầu: hiện đáp án đúng 2 giây rồi sang câu tiếp; cuối bài làm lại câu tương tự */
        ctx.onWrong = () => {
          if (r.first == null) r.first = false;
          stage.querySelectorAll("button,input").forEach(x => { if (!x.classList.contains("stay")) x.disabled = true; });
          const ans = answerText(L, it);
          const fb = el(`<div class="fb bad"><p class="fbt">Chưa đúng, không sao!</p><p class="why">Đáp án đúng: <b lang="${L === "zh" ? "zh" : "en"}">${esc(ans)}</b>${L === "zh" && /[一-鿿]/.test(ans) ? ` <span class="py">${esc(pyOf(ans))}</span>` : ""}</p><p class="small muted">Cuối bài bạn sẽ gặp lại một câu tương tự.</p></div>`);
          stage.appendChild(fb); paintDots(q.src);
          if (it.k === "mc") { const okb = stage.querySelector(`.opt[data-i="${it.a}"]`); if (okb) okb.classList.add("right"); }
          if (/[一-鿿]/.test(ans) || L === "en") say(ans, L);
          addReview(L, it.revF || String(it.q || "").replace(/^Thẻ ôn từ lỗi của bạn: /, ""), it.revB || ans, it);
          queue.push({ it: similarItem(it, 1), src: q.src, round: 1 });

        };
      } else {
        /* sai ở lần làm lại: hiện gợi ý, rồi chuyển sang một câu tương tự khác; lặp đến khi đúng */
        ctx.afterWrong = () => {
          if (stage.querySelector(".simbtn")) return;
          setTimeout(() => {
            stage.querySelectorAll(".opt,.tok,.inp,.chk").forEach(x => x.disabled = true);
            const b = el(`<button type="button" class="btn primary simbtn">Đã hiểu, làm câu tương tự →</button>`);
            stage.appendChild(b); b.focus();
            b.onclick = () => { queue.push({ it: similarItem(it, q.round + 1), src: q.src, round: q.round + 1 }); next(); };

    }
    if (it.k === "mc") itemMC(ctx); else if (it.k === "type") itemType(ctx); else if (it.k === "order") itemOrder(ctx); else if (it.k === "free") itemFree(ctx);

/* ---------- gợi ý từng bậc: giúp nhớ lại, không chỉ kiểm tra ---------- */

}

/* ---------- đọc có lời kết thúc (để cảnh tự chạy) ---------- */
function sayThen(text, lang, pitch, cb, who) {
  let done = false; const end = () => { if (!done) { done = true; cb && cb(); } };
  const f = who === "\u0000" ? null : audFile(text, lang, who);
  if (f) { playFile(f, S.slow, end, () => sayThen(text, lang, pitch, cb, "\u0000")); return; }
  const ms = 900 + String(text).length * (lang === "zh" ? 260 : 75) * (S.slow ? 1.35 : 1);
  try { speakSafe(text, lang, S.slow ? 0.72 : 0.95, pitch, end); } catch (e) { end(); }
  setTimeout(end, ms + 1500);
}

/* ---------- dựng nội dung học trước cho buildEx ---------- */
function learnEx(ex, code) {
  const L = S.lang, D = DATA[L], X = LEARN[L], base = code[0];
  ex.rule = LEARN_RULE[base];
  if (base === "T") { ex.kind = "cards"; ex.cards = X.cards[code]; ex.title = code === "T4" ? "Thẻ học: câu khoá cho trạm" : code === "T3" ? "Thẻ học: nói trang trọng" : "Thẻ học: từ và cụm câu mới"; }
  if (base === "P") { ex.kind = "pattern"; ex.pats = X.patterns[code]; ex.title = "Mẫu câu cần nắm"; }
  if (base === "S") {
    const sc = X.scenes[code]; ex.kind = "scene"; ex.setting = sc.setting; ex.bg = sc.bg;
    let lines = [];
    if (sc.src === "dialogue" || sc.src === "dialogue2") {
      lines = D[sc.src].map(r => L === "zh" ? { who: r[0], t: r[1], py: r[2], vi: r[3] } : { who: r[0], t: r[1], vi: r[2] });
      ex.title = "Xem cảnh: " + (code === "S1" ? "cuộc làm quen" : "hội thoại thứ hai");
    } else {
      const rp = sc.src === "rpbase" ? D.roleplay.base : D.roleplay.variant, partner = rp.partner.split(" · ")[0].split(" ")[0];
      rp.turns.filter(t => !t.m2 || S.level === 2).forEach(t => {
        lines.push({ who: partner, t: t.ai, py: t.py || "", vi: /^\(/.test(t.vi) ? "" : t.vi });
        lines.push({ who: sc.me, t: t.model, vi: "" });
      });
      ex.title = code === "S3" ? "Xem cảnh mẫu trước khi đóng vai" : "Xem cảnh mẫu trang trọng";
    }
    ex.lines2 = lines; ex.people = [...new Set(lines.map(l => l.who))].slice(0, 2);
  }
  return ex;
}

/* ---------- thẻ học ---------- */
function runCards(ex, body, finish) {
  const L = S.lang, cards = ex.cards; let i = 0, flipped = false, saved = 0;
  const box = el(`<div class="cardsx"><div class="prog" aria-hidden="true">${cards.map(() => "<i></i>").join("")}</div>
    <div class="fcard" tabindex="0" role="button" aria-label="Lật thẻ"></div>
    <div class="row center ctl"><button type="button" class="btn ghost prev">← Thẻ trước</button><button type="button" class="btn ghost flip">Lật thẻ</button><button type="button" class="btn primary nx">Thẻ tiếp →</button></div>
    <div class="row center"><button type="button" class="btn ghost small keep">Lưu thẻ này vào kho ôn</button></div></div>`);
  body.appendChild(box);
  const fc = $(".fcard", box), dots = [...box.querySelectorAll(".prog i")];
  function draw(play) {
    const c = cards[i];
    dots.forEach((d, k) => d.className = k < i ? "ok" : k === i ? "now" : "");
    fc.className = "fcard" + (flipped ? " back" : "");
    const ear = ex.ear && L === "zh", han = !ear || hanShown();
    const hanTag = ear ? `<button type="button" class="btn ghost small hz">${han ? "Ẩn chữ Hán" : "Xem chữ Hán"}</button>` : "";
    if (ear) fc.innerHTML = !flipped
      ? `<span class="side">Nghe · ${i + 1}/${cards.length}</span>${iconSVG(cardArt(c), "illu big")}<b class="fw pyw">${esc(c.py)}</b>${han ? `<span class="fhan" lang="zh">${esc(c.w)}</span>` : ""}<button type="button" class="btn sound sp">${ICON.play} Nghe</button><span class="hint">Nghe 2–3 lần, nói to theo, rồi chạm thẻ để xem nghĩa</span>${hanTag}`
      : `<span class="side">Nghĩa · ${i + 1}/${cards.length}</span>${iconSVG(cardArt(c), "illu corner")}<span class="fwb">${esc(c.py)}${han ? ` <small lang="zh">${esc(c.w)}</small>` : ""}</span><b class="fm">${esc(c.m)}</b>
         ${c.ex ? `<div class="fex"><span class="pyl">${esc(c.expy || pyOf(c.ex))}</span>${han ? `<span lang="zh">${esc(c.ex)}</span>` : ""}${c.exm ? `<small>${esc(c.exm)}</small>` : ""}<button type="button" class="btn ghost small spx">${ICON.play} Nghe câu ví dụ</button></div>` : ""}
         <p class="fnote"><span class="lab">Ghi nhớ:</span> ${esc(c.n)}</p>${hanTag}`;
    else fc.innerHTML = !flipped
      ? `<span class="side">Mặt trước · ${i + 1}/${cards.length}</span>${iconSVG(cardArt(c), "illu big")}<b class="fw" lang="${L === "zh" ? "zh" : "en"}">${esc(c.w)}</b>${c.py ? `<span class="fpy">${esc(c.py)}</span>` : ""}<button type="button" class="btn sound sp">${ICON.play} Nghe</button><span class="hint">Chạm thẻ để xem nghĩa</span>`
      : `<span class="side">Mặt sau · ${i + 1}/${cards.length}</span>${iconSVG(cardArt(c), "illu corner")}<span class="fwb" lang="${L === "zh" ? "zh" : "en"}">${esc(c.w)}${c.py ? ` <small>${esc(c.py)}</small>` : ""}</span><b class="fm">${L === "zh" ? biHTML(c.mEn, c.m) : esc(c.m)}</b>
         ${c.ex ? `<div class="fex">${L === "zh" ? glossHTML(c.ex) : `<span lang="en">${esc(c.ex)}</span>`}${L === "zh" && c.exEn ? `<small class="men" lang="en">${esc(c.exEn)}</small>` : ""}${c.exm ? `<small>${esc(c.exm)}</small>` : ""}<button type="button" class="btn ghost small spx">${ICON.play} Nghe câu ví dụ</button></div>` : ""}
         <p class="fnote"><span class="lab">Ghi nhớ:</span> ${esc(c.n)}</p>`;
    if (L === "zh") bindGloss(fc, true);
    const sp = $(".sp", fc); if (sp) sp.onclick = e => { e.stopPropagation(); say(c.w, L); };
    const spx = $(".spx", fc); if (spx) spx.onclick = e => { e.stopPropagation(); say(c.ex, L); };
    const hz = $(".hz", fc); if (hz) hz.onclick = e => { e.stopPropagation(); setHanShown(!hanShown()); draw(false); };
    $(".prev", box).disabled = i === 0;
    $(".nx", box).textContent = i === cards.length - 1 ? "Xong thẻ học" : "Thẻ tiếp →";
    if (play && !flipped) say(c.w, L);
  }
  const flip = () => { flipped = !flipped; draw(false); };
  fc.onclick = flip; fc.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); } };
  $(".flip", box).onclick = flip;
  $(".prev", box).onclick = () => { if (i > 0) { i--; flipped = false; draw(true); } };
  $(".nx", box).onclick = () => { if (i < cards.length - 1) { i++; flipped = false; draw(true); } else finish({ learn: true, extra: `Học ${cards.length} thẻ${saved ? `, lưu ${saved} thẻ vào kho ôn` : ""}` }); };
  $(".keep", box).onclick = () => { const c = cards[i]; addReview(L, L === "zh" ? bi(c.mEn, c.m) : c.m, c.w + (c.py ? " (" + c.py + ")" : "")); saved++; toast("Đã lưu vào kho ôn."); };
  draw(true);
}

    <div class="row center small"><label class="tick"><input type="checkbox" class="cvi" checked> ${L === "zh" ? "Nghĩa (Anh · Việt)" : "Phụ đề tiếng Việt"}</label>${L === "zh" ? `<label class="tick"><input type="checkbox" class="cpy" checked> Bính âm</label>` : ""}</div>

  $(".cvi", box).onchange = e => { subVi = e.target.checked; if (i >= 0) { now.querySelector(".bub2").innerHTML = lineHTML(lines[i]); log.innerHTML = lines.slice(0, i + 1).map(x => `<li class="${x.who === pA ? "l" : "r"}">${lineHTML(x)}</li>`).join(""); } };

}

/* ---------- mẫu câu: 3 bước dễ hiểu — xem và nghe mẫu → tự lắp câu → câu nào đúng? ---------- */
function patTokens(L, t) {
  if (L !== "zh") return String(t).split(/\s+/).filter(Boolean);
  const out = []; segZH(t).forEach(x => { if (x.w) out.push(x.w); else if (out.length && /\S/.test(x.t)) out[out.length - 1] += x.t; else if (/\S/.test(x.t)) out.push(x.t); });
  return out;
}
function runPatterns(ex, body, finish) {
  const L = S.lang, zh = L === "zh", pats = ex.pats; let i = 0, step = 1;
  const st = pats.map(() => ({ built: false, judged: false, tries: 0 }));
  const box = el(`<div class="pats2"><div class="prog" aria-hidden="true">${pats.map(() => "<i></i>").join("")}</div><div class="pcard"></div></div>`);
  body.appendChild(box);
  const card = $(".pcard", box), dots = [...box.querySelectorAll(".prog i")];
  const show = t => zh && /[一-鿿]/.test(t) ? glossHTML(t) : `<span lang="${zh ? "zh" : "en"}">${esc(t)}</span>`;
  function draw() {
    const p = pats[i], s = st[i], ex1 = p.ex[0], ex2 = p.ex[1] || p.ex[0];
    dots.forEach((d, k) => d.className = k < i ? "ok" : k === i ? "now" : "");
    const row = p.f[0] || [];
    const steps = `<ol class="psteps">${["Xem và nghe mẫu", "Tự lắp câu", "Câu nào đúng?"].map((x, k) => `<li class="${k + 1 === step ? "now" : k + 1 < step ? "ok" : ""}">${k + 1 < step ? "✓" : k + 1} · ${x}</li>`).join("")}</ol>`;
    let html = `<p class="eyebrow">Mẫu ${i + 1}/${pats.length}</p><h2 class="ptitle">${esc(p.t)}</h2>${steps}`;
    if (step === 1) {
      html += `<div class="pform">${row.filter(Boolean).map((c, k) => `<span class="pbox${k === 1 ? " key" : ""}">${show(c)}</span>`).join('<span class="plus">+</span>')}</div>
        <div class="pex1"><button type="button" class="btn sound sp1">${ICON.play}</button><div><p class="pbig">${show(ex1[0])}</p><p class="pvi">${zh ? biHTML(ex1[2], ex1[1]) : esc(ex1[1])}</p></div></div>
        ${p.ex.length > 1 ? `<div class="pex1 two"><button type="button" class="btn sound sp2">${ICON.play}</button><div><p class="pbig sm">${show(p.ex[1][0])}</p><p class="pvi">${zh ? biHTML(p.ex[1][2], p.ex[1][1]) : esc(p.ex[1][1])}</p></div></div>` : ""}
        <p class="note small">Nghe, nói to theo câu mẫu 1–2 lần. Ô màu vàng là phần chính của mẫu câu${zh ? "; rê chuột vào chữ để xem nghĩa" : ""}.</p>
        <div class="row center"><button type="button" class="btn ghost prevp" ${i ? "" : "disabled"}>← Mẫu trước</button><button type="button" class="btn primary go2">Tiếp: tự lắp câu →</button></div>`;
    } else if (step === 2) {
      const toks = patTokens(L, ex2[0]), pool = seeded(toks.map((t, k) => ({ t, k })), i + toks.length).map(x => x[0]);
      html += `<p class="qt">Lắp thành câu có nghĩa: <b>“${esc(zh ? bi(ex2[2], ex2[1]) : ex2[1])}”</b></p>
        <div class="pans" aria-live="polite"></div><div class="ppool">${pool.map((x, k) => `<button type="button" class="ptok" data-k="${k}" data-t="${esc(x.t)}">${zh ? glossHTML(x.t) : esc(x.t)}</button>`).join("")}</div>
        <div class="fb" role="status" hidden></div>
        <div class="row center"><button type="button" class="btn ghost back1">← Xem lại mẫu</button><button type="button" class="btn ghost clr">Xếp lại</button><button type="button" class="btn primary chk">Kiểm tra</button></div>`;
      card.innerHTML = html; bind2(toks, pool, ex2); return;
    } else {
      const two = seeded([[p.good, true], [p.bad, false]], i + 3).map(x => x[0]);
      html += `<p class="qt">Câu nào đúng?</p><div class="pjudge">${two.map((x, k) => `<button type="button" class="opt pj" data-k="${k}"><span class="badge">${"AB"[k]}</span><span class="ot">${show(x[0])}</span></button>`).join("")}</div>
        <div class="fb" role="status" hidden></div>
        <div class="row center"><button type="button" class="btn ghost back2">← Lắp câu</button><button type="button" class="btn primary nxp" ${s.judged ? "" : "hidden"}>${i < pats.length - 1 ? "Mẫu tiếp →" : "Đã nắm, sang bài tập"}</button></div>`;
      card.innerHTML = html; bind3(two); return;
    }
    card.innerHTML = html; if (zh) bindGloss(card);
    $(".sp1", card).onclick = () => say(ex1[0], L); const s2 = $(".sp2", card); if (s2) s2.onclick = () => say(p.ex[1][0], L);
    $(".go2", card).onclick = () => { step = 2; draw(); };
    $(".prevp", card).onclick = () => { if (i > 0) { i--; step = 1; draw(); } };
    if (autoOn()) setTimeout(() => say(ex1[0], L), 300);
  }
  function bind2(toks, pool, ex2) {
    const ans = $(".pans", card), fb = $(".fb", card), picked = [];
    if (zh) bindGloss(card, true);
    const paint = () => { ans.innerHTML = picked.length ? picked.map((x, j) => `<button type="button" class="ptok in" data-j="${j}">${zh ? glossHTML(x.t) : esc(x.t)}</button>`).join("") : `<span class="muted">Chạm vào các ô bên dưới theo đúng thứ tự.</span>`;
      ans.querySelectorAll(".ptok").forEach(b => b.onclick = () => { const x = picked.splice(+b.dataset.j, 1)[0]; card.querySelector(`.ppool [data-k="${pool.indexOf(x)}"]`).disabled = false; paint(); });
      if (zh) bindGloss(ans, true); };
    paint();
    card.querySelectorAll(".ppool .ptok").forEach(b => b.onclick = () => { picked.push(pool[+b.dataset.k]); b.disabled = true; fb.hidden = true; paint(); });
    $(".clr", card).onclick = () => { picked.length = 0; card.querySelectorAll(".ppool .ptok").forEach(b => b.disabled = false); fb.hidden = true; paint(); };
    $(".back1", card).onclick = () => { step = 1; draw(); };
    $(".chk", card).onclick = () => {
      if (picked.length < toks.length) { fbOn(fb, "bad"); fb.innerHTML = `<p class="why">Còn ${toks.length - picked.length} ô chưa xếp.</p>`; return; }
      const bad = picked.findIndex((x, j) => x.t !== toks[j]);
      if (bad < 0) { fbOn(fb, "good"); fb.innerHTML = `<p class="fbt">Đúng rồi!</p><p class="why">${zh ? glossHTML(ex2[0]) : esc(ex2[0])} · ${esc(zh ? bi(ex2[2], ex2[1]) : ex2[1])}</p>`; if (zh) bindGloss(fb); say(ex2[0], L); sfx("good"); st[i].built = true; setTimeout(() => { step = 3; draw(); }, 1300); return; }
      st[i].tries++; sfx("bad");
      ans.querySelectorAll(".ptok")[bad].classList.add("wrongt");
      fbOn(fb, "bad"); fb.innerHTML = `<p class="fbt">Gần được rồi!</p><p class="why">Ô số ${bad + 1} chưa đúng chỗ. Nhìn lại công thức: ${esc(pats[i].t)}. Chạm vào ô viền đỏ để trả lại rồi xếp lại.</p>${st[i].tries >= 2 ? `<p class="reveal">Câu đúng: <b>${show(ex2[0])}</b> <button type="button" class="btn ghost small skp">Đã hiểu, đi tiếp →</button></p>` : ""}`;
      const skp = $(".skp", fb); if (skp) skp.onclick = () => { say(ex2[0], L); step = 3; draw(); };
    };
  }
  function bind3(two) {
    const fb = $(".fb", card), p = pats[i];
    if (zh) bindGloss(card, true);
    card.querySelectorAll(".pj").forEach(b => b.onclick = () => {
      const k = +b.dataset.k, ok = two[k][1];
      b.classList.add(ok ? "right" : "wrong");
      fbOn(fb, ok ? "good" : "bad");
      fb.innerHTML = `<p class="fbt">${ok ? "Chính xác!" : "Chưa đúng, nhưng giờ bạn sẽ nhớ lâu hơn!"}</p><p><span class="x">✗</span> <s>${show(p.bad)}</s> &nbsp; <span class="v">✓</span> <b>${show(p.good)}</b></p><p class="why">${zhMixed(L, p.why)}</p>`; if (zh) bindGloss(fb);
      if (ok) { card.querySelectorAll(".pj").forEach(x => x.disabled = true); st[i].judged = true; $(".nxp", card).hidden = false; say(p.good, L); sfx("good"); }
      else { b.disabled = true; addReview(L, "Mẫu câu: " + p.t, p.good, { k: "mc", q: "Câu nào đúng theo mẫu " + p.t + "?", opts: [p.good, p.bad], a: 0, why: { 1: p.why } }); sfx("bad"); }
    });

    $(".nxp", card).onclick = () => { if (i < pats.length - 1) { i++; step = 1; draw(); } else finish({ learn: true, extra: `Học ${pats.length} mẫu câu: nghe, tự lắp câu và phân biệt câu đúng sai` }); };
  }

}

/* ---------- cảnh hội thoại bằng video (Google Flow) + phụ đề tự canh theo lời nói ---------- */
function runSceneVideo(ex, body, finish, VD) {
  const L = S.lang, lines = ex.lines2, [pA] = ex.people; let subVi = true, subPy = L === "zh", ci = 0, cur = -1, stopAt = null, seen = new Set();
  const box = el(`<div class="scene vscene">
    <div class="stage2"><p class="setting">${esc(ex.setting)}</p>
      <div class="vwrap"><video class="svid" playsinline preload="auto"></video><div class="subs" aria-live="polite"><p class="muted">Bấm Phát cả cảnh để xem.</p></div></div></div>
    <div class="row center"><button type="button" class="btn ghost prev">⏮ Câu trước</button><button type="button" class="btn primary playall">${ICON.play} Phát cả cảnh</button><button type="button" class="btn ghost rep">↻ Nghe lại câu này</button><button type="button" class="btn ghost nx">Câu tiếp ⏭</button></div>
    <div class="row center small"><label class="tick"><input type="checkbox" class="cvi" checked> ${L === "zh" ? "Nghĩa (Anh · Việt)" : "Phụ đề tiếng Việt"}</label>${L === "zh" ? `<label class="tick"><input type="checkbox" class="cpy" checked> Bính âm</label>` : ""}</div>
    <ol class="log"></ol>
    <div class="row center"><button type="button" class="btn primary huge fin" disabled>Xem xong, sang bài tập</button></div></div>`);
  body.appendChild(box);
  const v = $(".svid", box), subs = $(".subs", box), log = $(".log", box);
  const lineHTML = l => `<span class="spk">${esc(l.who)}</span><span class="tx" lang="${L === "zh" ? "zh" : "en"}">${L === "zh" ? glossHTML(l.t, true) : esc(l.t)}</span>${l.py && subPy ? `<span class="py">${esc(l.py)}</span>` : ""}${subVi && (l.en || l.vi) ? (L === "zh" ? `<span class="vi">${biHTML(l.en, l.vi)}</span>` : `<span class="vi">${esc(l.vi)}</span>`) : ""}`;
  const where = i => { for (let c = 0; c < VD.clips.length; c++) { const q = VD.clips[c].cues.find(x => x[2] === i); if (q) return { c, q }; } return null; };
  function load(c) { if (ci !== c || !v.src) { ci = c; v.src = "vid/" + VD.clips[c].src; } }
  function showLine(i) {
    if (i === cur || i < 0) return; cur = i; seen.add(i); const l = lines[i];
    subs.className = "subs " + (l.who === pA ? "left" : "right");
    subs.innerHTML = `<div class="bub2">${lineHTML(l)}</div>`;
    log.innerHTML = [...seen].sort((a, b) => a - b).map(k => `<li class="${lines[k].who === pA ? "l" : "r"}">${lineHTML(lines[k])}</li>`).join("");
    if (seen.size === lines.length) $(".fin", box).disabled = false;
  }
  v.ontimeupdate = () => {
    const t = v.currentTime, cues = VD.clips[ci].cues, q = cues.find(x => t >= x[0] - 0.1 && t <= x[1] + 0.35) || cues.filter(x => x[0] <= t).slice(-1)[0];
    if (q) showLine(q[2]);
    if (stopAt != null && t >= stopAt) { v.pause(); stopAt = null; }
  };
  v.onended = () => { if (playAll && ci < VD.clips.length - 1) { load(ci + 1); v.play().catch(() => {}); } else { playAll = false; VD.clips.forEach(c => c.cues.forEach(x => seen.add(x[2]))); showLine(cur); $(".fin", box).disabled = seen.size >= lines.length; $(".playall", box).innerHTML = `${ICON.play} Xem lại cả cảnh`; } };
  let playAll = false;
  const jump = (i, single) => { const w = where(i); if (!w) return; load(w.c); const go = () => { v.currentTime = Math.max(0, w.q[0] - 0.05); stopAt = single ? w.q[1] + 0.3 : null; v.play().catch(() => {}); }; if (v.readyState >= 1) go(); else v.onloadedmetadata = () => { v.onloadedmetadata = null; go(); }; };
  $(".playall", box).onclick = () => { playAll = true; cur = -1; load(0); v.currentTime = 0; v.play().catch(() => {}); $(".playall", box).textContent = "Đang phát…"; };
  $(".nx", box).onclick = () => { playAll = false; jump(Math.min(lines.length - 1, cur + 1), true); };
  $(".prev", box).onclick = () => { playAll = false; jump(Math.max(0, cur - 1), true); };
  $(".rep", box).onclick = () => { playAll = false; jump(Math.max(0, cur), true); };
  const redraw = () => { const c = cur; cur = -1; if (c >= 0) showLine(c); };
  $(".cvi", box).onchange = e => { subVi = e.target.checked; redraw(); };
  const cpy = $(".cpy", box); if (cpy) cpy.onchange = e => { subPy = e.target.checked; redraw(); };
  $(".fin", box).onclick = () => { v.pause(); finish({ learn: true, extra: `Xem đủ ${lines.length} câu thoại` }); };
  load(0);
}

/* ---------- bước 4: đếm nét để phân biệt chữ trông giống nhau (hanzi-writer, dữ liệu nét có sẵn trong trang) ---------- */
function strokePad(host, ch, size) {
  host.style.width = host.style.height = size + "px";
  if (typeof HanziWriter === "undefined" || !HZDATA[ch]) { host.innerHTML = `<span class="wfall" lang="zh" style="font-size:${Math.round(size * .55)}px">${esc(ch)}</span>`; return null; }
  const col = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  return HanziWriter.create(host, ch, { width: size, height: size, padding: Math.round(size * .06), showOutline: true, showCharacter: true,
    strokeColor: col("--ink") || "#1f2937", outlineColor: "rgba(127,127,127,.2)", radicalColor: null, strokeAnimationSpeed: 0.8, delayBetweenStrokes: 450,
    charDataLoader: (c, ok) => ok(HZDATA[c]) });
}
/* phát từng nét, đếm 1, 2, 3… trên nhãn */
function countAlong(writer, ch, label, done) {
  const n = HZDATA[ch] ? HZDATA[ch].strokes.length : 0; if (!writer || !n) { label.textContent = n ? n + " nét" : ""; return; }
  writer.hideCharacter(); let k = 0; label.textContent = "Nét 0";
  const step = () => { if (k >= n) { label.textContent = `${n} nét`; done && done(); return; } writer.animateStroke(k, { onComplete: () => { k++; label.textContent = "Nét " + k; setTimeout(step, 250); } }); };
  step();
}
function runStrokes(ex, body, finish) {
  const n = ex.items.length;
  const res = ex.items.map(() => ({ first: null, done: false }));
  const queue = ex.items.map((it, k) => ({ it, src: k, round: 0 }));
  let qi = 0, autoT = null;
  const box = el(`<div class="strokex"><div class="prog" aria-hidden="true">${ex.items.map(() => "<i></i>").join("")}</div>
    <p class="note small">Mỗi nét là một lần đặt bút xuống rồi nhấc lên. Chữ gần giống nhau thường chỉ khác nhau một bộ phận, nên số nét khác nhau.</p><div class="scard"></div></div>`);
  body.appendChild(box);
  const card = $(".scard", box), dots = [...box.querySelectorAll(".prog i")];
  const paint = cur => dots.forEach((d, k) => d.className = res[k].done ? (res[k].first ? "ok" : "fix") : res[k].first === false ? "redo" : k === cur ? "now" : "");
  const similar = (it, r) => { const c = Object.assign({}, it), perm = seeded(it.opts.map((_, k) => k), r * 5 + it.opts.length).map(x => x[0]);
    c.opts = perm.map(k => it.opts[k]); c.a = perm.indexOf(it.a); if (it.counts) c.counts = perm.map(k => it.counts[k]); if (it.info) c.info = perm.map(k => it.info[k]); c.why = {}; perm.forEach((o, k) => { if (it.why[o] != null) c.why[k] = it.why[o]; }); return c; };
  function next() {
    clearTimeout(autoT); stopAudio(); qi++;
    if (qi < queue.length) { draw(); return; }
    const first = res.filter(r => r.first).length;
    finish({ total: n, first, repair: n - first, extra: `Phân biệt ${n / 2} cặp chữ giống nhau${n - first ? `, làm lại đúng ${n - first} câu từng sai` : ""}` });
  }
  function draw() {
    const q = queue[qi], it = q.it, r = res[q.src]; let tries = 0, done = false;
    paint(q.src);
    card.innerHTML = `<div class="qhead"><span class="qn">${q.round ? `<span class="redo-tag">🔁 Làm lại câu tương tự</span>` : `Câu ${q.src + 1}/${n}`}</span></div>` + (it.k === "count"
      ? `<div class="spad1"><div class="wpad sp" aria-label="Chữ ${esc(it.ch)}"></div><span class="scount" aria-live="polite"></span></div>
         <p class="qt"><b lang="zh">${esc(it.ch)}</b> <b class="pyw">${esc(it.py)}</b> · ${esc(bi(it.en, it.m))}</p><p class="qt">${esc(it.q)}</p>
         <div class="row center"><button type="button" class="btn ghost small anim">${ICON.play} Xem từng nét</button><button type="button" class="btn ghost small snd">🔊 Nghe</button></div>
         <div class="opts nums" role="group" aria-label="Số nét">${it.opts.map((o, j) => `<button type="button" class="opt" data-i="${j}"><span class="ot">${esc(o)} nét</span></button>`).join("")}</div>`
      : `<p class="qt">${esc(it.q)}</p><div class="pair">${it.opts.map((o, j) => `<div class="pcell"><div class="wpad sp" data-p="${j}" aria-label="Chữ ${esc(o)}"></div>${it.info ? `<span class="pinfo"><b class="pyw">${esc(it.info[j].py)}</b> ${esc(bi(it.info[j].en, it.info[j].m))}</span>` : ""}<span class="scount" data-c="${j}"></span>
           <button type="button" class="btn ghost small anim" data-j="${j}">${ICON.play} Đếm nét</button><button type="button" class="opt pick" data-i="${j}"><span class="badge">${"AB"[j]}</span> Chọn chữ này</button></div>`).join("")}</div>`)
      + `<div class="fb" role="status" aria-live="polite" hidden></div><div class="row center"><button type="button" class="btn ghost skip">Bỏ qua, câu tiếp →</button><button type="button" class="btn primary next" hidden>${qi < queue.length - 1 ? "Câu tiếp →" : "Hoàn thành bài"}</button></div>`;
    const size = it.k === "count" ? Math.min(220, card.clientWidth - 40) : Math.min(150, Math.floor((card.clientWidth - 60) / 2));
    const fb = $(".fb", card), nx = $(".next", card), skip = $(".skip", card);
    let ws = [];
    if (it.k === "count") { const w = strokePad($(".sp", card), it.ch, size), lab = $(".scount", card); ws = [w]; $(".anim", card).onclick = () => countAlong(w, it.ch, lab); $(".snd", card).onclick = () => say(it.ch, "zh"); }
    else { ws = it.opts.map((o, j) => strokePad(card.querySelector(`[data-p="${j}"]`), o, size)); card.querySelectorAll(".anim").forEach(b => b.onclick = () => { const j = +b.dataset.j; countAlong(ws[j], it.opts[j], card.querySelector(`[data-c="${j}"]`)); }); }
    const revealCounts = () => { if (it.k === "pick") card.querySelectorAll(".scount").forEach((s, k) => s.textContent = it.counts[k] + " nét"); else $(".scount", card).textContent = it.n + " nét"; };
    const ansText = it.k === "count" ? `${it.ch} có ${it.n} nét` : `chữ ${it.opts[it.a]} (${it.counts[it.a]} nét)`;
    const wrongFirst = () => {
      /* sai lần đầu: hiện đáp án 2 giây rồi sang câu tiếp; cuối bài gặp lại câu tương tự */
      if (r.first == null) r.first = false; done = true;
      card.querySelectorAll(".opt").forEach(x => x.disabled = true); card.querySelector(`.opt[data-i="${it.a}"]`).classList.add("right"); revealCounts();
      fbOn(fb, "bad"); fb.innerHTML = `<p class="fbt">Chưa đúng, không sao!</p><p class="why">Đáp án: ${esc(ansText)}.${it.note ? " " + zhMixed("zh", it.note) : ""}</p><p class="small muted">Cuối bài bạn sẽ gặp lại một câu tương tự.</p>`;
      addReview("zh", it.k === "count" ? `Số nét của ${it.ch}` : `${it.py} — chữ nào?`, it.k === "count" ? `${it.n} nét` : it.opts[it.a]);
      queue.push({ it: similar(it, q.round + 1), src: q.src, round: q.round + 1 }); paint(q.src);
      skip.hidden = true; nx.hidden = false; nx.textContent = "Câu tiếp →"; autoT = setTimeout(next, SHOW_ANS_MS);
    };
    card.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      if (done) return; const j = +b.dataset.i;
      if (j === it.a) {
        done = true; b.classList.add("right"); card.querySelectorAll(".opt").forEach(x => x.disabled = true); revealCounts();
        if (q.round === 0 && r.first == null) r.first = tries === 0; r.done = true; paint(q.src);
        fbOn(fb, "good"); fb.innerHTML = `<p class="fbt">${tries ? "Đúng rồi, bạn đã tự sửa được" : "Đúng"}</p><p class="why">${esc(ansText)}.${it.note && it.k === "pick" ? " " + zhMixed("zh", it.note) : ""}</p>`; bindGloss(fb);
        say(it.k === "count" ? it.ch : it.opts[it.a], "zh"); skip.hidden = true; nx.hidden = false;
        if (!tries && qi < queue.length - 1) autoT = setTimeout(next, AUTO_MS + 600); else nx.focus();
        return;
      }

      if (q.round === 0) return wrongFirst();
      /* sai ở lần làm lại: hiện gợi ý rồi cho làm câu tương tự khác */
      revealCounts(); done = true; card.querySelectorAll(".opt").forEach(x => x.disabled = true);
      fbOn(fb, "bad"); fb.innerHTML = `<p class="fbt">Gần được rồi!</p><p class="why">${zhMixed("zh", it.why[j] || "")} ${zhMixed("zh", it.note || "")}</p><p class="next-step">Gợi ý: bấm ${it.k === "count" ? "Xem từng nét" : "Đếm nét dưới từng chữ"} và đếm theo. Rồi làm thêm một câu tương tự.</p>`;
      skip.hidden = true; nx.hidden = false; nx.textContent = "Đã hiểu, làm câu tương tự →";
      nx.onclick = () => { queue.push({ it: similar(it, q.round + 1), src: q.src, round: q.round + 1 }); next(); };
    });
    skip.onclick = () => { if (done) return; if (q.round === 0) wrongFirst(); else { queue.push({ it: similar(it, q.round + 1), src: q.src, round: q.round + 1 }); next(); } };
    nx.onclick = next;
  }
  draw();
}

/* ---------- bước 4: hướng dẫn viết, đi lần lượt từng chữ: xem thứ tự nét → tô nét (có gợi ý) → tự viết (nút gợi ý) → kiểm tra → chữ tiếp ---------- */

}

/* ---------- kho ôn: biến mỗi câu từng sai thành một câu hỏi tương tự để làm lại ---------- */
const cleanFront = f => String(f).replace(/\s*→\s*chọn chữ Hán đúng\s*$/, "").replace(/^Ôn lại:\s*/, "").replace(/^Thẻ ôn từ lỗi của bạn:\s*/, "");
function reviewItem(L, c, k, all) {
  if (c.item && c.item.opts) return Object.assign(similarItem(c.item, k + 2), { revF: c.front, revB: c.back, autoplay: !!c.item.audio });
  const han = s => /[\u4e00-\u9fff]/.test(s), back = String(c.back), front = cleanFront(c.front);
  let m;
  if ((m = back.match(/^(\d+) nét$/))) { const n = +m[1], opts = seeded([n, n - 1, n + 1].filter(x => x > 0), k).map(x => x[0]); return { k: "mc", q: front + "?", opts: opts.map(x => x + " nét"), a: opts.indexOf(n), revF: c.front, revB: c.back, why: {} }; }
  const pool = learnedPool(L);
  let cands;
  if (han(back)) cands = pool.map(x => String(x.w)).filter(w => han(w) && w !== back && !/[\/ ]/.test(w) && Math.abs([...w].length - [...back].length) <= 1);

  else cands = pool.map(x => String(x.m)).filter(w => w && w !== back);
  cands = [...new Set(cands.concat(all.map(x => String(x.back)).filter(w => w !== back && han(w) === han(back))))];
  const others = seeded(cands, k * 7 + back.length).map(x => x[0]).slice(0, 2);
  if (others.length < 2) return { k: "type", q: front, model: back, review: true, accept: null };

  const zhAns = L === "zh" && han(back);
  const q = /^Mẫu câu:/.test(front) ? "Câu nào đúng theo mẫu " + front.replace(/^Mẫu câu:\s*/, "") + "?" : /[:?？]/.test(front) ? front : (han(front) ? "Nghĩa đúng là gì: " : zhAns ? "Chọn chữ Hán đúng: " : "") + front;

}

/* ---------- chuỗi ngày theo lịch, có "đóng băng" ---------- */
function calStreak() {
  const days = new Set(S.days || []); S.freezeUsed = S.freezeUsed || []; S.freeze = S.freeze || 0;
  const d = new Date(); let n = 0, changed = false;
  const iso = x => x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0");
  if (!days.has(iso(d))) d.setDate(d.getDate() - 1); /* hôm nay chưa học thì tính từ hôm qua */
  for (let i = 0; i < 400; i++) {
    const k = iso(d);
    if (days.has(k) || S.freezeUsed.includes(k)) n += days.has(k) ? 1 : 0;
    else if (S.freeze > 0 && n > 0) { S.freeze--; S.freezeUsed.push(k); changed = true; }
    else break;
    d.setDate(d.getDate() - 1);
  }
  if (changed) save();

function journeyCard(L) {
  const p = progL(L), nu = nextUpL(L), w = nu && nu.d.week ? nu.d.week : curWeek(), wd = HAS_COURSE ? weekDays(w) : WDAYS.slice(0, 5);
  const cw = cweek(L, w), D = cw ? { cando: cw.cando } : DATA[L];
  const stops = HAS_COURSE ? [...wd, { id: "live", label: "Thứ 7", live: true }] : [...WDAYS.slice(0, 5), { id: "live", label: "Thứ 7", live: true }, WDAYS[5]];
  const pts = HAS_COURSE ? [[80, 220], [250, 140], [420, 200], [590, 100], [760, 160], [920, 80]] : [[70, 230], [210, 160], [350, 210], [490, 110], [630, 160], [770, 70], [910, 120]];
  const path = "M" + pts.map(q => q.join(" ")).join(" L");
  const nodes = stops.map((s, i) => {
    const [x, y] = pts[i], full = !s.live && dayDoneL(L, s) === exL(s, L).length, cur = !s.live && nu && nu.d.id === s.id;
    return `<g class="pin${full ? " done" : ""}${cur ? " cur" : ""}${s.live ? " live" : ""}" transform="translate(${x} ${y})"><circle r="${cur ? 24 : 19}"/>${full ? '<path d="M-8 1l5 5 10-11" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>' : `<text y="6" text-anchor="middle">${s.live ? "★" : i + 1 - (i > 5 ? 1 : 0)}</text>`}<text class="lb" y="${y > 150 ? 50 : -32}" text-anchor="middle">${esc(s.live ? "Live" : s.label)}</text></g>`;
  }).join("");
  const bg = IMG["journey-" + L] ? `<img class="photo jbg" src="img/${IMG["journey-" + L]}" alt="">` : "";
  return `<a class="jcard t-${L}" href="#" data-go="${L}">${bg}<div class="jshade"></div>
    <svg class="jmap" viewBox="0 0 1000 290" aria-hidden="true"><path d="${path}" class="road"/><path d="${path}" class="roaddash"/>${nodes}</svg>
    <div class="jfoot"><div class="jinfo"><b>${L === "zh" ? "Tiếng Trung" : "Tiếng Anh"} · Tuần ${w}${cw ? " · " + esc(cw.title) : ""}</b><span>${esc(D.cando)}</span><small>Đã xong ${p.days}/${WDAYS.length} ngày học · ${p.done}/${p.all} bài · đang mở ${HAS_COURSE ? CWEEKS.length : 1}/16 tuần</small></div>
    <span class="jgo">${nu ? (p.done ? "Học tiếp →" : "Bắt đầu →") : "Đã xong ✓"}</span></div></a>`;
}

const MIN_LV = { zh: 0, en: 1 }, MAX_LV = { zh: 4, en: 4 };
function trackOf(L, id) { return TRACKS[L].find(t => t.id === id); }
const trackStart = t => t.start || (t.demo ? demoStart(t.demo) : "");
/* lộ trình chưa mở: gợi ý tuần học thử gần nhất BÊN DƯỚI, không đẩy về lộ trình mới bắt đầu */
function nearTrial(L, t) { const i = TRACKS[L].indexOf(t); for (let j = i - 1; j >= 0; j--) if (trackStart(TRACKS[L][j])) return TRACKS[L][j]; return null; }
function sendSheet(row) {
  S.sentRows = S.sentRows || []; S.sentRows.push(row); save();
  if (!SHEET_URL) return false;
  try { fetch(SHEET_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(row) }); return true; } catch (e) { return false; }
}

function test(body) {
  const P = S.place, L = P.lang, bank = QB[L];
  const used = new Set(), log = []; let lv = Math.max(MIN_LV[L], Math.min(MAX_LV[L], P.self)), best = MIN_LV[L] - 1, seen = {}, block = [], n = 0;
  const pick = l => { const pool = bank.filter((q, i) => q.lv === l && !used.has(i)); const sk = new Set(block.map(b => b.sk)); const q = pool.find(x => !sk.has(x.sk)) || pool[0]; if (q) used.add(bank.indexOf(q)); return q; };
  function nextBlock() {
    block = []; for (let k = 0; k < 3; k++) { const q = pick(lv); if (q) block.push(q); }
    if (!block.length) return finish();
    ask(0, 0);
  }
  function ask(i, ok) {
    if (i >= block.length) return judgeBlock(ok);
    const q = block[i], perm = seeded(q.opts.map((_, k) => k), n * 3 + q.opts.length).map(x => x[0]); n++;
    body.innerHTML = `<section class="card2 ptest"><div class="row between"><p class="eyebrow">2 · Làm bài · câu ${n}</p><span class="pill">${esc(q.sk)}</span></div>
      <div class="pbar"><i style="width:${Math.min(100, n / 15 * 100)}%"></i></div>
      ${q.audio ? `<div class="row center"><button type="button" class="btn sound au">${ICON.play} Nghe</button></div>` : ""}
      <p class="qt">${L === "zh" && typeof glossMixed === "function" && !q.audio ? esc(q.q) : esc(q.q)}</p>
      <div class="opts" role="group">${perm.map((k, j) => `<button type="button" class="opt" data-k="${k}"><span class="badge">${"ABCD"[j]}</span><span class="ot" lang="${/[一-鿿]/.test(q.opts[k]) ? "zh" : L === "en" ? "en" : "vi"}">${esc(q.opts[k])}</span></button>`).join("")}</div>
      <div class="row center"><button type="button" class="btn ghost small dunno">Tôi chưa biết câu này</button></div></section>`;
    if (q.audio) { $(".au", body).onclick = () => say(q.audio, L); setTimeout(() => say(q.audio, L), 350); }
    const go = right => { log.push({ lv: q.lv, sk: q.sk, ok: right }); setTimeout(() => ask(i + 1, ok + (right ? 1 : 0)), 350); };
    body.querySelectorAll(".opt").forEach(b => b.onclick = () => { body.querySelectorAll(".opt").forEach(x => x.disabled = true); b.classList.add("picked"); go(+b.dataset.k === q.a); });
    $(".dunno", body).onclick = () => go(false);
  }
  function judgeBlock(ok) {
    seen[lv] = ok;
    const pass = ok >= Math.ceil(block.length * 2 / 3);
    if (pass) { best = Math.max(best, lv); if (lv < MAX_LV[L] && seen[lv + 1] == null) { lv++; return nextBlock(); } return finish(); }
    if (lv > MIN_LV[L] && seen[lv - 1] == null && best < lv - 1) { lv--; return nextBlock(); }
    return finish();
  }
  function finish() {
    const level = Math.max(best, 0);
    const bySk = {}; log.forEach(r => { bySk[r.sk] = bySk[r.sk] || [0, 0]; bySk[r.sk][1]++; if (r.ok) bySk[r.sk][0]++; });
    const track = LV_TRACK[L][level];
    P.result = { level, levelName: LV_NAMES[L][level], track, bySk, n: log.length, right: log.filter(r => r.ok).length, at: new Date().toISOString() }; P.retake = false;
    S.lang = L; save();
    P.sent = sendSheet({ type: "placement", time: P.result.at, name: P.name, contact: P.contact, lang: L === "zh" ? "Tiếng Trung" : "Tiếng Anh", goal: P.goal, cert: P.cert, self: P.self, level: P.result.levelName, track: trackOf(L, track).name + " (" + trackOf(L, track).lv + ")", score: `${P.result.right}/${P.result.n}`, skills: Object.entries(bySk).map(([k, v]) => `${k} ${v[0]}/${v[1]}`).join(", ") });
    save(); showResult(body, P);
  }
  nextBlock();
}
function showResult(body, P) {
  const L = P.lang, r = P.result, t = trackOf(L, r.track);
  const skills = Object.entries(r.bySk || {});
  body.innerHTML = `<section class="card2 presult"><p class="eyebrow">3 · Kết quả</p>
    <h2>Trình độ ${L === "zh" ? "tiếng Trung" : "tiếng Anh"} của bạn: <span class="lvl">${esc(r.levelName)}</span></h2>

    <div class="pskills">${skills.map(([k, v]) => `<div><b>${esc(k)}</b><div class="barbg"><i style="width:${Math.round(v[0] / v[1] * 100)}%;background:${v[0] / v[1] >= .67 ? "var(--green)" : v[0] / v[1] >= .34 ? "var(--sun)" : "var(--zh)"}"></i></div><small>${v[0]}/${v[1]} câu đúng${v[0] / v[1] < .5 ? " · nên luyện thêm" : ""}</small></div>`).join("")}</div>
    ${t.status === "open" ? `<a class="btn primary huge" href="#${t.start}">${ICON.play} Học thử ngay: ${esc(t.name)}</a>`

         <div class="row"><button type="button" class="btn primary wl">Đăng ký chờ lớp ${esc(t.lv)}</button>${(() => { const near = nearTrial(L, t); return near ? `<a class="btn ghost" href="#${trackStart(near)}">Học thử tuần gần nhất: ${esc(near.name)} (${esc(near.lv)})</a>` : ""; })()}</div>`}
    <p class="small muted">${P.sent ? "Kết quả đã gửi cho CES." : SHEET_URL ? "" : "Kết quả đang lưu trên máy này (CES chưa kết nối bảng nhận kết quả)."}</p>
    <div class="row"><button type="button" class="btn ghost small again">Làm lại bài kiểm tra</button><button type="button" class="btn ghost small other">Kiểm tra ${L === "zh" ? "tiếng Anh" : "tiếng Trung"}</button><a class="btn ghost small" href="#lo-trinh">Xem tất cả lộ trình</a></div></section>`;
  const wl = $(".wl", body); if (wl) wl.onclick = () => { P.waitlist = (P.waitlist || []).concat([t.id]); save(); sendSheet({ type: "waitlist", time: new Date().toISOString(), name: P.name, contact: P.contact, lang: L, track: t.name + " (" + t.lv + ")" }); wl.disabled = true; wl.textContent = "Đã đăng ký chờ ✓"; toast("CES sẽ báo bạn khi lộ trình mở."); };

}

function tracksHTML() {
  const st = { open: ["Đang mở", "ok"], demo: ["Có tuần học thử", "go"], soon: ["Sắp mở", "lock"] };
  return ["zh", "en"].map(L => `<section class="card2"><h2>${L === "zh" ? "Tiếng Trung" : "Tiếng Anh"}</h2><ol class="tracks">${TRACKS[L].map(t => `<li class="trk ${t.status}"><div><small>${esc(t.lv)}</small><b>${esc(t.name)}</b><span>Đích: ${esc(t.goal)} · ${esc(t.note)}</span></div>
    <span class="pill ${st[t.status][1]}">${st[t.status][0]}</span>${t.status === "open" ? `<a class="btn primary small" href="#${t.start}" data-l="${L}">Vào học</a>` : t.status === "demo" && trackStart(t) ? `<a class="btn primary small" href="#${trackStart(t)}" data-l="${L}">Học thử</a>` : `<a class="btn ghost small" href="#kiem-tra-dau-vao">Đăng ký chờ</a>`}</li>`).join("")}</ol></section>`).join("");
}
ROOMS["kiem-tra-dau-vao"] = "place";
(function () {
  const r0 = render;
  render = function () {
    const r = parseRoute();
    const navAdd = () => { const nav = $("#side .snav"); if (nav && !nav.querySelector('[href="#kiem-tra-dau-vao"]')) { const a = nav.querySelector('[href="#lo-trinh"]'); if (a) a.insertAdjacentHTML("afterend", `<a class="sn t-sun${r.v === "place" ? " on" : ""}" href="#kiem-tra-dau-vao">${nicon("review")}<span>Kiểm tra đầu vào</span></a>`); } };
    if (r.v === "place") { stopAudio(); renderTop(); renderSide(); navAdd(); const main = $("#main"); main.innerHTML = ""; viewPlace(main); applyPhotos(main); scrollTo(0, 0); return; }
    r0(); navAdd();
    if (r.v === "road") { const m = $("#main .roomv"); if (m) { const h = m.querySelector(".rhead"); h.insertAdjacentHTML("afterend", `<section class="card2 pcta"><div><h2>Chưa biết bắt đầu từ đâu?</h2><p>Làm bài kiểm tra đầu vào 10–15 phút để được xếp đúng lộ trình.</p></div><a class="btn primary" href="#kiem-tra-dau-vao">${ICON.play} Kiểm tra đầu vào</a></section>` + tracksHTML()); m.querySelectorAll(".tracks [data-l]").forEach(a => a.onclick = () => { S.lang = a.dataset.l; save(); }); } }
    if (r.v === "home") { const h = $("#main"); const first = h && h.firstElementChild; const P = S.place; if (first) first.insertAdjacentHTML("afterend", P && P.result ? `<section class="card2 pcta"><div><h2>Trình độ của bạn: ${esc(P.result.levelName)}</h2><p>Lộ trình phù hợp: ${esc(trackOf(P.lang, P.result.track).name)} (${esc(trackOf(P.lang, P.result.track).lv)}).</p></div><a class="btn ghost" href="#kiem-tra-dau-vao">Xem kết quả</a></section>` : `<section class="card2 pcta"><div><h2>Bạn mới đến?</h2><p>Làm bài kiểm tra đầu vào 10–15 phút để được xếp đúng trình độ và học thử ngay.</p></div><a class="btn primary" href="#kiem-tra-dau-vao">${ICON.play} Kiểm tra đầu vào</a></section>`); }
  };
})();

/*@FUNNEL@*/
boot();
gate();

</script>
