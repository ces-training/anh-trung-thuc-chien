<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bài tập tuần 1 · Anh – Trung Thực Chiến</title><link rel="canonical" href="https://ces-training.github.io/anh-trung-thuc-chien/tuan-1/"><link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>body{padding-bottom:env(safe-area-inset-bottom)}</style></head><body><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;700&display=swap">
<style>
/* Khung học theo kiểu chuỗi bài 21 ngày: Hành trình tuần (tuyến tàu) → Trang buổi học (thẻ chính + lưới bài) → Trình làm bài (cách làm → từng câu → màn kết).
   Xanh = tiếng Anh, đỏ = tiếng Trung, vàng = điểm và nút hành động phụ. */
:root{
  --bg:#F5F6FA; --surface:#FFFFFF; --soft:#EEF1F8; --ink:#0E1730; --muted:#515B70; --line:#DDE2EC;
  --en:#1F44D6; --en-soft:#E7ECFF; --zh:#D3271E; --zh-soft:#FDECEA; --sun:#FFD43B; --sun-soft:#FFF4C7; --sun-ink:#3B2F00;
  --green:#15803D; --green-soft:#E3F5E9; --slate:#334155; --slate-soft:#E8ECF3;
  --good:#146C43; --good-bg:#E5F4EB; --bad:#B42318; --bad-bg:#FFF1EF; --mark:#FFD6CF;
  --acc:var(--en); --acc-soft:var(--en-soft);
  --font:"Be Vietnam Pro","Segoe UI",system-ui,-apple-system,sans-serif;
  --han:"Noto Sans SC","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --shadow:0 1px 2px rgba(14,23,48,.06),0 6px 18px -8px rgba(14,23,48,.18);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1020; --surface:#131B31; --soft:#18223C; --ink:#EEF2FA; --muted:#A9B3C7; --line:#283553;
  --en:#8EA2FF; --en-soft:#1B2858; --zh:#FF8475; --zh-soft:#3A1B17; --sun:#FFD43B; --sun-soft:#3A3212; --sun-ink:#FFE89A;
  --green:#5BD38C; --green-soft:#10301F; --slate:#C3CCDD; --slate-soft:#1E2945;
  --good:#5BD38C; --good-bg:#0F2D1E; --bad:#FF8A7E; --bad-bg:#33171A; --mark:#6B2620; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px -10px rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0B1020; --surface:#131B31; --soft:#18223C; --ink:#EEF2FA; --muted:#A9B3C7; --line:#283553;
  --en:#8EA2FF; --en-soft:#1B2858; --zh:#FF8475; --zh-soft:#3A1B17; --sun:#FFD43B; --sun-soft:#3A3212; --sun-ink:#FFE89A;
  --green:#5BD38C; --green-soft:#10301F; --slate:#C3CCDD; --slate-soft:#1E2945;
  --good:#5BD38C; --good-bg:#0F2D1E; --bad:#FF8A7E; --bad-bg:#33171A; --mark:#6B2620; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px -10px rgba(0,0,0,.6); color-scheme:dark }
:root[data-track="zh"]{--acc:var(--zh);--acc-soft:var(--zh-soft)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--font);-webkit-font-smoothing:antialiased}
[lang="zh"]{font-family:var(--han)}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance}
p{margin:0} a{color:var(--acc)} button{font:inherit;color:inherit}
.muted{color:var(--muted)} .small{font-size:13.5px}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}
.lead{font-size:16.5px;color:var(--muted);max-width:62ch}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

/* nút */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1.5px solid transparent;font-weight:700;font-size:15px;cursor:pointer;background:var(--soft);color:var(--ink);text-decoration:none;transition:transform .08s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--acc);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--acc) 60%,#000)}
.btn.huge{min-height:56px;padding:0 24px;font-size:17px;border-radius:14px}
.btn.ghost{background:var(--surface);border-color:var(--line)}
.btn.small{min-height:38px;padding:0 12px;font-size:14px}
.btn.sound{background:var(--acc);color:#fff;border-radius:999px;min-height:40px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.center{justify-content:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-weight:700;font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.star{background:var(--sun);color:#3B2F00}
.pill.ok{background:var(--good-bg);color:var(--good)}
.pill.lock{background:var(--soft);color:var(--muted)}
.pill.go{background:var(--acc);color:#fff}

/* thanh trên */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:9;background:var(--surface);box-shadow:0 1px 0 var(--line)}
.bar1{display:flex;align-items:center;gap:10px 14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;margin-right:auto;font-weight:800;letter-spacing:-.01em}
.brand small{display:block;font-weight:500;font-size:12.5px;color:var(--muted)}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--soft);gap:2px}
.seg button{min-height:34px;padding:0 10px;border:0;border-radius:8px;background:transparent;font-weight:700;font-size:13.5px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(14,23,48,.15)}
.seg button[data-lang="en"][aria-pressed="true"]{color:var(--en)} .seg button[data-lang="zh"][aria-pressed="true"]{color:var(--zh)}
.icbtn{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted)}
.pill.strk{background:var(--zh-soft);color:var(--zh)}
.nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nv{flex:none;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--soft);color:var(--muted);text-decoration:none;font-weight:700;font-size:14px}
.nv span{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:1px 6px;border-radius:999px;background:var(--surface);font-variant-numeric:tabular-nums}
.nv.full span{background:var(--good-bg);color:var(--good)}
.nv.on{background:var(--ink);color:var(--bg)} .nv.on span{background:color-mix(in srgb,var(--bg) 20%,transparent);color:var(--bg)}
@media (max-width:720px){.top{position:static}.brand small{display:none}.bar1{gap:8px}}

main{padding-block:22px 90px;outline:none}
main:focus,main:focus-visible{outline:none}

/* trang chủ */
.home{display:flex;flex-direction:column;gap:20px}
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;background:var(--surface);border-radius:22px;padding:clamp(18px,3vw,30px);box-shadow:var(--shadow)}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero-txt{display:flex;flex-direction:column;gap:12px;align-items:flex-start;min-width:0}
.hero h1{font-size:clamp(26px,3.6vw,38px);font-weight:800;letter-spacing:-.02em}
.bar{width:100%;height:10px;border-radius:999px;background:var(--soft);overflow:hidden}
.bar.big{height:14px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),color-mix(in srgb,var(--acc) 60%,var(--sun)));border-radius:999px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-content:start}
.stat{display:flex;flex-direction:column;gap:2px;padding:14px;border-radius:16px;background:var(--soft);text-decoration:none;color:var(--ink)}
.stat b{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.stat small{color:var(--muted);font-size:13px}
.ic{width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:4px}
.ic.sun{background:var(--sun);color:#3B2F00}.ic.zh{background:var(--zh-soft);color:var(--zh)}.ic.en{background:var(--en-soft);color:var(--en)}.ic.green{background:var(--green-soft);color:var(--green)}
.journey{background:var(--surface);border-radius:22px;padding:clamp(18px,3vw,26px);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.journey h2,.livecard h2{font-size:20px}
.line{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;position:relative}
.line::before{content:"";position:absolute;left:4%;right:4%;top:17px;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--en),var(--zh))}
.stn{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.stn a{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:var(--ink)}
.stn .dot{width:40px;height:40px;border-radius:50%;background:var(--surface);border:5px solid var(--slate);display:flex;align-items:center;justify-content:center;color:#fff;position:relative;z-index:1}
.stn.done .dot{background:var(--good);border-color:var(--good)}
.stn.cur .dot{border-color:var(--acc);box-shadow:0 0 0 6px var(--acc-soft)}
.stn.live .dot{background:var(--ink);border-color:var(--sun);width:44px;height:44px;margin-top:-2px}
.stn b{font-size:14.5px}
.stn small{font-size:12.5px;color:var(--muted);line-height:1.35}
.stn em{font-style:normal;font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:760px){
  .line{grid-template-columns:minmax(0,1fr);gap:0}
  .line::before{left:19px;right:auto;top:10px;bottom:10px;width:6px;height:auto;background:linear-gradient(180deg,var(--en),var(--zh))}
  .stn,.stn a{flex-direction:row;align-items:center;text-align:left;gap:12px;padding-block:6px}
  .stn small{display:block}
  .stn a>b,.stn>b{min-width:62px}
  .stn.live{padding-left:0}
}
.livecard{background:var(--ink);color:var(--bg);border-radius:22px;padding:clamp(18px,3vw,26px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:center}
.livecard .eyebrow{color:var(--sun)} .livecard p{color:color-mix(in srgb,var(--bg) 80%,transparent)}
.livecard .keys{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.livecard .keys li{background:color-mix(in srgb,var(--bg) 10%,transparent);border:1px solid color-mix(in srgb,var(--bg) 25%,transparent);border-radius:12px;padding:10px 14px;font-weight:600;font-size:16px}
@media (max-width:760px){.livecard{grid-template-columns:minmax(0,1fr)}}
.donebanner{background:var(--sun-soft);color:var(--ink);border-radius:12px;padding:10px 14px;font-weight:700}

/* trang buổi học */
.dayview{display:grid;grid-template-columns:minmax(0,370px) minmax(0,1fr);gap:20px;align-items:start}
.dayview.one{grid-template-columns:minmax(0,1fr)}
@media (max-width:900px){.dayview{grid-template-columns:minmax(0,1fr)}}
.dhero{background:var(--surface);border-radius:22px;padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;position:sticky;top:130px}
@media (max-width:900px){.dhero{position:static}}
.dhero h1{font-size:clamp(24px,3vw,30px);font-weight:800;letter-spacing:-.02em}
.chip{align-self:flex-start;background:var(--acc);color:#fff;font-weight:700;font-size:13px;padding:4px 12px;border-radius:999px}
.who{display:flex;gap:12px;align-items:center;background:var(--soft);border-radius:14px;padding:10px 12px}
.who small{display:block;font-size:12px;color:var(--muted)}
.av{width:44px;height:44px;border-radius:50%;background:var(--acc-soft);color:var(--acc);font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.note{font-size:13.5px;color:var(--muted);border-left:3px solid var(--sun);padding-left:10px}
.tiles{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;height:100%;border-radius:20px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow);text-decoration:none;color:var(--ink);border:3px solid transparent;position:relative;transition:transform .12s}
.tile:hover{transform:translateY(-2px)}
.tile .art{height:118px;display:flex;align-items:center;justify-content:center;background:var(--tile-bg);color:var(--tile-fg)}
.tile .tmeta{display:flex;flex-direction:column;gap:2px;padding:12px 14px 14px;background:var(--tile-band);color:#fff;flex:1}
.tile .tmeta small{font-size:12.5px;font-weight:700;opacity:.9}
.tile .tmeta b{font-size:17px;line-height:1.25}
.tile .tmeta em{font-style:normal;font-size:12.5px;opacity:.9}
.tile .st{position:absolute;top:10px;right:10px}
.tile.cur{border-color:var(--sun)}
.tile.locked{opacity:.55}
.tile.locked:hover{transform:none}
.t-en{--tile-bg:var(--en-soft);--tile-fg:var(--en);--tile-band:#1F44D6}
.t-zh{--tile-bg:var(--zh-soft);--tile-fg:var(--zh);--tile-band:#C2271F}
.t-sun{--tile-bg:var(--sun-soft);--tile-fg:#B07D00;--tile-band:#A16207}
.t-green{--tile-bg:var(--green-soft);--tile-fg:var(--green);--tile-band:#15803D}
.t-slate{--tile-bg:var(--slate-soft);--tile-fg:var(--slate);--tile-band:#334155}

@media (max-width:600px){
  .tiles{grid-template-columns:minmax(0,1fr);gap:10px}
  .tile{flex-direction:row;border-radius:16px}
  .tile .art{height:auto;width:78px;flex:none}
  .tile .art svg{width:36px;height:36px}
  .tile .tmeta{padding:10px 12px;padding-right:64px}
  .tile .tmeta b{font-size:16px}
}
.qt.sm{font-size:15px;font-weight:600;color:var(--muted)}
/* trình làm bài */
.player{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.ptop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.crumb{font-weight:700;color:var(--muted);font-size:14px;margin-right:auto}
.spd[aria-pressed="true"]{background:var(--sun-soft);border-color:var(--sun)}
.pcard{background:var(--tile-bg);border-radius:24px;padding:clamp(12px,2.4vw,20px);display:flex;flex-direction:column;gap:14px}
.phead{display:flex;align-items:center;gap:12px}
.phead>div{flex:1;min-width:0}
.phead small{font-size:12.5px;font-weight:700;color:var(--tile-fg);text-transform:uppercase;letter-spacing:.08em}
.phead h1{font-size:clamp(19px,2.6vw,24px);font-weight:800}
.art.sm{width:48px;height:48px;border-radius:14px;background:var(--surface);color:var(--tile-fg);display:flex;align-items:center;justify-content:center;flex:none}
.pbody{background:var(--surface);border-radius:20px;padding:clamp(16px,3vw,28px);display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow);min-height:280px}
.intro{display:flex;flex-direction:column;gap:14px}
.rulecard ol{margin:6px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:4px;font-size:16.5px}
.rulebox{background:var(--soft);border-radius:14px;padding:12px 16px;font-size:15.5px}
.rulebox p:last-child{margin-top:4px}

/* câu hỏi */
.items{display:flex;flex-direction:column;gap:14px}
.prog{display:flex;gap:5px;flex-wrap:wrap}
.prog i{width:26px;height:8px;border-radius:4px;background:var(--line)}
.prog i.now{background:var(--acc);width:40px} .prog i.ok{background:var(--good)} .prog i.fix{background:var(--sun)}
.stage{display:flex;flex-direction:column;gap:14px}
.qhead{display:flex;justify-content:space-between}
.qn{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.q{display:flex;flex-direction:column;gap:14px;margin:0;align-items:stretch}
.qt{font-size:clamp(19px,2.4vw,23px);font-weight:700;text-align:center;line-height:1.35}
.q .au{align-self:center}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;min-height:64px;padding:12px 14px;border:2px solid var(--line);border-radius:16px;background:var(--surface);cursor:pointer;font-size:17px;font-weight:600;box-shadow:0 3px 0 var(--line)}
.opt .badge{flex:none;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;background:var(--en)}
.opt:nth-child(2) .badge{background:#C2410C} .opt:nth-child(3) .badge{background:var(--green)} .opt:nth-child(4) .badge{background:#7C3AED}
.opt .ot[lang="zh"]{font-size:21px}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);box-shadow:0 3px 0 color-mix(in srgb,var(--bad) 40%,transparent)}
.opt.wrong .ot{text-decoration:line-through;text-decoration-color:var(--bad)}
.opt.right{border-color:var(--good);background:var(--good-bg);box-shadow:0 3px 0 color-mix(in srgb,var(--good) 40%,transparent)}
.opt.hint{border-color:var(--good);border-style:dashed}
.opt:disabled{cursor:default}
.inp{flex:1 1 220px;min-width:0;min-height:56px;padding:0 16px;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font:600 19px var(--font);text-align:center}
.inp:focus{border-color:var(--acc);outline:none;background:var(--surface)}
.area{width:100%;flex-basis:100%;min-height:150px;padding:14px 16px;line-height:1.6;resize:vertical;text-align:left;font-weight:500;font-size:17px}
.ans,.pool{display:flex;flex-wrap:wrap;gap:10px;min-height:64px;align-items:center;justify-content:center;padding:10px;border-radius:16px}
.ans{background:var(--soft);border:2px dashed var(--line)}
.tok{min-height:52px;padding:0 16px;border-radius:14px;border:2px solid #E6B800;background:var(--sun);color:#3B2F00;cursor:pointer;font-size:19px;font-weight:700;display:inline-flex;align-items:center;gap:6px;box-shadow:0 3px 0 #C99A00}
.ans .tok{background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:0 3px 0 var(--line)}
.tok small{font-size:11px;color:var(--muted);font-weight:700}
.tok.right{border-color:var(--good);box-shadow:0 3px 0 var(--good)}
.tok.wrong{border-color:var(--bad);background:var(--bad-bg);box-shadow:0 3px 0 var(--bad)}
.crit{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:15px}
.crit li::before{content:"○ ";color:var(--muted)}
.crit li.ok::before{content:"✓ ";color:var(--good);font-weight:800}
.crit li.no{color:var(--bad)} .crit li.no::before{content:"✗ ";font-weight:800}
.next{align-self:center;min-height:56px;padding:0 30px;font-size:17px;border-radius:14px}

/* phản hồi */
.fb{border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;font-size:15.5px;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.98);opacity:.6}to{transform:none;opacity:1}}
.fb.good{background:var(--good-bg);border:2px solid color-mix(in srgb,var(--good) 45%,transparent)}
.fb.bad{background:var(--bad-bg);border:2px solid color-mix(in srgb,var(--bad) 40%,transparent)}
.fbt{font-weight:800;font-size:16.5px}
.fb.good .fbt{color:var(--good)} .fb.bad .fbt{color:var(--bad)}
.lab{font-weight:700;color:var(--muted);font-size:13.5px}
.where{font-size:18px}
mark.bad{background:var(--mark);color:var(--ink);border-radius:5px;padding:0 4px;text-decoration:underline wavy var(--bad);text-underline-offset:4px}
.gap{display:inline-block;min-width:1.4em;text-align:center;color:var(--bad);font-weight:800;border-bottom:2px solid var(--bad);margin:0 2px}
.reveal{border-top:1px dashed color-mix(in srgb,var(--bad) 40%,transparent);padding-top:8px}

  return String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase()
    .replace(/[\s\d.,!?;:'"“”()…，。！？；：、～~—-]/g, "");
}
const N = (lang, s) => lang === "zh" ? nz(s) : ne(s);
function lev(a, b) { const m = a.length, n = b.length; const d = Array.from({ length: m + 1 }, (_, i) => [i]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[m][n]; }
function markIn(raw, mark) {
  const s = String(raw); if (!mark) return esc(s);
  let i = -1, len = 0;
  if (mark instanceof RegExp) { const m = s.match(new RegExp(mark.source, "i")); if (m) { i = m.index; len = m[0].length; } }
  else { i = s.toLowerCase().indexOf(String(mark).toLowerCase()); len = String(mark).length; }
  if (i < 0) return esc(s);
  return esc(s.slice(0, i)) + '<mark class="bad">' + esc(s.slice(i, i + len)) + "</mark>" + esc(s.slice(i + len));
}
/* so sánh từng từ (Anh) hoặc từng chữ (Trung): đỏ = sai/thừa, ô trống = còn thiếu */
function diffHTML(lang, raw, model) {
  const L = lang === "zh" ? [...nz(raw)] : ne(raw).split(" ").filter(Boolean);
  const M = lang === "zh" ? [...nz(model)] : ne(model).split(" ").filter(Boolean);
  const m = L.length, n = M.length, T = Array.from({ length: m + 1 }, () => Array(n + 1).fill(0));
  for (let i = m - 1; i >= 0; i--) for (let j = n - 1; j >= 0; j--) T[i][j] = L[i] === M[j] ? T[i + 1][j + 1] + 1 : Math.max(T[i + 1][j], T[i][j + 1]);
  let i = 0, j = 0, out = [], bad = 0, miss = 0; const sep = lang === "zh" ? "" : " ";
  while (i < m || j < n) {
    if (i < m && j < n && L[i] === M[j]) { out.push(esc(L[i])); i++; j++; }
    else if (j < n && (i >= m || T[i][j + 1] >= T[i + 1][j])) { if (!(out.length && out[out.length - 1] === '<span class="gap">＿</span>')) { out.push('<span class="gap">＿</span>'); miss++; } j++; }
    else { out.push('<mark class="bad">' + esc(L[i]) + "</mark>"); bad++; i++; }
  }
  return { html: out.join(sep), bad, miss };
}
function fmtPts(n) { return n.toLocaleString("vi-VN").replace(/,/g, "."); }

/* ---------- âm thanh: giọng đọc của trình duyệt ---------- */
let VOICES = [];
function loadVoices() { try { VOICES = speechSynthesis.getVoices(); } catch (e) { VOICES = []; } }
try { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; } catch (e) {}
function say(text, lang, slow) {
  try {
    const t = lang === "zh" ? "zh" : "en";
    const v = VOICES.find(v => v.lang && v.lang.toLowerCase().startsWith(t === "zh" ? "zh-cn" : "en-us")) || VOICES.find(v => v.lang && v.lang.toLowerCase().startsWith(t));
    if (VOICES.length && !v) { toast(t === "zh" ? "Máy bạn chưa có giọng đọc tiếng Trung. Bấm 'Lời thoại' để đọc." : "Máy bạn chưa có giọng đọc tiếng Anh. Bấm 'Lời thoại' để đọc."); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text).replace(/\(.*?\)/g, ""));
    u.lang = t === "zh" ? "zh-CN" : "en-US"; if (v) u.voice = v;
    u.rate = (slow || S.slow) ? 0.72 : 1;
    speechSynthesis.speak(u);
  } catch (e) { toast("Trình duyệt này chưa phát được âm thanh."); }
}
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 3500); }

/* ---------- điểm ---------- */
function award(label, p) { if (!p) return; S.points += p; S.ledger.unshift({ t: label, p }); S.ledger = S.ledger.slice(0, 40); save(); renderTop(); renderSide(); }
function addReview(lang, front, back) {
  const list = S.review[lang]; if (!back || list.some(c => c.front === front)) return;
  list.push({ front, back }); save(); renderTop();
}

/* ---------- dựng bài theo ngày ---------- */
function exKey(day, code) { return S.lang + ":" + day + ":" + code; }
function buildEx(day, code) {
  const D = DATA[S.lang], L = S.lang, base = code[0];
  const title = typeof TITLES[base] === "object" ? TITLES[base][L] : TITLES[base];
  const ex = { key: exKey(day, code), code: base, title, rule: D.rules[base], pts: PTS[base], mins: MINS[base], kind: "items", items: [] };
  if ("TSP".includes(base)) return learnEx(ex, code);
  const pickMC = arr => arr.map(o => Object.assign({ k: "mc" }, o));
  const pickType = arr => arr.map(o => Object.assign({ k: "type" }, o));
  if (base === "A") {
    const di = WEBDAYS.indexOf(day), rev = S.review[L].slice(0, 4);
    const items = rev.map(c => ({ k: "type", q: "Thẻ ôn từ lỗi của bạn: " + c.front, model: c.back, accept: null, review: true }));
    const bank = D.vocab, start = (di * 7) % bank.length;
    for (let i = 0; items.length < 10; i++) {
      const v = bank[(start + i) % bank.length];
      if (L === "zh") items.push({ k: "type", q: v[0], model: v[1], py: v[3], hint: v[2], accept: new RegExp("^(" + v[1] + "|" + v[3] + ")$") });
      else items.push({ k: "type", q: v[0], model: v[1], hint: v[2], card: true });
    }
    ex.items = items;
  } else if (base === "B") {
    const two = code === "B2"; ex.dialogue = two ? D.dialogue2 : D.dialogue; ex.items = pickMC(two ? D.listen2 : D.listen1); ex.listen = true;
  } else if (base === "C") { ex.kind = "shadow"; ex.lines = D.shadow; }
  else if (base === "D") ex.items = pickMC(D.sound);
  else if (base === "E") ex.items = pickMC(D.vocabQuiz);
  else if (base === "F") ex.items = D.order.map(o => Object.assign({ k: "order" }, o));
  else if (base === "G") ex.items = pickType(code === "G1" ? D.cloze.slice(0, 6) : D.cloze.slice(6));
  else if (base === "H") { const r = code === "H1" ? [0, 5] : code === "H2" ? [5, 10] : [10, 13]; ex.items = pickType(D.speak.slice(r[0], r[1])); ex.speakNote = true; if (code === "H3") { ex.title = "Tập 3 câu khoá cho trạm"; ex.mins = 5; } }
  else if (base === "I") { ex.kind = "roleplay"; ex.rp = code === "I1" ? D.roleplay.base : D.roleplay.variant; if (code === "I2") ex.title = "Đóng vai với AI · lượt 2 (biến thể)"; else ex.title = "Đóng vai với AI · lượt 1"; }
  else if (base === "J") { ex.items = pickMC(D.reading.qs); ex.reading = D.reading; }
  else if (base === "K") { ex.items = [{ k: "free", q: D.writing.task, criteria: D.writing.criteria, errors: D.writing.errors, sample: D.writing.sample, ai: true }]; }
  else if (base === "L") { ex.items = D.test.map(o => Object.assign({}, o)); ex.test = true; }
  else if (base === "M") { ex.kind = "cando"; ex.list = D.candoList[S.level]; }
  else if (base === "N") { ex.items = pickType(D.sheet.fixes); ex.sheet = D.sheet; }
  return ex;
}

/* ---------- chạy các câu hỏi ---------- */
function runItems(ex, body, finish) {
  const L = S.lang, n = ex.items.length;
  const st = ex.items.map(() => ({ tries: 0, done: false, revealed: false }));
  let idx = 0;
  const wrap = el(`<div class="items"><div class="prog" aria-hidden="true">${ex.items.map(() => "<i></i>").join("")}</div><div class="stage"></div></div>`);
  body.appendChild(wrap);
  const stage = $(".stage", wrap), dots = [...wrap.querySelectorAll(".prog i")];
  function show() {
    dots.forEach((d, i) => d.className = st[i].done ? (st[i].tries === 0 ? "ok" : "fix") : i === idx ? "now" : "");
    const it = ex.items[idx];
    stage.innerHTML = "";
    const head = el(`<div class="qhead"><span class="qn">Câu ${idx + 1}/${n}${it.s ? " · " + esc(it.s) : ""}</span></div>`);
    stage.appendChild(head);
    const onDone = () => {
      st[idx].done = true; dots[idx].className = st[idx].tries === 0 ? "ok" : "fix";
      const nextBtn = el(`<button type="button" class="btn primary next">${idx < n - 1 ? "Câu tiếp →" : "Hoàn thành bài"}</button>`);
      stage.appendChild(nextBtn); nextBtn.focus();
      nextBtn.onclick = () => {
        if (idx < n - 1) { idx++; show(); return; }
        const first = st.filter(s => s.tries === 0).length, repair = st.filter(s => s.tries > 0 && !s.revealed).length;
        let extra = "";
        if (ex.test) {
          const by = {}; ex.items.forEach((it, i) => { const k = it.s; by[k] = by[k] || [0, 0]; by[k][1]++; if (st[i].tries === 0) by[k][0]++; });
          extra = "Theo kỹ năng: " + Object.keys(by).map(k => `${k} ${by[k][0]}/${by[k][1]}`).join(", ");
        }
        if (ex.openScript) ex.openScript();
        finish({ total: n, first, repair, extra, firstFlags: st.map(s => s.tries === 0) });
      };
    };
    const ctx = { L, ex, st: st[idx], it, onDone, stage, idx };
    if (it.k === "mc") itemMC(ctx); else if (it.k === "type") itemType(ctx); else if (it.k === "order") itemOrder(ctx); else if (it.k === "free") itemFree(ctx);
  }
  show();
}
function fbBox() { return el(`<div class="fb" role="status" aria-live="polite" hidden></div>`); }
function wrongMsg(ctx, whereHTML, why) {
  const { st, ex } = ctx;
  st.tries++;
  const shortRule = ex.rule ? `<details class="mini"><summary>Xem lại quy tắc</summary><p>${ex.rule}</p></details>` : "";
  let html = `<p class="fbt">Chưa đúng · lần ${st.tries}</p>`;
  if (whereHTML) html += `<p class="where"><span class="lab">Chỗ sai:</span> ${whereHTML}</p>`;
  html += `<p class="why">${why}</p>`;
  if (st.tries >= 2 && !st.revealed) { st.revealed = true; }
  return html + shortRule;
}

/* trắc nghiệm */
function itemMC(ctx) {
  const { L, it, st, stage, onDone, ex } = ctx;
  const q = el(`<div class="q"><p class="qt">${esc(it.q)}</p>${it.audio ? `<button type="button" class="btn sound au" aria-label="Nghe">${ICON.play} Nghe</button>` : ""}<div class="opts" role="group" aria-label="Các lựa chọn">${it.opts.map((o, i) => `<button type="button" class="opt" data-i="${i}"><span class="badge">${"ABCD"[i]}</span><span class="ot" lang="${/[一-鿿]/.test(o) ? "zh" : "vi"}">${esc(o)}</span></button>`).join("")}</div></div>`);
  const fb = fbBox(); stage.appendChild(q); stage.appendChild(fb);
  if (it.audio) { $(".au", q).onclick = () => say(it.audio, L); }
  q.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if (st.done) return;
    const i = +b.dataset.i;
    if (i === it.a) {
      b.classList.add("right"); q.querySelectorAll(".opt").forEach(x => x.disabled = true);
      fbOn(fb, "good");
      fb.innerHTML = `<p class="fbt">${st.tries === 0 ? "Đúng" : st.revealed ? "Đúng. Bạn đã tự chọn lại đáp án đúng." : "Đúng rồi, bạn đã tự sửa được (+5 khi xong bài)"}</p>` + (lineReason(ctx) ? `<p class="why">Thông tin ở ${esc(lineReason(ctx))}</p>` : "");
      onDone(); return;
    }
    b.classList.add("wrong"); b.disabled = true;
    const why = (it.why && it.why[i]) ? esc(it.why[i]) : "Lựa chọn này không khớp với nội dung.";
    let where = `bạn chọn <mark class="bad">${esc(it.opts[i])}</mark>`;
    let html = wrongMsg(ctx, where, why);
    if (it.line != null && ex.dialogue) {
      const row = ex.dialogue[it.line];
      html += `<p class="hintline">Thông tin nằm ở câu thoại: <span lang="${L === "zh" ? "zh" : "en"}">${esc(row[0])}: ${esc(row[1])}</span> <button type="button" class="btn ghost small pl">▶ Nghe lại câu này</button></p>`;
    }
    if (st.revealed) html += `<p class="reveal">Đáp án đúng: <b>${esc(it.opts[it.a])}</b>. Bấm vào đáp án đúng để hoàn thành câu.</p>`;
    else html += `<p class="next-step">Chọn lại một đáp án khác.</p>`;
    fbOn(fb, "bad"); fb.innerHTML = html;
    const pl = $(".pl", fb); if (pl) pl.onclick = () => say(ex.dialogue[it.line][1], L, true);
    if (st.revealed) q.querySelector(`.opt[data-i="${it.a}"]`).classList.add("hint");
    addReview(L, it.q, it.opts[it.a]);
  });
}
function lineReason(ctx) { const { it, ex } = ctx; if (it.line != null && ex.dialogue) return "câu thoại: " + ex.dialogue[it.line][1]; return ""; }

/* gõ câu trả lời */
function checkType(L, it, raw) {
  const n = N(L, raw);
  if (!n) return { empty: true };
  let ok = false;
  if (it.accept) ok = it.accept.test(n);
  else if (it.review) ok = N(L, raw) === N(L, it.model) || (L === "zh" && it.py && n === it.py);
  else ok = n === N(L, it.model);
  if (ok) return { ok: true };
  if (L === "en" && it.model && !it.parts) { const m = ne(it.model); if (m.length > 6 && lev(n, m) <= 1) return { ok: true, near: true }; }
  if (L === "en" && it.card && ne(it.model).replace(/^(a|an) /, "") === n) return { ok: false, where: markIn(raw, raw.trim()), why: "Thiếu mạo từ: nghề số ít luôn đi với a/an → " + esc(it.model) + "." };
  if (L === "en" && it.card && /^an? /.test(n) && /^an? /.test(ne(it.model)) && n.replace(/^an? /, "") === ne(it.model).replace(/^an? /, "")) return { ok: false, where: markIn(raw, /^\s*an?\b/i), why: "Sai mạo từ: trước âm nguyên âm dùng an, trước phụ âm dùng a." };
  for (const d of (it.diag || [])) if (d[0].test(n)) return { ok: false, where: markIn(raw, d[1]), why: esc(d[2]) };
  if (it.parts) {
    const miss = it.parts.filter(p => !p[0].test(n));
    if (miss.length) return { ok: false, where: esc(raw), why: "Câu của bạn còn thiếu: " + miss.map(p => "<b>" + esc(p[1]) + "</b>").join("; ") + "." };
    return { ok: false, where: esc(raw), why: "Đủ các phần nhưng còn chỗ chưa đúng mẫu câu. So với khung: <span class='model'>" + esc(it.model) + "</span> (tên có thể khác)." };
  }
  const short = (L === "zh" ? [...nz(it.model)].length : ne(it.model).split(" ").length) <= 2;
  if (short) return { ok: false, where: `<mark class="bad">${esc(raw)}</mark>`, why: "Từ này không hợp với chỗ trống. Đọc lại nghĩa tiếng Việt trong ngoặc và quy tắc." };
  let model = it.model;
  if (L === "zh" && !/[一-鿿]/.test(raw) && it.py) model = it.py;
  const d = diffHTML(L, raw, model);
  return { ok: false, where: d.html, why: `Có ${d.bad} chỗ sai (tô đỏ) và ${d.miss} chỗ còn thiếu (＿).` + (L === "zh" && !/[一-鿿]/.test(raw) ? " Bính âm được so từng chữ cái, không cần dấu thanh." : "") };
}
function itemType(ctx) {
  const { L, it, st, stage, onDone } = ctx;
  const isZh = L === "zh";
  const q = el(`<form class="q" novalidate><p class="qt">${it.review ? "" : (it.hint && S.level === 1 && isZh ? "" : "")}${esc(it.q)}</p>
    ${it.hint && isZh ? `<p class="small muted">Gợi ý Mức 1: ${S.level === 1 ? esc(it.hint) : "(ẩn ở Mức 2)"}</p>` : ""}
    <div class="row"><input class="inp" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Câu trả lời" placeholder="${isZh ? "Gõ chữ Hán hoặc bính âm không dấu" : "Gõ câu trả lời"}">
    <button type="submit" class="btn primary">Kiểm tra</button></div></form>`);
  const fb = fbBox(); stage.appendChild(q); stage.appendChild(fb);
  const inp = $(".inp", q); setTimeout(() => inp.focus({ preventScroll: true }), 0);
  q.onsubmit = e => {
    e.preventDefault(); if (st.done) return;
    const r = checkType(L, it, inp.value);
    if (r.empty) { fbOn(fb, "bad"); fb.innerHTML = `<p class="why">Bạn chưa gõ câu trả lời.</p>`; return; }
    if (r.ok) {
      inp.readOnly = true; $("button", q).disabled = true;
      fbOn(fb, "good");
      fb.innerHTML = `<p class="fbt">${r.near ? "Chấp nhận" : st.tries === 0 ? "Đúng" : st.revealed ? "Đúng. Bạn đã tự gõ lại câu đúng." : "Đúng rồi, bạn đã tự sửa được (+5 khi xong bài)"}</p>` +
        (r.near ? `<p class="why">Lưu ý chính tả: <span class="model">${esc(it.model)}</span></p>` : "") +
        (it.model && !it.accept ? "" : it.model ? `<p class="why">Câu mẫu: <span class="model" lang="${isZh ? "zh" : "en"}">${esc(it.model)}</span>${isZh && it.py ? "" : ""}</p>` : "");
      onDone(); return;
    }
    let html = wrongMsg(ctx, r.where, r.why);
    if (st.revealed) html += `<p class="reveal">Đáp án đúng: <b lang="${isZh ? "zh" : "en"}">${esc(it.model)}</b>${isZh && it.py ? ` <span class="muted">(${esc(it.py)})</span>` : ""}. Gõ lại đáp án đúng vào ô để hoàn thành câu.</p>`;
    else html += `<p class="next-step">Sửa ngay trong ô rồi bấm Kiểm tra.</p>`;
    fbOn(fb, "bad"); fb.innerHTML = html;
    if (st.tries === 1) addReview(L, it.q.replace(/^Thẻ ôn từ lỗi của bạn: /, ""), it.model);
    inp.focus(); inp.select();
  };
}

/* sắp xếp câu */
function seeded(arr, seed) { const a = arr.map((v, i) => [v, i]); let s = seed + 7; for (let i = a.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor(s / 233280 * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } if (a.every((x, i) => x[1] === i)) a.push(a.shift()); return a; }
function itemOrder(ctx) {
  const { L, it, st, stage, onDone, idx } = ctx;
  const pool = seeded(it.tokens, idx + 3), picked = [];
  const q = el(`<div class="q"><p class="qt sm">Chạm các ô theo đúng thứ tự để thành câu. Chạm ô đã chọn để trả lại.</p>
    <div class="ans" aria-label="Câu của bạn"></div><div class="pool" aria-label="Các ô chữ"></div>
    <div class="row"><button type="button" class="btn primary chk">Kiểm tra</button><button type="button" class="btn ghost clr">Xếp lại từ đầu</button></div></div>`);
  const fb = fbBox(); stage.appendChild(q); stage.appendChild(fb);
  const ans = $(".ans", q), pl = $(".pool", q);
  function draw(marks) {
    ans.innerHTML = picked.length ? picked.map((p, i) => `<button type="button" class="tok${marks ? (marks[i] ? " right" : " wrong") : ""}" data-a="${i}" lang="${L === "zh" ? "zh" : "en"}"><small>${i + 1}</small>${esc(p[0])}</button>`).join("") : '<span class="muted small">Câu của bạn sẽ hiện ở đây</span>';
    pl.innerHTML = pool.map((p, i) => picked.includes(p) ? "" : `<button type="button" class="tok" data-p="${i}" lang="${L === "zh" ? "zh" : "en"}">${esc(p[0])}</button>`).join("");
    ans.querySelectorAll("[data-a]").forEach(b => b.onclick = () => { if (st.done) return; picked.splice(+b.dataset.a, 1); draw(); });
    pl.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { if (st.done) return; picked.push(pool[+b.dataset.p]); draw(); });
  }
  draw();
  $(".clr", q).onclick = () => { if (st.done) return; picked.length = 0; draw(); };
  $(".chk", q).onclick = () => {
    if (st.done) return;
    if (picked.length < it.tokens.length) { fbOn(fb, "bad"); fb.innerHTML = `<p class="why">Còn ${it.tokens.length - picked.length} ô chưa dùng. Xếp hết các ô rồi bấm Kiểm tra.</p>`; return; }
    const marks = picked.map((p, i) => p[0] === it.tokens[i]);
    draw(marks);
    if (marks.every(Boolean)) {
      fbOn(fb, "good");
      fb.innerHTML = `<p class="fbt">${st.tries === 0 ? "Đúng" : st.revealed ? "Đúng. Bạn đã tự xếp lại câu đúng." : "Đúng rồi, bạn đã tự sửa được (+5 khi xong bài)"}</p><p class="why">${esc(it.explain)}</p>`;
      onDone(); return;
    }
    const firstBad = marks.indexOf(false), wrongN = marks.filter(m => !m).length;
    let html = wrongMsg(ctx, `ô số ${firstBad + 1} (<mark class="bad">${esc(picked[firstBad][0])}</mark>) đứng sai chỗ; tổng cộng ${wrongN} ô sai vị trí (viền đỏ).`, "Quy tắc: " + esc(it.explain));
    const sent = it.tokens.join(L === "zh" ? "" : " ").replace(/ \?/, "?");
    if (st.revealed) html += `<p class="reveal">Câu đúng: <b lang="${L === "zh" ? "zh" : "en"}">${esc(sent)}</b>. Bấm các ô viền đỏ để trả lại rồi xếp lại cho đúng.</p>`;
    else html += `<p class="next-step">Ô viền xanh đã đúng chỗ. Bấm ô viền đỏ để trả lại rồi xếp lại.</p>`;
    fbOn(fb, "bad"); fb.innerHTML = html;
    if (st.tries === 1) addReview(L, "Sắp xếp: " + it.tokens.slice().sort().join(" / "), sent);
  };
}

/* viết tự do (tin nhắn, bài nói trong kiểm tra) */
let SAMPLE = null;
function itemFree(ctx) {
  const { L, it, st, stage, onDone } = ctx;
  const crit = it.criteria.filter(c => !c[3] || c[3] <= S.level);
  const q = el(`<form class="q" novalidate><p class="qt">${esc(it.q)}</p>${it.m1 ? `<p class="small muted">${esc(S.level === 1 ? it.m1 : it.m2)}</p>` : ""}
    <ul class="crit">${crit.map((c, i) => `<li data-c="${i}">${esc(c[1])}</li>`).join("")}</ul>
    <textarea class="inp area" rows="5" aria-label="Bài viết của bạn" placeholder="${L === "zh" ? "Gõ chữ Hán hoặc bính âm" : "Viết ở đây"}"></textarea>
    <div class="row"><button type="submit" class="btn primary">Kiểm tra</button>${it.sample ? '<button type="button" class="btn ghost smp" hidden>Xem bài mẫu</button>' : ""}${it.ai ? '<button type="button" class="btn ghost ai" hidden>Nhờ Claude nhận xét thêm</button>' : ""}</div></form>`);
  const fb = fbBox(), aiBox = el(`<div class="aibox" hidden></div>`);
  stage.appendChild(q); stage.appendChild(fb); stage.appendChild(aiBox);
  const ta = $(".area", q);
  if (it.sample) $(".smp", q).onclick = () => { aiBox.hidden = false; aiBox.innerHTML = `<p class="small muted">Bài mẫu để tham khảo (không chép nguyên văn):</p><pre lang="${L === "zh" ? "zh" : "en"}">${esc(it.sample)}</pre>`; };
  if (it.ai) aiButton($(".ai", q), aiBox, () => ({ task: it.q, text: ta.value }));
  q.onsubmit = e => {
    e.preventDefault(); if (st.done) return;
    const raw = ta.value, n = N(L, raw.replace(/\n/g, " ")), nq = L === "zh" ? n : neq(raw.replace(/\n/g, " "));
    if (!n) { fbOn(fb, "bad"); fb.innerHTML = `<p class="why">Bạn chưa viết gì.</p>`; return; }
    const res = crit.map(c => c[0].test(L === "zh" ? n : nq));
    q.querySelectorAll(".crit li").forEach((li, i) => li.className = res[i] ? "ok" : "no");
    const errs = (it.errors || []).filter(e => e[0].test(n));
    if (res.every(Boolean) && !errs.length) {
      ta.readOnly = true; $("button[type=submit]", q).disabled = true;
      fbOn(fb, "good");
      fb.innerHTML = `<p class="fbt">${st.tries === 0 ? "Đạt đủ các phần, không còn lỗi đã học" : "Đạt rồi, bạn đã tự sửa được (+5 khi xong bài)"}</p>`;
      onDone(); return;
    }
    let marked = esc(raw);
    errs.forEach(e => { marked = markIn(raw, e[1]); });
    const missing = crit.filter((c, i) => !res[i]).map(c => "<b>" + esc(c[1]) + "</b>");
    const why = [missing.length ? "Còn thiếu: " + missing.join("; ") + "." : "", ...errs.map(e => "Lỗi: " + esc(e[2]))].filter(Boolean).join("<br>");
    let html = wrongMsg(ctx, errs.length ? `<span class="pre">${errs.length === 1 ? marked : esc(raw)}</span>` : "", why);
    html += `<p class="next-step">Sửa ngay trong bài viết rồi bấm Kiểm tra. Mục đã đạt có dấu ✓ ở danh sách trên.</p>`;
    fbOn(fb, "bad"); fb.innerHTML = html;
    if (st.revealed && it.sample) $(".smp", q).hidden = false;
  };
}
async function getSample() { if (SAMPLE !== null) return SAMPLE; try { SAMPLE = window.claude ? await window.claude.use("sample") : null; } catch (e) { SAMPLE = null; } return SAMPLE; }
function aiButton(btn, box, getInput) {
  getSample().then(s => { if (s) btn.hidden = false; });
  btn.onclick = async () => {
    const s = await getSample(); if (!s) return;
    const inp = getInput(); if (!inp.text || !inp.text.trim()) { toast("Viết hoặc nói xong rồi mới nhờ nhận xét."); return; }
    btn.disabled = true; box.hidden = false; box.innerHTML = `<p class="muted">Claude đang đọc bài…</p>`;
    const prompt = `Bạn là giáo viên ${S.lang === "zh" ? "tiếng Trung" : "tiếng Anh"} cho người lớn Việt Nam, trình độ mới bắt đầu (tuần 1, Mức ${S.level}). Chủ đề tuần: chào hỏi, giới thiệu tên, quê, nghề, hỏi lại.
Nhiệm vụ của học viên: ${inp.task}
Bài của học viên:
"""${inp.text.slice(0, 3000)}"""
Nhận xét bằng tiếng Việt, ngắn, tường minh, chỉ đúng chỗ sai. Chỉ nhận xét những gì có trong bài. Trả về đúng một JSON:
{"diem_manh": "1 câu nêu điều làm tốt, cụ thể", "can_sua": [{"cau_cua_ban": "trích nguyên văn đoạn sai", "sua_thanh": "câu đúng", "vi_sao": "quy tắc trong 1 câu"}], "buoc_tiep": "1 việc nên luyện tiếp"}
Tối đa 3 mục can_sua; nếu không có lỗi thì để mảng rỗng.`;
    try {
      const r = await s.json(prompt, { modelTier: "quick" });
      const fix = Array.isArray(r.can_sua) ? r.can_sua : [];
      box.innerHTML = `<p class="fbt">Claude nhận xét</p><p><b>Làm tốt:</b> ${esc(r.diem_manh || "")}</p>` +
        (fix.length ? `<ul class="fixes">${fix.map(f => `<li><mark class="bad">${esc(f.cau_cua_ban || "")}</mark> → <b>${esc(f.sua_thanh || "")}</b><br><span class="muted">${esc(f.vi_sao || "")}</span></li>`).join("")}</ul>` : "<p>Không thấy lỗi cần sửa.</p>") +
        `<p><b>Luyện tiếp:</b> ${esc(r.buoc_tiep || "")}</p>`;
    } catch (e) {
      const c = e && e.code;
      if (c === "not_granted" || c === "sampling_disabled" || c === "not_declared" || c === "capability_disabled") { btn.hidden = true; box.innerHTML = `<p class="muted">Nhận xét bằng Claude chưa được bật cho trang này.</p>`; }
      else if (c === "rate_limited") box.innerHTML = `<p class="muted">Đang có quá nhiều yêu cầu. Thử lại sau ít phút.</p>`;
      else if (c === "cancelled") box.hidden = true;
      else box.innerHTML = `<p class="muted">Chưa lấy được nhận xét. Bấm lại để thử.</p>`;
    } finally { btn.disabled = false; }
  };
}

/* nghe và nhại */
function runShadow(ex, body, finish) {
  const L = S.lang;
  const list = el(`<ol class="shadow">${ex.lines.map((l, i) => {
    const t = l[0], py = L === "zh" ? l[1] : "", focus = L === "zh" ? l[2] : l[1];
    return `<li><div class="sl"><span class="st" lang="${L === "zh" ? "zh" : "en"}">${esc(t)}</span>${py ? `<span class="py">${esc(py)}</span>` : ""}</div>
    <div class="row"><button type="button" class="btn ghost small n1" data-i="${i}">▶ Nghe</button><button type="button" class="btn ghost small n2" data-i="${i}">▶ Chậm</button></div>
    <p class="focus"><span class="lab">Chú ý:</span> ${esc(focus)}</p>
    <label class="tick"><input type="checkbox" data-i="${i}"> Tôi đã nhại câu này 3 lần và để ý điểm trên</label></li>`; }).join("")}</ol>`);
  body.appendChild(list);
  list.querySelectorAll(".n1").forEach(b => b.onclick = () => say(ex.lines[+b.dataset.i][0], L, false));
  list.querySelectorAll(".n2").forEach(b => b.onclick = () => say(ex.lines[+b.dataset.i][0], L, true));
  const doneBtn = el(`<button type="button" class="btn primary" disabled>Hoàn thành bài</button>`); body.appendChild(doneBtn);
  const boxes = [...list.querySelectorAll("input[type=checkbox]")];
  boxes.forEach(b => b.onchange = () => { doneBtn.disabled = !boxes.every(x => x.checked); });
  doneBtn.onclick = () => finish({ extra: "Nhại đủ " + ex.lines.length + " câu" });
}

/* tự chấm can-do */

    const msg = box.querySelectorAll(".cdmsg")[i], target = DAYS.find(d => d.id === ex.list[i][1]);

/* đóng vai */
function runRoleplay(ex, body, finish) {
  const L = S.lang, rp = ex.rp, turns = rp.turns.filter(t => !t.m2 || S.level === 2);
  const log = [], tags = {}; let ti = 0, reveals = 0, firstOk = 0, repairs = 0;
  const box = el(`<div class="rp"><div class="rphead"><b>${esc(rp.title)}</b><span class="muted small">${esc(rp.partner)}</span></div>
    <div class="chat" aria-live="polite"></div>
    <form class="rpform" novalidate><p class="frame small" hidden></p><div class="row"><input class="inp" type="text" autocomplete="off" spellcheck="false" aria-label="Câu trả lời của bạn" placeholder="${L === "zh" ? "Gõ chữ Hán hoặc bính âm" : "Gõ câu bạn nói"}"><button class="btn primary" type="submit">Gửi</button></div></form>
    <div class="fb" role="status" aria-live="polite" hidden></div><div class="rpend"></div></div>`);
  body.appendChild(box);
  if (S.level === 2) box.insertBefore(el(`<p class="note">Mức 2: không có khung câu, có một tình huống phát sinh, và bạn cần nhắc lại thông tin của người kia ở lượt cuối.</p>`), $(".chat", box));
  const chat = $(".chat", box), form = $(".rpform", box), inp = $(".inp", form), fb = $(".fb", box), frame = $(".frame", form);
  let tries = 0, revealed = false;
  function aiTurn() {
    const t = turns[ti];
    const b = el(`<div class="msg ai"><div class="bub"><span lang="${L === "zh" ? "zh" : "en"}">${esc(t.ai)}</span>${t.py ? `<span class="py">${esc(t.py)}</span>` : ""}
      <span class="tools"><button type="button" class="btn ghost small pl">▶</button><button type="button" class="btn ghost small vi">Dịch</button></span><span class="vit" hidden>${esc(t.vi)}</span></div></div>`);
    $(".pl", b).onclick = () => say(t.ai, L); $(".vi", b).onclick = () => { $(".vit", b).hidden = !$(".vit", b).hidden; };
    if (/^\(|chờ bạn/.test(t.vi)) $(".vit", b).hidden = false;
    chat.appendChild(b); chat.scrollTop = chat.scrollHeight;
    frame.hidden = !(S.level === 1 && t.frame); frame.innerHTML = `<span class="lab">Khung câu Mức 1:</span> <span lang="${L === "zh" ? "zh" : "en"}">${esc(t.frame)}</span>`;
    tries = 0; revealed = false; inp.value = ""; fb.hidden = true;
  }
  aiTurn();
  form.onsubmit = e => {
    e.preventDefault(); if (ti >= turns.length) return;
    const t = turns[ti], raw = inp.value, n = N(L, raw), nq = L === "zh" ? n : neq(raw);
    if (!n) return;
    let err = null;
    for (const d of t.diag) if (d[0].test(n)) { err = { where: markIn(raw, d[1]), why: esc(d[2]) }; break; }
    if (!err) {
      const needs = t.need.concat(S.level === 2 && t.m2need ? t.m2need : []);
      const miss = needs.filter(p => !p[0].test(L === "zh" ? n : nq));
      if (miss.length) err = { where: esc(raw), why: "Câu của bạn còn thiếu: " + miss.map(p => "<b>" + esc(p[1]) + "</b>").join("; ") + "." };
    }
    if (revealed && err && N(L, raw) === N(L, t.model)) err = null;
    if (err) {
      tries++; if (tries >= 2) revealed = true;
      let html = `<p class="fbt">Chưa đạt lượt này · lần ${tries}</p><p class="where"><span class="lab">Chỗ sai:</span> ${err.where}</p><p class="why">${err.why}</p>`;
      html += revealed ? `<p class="reveal">Câu mẫu: <b lang="${L === "zh" ? "zh" : "en"}">${esc(t.model)}</b>. Gõ lại câu mẫu (hoặc câu đúng của bạn) để đi tiếp.</p>` : `<p class="next-step">Sửa lại câu rồi bấm Gửi. Cuộc trò chuyện chờ bạn.</p>`;
      fbOn(fb, "bad"); fb.innerHTML = html;
      log.push({ turn: ti, said: raw, ok: false, why: err.why.replace(/<[^>]+>/g, "") });
      if (tries === 1) addReview(L, "Đóng vai: " + t.vi.replace(/^\(.*?\)\s*/, ""), t.model);
      inp.focus(); inp.select(); return;
    }
    if (tries === 0) firstOk++; else if (!revealed) repairs++; else reveals++;
    tags[t.tag] = true;
    chat.appendChild(el(`<div class="msg me"><div class="bub" lang="${L === "zh" ? "zh" : "en"}">${esc(raw)}</div></div>`));
    log.push({ turn: ti, said: raw, ok: true });
    fbOn(fb, "good"); fb.innerHTML = `<p class="fbt">${tries === 0 ? "Đạt" : "Đạt sau khi sửa"}</p><p class="why">${esc(t.praise)}</p>`;
    ti++;
    if (ti < turns.length) setTimeout(aiTurn, 450);
    else endRP();
  };
  function endRP() {
    form.hidden = true;
    const cd = [["ten", "Nói tên"], ["que", "Nói quê / quốc tịch"], ["nghe", "Nói nghề"], ["hoilai", "Hỏi lại người đối diện"]].filter(c => turns.some(t => t.tag === c[0]));
    const errs = log.filter(l => !l.ok);
    const end = $(".rpend", box);
    end.innerHTML = `<div class="summary"><h4>Tóm tắt lượt đóng vai</h4>
      <ul class="crit">${cd.map(c => `<li class="${tags[c[0]] ? "ok" : "no"}">${esc(c[1])}</li>`).join("")}</ul>
      <p><b>Đúng ngay:</b> ${firstOk}/${turns.length} lượt · <b>Tự sửa:</b> ${repairs} · <b>Cần câu mẫu:</b> ${reveals}</p>
      ${errs.length ? `<p><b>Lỗi đã gửi giáo viên lớp nhóm:</b></p><ul class="fixes">${errs.slice(0, 4).map(e => `<li><mark class="bad">${esc(e.said)}</mark><br><span class="muted">${esc(e.why)}</span></li>`).join("")}</ul>` : "<p>Không có lỗi nào. Giáo viên lớp nhóm sẽ giao bạn vai trợ host.</p>"}
      <div class="row"><button type="button" class="btn ghost ai" hidden>Nhờ Claude nhận xét cả cuộc hội thoại</button><button type="button" class="btn primary fin">Hoàn thành bài</button></div><div class="aibox" hidden></div></div>`;
    aiButton($(".ai", end), $(".aibox", end), () => ({ task: "Đóng vai: " + rp.title + ". " + DATA[L].cando, text: turns.map((t, i) => { const mine = log.filter(l => l.turn === i).map(l => l.said); return "Đối tác: " + t.ai + "\nHọc viên: " + mine.join(" / "); }).join("\n") }));
    $(".fin", end).onclick = () => {
      const all = cd.every(c => tags[c[0]]) && reveals === 0;
      finish({ total: turns.length, first: firstOk, repair: repairs, bonus: all ? 10 : 0, bonusText: all ? "đạt mục tiêu can-do không cần câu mẫu (+10)" : "" });
    };
  }
}

/* ---------- đọc có lời kết thúc (để cảnh tự chạy) ---------- */
function sayThen(text, lang, pitch, cb) {
  let done = false; const end = () => { if (!done) { done = true; cb && cb(); } };
  const ms = 900 + String(text).length * (lang === "zh" ? 260 : 75) * (S.slow ? 1.35 : 1);
  try {
    const t = lang === "zh" ? "zh" : "en";
    const v = VOICES.find(v => v.lang && v.lang.toLowerCase().startsWith(t === "zh" ? "zh-cn" : "en-us")) || VOICES.find(v => v.lang && v.lang.toLowerCase().startsWith(t));
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text));
    u.lang = t === "zh" ? "zh-CN" : "en-US"; if (v) u.voice = v; u.rate = S.slow ? 0.72 : 0.95; u.pitch = pitch || 1;
    u.onend = end; u.onerror = end;
    speechSynthesis.speak(u);
  } catch (e) {}
  setTimeout(end, ms + 1500);
}

/* ---------- dựng nội dung học trước cho buildEx ---------- */
function learnEx(ex, code) {
  const L = S.lang, D = DATA[L], X = LEARN[L], base = code[0];
  ex.rule = LEARN_RULE[base];
  if (base === "T") { ex.kind = "cards"; ex.cards = X.cards[code]; ex.title = code === "T4" ? "Thẻ học: câu khoá cho trạm" : code === "T3" ? "Thẻ học: nói trang trọng" : "Thẻ học: từ và cụm câu mới"; }
  if (base === "P") { ex.kind = "pattern"; ex.pats = X.patterns[code]; ex.title = "Mẫu câu cần nắm"; }
  if (base === "S") {
    const sc = X.scenes[code]; ex.kind = "scene"; ex.setting = sc.setting;
    let lines = [];
    if (sc.src === "dialogue" || sc.src === "dialogue2") {
      lines = D[sc.src].map(r => L === "zh" ? { who: r[0], t: r[1], py: r[2], vi: r[3] } : { who: r[0], t: r[1], vi: r[2] });
      ex.title = "Xem cảnh: " + (code === "S1" ? "cuộc làm quen" : "hội thoại thứ hai");
    } else {
      const rp = sc.src === "rpbase" ? D.roleplay.base : D.roleplay.variant, partner = rp.partner.split(" · ")[0].split(" ")[0];
      rp.turns.filter(t => !t.m2 || S.level === 2).forEach(t => {
        lines.push({ who: partner, t: t.ai, py: t.py || "", vi: /^\(/.test(t.vi) ? "" : t.vi });
        lines.push({ who: sc.me, t: t.model, vi: "" });
      });
      ex.title = code === "S3" ? "Xem cảnh mẫu trước khi đóng vai" : "Xem cảnh mẫu trang trọng";
    }
    ex.lines2 = lines; ex.people = [...new Set(lines.map(l => l.who))].slice(0, 2);
  }
  return ex;
}

/* ---------- thẻ học ---------- */
function runCards(ex, body, finish) {
  const L = S.lang, cards = ex.cards; let i = 0, flipped = false, saved = 0;
  const box = el(`<div class="cardsx"><div class="prog" aria-hidden="true">${cards.map(() => "<i></i>").join("")}</div>
    <div class="fcard" tabindex="0" role="button" aria-label="Lật thẻ"></div>
    <div class="row center ctl"><button type="button" class="btn ghost prev">← Thẻ trước</button><button type="button" class="btn ghost flip">Lật thẻ</button><button type="button" class="btn primary nx">Thẻ tiếp →</button></div>
    <div class="row center"><button type="button" class="btn ghost small keep">Lưu thẻ này vào kho ôn</button></div></div>`);
  body.appendChild(box);
  const fc = $(".fcard", box), dots = [...box.querySelectorAll(".prog i")];
  function draw(play) {
    const c = cards[i];
    dots.forEach((d, k) => d.className = k < i ? "ok" : k === i ? "now" : "");
    fc.className = "fcard" + (flipped ? " back" : "");
    fc.innerHTML = !flipped
      ? `<span class="side">Mặt trước · ${i + 1}/${cards.length}</span><b class="fw" lang="${L === "zh" ? "zh" : "en"}">${esc(c.w)}</b>${c.py ? `<span class="fpy">${esc(c.py)}</span>` : ""}<button type="button" class="btn sound sp">${ICON.play} Nghe</button><span class="hint">Chạm thẻ để xem nghĩa</span>`
      : `<span class="side">Mặt sau · ${i + 1}/${cards.length}</span><span class="fwb" lang="${L === "zh" ? "zh" : "en"}">${esc(c.w)}${c.py ? ` <small>${esc(c.py)}</small>` : ""}</span><b class="fm">${esc(c.m)}</b>
         ${c.ex ? `<div class="fex"><span lang="${L === "zh" ? "zh" : "en"}">${esc(c.ex)}</span>${c.exm ? `<small>${esc(c.exm)}</small>` : ""}<button type="button" class="btn ghost small spx">${ICON.play} Nghe câu ví dụ</button></div>` : ""}
         <p class="fnote"><span class="lab">Ghi nhớ:</span> ${esc(c.n)}</p>`;
    const sp = $(".sp", fc); if (sp) sp.onclick = e => { e.stopPropagation(); say(c.w, L); };
    const spx = $(".spx", fc); if (spx) spx.onclick = e => { e.stopPropagation(); say(c.ex, L); };
    $(".prev", box).disabled = i === 0;
    $(".nx", box).textContent = i === cards.length - 1 ? "Xong thẻ học" : "Thẻ tiếp →";
    if (play && !flipped) say(c.w, L);
  }
  const flip = () => { flipped = !flipped; draw(false); };
  fc.onclick = flip; fc.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); } };
  $(".flip", box).onclick = flip;
  $(".prev", box).onclick = () => { if (i > 0) { i--; flipped = false; draw(true); } };
  $(".nx", box).onclick = () => { if (i < cards.length - 1) { i++; flipped = false; draw(true); } else finish({ learn: true, extra: `Học ${cards.length} thẻ${saved ? `, lưu ${saved} thẻ vào kho ôn` : ""}` }); };
  $(".keep", box).onclick = () => { const c = cards[i]; addReview(L, c.m, c.w); saved++; toast("Đã lưu vào kho ôn."); };
  draw(true);
}

/* ---------- cảnh hội thoại ---------- */
function runScene(ex, body, finish) {
  const L = S.lang, lines = ex.lines2, [pA, pB] = ex.people; let i = -1, auto = false, subVi = true, subPy = L === "zh";
  const box = el(`<div class="scene">

      <div class="nowline" aria-live="polite"><p class="muted">Bấm Phát cả cảnh hoặc Câu tiếp để bắt đầu.</p></div></div>
    <div class="row center"><button type="button" class="btn ghost prev">⏮ Câu trước</button><button type="button" class="btn primary playall">${ICON.play} Phát cả cảnh</button><button type="button" class="btn ghost nx">Câu tiếp ⏭</button></div>
    <div class="row center small"><label class="tick"><input type="checkbox" class="cvi" checked> Phụ đề tiếng Việt</label>${L === "zh" ? `<label class="tick"><input type="checkbox" class="cpy" checked> Bính âm</label>` : ""}</div>
    <ol class="log"></ol>
    <div class="row center"><button type="button" class="btn primary huge fin" disabled>Xem xong, sang bài tập</button></div></div>`);
  body.appendChild(box);
  const now = $(".nowline", box), log = $(".log", box);
  function lineHTML(l) { return `<span class="spk">${esc(l.who)}</span><span class="tx" lang="${L === "zh" ? "zh" : "en"}">${esc(l.t)}</span>${l.py && subPy ? `<span class="py">${esc(l.py)}</span>` : ""}${l.vi && subVi ? `<span class="vi">${esc(l.vi)}</span>` : ""}`; }
  function show(k, chain) {
    i = k; const l = lines[i];
    box.querySelectorAll(".actor").forEach(a => a.classList.toggle("talk", (a.classList.contains("a") && l.who === pA) || (a.classList.contains("b") && l.who !== pA)));
    now.className = "nowline " + (l.who === pA ? "left" : "right");
    now.innerHTML = `<div class="bub2">${lineHTML(l)}</div><button type="button" class="btn ghost small rep">${ICON.play} Nghe lại câu này</button>`;
    $(".rep", now).onclick = () => sayThen(l.t, L, l.who === pA ? 1.05 : 0.85);
    log.innerHTML = lines.slice(0, i + 1).map(x => `<li class="${x.who === pA ? "l" : "r"}">${lineHTML(x)}</li>`).join("");
    $(".prev", box).disabled = i <= 0;
    if (i === lines.length - 1) { $(".fin", box).disabled = false; }
    sayThen(l.t, L, l.who === pA ? 1.05 : 0.85, () => { if (chain && auto && i === k && i < lines.length - 1) show(i + 1, true); else if (i === lines.length - 1) { auto = false; $(".playall", box).innerHTML = `${ICON.play} Xem lại cả cảnh`; } });
  }
  $(".nx", box).onclick = () => { auto = false; if (i < lines.length - 1) show(i + 1, false); };
  $(".prev", box).onclick = () => { auto = false; if (i > 0) show(i - 1, false); };
  $(".playall", box).onclick = () => { auto = true; $(".playall", box).textContent = "Đang phát…"; show(i >= lines.length - 1 || i < 0 ? 0 : i, true); };
  $(".cvi", box).onchange = e => { subVi = e.target.checked; if (i >= 0) { now.querySelector(".bub2").innerHTML = lineHTML(lines[i]); log.innerHTML = lines.slice(0, i + 1).map(x => `<li class="${x.who === pA ? "l" : "r"}">${lineHTML(x)}</li>`).join(""); } };
  const cpy = $(".cpy", box); if (cpy) cpy.onchange = e => { subPy = e.target.checked; if (i >= 0) { now.querySelector(".bub2").innerHTML = lineHTML(lines[i]); log.innerHTML = lines.slice(0, i + 1).map(x => `<li class="${x.who === pA ? "l" : "r"}">${lineHTML(x)}</li>`).join(""); } };
  $(".fin", box).onclick = () => { auto = false; try { speechSynthesis.cancel(); } catch (e) {} finish({ learn: true, extra: `Xem đủ ${lines.length} câu thoại` }); };
}

/* ---------- mẫu câu ---------- */
function runPatterns(ex, body, finish) {
  const L = S.lang, pats = ex.pats; let i = 0;
  const box = el(`<div class="pats"><div class="prog" aria-hidden="true">${pats.map(() => "<i></i>").join("")}</div><div class="pat"></div>
    <div class="row center"><button type="button" class="btn ghost prev">← Mẫu trước</button><button type="button" class="btn primary nx">Mẫu tiếp →</button></div></div>`);
  body.appendChild(box);
  const pat = $(".pat", box), dots = [...box.querySelectorAll(".prog i")];
  function draw() {
    const p = pats[i]; dots.forEach((d, k) => d.className = k < i ? "ok" : k === i ? "now" : "");
    pat.innerHTML = `<p class="eyebrow">Mẫu ${i + 1}/${pats.length}</p><h2>${esc(p.t)}</h2>
      <div class="formula">${p.f.map(r => `<div class="frow">${r.filter(Boolean).map((c, k) => `<span class="fchip${k === 1 ? " key" : ""}" lang="${/[一-鿿]/.test(c) ? "zh" : ""}">${esc(c)}</span>`).join('<span class="plus">+</span>')}</div>`).join("")}</div>
      <ul class="pex">${p.ex.map((e, k) => `<li><button type="button" class="btn sound small" data-k="${k}">${ICON.play}</button><span lang="${L === "zh" ? "zh" : "en"}">${esc(e[0])}</span><small>${esc(e[1])}</small></li>`).join("")}</ul>
      <div class="badgood"><p><span class="x">✗</span> <s lang="${L === "zh" ? "zh" : "en"}">${esc(p.bad)}</s></p><p><span class="v">✓</span> <b lang="${L === "zh" ? "zh" : "en"}">${esc(p.good)}</b></p><p class="why">${esc(p.why)}</p></div>`;
    pat.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { const t = p.ex[+b.dataset.k][0]; if (!/^[a-zāáǎàēéěèīíǐìōóǒòūúǔù ]+$/i.test(t)) say(t, L); });
    $(".prev", box).disabled = i === 0; $(".nx", box).textContent = i === pats.length - 1 ? "Đã nắm, sang bài tập" : "Mẫu tiếp →";
  }
  $(".prev", box).onclick = () => { if (i > 0) { i--; draw(); } };
  $(".nx", box).onclick = () => { if (i < pats.length - 1) { i++; draw(); } else finish({ learn: true, extra: `Học ${pats.length} mẫu câu` }); };
  draw();
}

/* ---------- âm báo nhỏ ---------- */
let AC = null;
function sfx(kind) {
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const notes = kind === "good" ? [660, 880] : kind === "win" ? [523, 659, 784, 1046] : [220, 196];
    notes.forEach((f, i) => {
      const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + i * 0.09;
      o.type = kind === "bad" ? "triangle" : "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(kind === "bad" ? 0.06 : 0.09, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t + 0.2);
    });
  } catch (e) {}
}
function fbOn(fb, kind) { fb.className = "fb " + kind; fb.hidden = false; sfx(kind); }
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.createElement("canvas"); c.className = "confetti"; document.body.appendChild(c);
  const x = c.getContext("2d"), W = c.width = innerWidth, H = c.height = innerHeight;
  const cols = ["#1F44D6", "#D3271E", "#FFD43B", "#16A34A"];
  const P = Array.from({ length: 90 }, () => ({ x: W / 2 + (Math.random() - .5) * 120, y: H * 0.35, vx: (Math.random() - .5) * 9, vy: -Math.random() * 9 - 3, r: Math.random() * 6 + 3, c: cols[Math.floor(Math.random() * 4)], a: Math.random() * 6 }));
  let n = 0; (function f() { x.clearRect(0, 0, W, H); P.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.28; p.a += 0.2; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); x.restore(); }); if (++n < 80) requestAnimationFrame(f); else c.remove(); })();
}

function scoreParts(ex, sum) {
  let p = ex.pts; const lines = [[ex.title, ex.pts]];
  if (sum.total && sum.first / sum.total >= 0.8) { p += 5; lines.push(["Đúng ngay từ 80% trở lên", 5]); }
  if (sum.repair) { p += sum.repair * 5; lines.push([`Tự sửa đúng ${sum.repair} câu`, sum.repair * 5]); }
  if (sum.bonus) { p += sum.bonus; lines.push(["Đạt can-do không cần câu mẫu", sum.bonus]); }
  return { p, lines };
}
function praise(sum) {
  if (sum.learn) return "Bạn đã học xong phần chuẩn bị. Bài tập tiếp theo dùng đúng nội dung này.";
  if (!sum.total) return "Xong rồi. Làm đều mỗi ngày là cách nhanh nhất để nói được.";
  const r = sum.first / sum.total;
  if (r >= 0.9) return "Rất chắc tay. Bạn gần như không cần gợi ý.";
  if (r >= 0.7) return "Tốt. Vài câu cần sửa đã được bạn tự sửa xong.";
  return "Bạn đã sửa xong mọi lỗi. Những câu từng sai đã vào kho ôn để quay lại sau.";
}
function finishEx(ex, d, k, sum, body) {
  const first = !S.done[ex.key], sc = scoreParts(ex, sum);
  if (first) { S.done[ex.key] = { p: sc.p, sum: "" }; award(ex.code + " · " + ex.title, sc.p); }
  let dayBonus = false;
  if (d.ex.every(c => S.done[exKey(d.id, c)]) && !S.daily[S.lang + d.id]) { S.daily[S.lang + d.id] = true; award("Mục tiêu ngày · " + d.label, 20); dayBonus = true; }
  save(); renderTop();
  const next = d.ex.findIndex((c, j) => j > k && !S.done[exKey(d.id, c)]);
  const allDone = d.ex.every(c => S.done[exKey(d.id, c)]);
  body.innerHTML = "";
  body.appendChild(el(`<div class="endcard">
    <div class="bigstar">${ICON.star}<b>${first ? "+" + sc.p : "Đã làm lại"}</b></div>
    <h2>${allDone && dayBonus ? `Xong ${esc(d.label)}!` : "Xong bài!"}</h2>
    <p class="lead">${esc(praise(sum))}</p>
    ${sum.total ? `<p class="small muted">Đúng ngay ${sum.first}/${sum.total} câu${sum.repair ? ` · tự sửa ${sum.repair} câu` : ""}${sum.extra ? " · " + esc(sum.extra) : ""}</p>` : sum.extra ? `<p class="small muted">${esc(sum.extra)}</p>` : ""}
    ${first ? `<ul class="breakdown">${sc.lines.map(l => `<li><span>${esc(l[0])}</span><b>+${l[1]}</b></li>`).join("")}${dayBonus ? `<li class="gold"><span>Mục tiêu ${d.mins} phút của ${esc(d.label)}</span><b>+20</b></li>` : ""}</ul>` : ""}
    ${dayBonus ? `<p class="donebanner">Chuỗi học: ${streak()} ngày liên tiếp. ${d.id === "thu-6" ? "Thứ Bảy gặp bạn ở Weekend Live!" : ""}</p>` : ""}
    <div class="row center">
      <button type="button" class="btn ghost again">↻ Làm lại</button>
      ${next >= 0 ? `<a class="btn primary huge" href="#${d.id}-bai-${next + 1}">Bài tiếp →</a>` : allDone ? `<a class="btn primary huge" href="#${nextDayId(d)}">${d.id === "chu-nhat" ? "Về hành trình" : "Sang ngày tiếp →"}</a>` : `<a class="btn primary huge" href="#${d.id}">Về danh sách bài</a>`}
    </div></div>`));
  $(".again", body).onclick = () => render();
  sfx("win"); confetti();
}

/* ---------- kho ôn ---------- */
function viewReview(main) {
  const list = S.review[S.lang];
  main.appendChild(el(`<div class="dayview one"><section class="dhero">
    <p class="chip">Kho ôn · ${langWord()}</p><h1>${list.length ? list.length + " câu bạn từng sai" : "Kho ôn đang trống"}</h1>
    <p class="lead">Mỗi câu bạn trả lời sai một lần sẽ vào đây. Bài ôn nhanh (A) mỗi ngày tự lấy 4 câu từ kho. Ôn ngay để đưa câu ra khỏi kho.</p>
    ${list.length ? `<a class="btn primary huge" href="#on-tap">${ICON.play} Ôn ngay ${Math.min(10, list.length)} câu</a>` : `<a class="btn primary huge" href="#trang-chu">Về hành trình</a>`}
  </section>${list.length ? `<ul class="revlist">${list.map(c => `<li><span>${esc(c.front)}</span><b lang="${S.lang === "zh" ? "zh" : "en"}">${esc(c.back)}</b></li>`).join("")}</ul>` : ""}</div>`));
}
function viewReviewRun(main) {
  const list = S.review[S.lang].slice(0, 10);
  if (!list.length) { location.replace("#kho-on"); return; }
  const ex = { key: null, code: "R", title: "Ôn kho lỗi", rule: "Gõ lại câu đúng. Đúng ngay từ lần đầu thì câu rời kho ôn.", pts: 10, mins: 3, kind: "items",
    items: list.map(c => ({ k: "type", q: c.front, model: c.back, review: true, accept: null })) };
  playerShell(main, ex, { crumb: "Kho ôn", backHref: "#kho-on", backText: "Kho ôn", onFinish: (sum, body) => {
    const keep = list.filter((c, i) => sum.firstFlags && !sum.firstFlags[i]);
    S.review[S.lang] = S.review[S.lang].filter(c => !list.includes(c) || keep.includes(c));
    const today = new Date().toISOString().slice(0, 10), key = S.lang + ":on:" + today;
    if (!S.done[key]) { S.done[key] = { p: 10 }; award("Ôn kho lỗi", 10); }
    save(); renderTop();
    body.innerHTML = ""; body.appendChild(el(`<div class="endcard"><div class="bigstar">${ICON.star}<b>+10</b></div><h2>Ôn xong!</h2>
      <p class="lead">${list.length - keep.length} câu đã rời kho ôn. ${keep.length ? keep.length + " câu còn lại để ôn tiếp." : ""}</p>
      <div class="row center"><a class="btn primary huge" href="#trang-chu">Về hành trình</a></div></div>`));
    sfx("win"); confetti();
  } });
}

/* ---------- khởi động ---------- */
function boot() {
  document.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => { S.lang = b.dataset.lang; save(); render(); });
  document.querySelectorAll("[data-level]").forEach(b => b.onclick = () => { S.level = +b.dataset.level; save(); render(); });
  $("#snd").onclick = () => { S.sound = !S.sound; save(); renderTop(); if (S.sound) sfx("good"); };
  $("#reset").onclick = () => { $("#resetConfirm").hidden = !$("#resetConfirm").hidden; };
  $("#resetYes").onclick = () => { S.points = 0; S.ledger = []; S.done = {}; S.daily = {}; S.review = { en: [], zh: [] }; save(); $("#resetConfirm").hidden = true; location.hash = "#trang-chu"; render(); };
  $("#resetNo").onclick = () => { $("#resetConfirm").hidden = true; };
  addEventListener("hashchange", render);
  render();
}
boot();

</script>
</body></html>
