<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Anh – Trung Thực Chiến · Học trên web</title><link rel="canonical" href="https://ces-training.github.io/anh-trung-thuc-chien/tuan-1/"><link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>body{padding-bottom:env(safe-area-inset-bottom)}</style></head><body><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;700&display=swap">
<style>
/* Khung học theo kiểu chuỗi bài 21 ngày: Hành trình tuần (tuyến tàu) → Trang buổi học (thẻ chính + lưới bài) → Trình làm bài (cách làm → từng câu → màn kết).
   Xanh = tiếng Anh, đỏ = tiếng Trung, vàng = điểm và nút hành động phụ. */
:root{
  --bg:#F5F6FA; --surface:#FFFFFF; --soft:#EEF1F8; --ink:#0E1730; --muted:#515B70; --line:#DDE2EC;
  --en:#1F44D6; --en-soft:#E7ECFF; --zh:#D3271E; --zh-soft:#FDECEA; --sun:#FFD43B; --sun-soft:#FFF4C7; --sun-ink:#3B2F00;
  --green:#15803D; --green-soft:#E3F5E9; --slate:#334155; --slate-soft:#E8ECF3;
  --good:#146C43; --good-bg:#E5F4EB; --bad:#B42318; --bad-bg:#FFF1EF; --mark:#FFD6CF;
  --acc:var(--en); --acc-soft:var(--en-soft);
  --font:"Be Vietnam Pro","Segoe UI",system-ui,-apple-system,sans-serif;
  --han:"Noto Sans SC","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --shadow:0 1px 2px rgba(14,23,48,.06),0 6px 18px -8px rgba(14,23,48,.18);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1020; --surface:#131B31; --soft:#18223C; --ink:#EEF2FA; --muted:#A9B3C7; --line:#283553;
  --en:#8EA2FF; --en-soft:#1B2858; --zh:#FF8475; --zh-soft:#3A1B17; --sun:#FFD43B; --sun-soft:#3A3212; --sun-ink:#FFE89A;
  --green:#5BD38C; --green-soft:#10301F; --slate:#C3CCDD; --slate-soft:#1E2945;
  --good:#5BD38C; --good-bg:#0F2D1E; --bad:#FF8A7E; --bad-bg:#33171A; --mark:#6B2620; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px -10px rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0B1020; --surface:#131B31; --soft:#18223C; --ink:#EEF2FA; --muted:#A9B3C7; --line:#283553;
  --en:#8EA2FF; --en-soft:#1B2858; --zh:#FF8475; --zh-soft:#3A1B17; --sun:#FFD43B; --sun-soft:#3A3212; --sun-ink:#FFE89A;
  --green:#5BD38C; --green-soft:#10301F; --slate:#C3CCDD; --slate-soft:#1E2945;
  --good:#5BD38C; --good-bg:#0F2D1E; --bad:#FF8A7E; --bad-bg:#33171A; --mark:#6B2620; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px -10px rgba(0,0,0,.6); color-scheme:dark }
:root[data-track="zh"]{--acc:var(--zh);--acc-soft:var(--zh-soft)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--font);-webkit-font-smoothing:antialiased}
[lang="zh"]{font-family:var(--han)}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance}
p{margin:0} a{color:var(--acc)} button{font:inherit;color:inherit}
.muted{color:var(--muted)} .small{font-size:13.5px}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}
.lead{font-size:16.5px;color:var(--muted);max-width:62ch}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

/* nút */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1.5px solid transparent;font-weight:700;font-size:15px;cursor:pointer;background:var(--soft);color:var(--ink);text-decoration:none;transition:transform .08s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--acc);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--acc) 60%,#000)}
.btn.huge{min-height:56px;padding:0 24px;font-size:17px;border-radius:14px}
.btn.ghost{background:var(--surface);border-color:var(--line)}
.btn.small{min-height:38px;padding:0 12px;font-size:14px}
.btn.sound{background:var(--acc);color:#fff;border-radius:999px;min-height:40px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.center{justify-content:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-weight:700;font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.star{background:var(--sun);color:#3B2F00}
.pill.ok{background:var(--good-bg);color:var(--good)}
.pill.lock{background:var(--soft);color:var(--muted)}
.pill.go{background:var(--acc);color:#fff}

/* thanh trên */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:9;background:var(--surface);box-shadow:0 1px 0 var(--line)}
.bar1{display:flex;align-items:center;gap:10px 14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;margin-right:auto;font-weight:800;letter-spacing:-.01em}
.brand small{display:block;font-weight:500;font-size:12.5px;color:var(--muted)}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--soft);gap:2px}
.seg button{min-height:34px;padding:0 10px;border:0;border-radius:8px;background:transparent;font-weight:700;font-size:13.5px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(14,23,48,.15)}
.seg button[data-lang="en"][aria-pressed="true"]{color:var(--en)} .seg button[data-lang="zh"][aria-pressed="true"]{color:var(--zh)}
.icbtn{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted)}
.pill.strk{background:var(--zh-soft);color:var(--zh)}
.nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nv{flex:none;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--soft);color:var(--muted);text-decoration:none;font-weight:700;font-size:14px}
.nv span{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:1px 6px;border-radius:999px;background:var(--surface);font-variant-numeric:tabular-nums}
.nv.full span{background:var(--good-bg);color:var(--good)}
.nv.on{background:var(--ink);color:var(--bg)} .nv.on span{background:color-mix(in srgb,var(--bg) 20%,transparent);color:var(--bg)}
@media (max-width:720px){.top{position:static}.brand small{display:none}.bar1{gap:8px}}

main{padding-block:22px 90px;outline:none}
main:focus,main:focus-visible{outline:none}

/* trang chủ */
.home{display:flex;flex-direction:column;gap:20px}
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;background:var(--surface);border-radius:22px;padding:clamp(18px,3vw,30px);box-shadow:var(--shadow)}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero-txt{display:flex;flex-direction:column;gap:12px;align-items:flex-start;min-width:0}
.hero h1{font-size:clamp(26px,3.6vw,38px);font-weight:800;letter-spacing:-.02em}
.bar{width:100%;height:10px;border-radius:999px;background:var(--soft);overflow:hidden}
.bar.big{height:14px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),color-mix(in srgb,var(--acc) 60%,var(--sun)));border-radius:999px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-content:start}
.stat{display:flex;flex-direction:column;gap:2px;padding:14px;border-radius:16px;background:var(--soft);text-decoration:none;color:var(--ink)}
.stat b{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.stat small{color:var(--muted);font-size:13px}
.ic{width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:4px}
.ic.sun{background:var(--sun);color:#3B2F00}.ic.zh{background:var(--zh-soft);color:var(--zh)}.ic.en{background:var(--en-soft);color:var(--en)}.ic.green{background:var(--green-soft);color:var(--green)}
.journey{background:var(--surface);border-radius:22px;padding:clamp(18px,3vw,26px);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.journey h2,.livecard h2{font-size:20px}
.line{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;position:relative}
.line::before{content:"";position:absolute;left:4%;right:4%;top:17px;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--en),var(--zh))}
.stn{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.stn a{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:var(--ink)}
.stn .dot{width:40px;height:40px;border-radius:50%;background:var(--surface);border:5px solid var(--slate);display:flex;align-items:center;justify-content:center;color:#fff;position:relative;z-index:1}
.stn.done .dot{background:var(--good);border-color:var(--good)}
.stn.cur .dot{border-color:var(--acc);box-shadow:0 0 0 6px var(--acc-soft)}
.stn.live .dot{background:var(--ink);border-color:var(--sun);width:44px;height:44px;margin-top:-2px}
.stn b{font-size:14.5px}
.stn small{font-size:12.5px;color:var(--muted);line-height:1.35}
.stn em{font-style:normal;font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:760px){
  .line{grid-template-columns:minmax(0,1fr);gap:0}
  .line::before{left:19px;right:auto;top:10px;bottom:10px;width:6px;height:auto;background:linear-gradient(180deg,var(--en),var(--zh))}
  .stn,.stn a{flex-direction:row;align-items:center;text-align:left;gap:12px;padding-block:6px}
  .stn small{display:block}
  .stn a>b,.stn>b{min-width:62px}
  .stn.live{padding-left:0}
}
.livecard{background:var(--ink);color:var(--bg);border-radius:22px;padding:clamp(18px,3vw,26px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:center}
.livecard .eyebrow{color:var(--sun)} .livecard p{color:color-mix(in srgb,var(--bg) 80%,transparent)}
.livecard .keys{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.livecard .keys li{background:color-mix(in srgb,var(--bg) 10%,transparent);border:1px solid color-mix(in srgb,var(--bg) 25%,transparent);border-radius:12px;padding:10px 14px;font-weight:600;font-size:16px}
@media (max-width:760px){.livecard{grid-template-columns:minmax(0,1fr)}}
.donebanner{background:var(--sun-soft);color:var(--ink);border-radius:12px;padding:10px 14px;font-weight:700}

/* trang buổi học */
.dayview{display:grid;grid-template-columns:minmax(0,370px) minmax(0,1fr);gap:20px;align-items:start}
.dayview.one{grid-template-columns:minmax(0,1fr)}
@media (max-width:900px){.dayview{grid-template-columns:minmax(0,1fr)}}
.dhero{background:var(--surface);border-radius:22px;padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;position:sticky;top:130px}
@media (max-width:900px){.dhero{position:static}}
.dhero h1{font-size:clamp(24px,3vw,30px);font-weight:800;letter-spacing:-.02em}
.chip{align-self:flex-start;background:var(--acc);color:#fff;font-weight:700;font-size:13px;padding:4px 12px;border-radius:999px}
.who{display:flex;gap:12px;align-items:center;background:var(--soft);border-radius:14px;padding:10px 12px}
.who small{display:block;font-size:12px;color:var(--muted)}
.av{width:44px;height:44px;border-radius:50%;background:var(--acc-soft);color:var(--acc);font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.note{font-size:13.5px;color:var(--muted);border-left:3px solid var(--sun);padding-left:10px}
.tiles{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;height:100%;border-radius:20px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow);text-decoration:none;color:var(--ink);border:3px solid transparent;position:relative;transition:transform .12s}
.tile:hover{transform:translateY(-2px)}
.tile .art{height:118px;display:flex;align-items:center;justify-content:center;background:var(--tile-bg);color:var(--tile-fg)}
.tile .tmeta{display:flex;flex-direction:column;gap:2px;padding:12px 14px 14px;background:var(--tile-band);color:#fff;flex:1}
.tile .tmeta small{font-size:12.5px;font-weight:700;opacity:.9}
.tile .tmeta b{font-size:17px;line-height:1.25}
.tile .tmeta em{font-style:normal;font-size:12.5px;opacity:.9}
.tile .st{position:absolute;top:10px;right:10px}
.tile.cur{border-color:var(--sun)}
.tile.locked{opacity:.55}
.tile.locked:hover{transform:none}
.t-en{--tile-bg:var(--en-soft);--tile-fg:var(--en);--tile-band:#1F44D6}
.t-zh{--tile-bg:var(--zh-soft);--tile-fg:var(--zh);--tile-band:#C2271F}
.t-sun{--tile-bg:var(--sun-soft);--tile-fg:#B07D00;--tile-band:#A16207}
.t-green{--tile-bg:var(--green-soft);--tile-fg:var(--green);--tile-band:#15803D}
.t-slate{--tile-bg:var(--slate-soft);--tile-fg:var(--slate);--tile-band:#334155}

@media (max-width:600px){
  .tiles{grid-template-columns:minmax(0,1fr);gap:10px}
  .tile{flex-direction:row;border-radius:16px}
  .tile .art{height:auto;width:78px;flex:none}
  .tile .art svg{width:36px;height:36px}
  .tile .tmeta{padding:10px 12px;padding-right:64px}
  .tile .tmeta b{font-size:16px}
}
.qt.sm{font-size:15px;font-weight:600;color:var(--muted)}
/* trình làm bài */
.player{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.ptop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.crumb{font-weight:700;color:var(--muted);font-size:14px;margin-right:auto}
.spd[aria-pressed="true"]{background:var(--sun-soft);border-color:var(--sun)}
.pcard{background:var(--tile-bg);border-radius:24px;padding:clamp(12px,2.4vw,20px);display:flex;flex-direction:column;gap:14px}
.phead{display:flex;align-items:center;gap:12px}
.phead>div{flex:1;min-width:0}
.phead small{font-size:12.5px;font-weight:700;color:var(--tile-fg);text-transform:uppercase;letter-spacing:.08em}
.phead h1{font-size:clamp(19px,2.6vw,24px);font-weight:800}
.art.sm{width:48px;height:48px;border-radius:14px;background:var(--surface);color:var(--tile-fg);display:flex;align-items:center;justify-content:center;flex:none}
.pbody{background:var(--surface);border-radius:20px;padding:clamp(16px,3vw,28px);display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow);min-height:280px}
.intro{display:flex;flex-direction:column;gap:14px}
.rulecard ol{margin:6px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:4px;font-size:16.5px}
.rulebox{background:var(--soft);border-radius:14px;padding:12px 16px;font-size:15.5px}
.rulebox p:last-child{margin-top:4px}

/* câu hỏi */
.items{display:flex;flex-direction:column;gap:14px}
.prog{display:flex;gap:5px;flex-wrap:wrap}
.prog i{width:26px;height:8px;border-radius:4px;background:var(--line)}
.prog i.now{background:var(--acc);width:40px} .prog i.ok{background:var(--good)} .prog i.fix{background:var(--sun)}
.stage{display:flex;flex-direction:column;gap:14px}
.qhead{display:flex;justify-content:space-between}
.qn{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.q{display:flex;flex-direction:column;gap:14px;margin:0;align-items:stretch}
.qt{font-size:clamp(19px,2.4vw,23px);font-weight:700;text-align:center;line-height:1.35}
.q .au{align-self:center}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;min-height:64px;padding:12px 14px;border:2px solid var(--line);border-radius:16px;background:var(--surface);cursor:pointer;font-size:17px;font-weight:600;box-shadow:0 3px 0 var(--line)}
.opt .badge{flex:none;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;background:var(--en)}
.opt:nth-child(2) .badge{background:#C2410C} .opt:nth-child(3) .badge{background:var(--green)} .opt:nth-child(4) .badge{background:#7C3AED}
.opt .ot[lang="zh"]{font-size:21px}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);box-shadow:0 3px 0 color-mix(in srgb,var(--bad) 40%,transparent)}
.opt.wrong .ot{text-decoration:line-through;text-decoration-color:var(--bad)}
.opt.right{border-color:var(--good);background:var(--good-bg);box-shadow:0 3px 0 color-mix(in srgb,var(--good) 40%,transparent)}
.opt.hint{border-color:var(--good);border-style:dashed}
.opt:disabled{cursor:default}
.inp{flex:1 1 220px;min-width:0;min-height:56px;padding:0 16px;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font:600 19px var(--font);text-align:center}
.inp:focus{border-color:var(--acc);outline:none;background:var(--surface)}
.area{width:100%;flex-basis:100%;min-height:150px;padding:14px 16px;line-height:1.6;resize:vertical;text-align:left;font-weight:500;font-size:17px}
.ans,.pool{display:flex;flex-wrap:wrap;gap:10px;min-height:64px;align-items:center;justify-content:center;padding:10px;border-radius:16px}
.ans{background:var(--soft);border:2px dashed var(--line)}
.tok{min-height:52px;padding:0 16px;border-radius:14px;border:2px solid #E6B800;background:var(--sun);color:#3B2F00;cursor:pointer;font-size:19px;font-weight:700;display:inline-flex;align-items:center;gap:6px;box-shadow:0 3px 0 #C99A00}
.ans .tok{background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:0 3px 0 var(--line)}
.tok small{font-size:11px;color:var(--muted);font-weight:700}
.tok.right{border-color:var(--good);box-shadow:0 3px 0 var(--good)}
.tok.wrong{border-color:var(--bad);background:var(--bad-bg);box-shadow:0 3px 0 var(--bad)}
.crit{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:15px}
.crit li::before{content:"○ ";color:var(--muted)}
.crit li.ok::before{content:"✓ ";color:var(--good);font-weight:800}
.crit li.no{color:var(--bad)} .crit li.no::before{content:"✗ ";font-weight:800}
.next{align-self:center;min-height:56px;padding:0 30px;font-size:17px;border-radius:14px}

/* phản hồi */
.fb{border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;font-size:15.5px;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.98);opacity:.6}to{transform:none;opacity:1}}
.fb.good{background:var(--good-bg);border:2px solid color-mix(in srgb,var(--good) 45%,transparent)}
.fb.bad{background:var(--bad-bg);border:2px solid color-mix(in srgb,var(--bad) 40%,transparent)}
.fbt{font-weight:800;font-size:16.5px}
.fb.good .fbt{color:var(--good)} .fb.bad .fbt{color:var(--bad)}
.lab{font-weight:700;color:var(--muted);font-size:13.5px}
.where{font-size:18px}
mark.bad{background:var(--mark);color:var(--ink);border-radius:5px;padding:0 4px;text-decoration:underline wavy var(--bad);text-underline-offset:4px}
.gap{display:inline-block;min-width:1.4em;text-align:center;color:var(--bad);font-weight:800;border-bottom:2px solid var(--bad);margin:0 2px}
.reveal{border-top:1px dashed color-mix(in srgb,var(--bad) 40%,transparent);padding-top:8px}

COURSE.en[1] = {"lang":"en","week":1,"title":"Chào hỏi, làm quen, gia đình","cando":"Chào hỏi, cảm ơn, giới thiệu tên, quê quán, ngôn ngữ, tuổi và gia đình bằng tiếng Anh","cast":[{"key":"an","name":"An","vi":"nhân viên mới người Việt, 26 tuổi, làm ở phòng marketing – nhân vật đại diện cho chính bạn","look":"a Vietnamese woman about 26, shoulder-length black bob, royal-blue top, yellow lanyard with a white staff card"},{"key":"tom","name":"Tom","vi":"đồng nghiệp người Anh khoảng 30 tuổi ở phòng marketing, thân thiện, hay pha trò","look":"a British man about 30, short ginger hair and light stubble, green crew-neck sweater"},{"key":"kevin","name":"Kevin","vi":"đồng nghiệp người Mỹ gốc Á khoảng 32 tuổi, làm bộ phận kinh doanh (sales); có con trai Ben 8 tuổi","look":"an East Asian-American man about 32, short dark hair, thin rectangular glasses, navy button-up shirt"},{"key":"linh","name":"Linh","vi":"đồng nghiệp người Việt 24 tuổi, vui vẻ, đang học thêm tiếng Trung buổi tối","look":"a Vietnamese woman about 24, long straight black hair, mustard-yellow sweater"},{"key":"sarah","name":"Sarah Lee","vi":"quản lý người Mỹ gốc Hàn khoảng 38 tuổi, lịch sự, chuyên nghiệp","look":"a Korean-American woman about 38, chin-length black bob, charcoal blazer over a white blouse"}],"days":[{"id":"w1-thu-2","label":"Thứ 2","title":"Chào hỏi, cảm ơn, tạm biệt","desc":"Hôm nay bạn học cách chào, cảm ơn, đáp lời cảm ơn, tạm biệt và nói “Tôi là …” bằng tiếng Anh qua cảnh ngày đầu đi làm của An, khi Tom ra đón cô ở khu bàn làm việc phòng marketing.","rule":"Tiếng Anh luôn cần động từ “be” (am / is / are): I am An, không nói “I An”. Muốn hỏi Có/Không thì đưa am / is / are lên đầu câu: Are you Linh?","cards":[{"w":"Hello! / Hi!","m":"Xin chào!","ex":"Hello! I'm An.","exm":"Xin chào! Tôi là An.","n":"“Hello” dùng được với mọi người (sếp, khách hàng, đồng nghiệp); “Hi” thân mật hơn, dùng với đồng nghiệp ngang hàng, bạn bè. Trọng âm: he-LLO.","img":"wave"},{"w":"I / I'm","m":"tôi / tôi là","ex":"I'm An.","exm":"Tôi là An.","n":"“I” luôn viết hoa. I'm = I am. Đừng quên “am”: nói “I An” là sai.","img":"me"},{"w":"you","m":"bạn, anh, chị, em… (người đang nói chuyện với mình)","ex":"Are you Linh?","exm":"Bạn là Linh phải không?","n":"Tiếng Anh chỉ có một từ “you” cho mọi vai vế: anh, chị, em, sếp, khách hàng, bố, mẹ…","img":"you"},{"w":"am / is / are","m":"là, thì (động từ “be”)","ex":"I am An. You are Tom. My mum is Mai.","exm":"Tôi là An. Anh là Tom. Mẹ tôi là bà Mai.","n":"I → am; you → are; một người khác (Tom, Linh, my mum) → is. Người Việt hay bỏ mất động từ này vì tiếng Việt có thể nói “Tôi An”.","img":"is"},{"w":"yes","m":"vâng, có, đúng","ex":"Yes, I am.","exm":"Vâng, đúng vậy.","n":"Trả lời ngắn: “Yes, I am.” – KHÔNG rút gọn thành “Yes, I'm.”"},{"w":"no / not","m":"không / không phải","ex":"No, I'm not Linh.","exm":"Không, tôi không phải là Linh.","n":"“No” đứng một mình để trả lời. “not” đứng SAU am / is / are để phủ định: I am not, you are not.","img":"no"},{"w":"My name is …","m":"Tên tôi là …","ex":"My name is An.","exm":"Tên tôi là An.","n":"Bắt buộc có “is”: My name is An. Lỗi hay gặp: “My name An.” Hoặc nói gọn: I'm An.","img":"name"},{"w":"Thank you! / Thanks!","m":"Cảm ơn!","ex":"Thank you, Tom!","exm":"Cảm ơn anh Tom!","n":"“th” đọc /θ/: đặt đầu lưỡi giữa hai răng rồi thổi hơi, không đọc “tanh kiu”. “Thanks” thân mật hơn.","img":"thanks"},{"w":"You're welcome.","m":"Không có gì.","ex":"Thank you! – You're welcome!","exm":"Cảm ơn! – Không có gì!","n":"Câu đáp lại lời cảm ơn. You're = You are. Trọng âm: WEL-come.","img":"polite"},{"w":"Goodbye! / Bye!","m":"Tạm biệt!","ex":"Bye, Tom! Goodbye, Ms Lee!","exm":"Tạm biệt anh Tom! Chào chị Lee ạ!","n":"“Bye” thân mật (với đồng nghiệp, bạn bè), “Goodbye” trang trọng hơn một chút (với sếp, khách hàng). Trọng âm: good-BYE.","img":"bye"},{"w":"Mum","m":"mẹ","ex":"Hi, Mum! I'm OK.","exm":"Con chào mẹ! Con ổn ạ.","n":"Anh–Anh viết “Mum”, Anh–Mỹ viết “Mom”. Giữ âm cuối /m/: khép môi lại.","img":"mom"},{" ùng is."}},{"q":"Điền vào chỗ trống: ___ you Linh?","opts":["Are","Is","Am"],"a":0,"why":{"1":"“is” không đi với you.","2":"“am” chỉ đi với I."}},{"q":"Chọn từ phủ định đúng: I am ___ Linh. (Tôi không phải là Linh.)","opts":["no","not","don't"],"a":1,"why":{"0":"“no” dùng để trả lời đứng một mình (No!), không đứng sau am.","2":"“don't” không đi cùng am / is / are; sau be chỉ cần not."}}],"grammar":[{"q":"Sắp xếp thành câu đúng: am / An / I","opts":["Am I An.","I am An.","An I am."],"a":1,"why":{"0":"Đảo “Am” lên đầu là câu hỏi, phải có dấu “?” – đây không phải câu kể.","2":"Sai trật tự: tiếng Anh là Chủ ngữ + be + tên."}},{"q":"Biến câu kể thành câu hỏi: “You are Tom.” →","opts":["You are Tom?","Do you Tom?","Are you Tom?"],"a":2,"why":{"0":"Chỉ lên giọng mà không đảo “are” là kiểu nói ngạc nhiên trong hội thoại, không phải câu hỏi chuẩn cho người mới học.","1":"Không dùng “do” với động từ be; chỉ cần đảo are lên đầu."}},{"k":"type","q":"Điền vào chỗ trống: I am ___ Linh. (Tôi không phải là Linh.)","model":"not","accept":["not"],"why":"Phủ định câu có be: thêm “not” ngay sau am / is / are → I am not Linh."},{"q":"Chọn câu đúng:","opts":["I not Linh.","I'm not Linh.","I no am Linh."],"a":1,"why":{"0":"Thiếu động từ be: phải là I am not / I'm not.","2":"Không dùng “no” trước động từ, và “not” phải đứng sau am."}},{"q":"Trả lời phủ định câu hỏi “Are you Linh?”","opts":["No, I'm not.","No, I amn't.","No, I not."],"a":0,"why":{"1":"Tiếng Anh không có dạng “amn't”; dùng I'm not.","2":"Thiếu am: phải là I'm not."}},{"q":"“Are you An?” – “Yes, ___.”","opts":["I'm","am","I am"],"a":2,"why":{"0":"Không được rút gọn I'm ở cuối câu trả lời ngắn: nói “Yes, I am.”","1":"Thiếu chủ ngữ I."}},{"k":"type","q":"Dịch sang tiếng Anh: “Anh là Tom phải không?”","model":"Are you Tom?","accept":["Are you Tom?","Are you Tom","are you tom?","are you tom"],"why":"Câu hỏi Có/Không: đưa “Are” lên trước “you” → Are you Tom?"}],"listen":[{"q":"Nghe: người nói đang làm gì?","opts":["chào","cảm ơn",  đáp phù hợp nhất.","opts":["Thank you.","Yes, I am.","You're welcome."],"a":1,"why":{"0":"Không có gì để cảm ơn; câu hỏi cần trả lời Có/Không.","2":"You're welcome chỉ dùng sau lời cảm ơn."},"audio":"Are you An?"},{"q":"TOEIC Bridge – Hỏi & đáp: nghe câu nói, chọn câu đáp phù hợp nhất.","opts":["No, I'm not.","My name is An.","Bye!"],"a":2,"why":{"0":"Không có câu hỏi Có/Không để trả lời “No”.","1":"Người kia đang chào tạm biệt, không hỏi tên."},"audio":"Goodbye!"},{"q":"TOEIC Bridge – Hỏi & đáp: nghe câu nói, chọn câu đáp phù hợp nhất.","opts":["Hello!","No, I'm An.","Thank you."],"a":1,"why":{"0":"Câu hỏi “Are you Linh?” cần câu trả lời Có/Không, không phải lời chào.","2":"Không có lý do để cảm ơn."},"audio":"Are you Linh?"}],"shadow":[{"t":"Hello!","focus":"Trọng âm rơi vào âm tiết thứ hai: he-LLO. Âm cuối /əʊ/ tròn môi dần, đừng đọc phẳng “hê-lô”."},{"t":"Thank you.","focus":"“th” /θ/: đầu lưỡi giữa hai răng, thổi hơi. Nối liền “thank-you” /θæŋkju/, không tách “tanh – kiu”."},{"t":"You're welcome.","focus":"Nhấn WEL; /w/ chu tròn môi; âm cuối /m/ phải khép môi lại."},{"t":"Goodbye!","focus":"Nhấn BYE. Âm /d/ của “good” chỉ chạm nhẹ rồi chuyển sang “bye”, không đọc “gút-bai”."},{"t":"Mum. Dad.","focus":"Giữ âm cuối: “Mum” khép môi ở /m/; “Dad” chạm lưỡi ở /d/. Âm /æ/ trong Dad mở miệng rộng, khác “đa” tiếng Việt."},{"t":"I'm An. My name is An.","focus":"Nối “I'm” sang “An”: khép môi ở /m/ rồi chuyển ngay thành “ai-man”. “name is” nối thành “nay-miz”, âm /z/ cuối của is rung nhẹ."},{"t":"Are you Tom?","focus":"Câu hỏi Có/Không: lên giọng ở cuối câu (khác 吗 tiếng Trung đọc nhẹ). “Are you” nối liền /ɑːju/; Tom /tɒm/ khép môi ở /m/ cuối."},{"t":"No, I'm not.","focus":"Nhấn mạnh NOT; giữ âm cuối /t/ (chặn hơi), đừng nuốt mất thành “no”."}],"dialog":{"title":"Ngày đầu đi làm: Tom chào bạn ở khu văn phòng","partner":"Tom","turns":[{"ai":"Hello!","vi":"Chào bạn!","model":"Hello!","accept":["Hello!","Hi!","Hello.","Hi.","Hi, Tom!"],"frame":"Hello!","hint":"Chào lại bằng  “Are you Tom?”","opts":["Yes, he is.","No, I'm Kevin.","Thank you."],"a":1,"why":{"0":"Câu hỏi “Are you…?” thì trả lời về mình: I am, không phải he is.","2":"Không có gì để cảm ơn."}},{"q":"Cambridge A1 Movers – Đọc và chọn câu trả lời đúng: “Nice to meet you!”","opts":["Goodbye, too!","I'm Tom, too.","Nice to meet you, too!"],"a":2,"why":{"0":"Người kia đang làm quen, không chào tạm biệt.","1":"“I'm Tom, too” nghĩa là “Tôi cũng là Tom” – vô nghĩa ở đây."}}],"shadow":[{"t":"What's your name?","focus":"Nối “What's your” → /wɒtʃə/ (nghe như “watch-ur”). Câu hỏi có từ hỏi What: XUỐNG giọng ở cuối, không lên giọng."},{"t":"name","focus":"/neɪm/: nguyên âm đôi “ây”, kết thúc khép môi ở /m/. Không đọc thành “nem”."},{"t":"Nice to meet you.","focus":"Nhấn NICE và MEET; “to” đọc nhẹ /tə/. “meet you” nối thành /miːtʃu/."},{"t":"And you?","focus":"“And” đọc nhẹ /ən/; lên giọng và nhấn ở “you”."},{"t":"He is Kevin.","focus":"“He is” nối thành “hee-yiz”; is kết thúc bằng /z/ rung. Kevin nhấn KEV-in; /v/ răng trên chạm môi dưới, không đọc thành “Ke-bin”."},{"t":"I'm very happy.","focus":"/v/: răng trên chạm môi dưới, rung (khác /b/). Nhấn VER-y và HAP-py."},{"t":"We are very happy.","focus":"/w/ chu tròn môi; “We are” nối thành “we-yar”."},{"t":"I'm happy, too.","focus":"Ngắt nhẹ ở dấu phẩy, rồi nhấn và kéo dài “too” /tuː/."}],"dialog":{"title":"Buổi giao lưu (networking): làm quen với Tom","partner":"Tom","turns":[{"ai":"Hello!","vi":"Chào bạn!","model":"Hello!","accept":["Hello!","Hi!","Hello.","Hi."],"frame":"Hello!","hint":"Chào lại."},{"ai":"What's your name?","vi":"Bạn tên là gì?","model":"My name is Minh. And you?","accept":["My name is Minh. And you?","I'm Minh. And you?","My name is Minh. What's your name?","My name is Minh."],"frame":"My name is ___. And you?","hint":"Nói tên bạn (thay Minh) rồi hỏi lại “And you?”."},{"ai":"My name is Tom.","vi":"Mình tên là Tom.","model":"Nice to meet you!","accept":["Nice to meet you!","Nice to meet you, Tom!","Nice to meet you."],"frame":"Nice to ___ you!","hint":"Nói câu làm quen lần đầu."},{"ai":"Nice to meet you, too! Goodbye!","vi":"Mình cũng rất vui được làm quen! Tạm biệt!","model":"Goodbye!","accept":["Goodbye!","Bye!","Bye-bye!","Goodbye, Tom!"],"frame":"Goodbye!","hint":"Chào tạm biệt."}]},"reading":{"text":"Hello! My name is Tom. He is Kevin. We are very happy. An, nice to meet you!","vi":"Xin chào! Mình tên là Tom. Anh ấy là Kevin. Chúng mình rất vui. An, rất vui được làm quen với bạn!","qs":[{"q":"Người viết tên là gì?","opts":["Kevin","Tom","An"],"a":1,"why":{"0":"Kevin là người được giới thiệu (“He is Kevin”).","2":"An là người được chào ở câu cuối."}},{"q":"Người đàn ông được giới thiệu tên là gì?","opts":["An","Sarah","Kevin"],"a":2,"why":{"0":"An là người được chào làm quen, không được giới thiệu (và An là nữ, không dùng he).","1":"Sarah không có trong bài."}},{"q":"Họ cảm thấy thế nào?","opts":["rất vui","rất buồn"],"a":0,"why":{"1":"Bài đọc: “We are very happy” – rất vui."}},{"q":"Tom nói “nice to meet you” với ai?","opts":["Kevin","Sarah","An"],"a":2,"why":{"0":"Kevin là đồng nghiệp Tom đã quen, Tom chỉ giới thiệu anh ấy.","1":"Sarah không có trong bài đọc."}},{"q":"Đúng hay sai: “We are not happy.”","opts":["Đúng","Sai"],"a":1,"why":{"0":"Bài đọc nói “We are very happy” – họ rất vui."}}]}},{"id":"w1-thu-4","label":"Thứ 4","title":"Quốc tịch, ngôn ngữ, bạn bè","desc":"Hôm nay bạn học hỏi và nói quê / quốc tịch, ngôn ngữ mình biết nói (can speak), giới thiệu bạn bè, bạn cùng lớp qua cảnh Kevin và Linh trực gian hàng của công ty ở hội chợ việc làm.","rule":"Hỏi quê: Where are you from? – I'm from Vietnam. Sau “can” dùng động từ nguyên mẫu (can speak, không “can speaks”). Danh từ số ít cần “a”: I'm a student.","cards":[{"w":"everyone","m":"mọi người","ex":"Hi, everyone!","exm":"Chào mọi người!","n":"Dùng khi chào cả nhóm. Có thể nói “everybody” – nghĩa giống hệt.","img":"team"},{"w":"she","m":"cô ấy, chị ấy, bà ấy (người nữ)","ex":"She is my friend.","exm":"Cô ấy là bạn của tôi.","n":"she cho người nữ, he cho người nam. Người Việt hay lẫn he / she – hãy kiểm tra trước khi nói.","img":"she"},{"w":"friend","m":"bạn, bạn bè","ex":"Linh is my friend.","exm":"Linh là bạn của tôi.","n":"Một người bạn: a friend; nhiều bạn: friends (đừng quên -s). Đọc /frend/, giữ cụm /nd/ cuối.","img":"friend"},{"w":"Where are you from?","m":"Bạn đến từ đâu? / Bạn là người nước nào?","ex":"Where are you from? – I'm from Vietnam.","exm":"Bạn là người nước nào? – Tôi đến từ Việt Nam.","n":"Đừng bỏ “are” và đừng quên “from” ở cuối câu.","img":"where"},{"w":"from","m":"từ, đến từ","ex":"I'm from Vietnam.","exm":"Tôi đến từ Việt Nam.","n":"be from + tên nước: I'm from Vietnam (không nói “I from Vietnam”).","img":"from"},{"w":"Vietnamese","m":"người Việt Nam; tiếng Việt","ex":"I'm Vietnamese.","exm":"Tôi là người Việt Nam.","n":"Vietnam là tên nước; Vietnamese là quốc tịch / ngôn ngữ. Nhấn âm cuối: viet-na-MESE /ˌviːetnəˈmiːz/.","img":"vietnam"},{"w":"English","m":"tiếng Anh; người Anh","ex":"Can you speak English?","exm":"Bạn nói được tiếng Anh không?","n":"Tên ngôn ngữ luôn viết hoa: English, Vietnamese, Chinese. Đọc EN-glish, âm cuối /ʃ/ (“sh”).","img":"uk"},{"w":"speak","m":"nói (một ngôn ngữ)","ex":"I speak Vietnamese.","exm":"Tôi nói tiếng Việt.","n":"speak + tên ngôn ngữ (không cần “in”). Cụm /sp/ đầu từ đọc liền, không chèn “x-pích”."},{"w":"can / can't","m":"có thể, biết (làm gì) / không thể","ex":"I can speak English. I can't speak Chinese.","exm":"Tôi nói được tiếng Anh. Tôi không nói được tiếng Trung.","n":"can + động từ nguyên mẫu, không thêm -s, không thêm to. can't = cannot. Giống 会 trong tiếng Trung."},{"w":"student","m":"học sinh, sinh viên","ex":"I'm a student.","exm":"Tôi là sinh viên.","n":"Một người: a student (đừng quên a). Nhiều người: students. Giữ âm /t/ cuối.","img":"student"},{"w":"classmate","m":"bạn cùng lớp","ex":"An is my classmate.","exm":"An là bạn cùng lớp của tôi.","n":"class (lớp) + mate (bạn) – giống 同学. Dùng cả cho lớp học thêm buổi tối của người đi làm. Nhấn âm đầu: CLASS-mate."},{"w":"they / all","m":"họ, các bạn ấy / tất cả, đều","ex":"They are all students.","exm":"Họ đều là sinh viên.","n":"they đi với are. all đứng sau be (are all) hoặc trước động từ thường (all speak) – giống 都."}],"scene":{"setting":"Hội chợ việc làm (career fair) ở một trường đại học. Kevin (bộ phận kinh doanh, mới chuyển từ Mỹ sang) và Linh trực gian hàng của công ty, đón các bạn sinh viên. Lúc vắng khách, Kevin hỏi chuyện Linh.","img":"scene-en-fair","imgPrompt":"A busy university career fair: kevin, in glasses and a navy shirt, holds a sheet of paper and chats with linh, in a mustard-yellow top holding folders, at their company booth; students and colourful booth panels fill the background.","lines":[{"who":"Linh","t":"Hi, everyone!","vi":"(Chào các bạn sinh viên ghé gian hàng) Chào mọi người!"},{"who":"Kevin","t":"Linh, where are you from?","vi":"Linh này, em là người ở đâu?"},{"who":"Linh","t":"I'm from Vietnam. I'm Vietnamese. Can you speak Vietnamese?","vi":"Em đến từ Việt Nam. Em là người Việt. Anh nói được tiếng Việt không?"},{"who":"Kevin","t":"No, I can't. I can speak Chinese.","vi":"Không, anh không nói được. Anh nói được tiếng Trung."},{"who":"Linh","t":"I can speak Chinese, too! An is my classmate. She is my friend.","vi":"Em cũng nói được tiếng Trung! (Em học lớp tiếng Trung buổi tối.) An là bạn cùng lớp của em. Cô ấy là bạn của em."},{"who":"Kevin","t":"They are all students. They all speak English!","vi":"(Chỉ các bạn sinh viên) Họ đều là sinh viên. Họ đều nói tiếng Anh!"}]},"patterns":[{"t":"Hỏi quê / quốc tịch: Where + are + you from? – I'm from …","f":[["Where","are","you from?"],["I","'m from","Vietnam."],["She","is from","Vietnam."]],"ex":[["Where are you from?","Bạn đến từ đâu?"],["I'm from Vietnam. I'm Vietnamese.","Tôi đến từ Việt Nam. Tôi là người Việt."]],"bad":"Where you from?","good":"Where are you from?","why":"Thiếu “are” là lỗi rất hay gặp. Khi trả lời cũng phải có be: I'm from Vietnam (không nói “I from Vietnam”). from + tên nước (Vietnam), còn quốc tịch thì không cần from: I'm Vietnamese."},{"t":"can + động từ nguyên mẫu","f":[["I","can","speak English."],["Can","you","speak English?"],["I","can't","speak Chinese."]],"ex":[["Can you speak English? – Yes, I can.","Bạn nói được tiếng Anh không? – Được."],["She can't speak Chinese.","Bạn ấy không nói được tiếng Trung."]],"bad":"She can speaks English.","good":"She can speak English.","why":"Sau can luôn là động từ nguyên mẫu: không thêm -s (kể cả với she / he), không thêm to. Câu hỏi: đưa Can lên đầu. Trả lời ngắn: Yes, I can. / No, I can't."},{"t":"all (đều) đứng sau be / trước động từ thường","f":[["They are","all","students."],["They","all","speak English."]],"ex":[["We are all students.","Chúng tôi đều là sinh viên."],["They all speak English.","Họ đều nói tiếng Anh."]],"bad":"All they are students.","good":"They are all students.","why":"Giống 都 tiếng Trung: all không đứng trước chủ ngữ đại từ. Với be thì all đứng sau be (are all); với động từ thường thì all đứng trước động từ (all speak)."},{"t":"Mạo từ a / an + danh từ số ít; số nhiều thêm -s","f":[["I am","a","student."],["She is","an","English student."],["We are","students.","(không có a)"]],"ex":[["Minh is a student.","Minh là sinh viên."],["They are students.","Họ là sinh viên."]],"bad":"I am student.","good":"I am a student.","why":"Tiếng Việt không có mạo từ nên người Việt hay quên “a”. Một người / một vật đếm được: a + danh từ; trước âm nguyên âm (a, e, i, o, u) dùng an: an English student. Số nhiều thì bỏ a và thêm -s: students."}],"vocab":[{"q":"“Vietnamese” nghĩa là gì?","opts":["nước Việt Nam","người Việt Nam / tiếng Việt","người nước ngoài"],"a":1,"why":{"0":"Tên nước là “Vietnam”; Vietnamese là quốc tịch / ngôn ngữ.","2":"“người nước ngoài” không phải Vietnamese."}},{"q":"Trong câu “I can speak English.”, English nghĩa là gì?","opts":["tiếng Anh","nước Anh","sinh viên"],"a":0,"why":{"1":"Sau speak là ngôn ngữ, nên English ở đây là tiếng Anh, không phải nước Anh.","2":"sinh viên là student."}},{"q":"“bạn cùng lớp” trong tiếng Anh là:","opts":["friend","classmate"],"a":1,"why":{"0":"friend là bạn bè nói chung, không nhất thiết học cùng lớp."}},{"q":"“everyone” nghĩa là gì?","opts":["một người","bạn bè","mọi người"],"a":2,"why":{"0":"everyone là tất cả mọi người, không phải một người.","1":"bạn bè là friends."}},{"q":"Chọn từ đúng nghĩa “cô ấy” (nói về Linh):","opts":["he","she","we"],"a":1,"why":{"0":"he dùng cho người nam.","2":"we là “chúng tôi”."}},{"q":"Điền: Can you ___ English?","opts":["from","all","speak"],"a":2,"why":{"0":"from là “từ”, không phải động từ; sau can cần động từ.","1":"all là “đều, tất cả”, không phải động từ."}},{"q":"Điền: We are ___ students. (đều)","opts":["all","too","very"],"a":0,"why":{"1":"too (cũng) đứng cuối câu, không đứng trước danh từ.","2":"very (rất) đi với tính từ, không đi với danh từ students."}},{"q":"Điền: Where are you ___?","opts":["speak","from","name"],"a":1,"why":{"0":"speak là “nói” – không hợp với câu hỏi quê quán.","2":"name là danh từ “tên”, không đứng ở đây."}}],"grammar":[{"q":"Điền: ___ are you from?","opts":["What","Where","Are"],"a":1,"why":{"0":"What hỏi “cái gì”; hỏi quê quán dùng Where.","2":"Đã có “are” ở sau; câu cần từ hỏi Where ở đầu."}},{"q":"Trả lời “Where are you from?” (Việt Nam)","opts":["I from Vietnam.","I'm Vietnam from.","I'm from Vietnam."],"a":2,"why":{"0":"Thiếu động từ be (am).","1":"Sai trật tự: from phải đứng trước tên nước."}},{"k":"type","q":"Điền: I ___ speak English. (biết, có thể)","model":"can","accept":["can"],"why":"Diễn tả khả năng / biết làm gì: can + động từ nguyên mẫu → I can speak English."},{"q":"Phủ định câu “I can speak English.”","opts":["I don't can speak English.","I can't speak English.","I can speak not English."],"a":1,"why":{"0":"Không dùng don't với can; chỉ cần thêm not: can't / cannot.","2":"not phải đi liền với can (can't), không đứng sau speak."}},{"q":"Sắp xếp: all / We / students / are","opts":["All we are students.","We are all students.","We all are student."],"a":1,"why":{"0":"all không đứng trước đại từ chủ ngữ we.","2":"Thiếu -s: nhiều người phải là students."}},{"q":"Linh là nữ. Chọn câu đúng:","opts":["He is my friend.","She my friend.","She is my friend."],"a":2,"why":{"0":"he dùng cho người nam; Linh là nữ nên dùng she.","1":"Thiếu động từ be (is)."}},{"q":"Chọn câu đúng:","opts":["I am a student.","I am student.","I am an student."],"a":0,"why":{"1":"Thiếu mạo từ a trước danh từ số ít student.","2":"student bắt đầu bằng phụ âm /s/ nên dùng a, không dùng an."}}],"listen":[{"q":"Nghe: người nói đến từ đâu?","opts":["Việt Nam","nước Anh","Trung Quốc"],"a":0,"why":{"1":"Bạn nghe “Vietnam”, không phải “England”.","2":"Không nhắc tới China."},"audio":"I'm from Vietnam."},{"q":"Nghe: cô ấy là người nước nào?","opts":["người Anh","người Việt Nam","người Trung Quốc"],"a":1,"why":{"0":"Bạn nghe “Vietnamese”, không phải “English”.","2":"Không nhắc tới Chinese."},"audio":"She is Vietnamese."},{"q":"Nghe: người nói biết làm gì?","opts":["nói tiếng Việt","nói tiếng Anh","không nói được tiếng Anh"],"a":1,"why":{"0":"Bạn nghe “English”, không phải “Vietnamese”.","2":"Câu là “can”, không phải “can't”."},"audio":"I can speak English."},{"q":"Nghe: câu này nghĩa là gì?","opts":["Họ đều là bạn bè.","Họ không phải là sinh viên.","Họ đều là sinh viên."],"a":2,"why":{"0":"Bạn nghe “students” (sinh viên), không phải “friends”.","1":"Không có “not” trong câu."},"audio":"They are all students."},{"q":"Nghe: người nói đang nói với ai?","opts":["mọi người","một người bạn","bố"],"a":0,"why":{"1":"“everyone” là mọi người, không phải một người.","2":"Không có “Dad” trong câu."},"audio":"Hi, everyone!"},{"q":"Nghe: cô ấy là ai của người nói?","opts":["mẹ","bạn cùng lớp","em gái"],"a":1,"why":{"0":"Bạn nghe “classmate”, không phải “mum”.","2":"Bạn nghe “classmate”, không phải “sister”."},"audio":"She is my classmate."},{"q":"Nghe: người nói hỏi về điều gì?","opts":["tên","tuổi","quê / quốc tịch"],"a":2,"why":{"0":"Hỏi tên là “What's your name?”.","1":"Hỏi tuổi là “How old are you?”."},"audio":"Where are you from?"}],"hsk":[{"q":"Movers / TOEIC Bridge – Chọn từ điền vào chỗ trống: Where are you ___?","opts":["speak","from","can"],"a":1,"why":{"0":"speak là động từ “nói”, không hợp cấu trúc hỏi quê.","2":"can không đứng cuối câu hỏi này."}},{"q":"Movers / TOEIC Bridge – Chọn từ điền vào chỗ trống: Can you ___ English?","opts":["all","friend","speak"],"a":2,"why":{"0":"Sau can cần một động từ; all không phải động từ.","1":"friend là danh từ, không phải động từ."}},{"q":"Movers / TOEIC Bridge – Chọn từ điền vào chỗ trống: We are ___ students.","opts":["all","can","from"],"a":0,"why":{"1":"can không đứng sau are.","2":"“are from students” vô nghĩa; from đi với tên nơi chốn."}},{"q":"Movers / TOEIC Bridge – Chọn từ điền vào chỗ trống: She is my ___.","opts":["speak","friend","from"],"a":1,"why":{"0":"Sau my cần danh từ; speak là động từ.","2":"Sau my cần danh từ; from là giới từ."}},{"q":"Movers / TOEIC Bridge – Chọn từ điền vào chỗ trống: ___ she speak English?","opts":["Is","Are","Can"],"a":2,"why":{"0":"Không dùng Is với động từ thường speak (“Is she speak” sai).","1":"Are không đi với she, và cũng không đi với speak."}}],"shadow":[{"t":"Vietnam. Vietnamese.","focus":"Vietnam nhấn âm cuối: viet-NAM. Vietnamese nhấn âm cuối: viet-na-MESE, kết thúc bằng /z/ rung, không đọc “mít”."},{"t":"English","focus":"Nhấn EN-glish; âm cuối /ʃ/ (“sh” chu môi), không đọc “ing-lít”."},{"t":"Where are you from?","focus":"Nối “Where are” thành “we-rar”. “from” khép môi ở /m/. Câu hỏi Where: xuống giọng ở cuối."},{"t":"I'm from Vietnam.","focus":"“I'm from” – hai âm /m/ liền nhau, giữ môi khép một nhịp. Nhấn vào Vietnam."},{"t":"Can you speak English?","focus":"Câu hỏi Có/Không: lên giọng ở cuối. speak /spiːk/: đọc liền /sp/, giữ âm /k/ cuối."},{"t":"Yes, I can. No, I can't.","focus":"Cuối câu trả lời ngắn, can đọc mạnh /kæn/; can't /kɑːnt/ – giữ /t/ cuối để phân biệt với can."},{"t":"She is my friend.","focus":"she /ʃiː/ chu môi (khác see /siː/). friend: giữ cụm /nd/ cuối, không đọc “phren”."},{"t":"They are all students.","focus":"they /ðeɪ/: lưỡi giữa hai răng, rung. students kết thúc bằng /ts/ – đừng bỏ âm -s cuối."}],"dialog":{"title":"Gặp Kevin ở gian hàng hội chợ việc làm","partner":"Kevin","turns":[{"ai":"Hi, everyone! Hello!","vi":"Chào mọi người! Chào bạn!","model":"Hello!","accept":["Hello!","Hi!","Hello.","Hi, Kevin!"],"frame":"Hello!","hint":"Chào lại."},{"ai":"Where are you from?","vi":"Bạn đến từ đâu?","model":"I'm from Vietnam.","accept":["I'm from Vietnam.","I am from Vietnam.","From Vietnam.","I'm Vietnamese."],"frame":"I'm from ___.","hint":"Nói tên nước của bạn sau “I'm from”."},{"ai":"Can you speak English?","vi":"Bạn nói được tiếng Anh không?","model":"Yes, I can.","accept":["Yes, I can.","Yes, I can speak English.","Yes, I can. I can speak English.","No, I can't."],"frame":"Yes, I ___.","hint":"Trả lời ngắn với can."},{"ai":"Is she your friend?","vi":"(Chỉ Linh) Cô ấy là bạn của bạn à?","model":"Yes, she is. We are classmates.","accept":["Yes, she is. We are classmates.","Yes, she is.","Yes, she is my friend.","Yes, we are classmates."],"frame":"Yes, she ___. We are ___.","hint":"Trả lời ngắn “Yes, she is.” rồi nói các bạn là bạn cùng lớp."}]},"reading":{"text":"Hi, everyone! My name is Linh. I'm from Vietnam. I can speak English. I can speak Chinese, too. An is my classmate. She is my friend, too. We are all students.","vi":"Chào mọi người! Mình tên là Linh. Mình đến từ Việt Nam. Mình nói được tiếng Anh. Mình cũng nói được tiếng Trung. An là bạn cùng lớp của mình. Cô ấy cũng là bạn của mình. Chúng mình đều là học viên (của lớp học thêm).","qs":[{"q":"Linh có phải người Anh không?","opts":["Có, Linh là người Anh.","Không, Linh đến từ Việt Nam."],"a":1,"why":{"0":"Bài đọc: “I'm from Vietnam.” – Linh là người Việt Nam."}},{"q":"Theo bài đọc, Linh nói được những tiếng gì?","opts":["chỉ tiếng Anh","tiếng Anh và tiếng Trung","chỉ tiếng Trung"],"a":1,"why":{"0":"Bài đọc còn có “I can speak Chinese, too” – Linh cũng nói được tiếng Trung.","2":"Bài đọc có “I can speak English” – Linh nói được cả tiếng Anh."}},{"q":"An là gì của Linh?","opts":["chị gái","chỉ là bạn cùng lớp, không phải bạn","bạn cùng lớp và cũng là bạn"],"a":2,"why":{"0":"Bài không nói An là chị gái.","1":"Bài đọc có “She is my friend, too” – An cũng là bạn của Linh."}},{"q":"Họ đều là gì?","opts":["giáo viên","học viên, sinh viên (students)"],"a":1,"why":{"0":"Bài đọc: “We are all students” – đều là người đi học, không phải giáo viên."}},{"q":"Đúng hay sai: “Linh can't speak English.”","opts":["Đúng","Sai"],"a":1,"why":{"0":"Bài đọc: “I can speak English.” – Linh nói được."}}]}},{"id":"w1-thu-5","label":"Thứ 5","title":"Số đếm 1–99, hỏi tuổi, cấp học","desc":"Hôm nay bạn học đếm từ 1 đến 99, đọc số điện thoại, hỏi và nói tuổi (How old is he? – He's eight.), nói con mình học cấp nào, qua cảnh An và Kevin nói chuyện bên máy pha cà phê – hôm nay là sinh nhật bé Ben, con trai Kevin.","rule":"Nói tuổi: I'm twenty-six / He's eight years old (luôn có be, years có -s, không dùng “have”). -teen (13–19) nhấn âm cuối, -ty (20, 30…) nhấn âm đầu. Số điện thoại đọc từng chữ số.","cards":[{"w":"one, two, three, four, five","m":"1, 2, 3, 4, 5","ex":"One, two, three!","exm":"Một, hai, ba!","n":"Giữ âm cuối: two /tuː/, three /θriː/ (th lưỡi giữa răng), five kết thúc bằng /v/.","img":"numbers"},{"w":"six, seven, eight, nine, ten","m":"6, 7, 8, 9, 10","ex":"Ben is eight!","exm":"Bé Ben tám tuổi!","n":"six kết thúc /ks/, eight kết thúc /t/ – đừng nuốt âm cuối."},{"w":"eleven, twelve","m":"11, 12","ex":"My sister is twelve.","exm":"Em gái tôi mười hai tuổi.","n":"11 và 12 là số đặc biệt, phải học thuộc (không nói “ten-one”)."},{"w":"thirteen … nineteen","m":"13 … 19","ex":"Minh is nineteen.","exm":"Minh mười chín tuổi.","n":"Đuôi -teen nhấn ở cuối: thir-TEEN. Viết đặc biệt: thirteen (13), fifteen (15), eighteen (18)."},{"w":"twenty, thirty … ninety","m":"20, 30 … 90","ex":"twenty-six, forty-four, ninety-nine","exm":"26, 44, 99","n":"Đuôi -ty nhấn ở đầu: THIR-ty. Số ghép có gạch nối: twenty-one. Chú ý: forty (40) không có “u”."},{"w":"How old are you?","m":"Bạn bao nhiêu tuổi?","ex":"Ben, how old are you?","exm":"Ben ơi, con mấy tuổi?","n":"Tiếng Anh dùng một câu cho mọi lứa tuổi (không phân biệt như 几岁 / 多大). Với người lớn – nhất là sếp, khách hàng, người mới quen – hỏi tuổi bị coi là bất lịch sự; thường chỉ hỏi tuổi trẻ em hoặc bạn thân.","img":"question"},{"w":"… years old","m":"… tuổi","ex":"I'm twenty-six years old.","exm":"Tôi hai mươi sáu tuổi.","n":"Dùng be, không dùng have: I'm 26 years old (không nói “I have 26 years”). years có -s. Có thể bỏ “years old”: I'm twenty-six."},{"w":"big / little","m":"to, lớn / nhỏ, bé","ex":"I'm not little! I'm big!","exm":"Con không bé! Con lớn rồi!","n":"Hai từ trái nghĩa. Vẫn cần be: He's little (không nói “He little”)."},{"w":"now","m":"bây giờ, rồi","ex":"He's eight now!","exm":"Bây giờ cháu tám tuổi rồi!","n":"Đặt cuối câu để nhấn sự thay đổi – gần giống 了 trong 我不小了."},{"w":"next year","m":"năm sau","ex":"Ben is nine next year.","exm":"Sang năm bé Ben chín tuổi.","n":"Thường đặt cuối câu. “this year” = năm nay."},{"w":"birthday","m":"sinh nhật","ex":"Happy birthday, Ben!","exm":"Chúc mừng sinh nhật Ben!","n":"Nhấn BIRTH-day; “th” /θ/ lưỡi giữa răng.","img":"birthday-cake"},{"w":"primary school / secondary school","m":"trường tiểu học / trường trung học","ex":"Ben is in primary school.","exm":"Bé Ben học tiểu học.","n":"Người lớn hay dùng khi nói về con, em: He's in + primary / secondary school (cần “in”). Trường cấp 2–3 ở Anh gọi chung là secondary school."},{"w":"phone number","m":"số điện thoại","ex":"What's your phone number? – It's 0912 345 678.","exm":"Số điện thoại của bạn là gì? – Là 0912 345 678.","n":"Đọc TỪNG chữ số, ngắt theo nhóm: oh-nine-one-two, three-four-five, six-seven-eight. Số 0 thường đọc là “oh” /əʊ/. Hỏi: What's your phone number?"}],"scene":{"setting":"Giờ giải lao buổi sáng, bên máy pha cà phê ở văn phòng. An xin số điện thoại của Kevin; Kevin khoe hôm nay là sinh nhật bé Ben (con trai anh) – cậu bé cứ nói mình “không còn bé nữa”.","img":"colleague","imgPrompt":"A bright office pantry beside an espresso machine: an, in a blue top and holding a mug, laughs as she chats with kevin, in a blue shirt and also holding a mug; shelves with cups and a city view through the window.","lines":[{"who":"An","t":"Kevin, what's your phone number?","vi":"Anh Kevin, số điện thoại của anh là gì ạ?"},{"who":"Kevin","t":"It's oh-nine-one-two, three-four-five, six-seven-eight.","vi":"Số của anh là 0912 345 678."},{"who":"Kevin","t":"It's Ben's birthday! He's eight now.","vi":"Hôm nay sinh nhật bé Ben (con trai anh)! Bây giờ cháu tám tuổi rồi."},{"who":"An","t":"Eight? He's little! He's in primary school.","vi":"Tám tuổi ạ? Bé còn nhỏ nhỉ! Bé đang học tiểu học."},{"who":"Kevin","t":"He says, “I'm not little! I'm big now! I'm nine next year!”","vi":"Cháu cứ nói: “Con không bé! Con lớn rồi! Sang năm con chín tuổi!”"},{"who":"Kevin","t":"And you, An? How old are you? Twenty?","vi":"(Đùa) Còn em, An? Em bao nhiêu tuổi? Hai mươi à?"},{"who":"An","t":"No! I'm twenty-six years old!","vi":"Không ạ! Em hai mươi sáu tuổi rồi!"}]},"patterns":[{"t":"Nói tuổi: chủ ngữ + be + số (+ years old)","f":[["I","am","twenty-six."],["He","is","eight years old."]],"ex":[["I'm twenty-six.","Tôi hai mươi sáu tuổi."],["Ben is eight years old.","Bé Ben tám tuổi."]],"bad":"I twenty-six years old.","good":"I'm twenty-six years old.","why":"Tiếng Việt (“Tôi hai mươi sáu tuổi”) và tiếng Trung (我二十六岁) đều không cần “là”, nhưng tiếng Anh BẮT BUỘC có be. Không dùng have (“I have twenty-six years” sai). years phải có -s, hoặc bỏ hẳn “years old”: I'm twenty-six."},{"t":"Hỏi tuổi: How old + be + chủ ngữ?","f":[["How old","are","you?"],["How old","is","he?"]],"ex":[["How old are you, Ben?","Ben ơi, con bao nhiêu tuổi?"],["How old is Ben?","Bé Ben bao nhiêu tuổi?"]],"bad":"How old you are?","good":"How old are you?","why":"Trong câu hỏi, be đứng trước chủ ngữ: How old ARE you. Không nói “How many years old are you?”. Câu hỏi có từ hỏi: xuống giọng ở cuối. Lưu ý văn hoá: tránh hỏi tuổi người lớn mới quen."},{"t":"-teen và -ty: 13 ≠ 30","f":[["thir","teen","= 13, nhấn cuối"],["THIR","ty","= 30, nhấn đầu"],["forty","-four","= 44"]],"ex":[["fourteen – forty","14 – 40"],["twenty-nine","29"]],"bad":"fourty (40)","good":"forty (40)","why":"40 viết là forty (không có u), dù 4 là four và 14 là fourteen. Phân biệt khi nghe: -teen kéo dài và nhấn ở cuối; -ty ngắn, nhấn ở đầu. Số ghép từ 21–99 có gạch nối."},{"t":"Học cấp nào: be + in + primary / secondary school","f":[["Ben is","in","primary school."],["My sister is","in","secondary school."]],"ex":[["He's in primary school.","Cháu học tiểu học."],["She's in secondary school.","Em ấy học trung học."]],"bad":"He's primary school.","good":"He's in primary school.","why":"Thiếu “in” thì câu thành “Cháu là trường tiểu học”. Cần be + in + tên cấp học."}],"vocab":[{"q":"Số 18 viết bằng chữ là:","opts":["eighty","eighteen","eight"],"a":1,"why":{"0":"eighty là 80.","2":"eight là 8."}},{"q":"Số 29 viết bằng chữ là:","opts":["ninety-two","twelve-nine","twenty-nine"],"a":2,"why":{"0":"ninety-two là 92 – ngược thứ tự.","1":"Không có cách ghép “twelve-nine”; 29 = twenty + nine."}},{"q":"Số 73 viết bằng chữ là:","opts":["seventy-three","thirty-seven","seventeen-three"],"a":0,"why":{"1":"thirty-seven là 37.","2":"seventeen là 17; không ghép 17 với 3."}},{"q":"“How old are you?” nghĩa là gì?","opts":["Bạn tên là gì?","Bạn bao nhiêu tuổi?","Bạn đến từ đâu?"],"a":1,"why":{"0":"Hỏi tên là What's your name?","2":"Hỏi quê là Where are you from?"}},{"q":"“next year” nghĩa là gì?","opts":["năm nay","năm ngoái","năm sau"],"a":2,"why":{"0":"năm nay là this year.","1":"năm ngoái là last year (chưa học)."}},{"q":"“primary school” nghĩa là gì?","opts":["trường tiểu học","trường trung học","đại học"],"a":0,"why":{"1":"trường trung học là secondary school.","2":"đại học là university (chưa học)."}},{"q":"Từ trái nghĩa với “big” là:","opts":["old","little","next"],"a":1,"why":{"0":"old là “già, cũ”, dùng khi hỏi tuổi, không trái nghĩa với big.","2":"next là “tiếp theo”."}},{"q":"Số 12 đọc là:","opts":["twenty","eleven","twelve"],"a":2,"why":{"0":"twenty là 20.","1":"eleven là 11."}}],"grammar":[{"q":"Trả lời “How old are you?” (26 tuổi)","opts":["I twenty-six.","I'm twenty-six.","I have twenty-six years."],"a":1,"why":{"0":"Thiếu động từ be (am).","2":"Tiếng Anh không dùng have để nói tuổi."}},{"q":"Chọn câu đúng:","opts":["I'm twenty-six year old.","I'm twenty-six years.","I'm twenty-six years old."],"a":2,"why":{"0":"Thiếu -s: twenty-six years (số nhiều).","1":"Thiếu “old”: nói đủ “twenty-six years old” hoặc chỉ “twenty-six”."}},{"k":"type","q":"Điền để hỏi tuổi: How ___ are you?","model":"old","accept":["old"],"why":"Hỏi tuổi luôn dùng How old: How old are you?"},{"q":"Hỏi tuổi bé Ben (con trai Kevin):","opts":["How old he is?","How old is he?","How many old is he?"],"a":1,"why":{"0":"Trong câu hỏi, is phải đứng trước he.","2":"Không dùng “how many” để hỏi tuổi; dùng how old."}},{"q":"Ben nói: “Con không bé nữa!” Chọn câu đúng.","opts":["I'm not little now!","I not little now!","I'm no little now!"],"a":0,"why":{"1":"Thiếu động từ be (am).","2":"Phủ định be dùng not, không dùng no."}},{"q":"Sắp xếp: twenty-six / I / am","opts":["Am I twenty-six.","I twenty-six am.","I am twenty-six."],"a":2,"why":{"0":"Đảo am lên đầu là câu hỏi, cần dấu “?”.","1":"Sai trật tự: chủ ngữ + be + số."}},{"q":"Chọn câu đúng:","opts":["He's in primary school.","He's primary school.","He in primary school."],"a":0,"why":{"1":"Thiếu “in” trước primary school.","2":"Thiếu động từ be (is)."}}],"listen":[{"q":"Nghe: cô bé mấy tuổi?","opts":["5","9","19"],"a":1,"why":{"0":"five là 5; bạn nghe “nine”.","2":"nineteen là 19, kéo dài -TEEN ở cuối; bạn nghe “nine”."},"audio":"She's nine."},{"q":"Nghe: cậu ấy bao nhiêu tuổi?","opts":["12","20","2"],"a":0,"why":{"1":"twenty là 20; bạn nghe “twelve”.","2":"two là 2; bạn nghe “twelve”."},"audio":"He's twelve years old."},{"q":"Nghe: năm nay cậu bé mấy tuổi?","opts":["9","10","8"],"a":2,"why":{"0":"9 là tuổi của năm sau (next year), không phải năm nay.","1":"Năm sau mới 9 tuổi, nên năm nay là 8, không phải 10."},"audio":"He's nine next year."},{"q":"Nghe: người nói hỏi về điều gì?","opts":["tên","tuổi","quê"],"a":1,"why":{"0":"Hỏi tên là What's your name?","2":"Hỏi quê là Where are you from?"},"audio":"How old are you?"},{"q":"Nghe: cô bé là ai?","opts":["học sinh trung học","học sinh tiểu học","mẹ"],"a":1,"why":{"0":"Bạn nghe “primary school”, không phải “secondary school”.","2":"Không có “mum” trong câu."},"audio":"She's in primary school."},{"q":"Nghe: bạn nghe số nào?","opts":["40","14","44"],"a":1,"why":{"0":"40 (forty) nhấn âm đầu FOR-ty và âm cuối ngắn; bạn nghe four-TEEN kéo dài ở cuối.","2":"44 là forty-four, có hai phần số."},"audio":"fourteen"},{"q":"Nghe: bạn nghe số nào?","opts":["14","40","44"],"a":2,"why":{"0":"14 chỉ có một từ fourteen; bạn nghe forty-four.","1":"40 chỉ là forty; còn có thêm “four” phía sau."},"audio":"forty-four"}],"hsk":[{"q":"Cambridge A1 Starters – Nghe và chọn tranh đúng.","opts":["bánh có 6 cây nến","bánh có 8 cây nến","bánh có 9 cây nến"],"a":1,"why":{"0":"six là 6; bạn nghe eight.","2":"nine là 9; bạn nghe eight."},"audio":"He's eight years old. Happy birthday!"},{"q":"Cambridge A1 Starters – Nghe và chọn tranh đúng.","opts":["số 14","số 40","số 44"],"a":2,"why":{"0":"14 là fourteen.","1":"40 là forty, chưa có “four” phía sau."},"audio":"forty-four"},{"q":"Cambridge A1 Starters – Nghe và chọn tranh đúng.","opts":["cô giáo","người mẹ","bé gái mặc đồng phục tiểu học"],"a":2,"why":{"0":"Câu nói “in primary school” – là học sinh, không phải cô giáo.","1":"Không có “mum” trong câu."},"audio":"She's in primary school."},{"q":"Cambridge A1 Starters – Nghe và chọn tranh đúng.","opts":["hai học sinh cấp hai","hai cụ già","hai em bé"],"a":0,"why":{"1":"Câu nói “secondary school” – học sinh, không phải người già.","2":"Em bé chưa đi học trung học."},"audio":"They're in secondary school."},{"q":"Cambridge A1 Starters – Nghe và chọn tranh đúng.","opts":["19","90","99"],"a":2,"why":{"0":"19 là nineteen.","1":"90 là ninety, không có “nine” phía sau."},"audio":"ninety-nine"}],"shadow":[{"t":"One, two, three, four, five, six, seven, eight, nine, ten.","focus":"Đếm lên rồi đếm xuống. Giữ âm cuối: five /v/, six /ks/, eight /t/, nine /n/."},{"t":"thirteen – thirty","focus":"thir-TEEN: nhấn cuối, kéo dài /iːn/. THIR-ty: nhấn đầu, âm cuối ngắn."},{"t":"fourteen – forty","focus":"four-TEEN nhấn cuối; FOR-ty nhấn đầu. Đây là cặp dễ nghe nhầm nhất."},{"t":"How old are you?","focus":"Nối “old are” thành “ol-dar”. Câu hỏi có từ hỏi How: xuống giọng ở cuối."},{"t":"I'm twenty-six years old.","focus":"twenty nhấn âm đầu TWEN-ty; six giữ /ks/ cuối; years kết thúc bằng /z/ – đừng bỏ âm -s; “years old” nối liền."},{"t":"I'm not little!","focus":"Nhấn NOT. little /ˈlɪtl/: âm /l/ cuối cong lưỡi lên, không đọc “lít-tồ”."},{"t":"He's nine next year!","focus":"next /nekst/ có cụm phụ âm cuối; khi nói nhanh nối thành “neks-year”. He's kết thúc /z/."},{"t":"She's twelve. She's in secondary school.","focus":"twelve kết thúc /lv/ – giữ /v/. “She's in” nối thành “shi-zin”. school /skuːl/: đọc liền /sk/, không chèn “x-cun”."}],"dialog":{"title":"Bên máy pha cà phê: hỏi chuyện con của đồng nghiệp, đọc số điện thoại","partner":"Kevin","turns":[{"ai":"Hi! What's your name?","vi":"Chào bạn! Bạn tên là gì?","model":"My name is Minh.","accept":["My name is Minh.","I'm Minh.","Hi! My name is Minh.","Hi! I'm Minh."],"frame":"My name is ___.","hint":"Nói tên bạn (thay Minh)."},{"ai":"Ben is my son. It's his birthday!","vi":"Ben là con trai anh. Hôm nay sinh nhật cháu!","model":"Happy birthday, Ben! How old is he?","accept":["Happy birthday, Ben! How old is he?","How old is he?","Happy birthday! How old is he?","Happy birthday, Ben!"],"frame":"Happy ___, Ben! How old is he?","hint":"Chúc mừng sinh nhật rồi hỏi tuổi bé: How old is he?"},{"ai":"He's eight now. Is he in primary school or secondary school?","vi":"Cháu tám tuổi rồi. Cháu học tiểu học hay trung học nhỉ?","model":"He's in primary school.","accept":["He's in primary school.","He is in primary school.","Primary school.","In primary school."],"frame":"He's in ___ school.","hint":"Trẻ 8 tuổi học tiểu học: He's in primary school (nhớ “in”)."},{"ai":"He's nine next year! What's your phone number?","vi":"Sang năm cháu chín tuổi! Số điện thoại của bạn là gì?","model":"It's 0912 345 678.","accept":["It's 0912 345 678.","0912 345 678.","My phone number is 0912 345 678.","It's oh-nine-one-two, three-four-five, six-seven-eight."],"frame":"It's ___.","hint":"Đọc số điện thoại của bạn từng chữ số (ví dụ 0912 345 678; số 0 đọc là “oh”)."}]},"reading":{"text":"My name is An. I'm twenty-six years old. Kevin's son, Ben, is eight. He is in primary school. Hoa is thirteen. She is in secondary school. Ben is nine next year!","vi":"Tôi tên là An. Tôi hai mươi sáu tuổi. Ben, con trai của Kevin, tám tuổi. Bé học tiểu học. Hoa (em gái tôi) mười ba tuổi. Em ấy học trung học. Sang năm Ben chín tuổi!","qs":[{"q":"Ben mấy tuổi?","opts":["9","8","13"],"a":1,"why":{"0":"9 là tuổi của Ben vào năm sau (next year).","2":"13 (thirteen) là tuổi của Hoa."}},{"q":"Ben học cấp nào?","opts":["trung học","tiểu học"],"a":1,"why":{"0":"Bài đọc: “He is in primary school” – tiểu học."}},{"q":"Hoa bao nhiêu tuổi?","opts":["13","30","8"],"a":0,"why":{"1":"30 là thirty (nhấn âm đầu); bài đọc là thirteen (13, nhấn âm cuối).","2":"8 là tuổi của Ben."}},{"q":"An bao nhiêu tuổi?","opts":["16","26","62"],"a":1,"why":{"0":"16 là sixteen; bài đọc là twenty-six.","2":"62 là sixty-two – ngược thứ tự; twenty-six = 26."}},{"q":"Đúng hay sai: “Hoa is in primary school.”","opts":["Đúng","Sai"],"a":1,"why":{"0":"Hoa học secondary school (trung học), không phải tiểu học."}}]}},{"id":"w1-thu-6","label":"Thứ 6","title":"Gia đình, người thân","desc":"Hôm nay bạn học gọi tên người trong gia đình, dùng this / that, my / your / his / her, have / don't have, nói nhà có mấy người, qua cảnh giờ nghỉ trưa: Linh mở ảnh gia đình trên điện thoại cho An và Kevin xem.","rule":"This / That + is + danh từ (không bỏ is). he / she đi với has, I / you / we / they đi với have; phủ định: don't have. Nhiều người phải thêm -s: two sisters. Trước nguyên âm dùng an: an older brother.","cards":[{"w":"this","m":"này, đây (gần)","ex":"This is my family.","exm":"Đây là gia đình tôi.","n":"Chỉ người / vật ở gần. “th” /ð/ rung, lưỡi giữa răng; âm cuối /s/."},{"w":"that","m":"kia, đó (xa)","ex":"That is my sister.","exm":"Kia là chị tôi.","n":"Chỉ người / vật ở xa. That's = That is. Âm /æ/ mở miệng rộng, giữ /t/ cuối."},{"w":"family","m":"gia đình","ex":"Is this your family?","exm":"Đây là gia đình bạn à?","n":"Nhấn FAM-i-ly. Giống 家人 tiếng Trung.","img":"family"},{"w":"There are … people in my family.","m":"Nhà tôi có … người.","ex":"There are five people in my family.","exm":"Nhà tôi có năm người.","n":"Hỏi: How many people are there in your family? “people” đã là số nhiều, không thêm -s. Giống 我家有五口人."},{"w":"have / has","m":"có","ex":"I have a sister. He has two sons.","exm":"Tôi có một chị gái. Anh ấy có hai con trai.","n":"I / you / we / they + have; he / she + has. Lỗi hay gặp: “He have”."},{"w":"don't have","m":"không có","ex":"I don't have a brother.","exm":"Tôi không có anh / em trai.","n":"Phủ định của have: don't have (he / she: doesn't have). Không nói “I no have”. Hỏi: Do you have …? – Yes, I do. / No, I don't."},{"w":"brother","m":"anh trai, em trai","ex":"Bao is my brother.","exm":"Bảo là em trai tôi.","n":"Tiếng Anh không phân biệt anh / em; muốn rõ thì thêm older / younger. “th” /ð/ rung.","img":"brother"},{"w":"sister","m":"chị gái, em gái","ex":"Thu is my sister.","exm":"Thu là chị gái tôi.","n":"Hai chị em: two sisters (đừng quên -s).","img":"sister"},{"w":"older / younger","m":"lớn hơn / nhỏ hơn (anh, chị / em)","ex":"an older sister, a younger brother","exm":"một chị gái, một em trai","n":"older bắt đầu bằng nguyên âm nên dùng an: an older brother; younger dùng a: a younger sister."},{"w":"son / daughter","m":"con trai / con gái","ex":"I have two sons and a daughter.","exm":"Tôi có hai con trai và một con gái.","n":"son đọc giống sun /sʌn/. daughter: “gh” câm, đọc /ˈdɔːtə/."},{"w":"and","m":"và","ex":"my mum and my dad","exm":"mẹ tôi và bố tôi","n":"Nối hai người / hai vật. Khi nói nhanh đọc nhẹ /ən/."},{"w":"her","m":"của cô ấy, của chị ấy, của bà ấy","ex":"That is her son.","exm":"Kia là con trai của chị ấy.","n":"his (của người nam) – her (của người nữ). Có thể dùng tên + ’s: Linh's sister (chị của Linh)."}],"scene":{"setting":"Giờ nghỉ trưa ở sảnh văn phòng. Kevin và Linh gặp An; Linh mở ảnh gia đình trên điện thoại cho hai người xem, rồi mọi người kể về gia đình mình.","img":"she","imgPrompt":"A bright office lobby at lunchtime: an, in a blue top, smiles as kevin, in a navy shirt and lanyard, reaches out to greet her; linh, in a mustard-yellow top, stands beside him smiling; plants and large windows behind.","lines":[{"who":"An","t":"Linh, is this your family?","vi":"(Linh đưa điện thoại) Linh ơi, đây là gia đình em à?"},{"who":"Linh","t":"Yes. There are five people in my family.","vi":"Vâng. Nhà em có năm người."},{"who":"An","t":"Is that your sister? And that's your brother?","vi":"Kia là chị em à? Còn kia là em trai em?"},{"who":"Linh","t":"Yes. Thu is my older sister, and Bao is my younger brother. I don't have an older brother.","vi":"Vâng. Thu là chị gái em, còn Bảo là em trai em. Em không có anh trai."},{"who":"Kevin","t":"I have a son and a daughter. Ben is my son!","vi":"Anh có một con trai và một con gái. Ben là con trai anh!"},{"who":"An","t":"There are five people in my family, too!","vi":"Nhà chị cũng có năm người!"}]},"patterns":[{"t":"This / That + is + danh từ","f":[["This","is","my mum."],["That","is","my sister."],["Is","this","your family?"]],"ex":[["This is my dad.","Đây là bố tôi."],["Is that your brother?","Kia là anh / em trai bạn à?"]],"bad":"This my mum.","good":"This is my mum.","why":"Lỗi thiếu be lại xuất hiện: tiếng Việt “Đây mẹ tôi” nghe vẫn được, nhưng tiếng Anh phải có is. Câu hỏi: đưa Is lên đầu (Is this…?)."},{"t":"Sở hữu: my / your / his / her + danh từ; tên + ’s","f":[["my","brother"],["Linh","'s","sister"],["her","son"]],"ex":[["This is Linh's sister.","Đây là chị của Linh."],["That is her daughter.","Kia là con gái của chị ấy."]],"bad":"This is sister Linh.","good":"This is Linh's sister.","why":"Tiếng Việt nói “chị của Linh / chị Linh” (người được sở hữu đứng trước). Tiếng Anh đặt chủ sở hữu TRƯỚC và thêm ’s: Linh's sister. Đừng quên ’s. his cho nam, her cho nữ."},{"t":"have / has; don't have; Do you have …?","f":[["I","have","a brother."],["He","has","two sisters."],["I","don't have","a sister."],["Do","you","have a brother?"]],"ex":[["Do you have an older sister? – Yes, I do.","Bạn có chị gái không? – Có."],["I don't have a younger brother.","Tôi không có em trai."]],"bad":"He have two sister.","good":"He has two sisters.","why":"Hai lỗi trong một câu: he / she phải đi với has; và nhiều người phải thêm -s (sisters). Phủ định không nói “I no have” mà là “I don't have”. Hỏi không dùng “Are you have…?” mà dùng “Do you have…?”."},{"t":"Số lượng: a / an + một; số ≥ 2 + danh từ -s","f":[["a","son"],["an","older brother"],["two","sons"]],"ex":[["I have a son and a daughter.","Tôi có một con trai và một con gái."],["She has an older sister.","Cô ấy có một chị gái."]],"bad":"I have a older brother.","good":"I have an older brother.","why":"an đứng trước từ bắt đầu bằng âm nguyên âm (older, English); a đứng trước phụ âm (son, younger). Từ hai trở lên phải thêm -s cho danh từ: two sons, three sisters."}],"vocab":[{"q":"“brother” nghĩa là gì?","opts":["chị gái hoặc em gái","a ughter."},{"q":"Nghe: bà ấy có gì?","opts":["1 con gái","2 con trai","1 con trai"],"a":2,"why":{"0":"Bạn nghe son, không phải daughter.","1":"Bạn nghe “a son” – một, không có -s."},"audio":"She has a son."},{"q":"Nghe đoạn hỏi – đáp: người trả lời có chị gái không?","opts":["có chị gái","không có chị gái","có em gái"],"a":0,"why":{"1":"Câu trả lời là “Yes, I do.” – có.","2":"Câu hỏi về older sister (chị gái), không phải younger sister."},"audio":"Do you have an older sister? Yes, I do."}],"hsk":[{"q":"Cambridge A1 Movers – Đọc câu và chọn tranh phù hợp: “There are five people in my family.”","opts":["bố mẹ với một bé trai và một bé gái","gia đình 5 người","hai anh trai đứng cạnh em gái"],"a":1,"why":{"0":"Tranh này chỉ có 4 người.","2":"Tranh này chỉ có 3 người."}},{"q":"Cambridge A1 Movers – Đọc câu và chọn tranh phù hợp: “I have a son and a daughter.”","opts":["bố mẹ với một bé trai và một bé gái","hai anh trai đứng cạnh em gái","cô bé 8 tuổi với bánh sinh nhật"],"a":0,"why":{"1":"Tranh này có 2 con trai, không phải 1 con trai và 1 con gái.","2":"Tranh này không cho thấy một người có con trai và con gái."}},{"q":"Cambridge A1 Movers – Đọc câu và chọn tranh phù hợp: “I have two older brothers.”","opts":["chàng trai chỉ vào ảnh","gia đình 5 người","hai anh trai đứng cạnh em gái"],"a":2,"why":{"0":"Tranh này không thể hiện hai anh trai.","1":"Câu chỉ nói về hai anh trai, không nói nhà có 5 người."}},{"q":"Cambridge A1 Movers – Đọc câu và chọn tranh phù hợp: “My younger sister is eight years old.”","opts":["cô bé 8 tuổi với bánh sinh nhật","bố mẹ với một bé trai và một bé gái","chàng trai chỉ vào ảnh"],"a":0,"why":{"1":"Tranh này không cho thấy tuổi 8.","2":"Tranh này không có em gái 8 tuổi."}},{"q":"Cambridge A1 Movers – Đọc câu và chọn tranh phù hợp: “This is my family.”","opts":["cô bé 8 tuổi với bánh sinh nhật","chàng trai chỉ vào ảnh gia đình","hai anh trai đứng cạnh em gái"],"a":1,"why":{"0":"Tranh này nói về sinh nhật, không có hành động giới thiệu gia đình."," iờ thì giờ đứng CUỐI câu sau 'at': The meeting is at half past eight.","cards":[{"w":"morning","m":"buổi sáng","ex":"Good morning, Kevin!","exm":"Chào buổi sáng, anh Kevin!","n":"Good morning = chào buổi sáng (chỉ dùng để chào, không dùng khi tạm biệt). 'vào buổi sáng' = in the morning (có in the).","img":"morning"},{"w":"get up","m":"thức dậy, ra khỏi giường","ex":"I get up at six o'clock.","exm":"Tôi dậy lúc sáu giờ.","n":"Đọc nối: get‿up → 'ghe-tắp'. Khác 'wake up' (tỉnh giấc): có thể wake up rồi vẫn chưa get up."},{"w":"now","m":"bây giờ","ex":"What time is it now?","exm":"Bây giờ là mấy giờ?","n":"Thường đứng cuối câu: It's seven now. Đọc /naʊ/ như 'nao', không đọc 'nâu'."},{"w":"What time is it?","m":"Mấy giờ rồi?","ex":"What time is it? – It's seven.","exm":"Mấy giờ rồi? – Bảy giờ.","n":"Học nguyên cụm. Lỗi hay gặp: 'What time it is?' (thiếu đảo ngữ) hoặc 'How many hours?' (= bao nhiêu tiếng đồng hồ – sai nghĩa).","img":"clock"},{"w":"o'clock","m":"giờ đúng (giờ chẵn)","ex":"It's eight o'clock.","exm":"Tám giờ đúng.","n":"CHỈ dùng cho giờ chẵn: seven o'clock. Không nói 'seven twenty o'clock'. Đọc /əˈklɒk/, nhấn âm sau.","img":"clock"},{"w":"half past","m":"rưỡi (… giờ 30)","ex":"It's half past seven.","exm":"Bảy giờ rưỡi.","n":"Trật tự ngược tiếng Việt: half past + GIỜ. 'bảy rưỡi' = half past seven, KHÔNG phải 'seven half'. Cũng có thể nói kiểu đồng hồ số: seven thirty."},{"w":"early","m":"sớm","ex":"It's still early!","exm":"Vẫn còn sớm mà!","n":"Trái nghĩa: late. 'still' = vẫn còn: It's still early. Đọc /ˈɜːli/, không đọc 'ơ-li' ngắn."},{"w":"late","m":"muộn, trễ","ex":"Oh no! I'm late for work!","exm":"Ôi không! Tôi đi làm muộn rồi!","n":"be late for + nơi/việc: late for work, late for the meeting. Không nói 'I late' (thiếu am) – người Việt hay bỏ động từ to be."},{"w":"sleep","m":"ngủ","ex":"It's early. I want to sleep!","exm":"Còn sớm mà. Tôi muốn ngủ!","n":"I want to sleep (có 'to'). Đi ngủ (lên giường) là 'go to bed' – sẽ học thứ 6."},{"w":"go to school","m":"đi học, đến trường","ex":"Ben goes to school at seven.","exm":"Bé Ben đi học lúc bảy giờ.","n":"Không có 'the': go to school (đi học). Người đi làm nói go to work (đi làm) – cùng cấu trúc, cũng không có 'the'. He/she thêm -es: Ben goes to school."},{"w":"Don't …","m":"Đừng …","ex":"Don't sleep! The meeting is at eight.","exm":"Đừng ngủ nữa! Tám giờ họp đấy.","n":"Don't + động từ nguyên mẫu, KHÔNG có 'to': Don't call me (không nói 'Don't to call')."},{"w":"Let's …","m":"Chúng ta … nào / … thôi","ex":"Let's go to the meeting!","exm":"Đi họp thôi!","n":"Let's = Let us, đã có 'chúng ta' bên trong nên không thêm 'we': không nói 'Let's we go'."},{"w":"meeting","m":"cuộc họp","ex":"The meeting is at half past eight.","exm":"Cuộc họp lúc tám giờ rưỡi.","n":"the meeting is at + giờ. late for the meeting = đến họp muộn. Đọc /ˈmiːtɪŋ/: i dài, giữ /ŋ/ cuối – không đọc 'mít-tinh'."}],"scene":{"setting":"8 giờ 20 sáng thứ Hai ở văn phòng (giờ làm bắt đầu lúc 8 giờ). An đến sớm, đang cầm cốc cà phê; Kevin vội vàng bước vào, đeo ba lô, còn ngái ngủ. Cuộc họp nhóm bắt đầu lúc 8 giờ rưỡi.","img":"morning","imgPrompt":"Morning in a bright open-plan office: an, in a white blouse with a lanyard, holds a takeaway coffee cup and smiles at kevin, who has just arrived in glasses and a navy shirt with a backpack over his shoulder; desks and a city view through large windows.","lines":[{"who":"An","t":"Good morning, Kevin!","vi":"Chào buổi sáng, anh Kevin!"},{"who":"Kevin","t":"Good morning, An! What time is it?","vi":"Chào An! Mấy giờ rồi em?"},{"who":"An","t":"It's eight twenty. You're late!","vi":"Tám giờ hai mươi rồi. Anh đến muộn đấy!"},{"who":"Kevin","t":"Oh no! I'm late for work! I get up at seven o'clock… I want to sleep!","vi":"Ôi không! Anh đi làm muộn rồi! Anh dậy lúc bảy giờ… mà vẫn buồn ngủ quá!"},{"who":"An","t":"Don't sleep! The meeting is at half past eight.","vi":"Đừng ngủ nữa! Tám rưỡi là họp đấy."},{"who":"Kevin","t":"Half past eight? It's not early! OK. Let's go!","vi":"Tám rưỡi á? Không còn sớm nữa rồi! Được rồi. Đi thôi!"}]},"patterns":[{"t":"Hỏi và nói giờ: What time is it? – It's …","f":[["What time","is","it?"],["It's","seven","o'clock."],["It's","half past","seven."]],"ex":[["What time is it? – It's eight o'clock.","Mấy giờ rồi? – Tám giờ đúng."],["It's half past eight.","Tám giờ rưỡi."],["It's eight twenty.","Tám giờ hai mươi."]],"bad":"It's seven half.","good":"It's half past seven.","why":"Tiếng Việt nói 'bảy giờ rưỡi' (giờ trước, rưỡi sau) nên người Việt hay dịch từng chữ thành 'seven half' – câu này sai. Tiếng Anh nói half past + giờ (half past seven), hoặc đọc như đồng hồ số: seven thirty. Nhớ thêm: o'clock chỉ dùng với giờ chẵn, không nói 'seven twenty o'clock'."},{"t":"Giờ đứng cuối câu: chủ ngữ + động từ + at + giờ","f":[["I","get up","at seven."],["Ben","goes to school","at half past seven."]],"ex":[["I get up at seven o'clock.","Tôi dậy lúc bảy giờ."],["Kevin gets up at half past six.","Kevin dậy lúc sáu giờ rưỡi."]],"bad":"I at seven o'clock get up.","good":"I get up at seven o'clock.","why":"Tiếng Trung đặt giờ TRƯỚC động từ (我七点起床), còn tiếng Anh thường đặt giờ ở CUỐI câu và phải có 'at'. Lỗi hay gặp của người Việt: bỏ 'at' (I get up seven o'clock) hoặc dùng 'in' (in seven o'clock). Với he/she thêm -s: Kevin gets up."},{"t":"Rủ rê và ngăn cấm: Let's + V! / Don't + V!","f":[["(rủ)","Let's","go!"],["(cấm)","Don't","sleep!"]],"ex":[["Let's go to the meeting!","Đi họp thôi!"],["Don't call me!","Đừng gọi tôi!"],["Don't sleep! Get up!","Đừng ngủ nữa! Dậy đi!"]],"bad":"Let's we go to the meeting!","good":"Let's go to the meeting!","why":"Let's = Let us, đã chứa sẵn 'chúng ta', nên không thêm 'we'. Sau Let's và Don't là động từ nguyên mẫu, không có 'to' (không nói 'Let's to go', 'Don't to sleep'). Let's giống 吧 trong tiếng Trung (起床吧)."}],"vocab":[{"q":"'get up' nghĩa là gì?","opts":["thức dậy, ra khỏi giường","đi ngủ","đi học"],"a":0,"why":{"1":"Sai: 'đi ngủ' là go to bed – ngược nghĩa với get up.","2":"Sai: 'đi
