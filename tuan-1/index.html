:"Nhận lời: 好 + 下课后我写."}]},"reading":{"text":"我叫阮明，是学生。上课了，李老师说：“不要说话！”我们学第九课。男同学读中文，女同学写汉字。下课后，我写十个汉字。","py":"Wǒ jiào Ruǎn Míng, shì xuéshēng. Shàngkè le, Lǐ lǎoshī shuō: “Búyào shuōhuà!” Wǒmen xué dì-jiǔ kè. Nán tóngxué dú Zhōngwén, nǚ tóngxué xiě Hànzì. Xiàkè hòu, wǒ xiě shí gè Hànzì.","vi":"Tôi tên là Nguyễn Minh, là học viên (lớp tiếng Trung buổi tối). Vào học rồi, cô Lý nói: “Không được nói chuyện!” Chúng tôi học bài 9. Các học viên nam đọc tiếng Trung, các học viên nữ viết chữ Hán. Sau giờ học, tôi viết mười chữ Hán.","qs":[{"q":"Người viết là ai?","opts":["học viên 阮明","giáo viên 李老师","王丽"],"a":0,"why":{"1":"李老师 là người nói 不要说话, không phải người viết; người viết là 学生.","2":"王丽 không được nhắc đến; người viết tự giới thiệu 我叫阮明."}},{"q":"Họ học bài mấy?","opts":["bài 9","bài 5","bài 10"],"a":0,"why":{"1":"Bài viết nói 第九课 (bài 9).","2":"10 (十) là số chữ Hán người viết viết sau giờ học, không phải số bài."}},{"q":"Các học viên nam làm gì?","opts":["đọc tiếng Trung","viết chữ Hán","nói chuyện"],"a":0,"why":{"1":"Viết chữ Hán là việc của các học viên nữ (女同学).","2":"Cô giáo cấm nói chuyện."}},{"q":"Sau giờ học người viết làm gì?","opts":["Viết mười chữ Hán","Đọc tiếng Trung","Đi ăn bánh bao"],"a":0,"why":{"1":"Đọc tiếng Trung là việc của các học viên nam trong giờ học.","2":"Bài không nhắc đến bánh bao."}},{"q":"Cô giáo nói gì khi vào học?","opts":["Không được nói chuyện!","Đọc to lên!","Tan học rồi!"],"a":0,"why":{"1":"Cô nói 不要说话, không bảo đọc to.","2":"Đây là lúc vào học (上课了), không phải tan học."}}]}},{"id":"w2-thu-6","label":"Thứ 6","title":"Ngày tháng, thứ, buổi trong ngày, phương tiện: lên lịch công tác","desc":"Hỏi và nói ngày tháng, thứ, buổi trong ngày; lên lịch chuyến công tác: ai về/đến bằng phương tiện gì và lúc nào.","rule":"Ngày tháng đi từ lớn đến nhỏ: 九月六号，星期日。⚠ 星期一 = thứ Hai (số + 1). Phương tiện: 坐 + xe + 来/去/回来.","cards":[{"w":"今天","py":"jīntiān","m":"hôm nay","ex":"今天星期几？","expy":"Jīntiān xīngqī jǐ?","exm":"Hôm nay thứ mấy?","n":"今 (nay) như trong 今年 (năm nay). Hai thanh 1, giữ cao đều."},{"w":"回来","py":"huílai","m":"về, trở về (đây)","ex":"王经理今天回来吗？","expy":"Wáng jīnglǐ jīntiān huílai ma?","exm":"Hôm nay giám đốc Vương về không?","n":"回 = về: 回家 (về nhà). 来 = đến (về phía người nói): 来学校. 回来 = về đây; 来 đọc nhẹ."},{"w":"明天","py":"míngtiān","m":"ngày mai","ex":"明天星期日。","expy":"Míngtiān xīngqīrì.","exm":"Ngày mai là Chủ nhật.","n":"明 như trong 明年 (năm sau). Thanh 2 + thanh 1."},{"w":"下午","py":"xiàwǔ","m":"buổi chiều","ex":"他明天下午到。","expy":"Tā míngtiān xiàwǔ dào.","exm":"Chiều mai anh ấy đến.","n":"下 (sau) + 午 (trưa) = buổi chiều. Mốc lớn trước, nhỏ sau: 明天下午三点."},{"w":"到","py":"dào","m":"đến (nơi), tới","ex":"王经理下午三点到。","expy":"Wáng jīnglǐ xiàwǔ sān diǎn dào.","exm":"Giám đốc Vương đến lúc 3 giờ chiều.","n":"到 = tới nơi (kết thúc chuyến đi). 去 = đi đến (bắt đầu đi)."},{"w":"火车","py":"huǒchē","m":"tàu hỏa","ex":"他坐火车回来。","expy":"Tā zuò huǒchē huílai.","exm":"Anh ấy về bằng tàu hỏa.","n":"火 (lửa) + 车 (xe). Đi tàu = 坐火车.","img":"train"},{"w":"飞机","py":"fēijī","m":"máy bay","ex":"我坐飞机去中国。","expy":"Wǒ zuò fēijī qù Zhōngguó.","exm":"Tôi đi Trung Quốc bằng máy bay.","n":"飞 (bay) + 机 (máy). Hai thanh 1. Đi máy bay = 坐飞机.","img":"plane"},{"w":"月","py":"yuè","m":"tháng","ex":"今天九月五号。","expy":"Jīntiān jiǔ yuè wǔ hào.","exm":"Hôm nay ngày 5 tháng 9.","n":"Số + 月 = tháng mấy: 九月 = tháng 9. Hỏi: 几月？ yuè: ü sau y viết u."},{"w":"号","py":"hào","m":"ngày (trong tháng); số","ex":"明天几号？","expy":"Míngtiān jǐ hào?","exm":"Ngày mai ngày mấy?","n":"⚠ Số + 号 = ngày mấy (không phải 'hiệu'). Văn viết hay dùng 日: 九月六日 = 九月六号."},{"w":"星期","py":"xīngqī","m":"tuần; thứ (trong tuần)","ex":"今天星期六，明天星期日。","expy":"Jīntiān xīngqīliù, míngtiān xīngqīrì.","exm":"Hôm nay thứ Bảy, mai Chủ nhật.","n":"⚠ 星期一 = thứ Hai, 星期二 = thứ Ba… (số + 1). Chủ nhật = 星期日 (日 = ngày). Hỏi: 星期几？"},{"w":"手机","py":"shǒujī","m":"điện thoại di động","ex":"我的手机在哪儿？","expy":"Wǒ de shǒujī zài nǎr?","exm":"Điện thoại của tôi đâu?","n":"手 (tay) + 机 (máy). shǒu đọc nửa thanh 3 (thấp) rồi jī cao."},{"w":"知道","py":"zhīdào","m":"biết (một thông tin)","ex":"知道了！","expy":"Zhīdào le!","exm":"Biết rồi!","n":"知道 = biết một điều/thông tin. ⚠ 会 = biết làm (nhờ học): 我会说汉语."},{"w":"晚上","py":"wǎnshang","m":"buổi tối","ex":"我晚上十点睡觉。","expy":"Wǒ wǎnshang shí diǎn shuìjiào.","exm":"Tôi đi ngủ lúc 10 giờ tối.","n":"晚 (muộn) + 上; 上 đọc nhẹ. Đối lập với 早上 (buổi sáng)."},{"w":"开","py":"kāi","m":"mở, bật; lái","ex":"不要开电视！","expy":"Búyào kāi diànshì!","exm":"Đừng bật tivi!","n":"开电视 = bật tivi. k bật hơi, thanh 1."},{"w":"电视","py":"diànshì","m":"tivi, truyền hình","ex":"我们晚上不看电视。","expy":"Wǒmen wǎnshang bú kàn diànshì.","exm":"Buổi tối chúng tôi không xem tivi.","n":"看电视 = xem tivi; 开电视 = bật tivi. 电 (điện) + 视 (nhìn)."},{"w":"睡觉","py":"shuìjiào","m":"đi ngủ","ex":"睡觉吧！","expy":"Shuìjiào ba!","exm":"Đi ngủ thôi!","n":"Đã học 睡 (ngủ); 睡觉 = đi ngủ (cả cụm). ⚠ 觉 ở đây đọc jiào."}],"scene":{"setting":"Chuyến công tác cuối tuần ở Bắc Kinh. 阮安 và 王丽 đứng trên phố xem bản đồ giấy, tính lịch: giám đốc Vương đi Thượng Hải, khi nào và bằng gì sẽ quay lại nhóm.","img":"where","imgPrompt":"Photo of two adults, an and wangli, looking at a paper map together on a city street, pointing and smiling while planning their trip. No text in image.","lines":[{"who":"阮安","t":"王丽，王经理今天回来吗？","py":"Wáng Lì, Wáng jīnglǐ jīntiān huílai ma?","vi":"Chị Lệ ơi, hôm nay giám đốc Vương về (chỗ mình) không?"},{"who":"王丽","t":"不回来。他明天下午到。","py":"Bù huílai. Tā míngtiān xiàwǔ dào.","vi":"Không về đâu. Chiều mai ông ấy mới đến."},{"who":"阮安","t":"他坐飞机回来吗？","py":"Tā zuò fēijī huílai ma?","vi":"Ông ấy về bằng máy bay à?"},{"who":"王丽","t":"不，他坐火车回来。","py":"Bù, tā zuò huǒchē huílai.","vi":"Không, ông ấy về bằng tàu hỏa."},{"who":"阮安","t":"明天几月几号？星期几？","py":"Míngtiān jǐ yuè jǐ hào? Xīngqī jǐ?","vi":"Mai là ngày mấy tháng mấy? Thứ mấy nhỉ?"},{"who":"王丽","t":"九月六号，星期日。","py":"Jiǔ yuè liù hào, xīngqīrì.","vi":"Ngày 6 tháng 9, Chủ nhật."},{"who":"王丽","t":"今天晚上不要开电视，十点睡觉吧！","py":"Jīntiān wǎns       const en = ["T", "S", "P", "E", "G", "B", "C", "I", "H"].concat(read ? ["J"] : []);
      const zh = ["T", "Q", "S", "B", "C", "P", "I", "U", "E", "G"].concat(read ? ["J"] : [], ["H"], STROKE_PAIRS[dz.id] && STROKE_PAIRS[dz.id].length ? ["W"] : [], WRITE_GUIDE[dz.id] && WRITE_GUIDE[dz.id].length ? ["V"] : []);
      out.push({ id: dz.id, week: w, label: dz.label, wlabel: `Tuần ${w} · ${dz.label}`, kind: "web", idx: i,

function runItems(ex, body, finish) {
  const L = S.lang, n = ex.items.length;
  const st = ex.items.map(() => ({ tries: 0, hints: 0, done: false, revealed: false }));
  let idx = 0;
  const wrap = el(`<div class="items"><div class="prog" aria-hidden="true">${ex.items.map(() => "<i></i>").join("")}</div><div class="stage"></div></div>`);
  body.appendChild(wrap);
  const stage = $(".stage", wrap), dots = [...wrap.querySelectorAll(".prog i")];
  function show() {
    dots.forEach((d, i) => d.className = st[i].done ? (clean1(st[i]) ? "ok" : "fix") : i === idx ? "now" : "");
    const it = ex.items[idx];
    stage.innerHTML = "";
    const head = el(`<div class="qhead"><span class="qn">Câu ${idx + 1}/${n}${it.s ? " · " + esc(it.s) : ""}</span></div>`);
    stage.appendChild(head);
    const onDone = () => {
      st[idx].done = true; dots[idx].className = clean1(st[idx]) ? "ok" : "fix";
      const nextBtn = el(`<button type="button" class="btn primary next">${idx < n - 1 ? "Câu tiếp →" : "Hoàn thành bài"}</button>`);
      stage.appendChild(nextBtn); nextBtn.focus();
      nextBtn.onclick = () => {
        if (idx < n - 1) { idx++; show(); return; }
        const first = st.filter(clean1).length, repair = st.filter(s => !clean1(s) && !s.revealed).length;
        let extra = "";
        if (ex.test) {
          const by = {}; ex.items.forEach((it, i) => { const k = it.s; by[k] = by[k] || [0, 0]; by[k][1]++; if (clean1(st[i])) by[k][0]++; });
          extra = "Theo kỹ năng: " + Object.keys(by).map(k => `${k} ${by[k][0]}/${by[k][1]}`).join(", ");
        }
        if (ex.openScript) ex.openScript();
        finish({ total: n, first, repair, extra, firstFlags: st.map(clean1) });
      };
    };
    const ctx = { L, ex, st: st[idx], it, onDone, stage, idx };
    if (it.k === "mc") itemMC(ctx); else if (it.k === "type") itemType(ctx); else if (it.k === "order") itemOrder(ctx); else if (it.k === "free") itemFree(ctx);

}

}

function checkType(L, it, raw) {

    return { ok: false, where: esc(raw), why: "Đủ các phần nhưng còn chỗ chưa đúng mẫu câu. So với khung: <span class='model'>" + esc(it.model) + "</span> (tên có thể khác)." };

    const raw = ta.value, n = N(L, raw.replace(/\n/g, " ")), nq = L === "zh" ? n : neq(raw.replace(/\n/g, " "));

/* ---------- đọc có lời kết thúc (để cảnh tự chạy) ---------- */
function sayThen(text, lang, pitch, cb, who) {
  let done = false; const end = () => { if (!done) { done = true; cb && cb(); } };
  const f = who === "\u0000" ? null : audFile(text, lang, who);
  if (f) { playFile(f, S.slow, end, () => sayThen(text, lang, pitch, cb, "\u0000")); return; }
  const ms = 900 + String(text).length * (lang === "zh" ? 260 : 75) * (S.slow ? 1.35 : 1);
  try { speakSafe(text, lang, S.slow ? 0.72 : 0.95, pitch, end); } catch (e) { end(); }
  setTimeout(end, ms + 1500);
}

/* ---------- dựng nội dung học trước cho buildEx ---------- */
function learnEx(ex, code) {
  const L = S.lang, D = DATA[L], X = LEARN[L], base = code[0];
  ex.rule = LEARN_RULE[base];
  if (base === "T") { ex.kind = "cards"; ex.cards = X.cards[code]; ex.title = code === "T4" ? "Thẻ học: câu khoá cho trạm" : code === "T3" ? "Thẻ học: nói trang trọng" : "Thẻ học: từ và cụm câu mới"; }
  if (base === "P") { ex.kind = "pattern"; ex.pats = X.patterns[code]; ex.title = "Mẫu câu cần nắm"; }
  if (base === "S") {
    const sc = X.scenes[code]; ex.kind = "scene"; ex.setting = sc.setting; ex.bg = sc.bg;
    let lines = [];
    if (sc.src === "dialogue" || sc.src === "dialogue2") {
      lines = D[sc.src].map(r => L === "zh" ? { who: r[0], t: r[1], py: r[2], vi: r[3] } : { who: r[0], t: r[1], vi: r[2] });
      ex.title = "Xem cảnh: " + (code === "S1" ? "cuộc làm quen" : "hội thoại thứ hai");
    } else {
      const rp = sc.src === "rpbase" ? D.roleplay.base : D.roleplay.variant, partner = rp.partner.split(" · ")[0].split(" ")[0];
      rp.turns.filter(t => !t.m2 || S.level === 2).forEach(t => {
        lines.push({ who: partner, t: t.ai, py: t.py || "", vi: /^\(/.test(t.vi) ? "" : t.vi });
        lines.push({ who: sc.me, t: t.model, vi: "" });
      });
      ex.title = code === "S3" ? "Xem cảnh mẫu trước khi đóng vai" : "Xem cảnh mẫu trang trọng";
    }
    ex.lines2 = lines; ex.people = [...new Set(lines.map(l => l.who))].slice(0, 2);
  }
  return ex;
}

/* ---------- thẻ học ---------- */
function runCards(ex, body, finish) {
  const L = S.lang, cards = ex.cards; let i = 0, flipped = false, saved = 0;
  const box = el(`<div class="cardsx"><div class="prog" aria-hidden="true">${cards.map(() => "<i></i>").join("")}</div>
    <div class="fcard" tabindex="0" role="button" aria-label="Lật thẻ"></div>
    <div class="row center ctl"><button type="button" class="btn ghost prev">← Thẻ trước</button><button type="button" class="btn ghost flip">Lật thẻ</button><button type="button" class="btn primary nx">Thẻ tiếp →</button></div>
    <div class="row center"><button type="button" class="btn ghost small keep">Lưu thẻ này vào kho ôn</button></div></div>`);
  body.appendChild(box);
  const fc = $(".fcard", box), dots = [...box.querySelectorAll(".prog i")];
  function draw(play) {
    const c = cards[i];
    dots.forEach((d, k) => d.className = k < i ? "ok" : k === i ? "now" : "");
    fc.className = "fcard" + (flipped ? " back" : "");
    const ear = ex.ear && L === "zh", han = !ear || hanShown();
    const hanTag = ear ? `<button type="button" class="btn ghost small hz">${han ? "Ẩn chữ Hán" : "Xem chữ Hán"}</button>` : "";
    if (ear) fc.innerHTML = !flipped
      ? `<span class="side">Nghe · ${i + 1}/${cards.length}</span>${iconSVG(cardArt(c), "illu big")}<b class="fw pyw">${esc(c.py)}</b>${han ? `<span class="fhan" lang="zh">${esc(c.w)}</span>` : ""}<button type="button" class="btn sound sp">${ICON.play} Nghe</button><span class="hint">Nghe 2–3 lần, nói to theo, rồi chạm thẻ để xem nghĩa</span>${hanTag}`
      : `<span class="side">Nghĩa · ${i + 1}/${cards.length}</span>${iconSVG(cardArt(c), "illu corner")}<span class="fwb">${esc(c.py)}${han ? ` <small lang="zh">${esc(c.w)}</small>` : ""}</span><b class="fm">${esc(c.m)}</b>
         ${c.ex ? `<div class="fex"><span class="pyl">${esc(c.expy || pyOf(c.ex))}</span>${han ? `<span lang="zh">${esc(c.ex)}</span>` : ""}${c.exm ? `<small>${esc(c.exm)}</small>` : ""}<button type="button" class="btn ghost small spx">${ICON.play} Nghe câu ví dụ</button></div>` : ""}
         <p class="fnote"><span class="lab">Ghi nhớ:</span> ${esc(c.n)}</p>${hanTag}`;
    else fc.innerHTML = !flipped
      ? `<span class="side">Mặt trước · ${i + 1}/${cards.length}</span>${iconSVG(cardArt(c), "illu big")}<b class="fw" lang="${L === "zh" ? "zh" : "en"}">${esc(c.w)}</b>${c.py ? `<span class="fpy">${esc(c.py)}</span>` : ""}<button type="button" class="btn sound sp">${ICON.play} Nghe</button><span class="hint">Chạm thẻ để xem nghĩa</span>`
      : `<span class="side">Mặt sau · ${i + 1}/${cards.length}</span>${iconSVG(cardArt(c), "illu corner")}<span class="fwb" lang="${L === "zh" ? "zh" : "en"}">${esc(c.w)}${c.py ? ` <small>${esc(c.py)}</small>` : ""}</span><b class="fm">${esc(c.m)}</b>
         ${c.ex ? `<div class="fex"><span lang="${L === "zh" ? "zh" : "en"}">${esc(c.ex)}</span>${c.exm ? `<small>${esc(c.exm)}</small>` : ""}<button type="button" class="btn ghost small spx">${ICON.play} Nghe câu ví dụ</button></div>` : ""}
         <p class="fnote"><span class="lab">Ghi nhớ:</span> ${esc(c.n)}</p>`;
    const sp = $(".sp", fc); if (sp) sp.onclick = e => { e.stopPropagation(); say(c.w, L); };
    const spx = $(".spx", fc); if (spx) spx.onclick = e => { e.stopPropagation(); say(c.ex, L); };
    const hz = $(".hz", fc); if (hz) hz.onclick = e => { e.stopPropagation(); setHanShown(!hanShown()); draw(false); };
    $(".prev", box).disabled = i === 0;
    $(".nx", box).textContent = i === cards.length - 1 ? "Xong thẻ học" : "Thẻ tiếp →";
    if (play && !flipped) say(c.w, L);
  }
  const flip = () => { flipped = !flipped; draw(false); };
  fc.onclick = flip; fc.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); } };
  $(".flip", box).onclick = flip;
  $(".prev", box).onclick = () => { if (i > 0) { i--; flipped = false; draw(true); } };
  $(".nx", box).onclick = () => { if (i < cards.length - 1) { i++; flipped = false; draw(true); } else finish({ learn: true, extra: `Học ${cards.length} thẻ${saved ? `, lưu ${saved} thẻ vào kho ôn` : ""}` }); };
  $(".keep", box).onclick = () => { const c = cards[i]; addReview(L, c.m, c.w); saved++; toast("Đã lưu vào kho ôn."); };
  draw(true);
}

/* ---------- cảnh hội thoại ---------- */

    return `<span class="spk">${esc(l.who)}</span><span class="tx" lang="${L === "zh" ? "zh" : "en"}">${esc(l.t)}</span>${py && subPy ? `<span class="py">${esc(py)}</span>` : ""}${l.vi && subVi ? `<span class="vi">${esc(l.vi)}</span>` : ""}`; }
  function show(k, chain) {

/* ---------- mẫu câu ---------- */
function runPatterns(ex, body, finish) {
  const L = S.lang, pats = ex.pats; let i = 0;
  const box = el(`<div class="pats"><div class="prog" aria-hidden="true">${pats.map(() => "<i></i>").join("")}</div><div class="pat"></div>
    <div class="row center"><button type="button" class="btn ghost prev">← Mẫu trước</button><button type="button" class="btn primary nx">Mẫu tiếp →</button></div></div>`);

  const pat = $(".pat", box), dots = [...box.querySelectorAll(".prog i")];

      <div class="formula">${p.f.map(r => `<div class="frow">${r.filter(Boolean).map((c, k) => `<span class="fchip${k === 1 ? " key" : ""}" lang="${/[一-鿿]/.test(c) ? "zh" : ""}">${esc(c)}${L === "zh" && /[一-鿿]/.test(c) ? `<small class="cpy">${esc(pyOf(c))}</small>` : ""}</span>`).join('<span class="plus">+</span>')}</div>`).join("")}</div>
      <ul class="pex">${p.ex.map((e, k) => `<li><button type="button" class="btn sound small" data-k="${k}">${ICON.play}</button><span lang="${L === "zh" ? "zh" : "en"}">${esc(e[0])}${L === "zh" && /[一-鿿]/.test(e[0]) ? `<small class="cpy">${esc(pyOf(e[0]))}</small>` : ""}</span><small>${esc(e[1])}</small></li>`).join("")}</ul>
      <div class="badgood"><p><span class="x">✗</span> <s lang="${L === "zh" ? "zh" : "en"}">${esc(p.bad)}</s></p><p><span class="v">✓</span> <b lang="${L === "zh" ? "zh" : "en"}">${esc(p.good)}</b>${L === "zh" && /[一-鿿]/.test(p.good) ? ` <small class="cpy">${esc(pyOf(p.good))}</small>` : ""}</p><p class="why">${esc(p.why)}</p></div>`;
    pat.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { const t = p.ex[+b.dataset.k][0]; if (!/^[a-zāáǎàēéěèīíǐìōóǒòūúǔù ]+$/i.test(t)) say(t, L); });

/* ---------- cảnh hội thoại bằng video (Google Flow) + phụ đề tự canh theo lời nói ---------- */
function runSceneVideo(ex, body, finish, VD) {
  const L = S.lang, lines = ex.lines2, [pA] = ex.people; let subVi = true, subPy = L === "zh", ci = 0, cur = -1, stopAt = null, seen = new Set();
  const box = el(`<div class="scene vscene">
    <div class="stage2"><p class="setting">${esc(ex.setting)}</p>
      <div class="vwrap"><video class="svid" playsinline preload="auto"></video><div class="subs" aria-live="polite"><p class="muted">Bấm Phát cả cảnh để xem.</p></div></div></div>
    <div class="row center"><button type="button" class="btn ghost prev">⏮ Câu trước</button><button type="button" class="btn primary playall">${ICON.play} Phát cả cảnh</button><button type="button" class="btn ghost rep">↻ Nghe lại câu này</button><button type="button" class="btn ghost nx">Câu tiếp ⏭</button></div>
    <div class="row center small"><label class="tick"><input type="checkbox" class="cvi" checked> Phụ đề tiếng Việt</label>${L === "zh" ? `<label class="tick"><input type="checkbox" class="cpy" checked> Bính âm</label><label class="tick"><input type="checkbox" class="chan" ${subHan ? "checked" : ""}> Chữ Hán</label>` : ""}</div>
    ${L === "zh" && ex.ear ? `<p class="note small">Bước Nghe: chữ Hán đang ${subHan ? "hiện" : "ẩn"} để bạn tập trung vào âm thanh. Nghe câu nào thì nói nhỏ theo câu đó.</p>` : ""}
    <ol class="log"></ol>
    <div class="row center"><button type="button" class="btn primary huge fin" disabled>Xem xong, sang bài tập</button></div></div>`);
  body.appendChild(box);
  const v = $(".svid", box), subs = $(".subs", box), log = $(".log", box);
  const lineHTML = l => `<span class="spk">${esc(l.who)}</span><span class="tx" lang="${L === "zh" ? "zh" : "en"}">${esc(l.t)}</span>${l.py && subPy ? `<span class="py">${esc(l.py)}</span>` : ""}${l.vi && subVi ? `<span class="vi">${esc(l.vi)}</span>` : ""}`;
  const where = i => { for (let c = 0; c < VD.clips.length; c++) { const q = VD.clips[c].cues.find(x => x[2] === i); if (q) return { c, q }; } return null; };
  function load(c) { if (ci !== c || !v.src) { ci = c; v.src = "vid/" + VD.clips[c].src; } }
  function showLine(i) {
    if (i === cur || i < 0) return; cur = i; seen.add(i); const l = lines[i];
    subs.className = "subs " + (l.who === pA ? "left" : "right");
    subs.innerHTML = `<div class="bub2">${lineHTML(l)}</div>`;
    log.innerHTML = [...seen].sort((a, b) => a - b).map(k => `<li class="${lines[k].who === pA ? "l" : "r"}">${lineHTML(lines[k])}</li>`).join("");
    if (seen.size === lines.length) $(".fin", box).disabled = false;
  }
  v.ontimeupdate = () => {
    const t = v.currentTime, cues = VD.clips[ci].cues, q = cues.find(x => t >= x[0] - 0.1 && t <= x[1] + 0.35) || cues.filter(x => x[0] <= t).slice(-1)[0];
    if (q) showLine(q[2]);
    if (stopAt != null && t >= stopAt) { v.pause(); stopAt = null; }
  };
  v.onended = () => { if (playAll && ci < VD.clips.length - 1) { load(ci + 1); v.play().catch(() => {}); } else { playAll = false; VD.clips.forEach(c => c.cues.forEach(x => seen.add(x[2]))); showLine(cur); $(".fin", box).disabled = seen.size >= lines.length; $(".playall", box).innerHTML = `${ICON.play} Xem lại cả cảnh`; } };
  let playAll = false;
  const jump = (i, single) => { const w = where(i); if (!w) return; load(w.c); const go = () => { v.currentTime = Math.max(0, w.q[0] - 0.05); stopAt = single ? w.q[1] + 0.3 : null; v.play().catch(() => {}); }; if (v.readyState >= 1) go(); else v.onloadedmetadata = () => { v.onloadedmetadata = null; go(); }; };
  $(".playall", box).onclick = () => { playAll = true; cur = -1; load(0); v.currentTime = 0; v.play().catch(() => {}); $(".playall", box).textContent = "Đang phát…"; };
  $(".nx", box).onclick = () => { playAll = false; jump(Math.min(lines.length - 1, cur + 1), true); };
  $(".prev", box).onclick = () => { playAll = false; jump(Math.max(0, cur - 1), true); };
  $(".rep", box).onclick = () => { playAll = false; jump(Math.max(0, cur), true); };
  const redraw = () => { const c = cur; cur = -1; if (c >= 0) showLine(c); };
  $(".cvi", box).onchange = e => { subVi = e.target.checked; redraw(); };
  const cpy = $(".cpy", box); if (cpy) cpy.onchange = e => { subPy = e.target.checked; redraw(); };
  $(".fin", box).onclick = () => { v.pause(); finish({ learn: true, extra: `Xem đủ ${lines.length} câu thoại` }); };
  load(0);
}

/* ---------- bước 4: đếm nét để phân biệt chữ trông giống nhau (hanzi-writer, dữ liệu nét có sẵn trong trang) ---------- */
function strokePad(host, ch, size) {
  host.style.width = host.style.height = size + "px";
  if (typeof HanziWriter === "undefined" || !HZDATA[ch]) { host.innerHTML = `<span class="wfall" lang="zh" style="font-size:${Math.round(size * .55)}px">${esc(ch)}</span>`; return null; }
  const col = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  return HanziWriter.create(host, ch, { width: size, height: size, padding: Math.round(size * .06), showOutline: true, showCharacter: true,
    strokeColor: col("--ink") || "#1f2937", outlineColor: "rgba(127,127,127,.2)", radicalColor: null, strokeAnimationSpeed: 0.8, delayBetweenStrokes: 450,
    charDataLoader: (c, ok) => ok(HZDATA[c]) });
}
/* phát từng nét, đếm 1, 2, 3… trên nhãn */
function countAlong(writer, ch, label, done) {
  const n = HZDATA[ch] ? HZDATA[ch].strokes.length : 0; if (!writer || !n) { label.textContent = n ? n + " nét" : ""; return; }
  writer.hideCharacter(); let k = 0; label.textContent = "Nét 0";
  const step = () => { if (k >= n) { label.textContent = `${n} nét`; done && done(); return; } writer.animateStroke(k, { onComplete: () => { k++; label.textContent = "Nét " + k; setTimeout(step, 250); } }); };
  step();
}
function runStrokes(ex, body, finish) {
  const n = ex.items.length; let i = 0;
  const st = ex.items.map(() => ({ tries: 0, done: false }));
  const box = el(`<div class="strokex"><div class="prog" aria-hidden="true">${ex.items.map(() => "<i></i>").join("")}</div>
    <p class="note small">Mỗi nét là một lần đặt bút xuống rồi nhấc lên. Chữ gần giống nhau thường chỉ khác nhau một bộ phận, nên số nét khác nhau.</p><div class="scard"></div></div>`);
  body.appendChild(box);
  const card = $(".scard", box), dots = [...box.querySelectorAll(".prog i")];
  function draw() {
    const it = ex.items[i];
    dots.forEach((d, k) => d.className = st[k].done ? (st[k].tries ? "fix" : "ok") : k === i ? "now" : "");
    card.innerHTML = `<div class="qhead"><span class="qn">Câu ${i + 1}/${n}</span></div>` + (it.k === "count"
      ? `<div class="spad1"><div class="wpad sp" aria-label="Chữ ${esc(it.ch)}"></div><span class="scount" aria-live="polite"></span></div>
         <p class="qt"><b class="pyw">${esc(it.py)}</b> · ${esc(it.m)}</p><p class="qt">${esc(it.q)}</p>
         <div class="row center"><button type="button" class="btn ghost small anim">${ICON.play} Xem từng nét</button><button type="button" class="btn ghost small snd">🔊 Nghe</button></div>
         <div class="opts nums" role="group" aria-label="Số nét">${it.opts.map((o, j) => `<button type="button" class="opt" data-i="${j}"><span class="ot">${esc(o)} nét</span></button>`).join("")}</div>`
      : `<p class="qt">${esc(it.q)}</p><div class="pair">${it.opts.map((o, j) => `<div class="pcell"><div class="wpad sp" data-p="${j}" aria-label="Chữ ${esc(o)}"></div><span class="scount" data-c="${j}"></span>
           <button type="button" class="btn ghost small anim" data-j="${j}">${ICON.play} Đếm nét</button><button type="button" class="opt pick" data-i="${j}"><span class="badge">${"AB"[j]}</span> Chọn chữ này</button></div>`).join("")}</div>`)
      + `<div class="fb" role="status" aria-live="polite" hidden></div><div class="row center"><button type="button" class="btn primary next" hidden>${i < n - 1 ? "Câu tiếp →" : "Hoàn thành bài"}</button></div>`;
    const size = it.k === "count" ? Math.min(220, card.clientWidth - 40) : Math.min(150, Math.floor((card.clientWidth - 60) / 2));
    const fb = $(".fb", card), nx = $(".next", card);
    if (it.k === "count") {
      const w = strokePad($(".sp", card), it.ch, size), lab = $(".scount", card);
      $(".anim", card).onclick = () => countAlong(w, it.ch, lab);
      $(".snd", card).onclick = () => say(it.ch, "zh");
    } else {
      const ws = it.opts.map((o, j) => strokePad(card.querySelector(`[data-p="${j}"]`), o, size));
      card.querySelectorAll(".anim").forEach(b => b.onclick = () => { const j = +b.dataset.j; countAlong(ws[j], it.opts[j], card.querySelector(`[data-c="${j}"]`)); });
    }
    card.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      if (st[i].done) return; const j = +b.dataset.i;
      if (j === it.a) {
        st[i].done = true; b.classList.add("right"); card.querySelectorAll(".opt").forEach(x => x.disabled = true);
        fbOn(fb, "good");
        fb.innerHTML = `<p class="fbt">${st[i].tries ? "Đúng rồi, bạn đã tự sửa được" : "Đúng"}</p>` + (it.k === "count" ? `<p class="why">${esc(it.ch)} (${esc(it.py)}) có ${it.n} nét.</p>` : `<p class="why">${it.opts.map((o, k) => `${esc(o)}: ${it.counts[k]} nét`).join(" · ")}. ${esc(it.note)}</p>`);
        if (it.k === "pick") card.querySelectorAll(".scount").forEach((s, k) => s.textContent = it.counts[k] + " nét");
        say(it.k === "count" ? it.ch : it.opts[it.a], "zh");
        dots[i].className = st[i].tries ? "fix" : "ok"; nx.hidden = false; nx.focus(); return;
      }
      st[i].tries++; b.classList.add("wrong"); b.disabled = true;
      if (st[i].tries === 1) addReview("zh", it.k === "count" ? `Số nét của ${it.ch}` : `${it.py} — chữ nào?`, it.k === "count" ? `${it.n} nét` : it.opts[it.a]);
      fbOn(fb, "bad"); fb.innerHTML = `<p class="fbt">Chưa đúng</p><p class="why">${esc(it.why[j] || "")}</p><p class="next-step">${it.k === "count" ? "Bấm Xem từng nét, đếm theo rồi chọn lại." : "Bấm Đếm nét dưới từng chữ, rồi chọn lại."}</p>`;
    });
    nx.onclick = () => {
      if (i < n - 1) { i++; draw(); return; }
      const first = st.filter(x => !x.tries).length;
      finish({ total: n, first, repair: st.filter(x => x.tries).length, extra: `Phân biệt ${n / 2} cặp chữ giống nhau` });
    };
  }
  draw();
}

/* ---------- bước 4: hướng dẫn viết, đi lần lượt từng chữ: xem thứ tự nét → tô nét (có gợi ý) → tự viết (nút gợi ý) → kiểm tra → chữ tiếp ---------- */
function runWGuide(ex, body, finish) {
  const chars = ex.chars; let ci = 0, tab = "learn", W = null, timer = null, autoT = null;
  const STAGES = [["learn", "👀 Xem thứ tự nét"], ["trace", "✏️ Tô nét"], ["free", "✍️ Tự viết"], ["quiz", "🏆 Kiểm tra"]];
  const SC = chars.map(() => ({ ok: 0, miss: 0, learn: false, trace: false, free: false, quiz: false, qmiss: null }));
  const rate = o => (o.ok + o.miss) ? Math.round(o.ok * 100 / (o.ok + o.miss)) : 0;
  const stars = n => "★".repeat(n) + "☆".repeat(3 - n);
  const N = () => HZDATA[chars[ci].ch] ? HZDATA[chars[ci].ch].strokes.length : 0;
  const box = el(`<div class="wg">
    <p class="note small">Đi lần lượt từng chữ: xem thứ tự nét → tô nét theo hình mờ → tự viết (có nút gợi ý) → kiểm tra. Xong một bước trang tự chuyển sang bước sau, xong chữ này tự sang chữ kia. Muốn học chữ khác thì bấm chọn ở hàng dưới.</p>
    <div class="wgchars" role="group" aria-label="Chọn chữ"></div>
    <div class="wginfo"><b class="wgt" lang="zh"></b><span class="wgs"></span><span class="pill wgn"></span></div>
    <div class="wgtabs" role="tablist">${STAGES.map((s, k) => `<button type="button" role="tab" data-t="${s[0]}"><small>Bước ${k + 1}</small>${s[1]}</button>`).join("")}<button type="button" role="tab" data-t="res">📊 Kết quả</button></div>
    <div class="wgauto" aria-live="polite" hidden></div>
    <div class="wgbody"></div>
    <div class="row center"><button type="button" class="btn primary huge fin" disabled>Hoàn thành bài</button></div>
    <p class="small muted center wghint">Mỗi chữ cần làm xong bước Kiểm tra để hoàn thành bài.</p></div>`);
  body.appendChild(box);
  const wb = $(".wgbody", box), fin = $(".fin", box), ab = $(".wgauto", box);
  const col = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const cancelAuto = () => { if (autoT) { clearTimeout(autoT); autoT = null; } ab.hidden = true; };
  function auto(text, fn, ms) { cancelAuto(); ab.hidden = false; ab.innerHTML = `${esc(text)} <button type="button" class="btn ghost small now">Đi ngay</button> <button type="button" class="btn ghost small stay">Ở lại</button>`;
    $(".now", ab).onclick = () => { cancelAuto(); fn(); }; $(".stay", ab).onclick = cancelAuto; autoT = setTimeout(() => { autoT = null; ab.hidden = true; fn(); }, ms || 2200); }
  const nextStage = () => { const k = STAGES.findIndex(s => s[0] === tab); return k >= 0 && k < STAGES.length - 1 ? STAGES[k + 1] : null; };
  const nextChar = () => { for (let k = 1; k <= chars.length; k++) { const j = (ci + k) % chars.length; if (!SC[j].quiz) return j; } return -1; };
  function stageDone() {
    const nx = nextStage();
    if (nx) auto(`Tốt lắm! Sang bước tiếp: ${nx[1]}…`, () => { tab = nx[0]; draw(); });
    else { const j = nextChar(); if (j >= 0) auto(`Xong chữ ${chars[ci].ch}! Sang chữ ${chars[j].ch}…`, () => { ci = j; tab = "learn"; draw(); }, 2600); else auto("Bạn đã viết xong cả " + chars.length + " chữ! Xem kết quả…", () => { tab = "res"; draw(); }, 2400); }
  }
  function chips() {
    $(".wgchars", box).innerHTML = chars.map((c, i) => { const s = SC[i], n = ["learn", "trace", "free", "quiz"].filter(k => s[k]).length; return `<button type="button" class="wgc" aria-pressed="${i === ci}" data-i="${i}"><span class="gl" lang="zh">${esc(c.ch)}</span><span class="nm">${esc(c.py)} · ${esc(c.m)}<small>${s.quiz ? "★ đã xong" : n + "/4 bước"}</small></span></button>`; }).join("");
    box.querySelectorAll(".wgc").forEach(b => b.onclick = () => { cancelAuto(); ci = +b.dataset.i; const s = SC[ci]; tab = !s.learn ? "learn" : !s.trace ? "trace" : !s.free ? "free" : "quiz"; draw(); });
    fin.disabled = !SC.every(s => s.quiz);
  }
  function header() {
    const c = chars[ci], s = SC[ci];
    $(".wgt", box).textContent = `${c.ch} — ${c.py}`; $(".wgs", box).textContent = c.m; $(".wgn", box).textContent = N() ? N() + " nét" : "";
    box.querySelectorAll(".wgtabs button").forEach(b => { b.setAttribute("aria-selected", String(b.dataset.t === tab)); b.classList.toggle("ok", !!s[b.dataset.t]); });
  }
  function dots(h, n, now) { h.innerHTML = Array.from({ length: N() }, (_, i) => `<span class="dot${i < n ? " done" : now && i === n ? " now" : ""}">${i + 1}</span>`).join(""); }
  function board(outline) {
    const host = $(".wpad", wb); host.innerHTML = "";
    const size = Math.max(200, Math.min(320, Math.floor(wb.clientWidth > 700 ? wb.clientWidth * 0.42 : wb.clientWidth - 24)));
    host.style.width = host.style.height = size + "px";
    if (typeof HanziWriter === "undefined" || !HZDATA[chars[ci].ch]) { host.innerHTML = `<span class="wfall" lang="zh">${esc(chars[ci].ch)}</span>`; return null; }
    return HanziWriter.create(host, chars[ci].ch, { width: size, height: size, padding: Math.round(size * .05), showCharacter: false, showOutline: outline,
      strokeColor: col("--ink") || "#1f2937", radicalColor: col("--zh") || "#c2410c", outlineColor: "rgba(127,127,127,.25)", drawingColor: col("--en") || "#1F44D6",
      drawingWidth: Math.round(size * .06), highlightColor: col("--sun") || "#FFD43B", strokeAnimationSpeed: 0.9, delayBetweenStrokes: 300, charDataLoader: (ch, ok) => ok(HZDATA[ch]) });
  }
  const msg = (t, k) => { const m = $(".wgmsg", wb); if (m) { m.textContent = t; m.className = "wgmsg" + (k ? " " + k : ""); } };
  function draw() {
    if (timer) { clearInterval(timer); timer = null; }
    chips(); header(); const c = chars[ci], s = SC[ci];
    if (tab === "res") return results();
    const left = `<div class="wgl"><div class="wpad"></div><div class="dots"></div></div>`;
    if (tab === "learn") {
      wb.innerHTML = `<div class="wgrid">${left}<div class="wgr">
        <p class="wgmsg">Đang viết mẫu… đếm theo từng nét và để ý nét nào trước, nét nào sau.</p>
        <div class="row"><button type="button" class="btn primary play">${ICON.play} Viết lại</button><button type="button" class="btn ghost step">Từng nét</button><button type="button" class="btn ghost small snd">🔊 Nghe</button></div>
        <figure class="wgart">${c.art ? iconSVG(c.art, "illu big") : ""}<figcaption>${c.word ? `<b lang="zh">${esc(c.word.w)}</b> (${esc(c.word.py)}) · ${esc(c.word.m)} — ` : ""}${esc(c.k)}</figcaption></figure>
        <details open><summary>Quy tắc viết</summary><ol class="wgrules">${c.r.map(r => `<li>${esc(r)}</li>`).join("")}</ol></details></div></div>`;
      W = board(true); const dh = $(".dots", wb); dots(dh, 0); let step = 0;
      $(".snd", wb).onclick = () => say(c.ch, "zh");
      const play = () => { if (!W) { s.learn = true; stageDone(); return; } cancelAuto(); step = 0; W.hideCharacter(); dots(dh, 0); let k = 0;
        const go = () => { if (tab !== "learn" || chars[ci] !== c) return; if (k >= N()) { msg("Xong mẫu. Bạn có thể bấm Viết lại để xem thêm.", "good"); const first = !s.learn; s.learn = true; header(); chips(); if (first) stageDone(); return; } W.animateStroke(k, { onComplete: () => { k++; dots(dh, k); setTimeout(go, 200); } }); }; go(); };
      $(".play", wb).onclick = play;
      $(".step", wb).onclick = () => { if (!W) return; cancelAuto(); if (step === 0) W.hideCharacter(); W.animateStroke(step); step++; dots(dh, step, true); msg(`Nét ${step}/${N()}`); if (step >= N()) { step = 0; if (!s.learn) { s.learn = true; header(); chips(); stageDone(); } } };
      setTimeout(play, 400);
      return;
    }
    const kind = tab, q = kind === "quiz", fr = kind === "free";
    const how = { trace: ["Hình mờ là nét sắp viết.", "Đặt ngón tay (hoặc chuột) vào đầu nét rồi kéo theo hình.", "Trượt 2 lần, nét đúng tự nháy để chỉ đường."], free: ["Không có hình mờ: tự nhớ thứ tự nét.", "Quên thì bấm 💡 Gợi ý: nét tiếp theo sẽ nháy lên.", "Trượt 3 lần, nét đúng cũng tự nháy."], quiz: ["Không hình mờ, không gợi ý, có tính giờ.", "Sai thứ tự hoặc sai chiều nét thì không tính.", "Viết xong là xong chữ này, trang tự sang chữ tiếp."] }[kind];
    wb.innerHTML = `<div class="wgrid">${left}<div class="wgr">
      <div class="wgstats"><div><b class="s1">0</b><span>nét xong</span></div><div><b class="s2">0</b><span>viết trượt</span></div><div><b class="s3">${q ? "0:00" : "–"}</b><span>${q ? "thời gian" : "điểm"}</span></div></div>
      <p class="wgstars"></p><p class="wgmsg">${q ? "Kiểm tra: tự viết cả chữ, không có gợi ý." : fr ? "Tự viết không có hình mờ. Quên nét nào thì bấm Gợi ý." : "Đặt ngón tay vào đầu nét mờ rồi kéo theo hình."}</p>
      <div class="row">${fr ? `<button type="button" class="btn ghost hint">💡 Gợi ý</button>` : ""}<button type="button" class="btn ghost again">↻ Làm lại</button><button type="button" class="btn ghost small grid" aria-pressed="true">Ô kẻ</button></div>
      <details><summary>Cách làm</summary><ol>${how.map(x => `<li>${x}</li>`).join("")}</ol></details></div></div>`;
    const dh = $(".dots", wb); let miss = 0, dn = 0, t0 = 0;
    const start = () => {
      if (timer) { clearInterval(timer); timer = null; }
      W = board(kind === "trace"); miss = 0; dn = 0; dots(dh, 0, true); $(".s1", wb).textContent = 0; $(".s2", wb).textContent = 0; $(".wgstars", wb).textContent = "";
      if (!W) { msg("Trình duyệt chưa vẽ được ô viết. Nhìn chữ và viết ra giấy."); s[kind] = true; return; }
      if (q) { t0 = Date.now(); timer = setInterval(() => { const x = Math.floor((Date.now() - t0) / 1000); $(".s3", wb).textContent = Math.floor(x / 60) + ":" + String(x % 60).padStart(2, "0"); }, 500); }
      W.quiz({ showHintAfterMisses: q ? false : fr ? 3 : 2, leniency: q ? 1.1 : 1.25,

        onCorrectStroke: d => { dn = N() - d.strokesRemaining; SC[ci].ok++; $(".s1", wb).textContent = dn; dots(dh, dn, true); msg(["Đúng rồi!", "Chuẩn nét!", "Tiếp tục nào!"][dn % 3], "good"); },

          msg(q ? `Xong kiểm tra! Trượt ${d.totalMistakes} lần, hết ${$(".s3", wb).textContent}.` : `Hoàn thành! Bạn được ${sc} điểm.`, "good");

    };
    start(); $(".again", wb).onclick = () => { cancelAuto(); start(); };
    const hb = $(".hint", wb); if (hb) hb.onclick = () => { if (W) { W.highlightStroke(dn, { duration: 900 }); msg("Nét đang nháy là nét tiếp theo."); } };

    const bc = p => p >= 90 ? "var(--green)" : p >= 70 ? "var(--sun)" : "var(--zh)";

      <p class="small muted">Chữ dưới 70% thì viết thêm vài lần trong workbook.</p></div>`;
  }
  box.querySelectorAll(".wgtabs button").forEach(b => b.onclick = () => { cancelAuto(); tab = b.dataset.t; draw(); });

    cancelAuto(); if (timer) clearInterval(timer);
    const good = SC.filter(s => s.qmiss === 0).length;
    finish({ total: chars.length, first: good, repair: 0, extra: `Luyện viết ${chars.length} chữ: ${chars.map(c => c.ch).join(" ")}` });
  };
  draw();
}

/* ---------- chuỗi ngày theo lịch, có "đóng băng" ---------- */
function calStreak() {
  const days = new Set(S.days || []); S.freezeUsed = S.freezeUsed || []; S.freeze = S.freeze || 0;
  const d = new Date(); let n = 0, changed = false;
  const iso = x => x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0");
  if (!days.has(iso(d))) d.setDate(d.getDate() - 1); /* hôm nay chưa học thì tính từ hôm qua */
  for (let i = 0; i < 400; i++) {
    const k = iso(d);
    if (days.has(k) || S.freezeUsed.includes(k)) n += days.has(k) ? 1 : 0;
    else if (S.freeze > 0 && n > 0) { S.freeze--; S.freezeUsed.push(k); changed = true; }
    else break;
    d.setDate(d.getDate() - 1);
  }
  if (changed) save();
  return n;
}

    <p class="small muted">Số liệu tham khảo, có ghi ngày. Nguồn: ${MARKET.sources.map(s => `<a href="${s[1]}" target="_blank" rel="noopener">${esc(s[0])}</a>`).join(" · ")}.</p>`;
}
function viewRoad(main) {
  const p = progL(S.lang), overall = Math.round(p.done / p.all * (HAS_COURSE ? CWEEKS.length : 1) / 16 * 1000) / 10;
  const phases = HAS_COURSE ? [["Tuần 1", "HSK1 · Chào hỏi, gia đình", "Chào hỏi, tên, quốc tịch, số đếm, tuổi, gia đình", "w1-thu-2"], ["Tuần 2", "HSK1 · Sinh hoạt hằng ngày", "Giờ giấc, bữa sáng, đồ vật, lớp học, ngày tháng", "w2-thu-2"], ["Tuần 3–4", "HSK1 · Mua sắm, công việc, thi thử", "Mua bán, công việc, thời tiết, sở thích, 2 đề thi thử HSK1"], ["Tuần 5–16", "HSK2 → HSK3", "Đi lại, du lịch, công việc; thi thử HSK2, HSK3"]]
    : [["Tuần 1–4", "Giao tiếp xã giao", "Chào hỏi, giới thiệu, hỏi han, hẹn gặp"], ["Tuần 5–8", "Việc hằng ngày ở công ty", "Đồng nghiệp, lịch làm việc, gọi điện, nhắn tin"], ["Tuần 9–12", "Trao đổi công việc", "Họp ngắn, báo cáo, hỏi lại, đề xuất"], ["Tuần 13–16", "Thuyết trình và phỏng vấn", "Giới thiệu dự án, phỏng vấn xin việc"]];
  main.appendChild(el(`<div class="roomv">
    ${roomHead("room-career", "Lộ trình & chứng chỉ", "Từ chào hỏi đến chứng chỉ thật", "16 tuần đầu đưa bạn tới giao tiếp công việc cơ bản (tương đương HSK3 và A2+). Sau đó là các chặng HSK4–5, B1–B2 và lớp ôn thi chuyên sâu.")}
    <section class="card2"><h2>16 tuần đầu</h2><ol class="phases">${phases.map((x, i) => { const open = x[3] || (!HAS_COURSE && i === 0); return `<li class="${open ? "on" : ""}"><small>${x[0]}</small><b>${x[1]}</b><span>${x[2]}</span>${open ? `<a class="btn primary small" href="#${x[3] || "trang-chu"}">${x[0]} đang mở</a>` : `<em>${ICON.lock} sắp mở</em>`}</li>`; }).join("")}</ol>
      <p class="small muted">Nội dung từng tuần sau đang được soạn; tên chủ đề có thể điều chỉnh.</p></section>
    <section class="card2 market"><h2>Trình độ và việc làm · ${langWord()}</h2>${ladderHTML(S.lang, overall)}</section></div>`));
}
function viewRewards(main) {
  S.redeemed = S.redeemed || [];
  main.appendChild(el(`<div class="roomv">
    ${roomHead("room-rewards", "Phòng đổi quà", `Bạn có ${fmtPts(S.points)} điểm`, "Quà chọn theo điều người đi làm thật sự cần: được chữa lỗi, được dùng tiếng thật, và tiến gần hơn tới công việc và chứng chỉ.")}
    ${REWARDS.map(g => `<section class="card2"><h2>${g.tier} <small class="muted">· ${g.sub}</small></h2><ul class="gifts">${g.items.map(it => {
      const can = S.points >= it.p, n = S.redeemed.filter(r => r.id === it.id).length, full = it.id === "freeze" && (S.freeze || 0) >= 2;
      return `<li><div><b>${esc(it.t)}</b><p>${esc(it.d)}</p><small class="why">${esc(it.why)}</small>${n ? `<small class="muted"> · đã đổi ${n} lần</small>` : ""}</div>
        <button type="button" class="btn ${can && !full ? "primary" : "ghost"} small rd" data-id="${it.id}" ${can && !full ? "" : "disabled"}>${ICON.star} ${fmtPts(it.p)}</button></li>`; }).join("")}</ul></section>`).join("")}
    ${S.redeemed.length ? `<section class="card2"><h2>Quà đã đổi</h2><ul class="codes">${S.redeemed.slice().reverse().map(r => `<li><b>${esc(r.t)}</b><code>${esc(r.code)}</code><small>${esc(r.date)}${r.auto ? " · đã kích hoạt" : " · đưa mã cho giáo viên hoặc host để nhận"}</small></li>`).join("")}</ul></section>` : ""}
    <p class="small muted">Quà (trừ đóng băng chuỗi) được CES xác nhận thủ công qua mã. Điểm lưu trên trình duyệt này.</p></div>`));
  main.querySelectorAll(".rd").forEach(btn => btn.onclick = () => {
    const it = REWARDS.flatMap(g => g.items).find(x => x.id === btn.dataset.id);
    if (!it || S.points < it.p) return;
    if (btn.dataset.confirm !== "1") { btn.dataset.confirm = "1"; btn.innerHTML = `Đổi ${fmtPts(it.p)} điểm?`; return; }
    S.points -= it.p; S.ledger.unshift({ t: "Đổi quà · " + it.t, p: -it.p });
    const code = "ATTC-" + it.id.slice(0, 3).toUpperCase() + "-" + Math.random().toString(36).slice(2, 6).toUpperCase();
    S.redeemed = S.redeemed || []; S.redeemed.push({ id: it.id, t: it.t, code, date: todayISO(), auto: !!it.auto });
    if (it.id === "freeze") S.freeze = (S.freeze || 0) + 1;
    save(); toast("Đã đổi: " + it.t); sfx("win"); render();
  });
}
function viewLive(main) {

  main.appendChild(el(`<div class="roomv">
    ${roomHead("room-live", "Thứ Bảy · Weekend Live", "Ba trạm, nói với người thật", "Mỗi trạm 4–6 người, một người nước ngoài và một host người Việt. Bạn dùng đúng những câu đã luyện trong tuần.")}
    <section class="card2"><h2>3 câu khoá mang theo</h2><ul class="keys2">${keys.map((s, i) => `<li><button type="button" class="btn sound small" data-k="${i}">${ICON.play}</button><span lang="${L === "zh" ? "zh" : "en"}">${esc(s.model)}</span><small>${esc(s.q)}</small></li>`).join("")}</ul>
      ${ready ? `<p class="donebanner">Bạn đã luyện xong 3 câu khoá. Sẵn sàng ra trạm!</p>` : `<a class="btn primary" href="#${HAS_COURSE ? weekDays(curWeek()).slice(-1)[0].id : "thu-6"}">Luyện 3 câu khoá ở Thứ 6</a>`}</section>
    <section class="card2"><h2>Chuẩn bị trước buổi</h2><ul class="facts">
      <li>Làm xong bài Thứ 6, nhất là bài hội thoại (3 câu khoá ở trên).</li>
      <li>Nếu chưa nghe kịp, dùng câu cứu cánh: ${L === "zh" ? "<b lang='zh'>请再说一遍。</b>" : "<b>Sorry, could you say that again?</b>"}</li>
      <li>Sau buổi, Chủ nhật bạn nhận phiếu nhận xét và sửa 3 câu đã nói sai.</li></ul>
      <p class="small muted">Lịch và địa điểm buổi Live được thông báo trong lớp nhóm.</p></section></div>`));
  main.querySelectorAll("[data-k]").forEach(b => b.onclick = () => say(keys[+b.dataset.k].model, L));
}

/* ---------- màn chào: chọn người hướng dẫn, chạm để bắt đầu ---------- */
function gate() {
  let started = false; try { started = sessionStorage.getItem("attc-started") === "1"; } catch (e) {}
  if (S.profile && started) return;
  const ov = el(`<div class="gate" role="dialog" aria-modal="true" aria-labelledby="gt"><div class="gcard"></div></div>`);
  document.body.appendChild(ov); const card = $(".gcard", ov);
  const done = kind => { try { sessionStorage.setItem("attc-started", "1"); } catch (e) {} ov.remove(); coachSay(kind, true); render(); };
  if (!S.profile) {
    card.innerHTML = `<p class="eyebrow">Anh – Trung Thực Chiến</p><h2 id="gt">Chào bạn! Mình làm quen chút nhé</h2>
      <label class="fl">Tên bạn<input class="inp" id="gname" autocomplete="given-name" placeholder="Ví dụ: Hà"></label>
      <fieldset class="fl"><legend>Bạn là</legend><div class="seg big"><button type="button" data-g="f">Nữ</button><button type="button" data-g="m">Nam</button></div></fieldset>
      <p class="small muted">Người hướng dẫn sẽ được chọn theo bạn; đổi lại được trong phòng Hướng dẫn.</p>
      <button type="button" class="btn primary huge" id="gnext" disabled>Tiếp tục</button>`;
    let g = null;
    card.querySelectorAll("[data-g]").forEach(b => b.onclick = () => { g = b.dataset.g; card.querySelectorAll("[data-g]").forEach(x => x.setAttribute("aria-pressed", x === b)); $("#gnext", card).disabled = false; });
    $("#gnext", card).onclick = () => {
      S.profile = { name: ($("#gname", card).value || "").trim() || "bạn", gender: g, coach: g === "m" ? "vy" : "khang" }; save();
      const c = coach();
      card.innerHTML = `${coachFace(120, "gface")}<p class="eyebrow">Người hướng dẫn của bạn</p><h2 id="gt">${esc(c.name)}</h2><p class="say">“${esc(c.lines.welcome)}”</p>
        <button type="button" class="btn primary huge" id="ggo">${ICON.play} Chạm để bắt đầu</button><p class="small muted">Bật loa để nghe ${esc(c.name)} nhé.</p>`;
      card.insertAdjacentHTML("beforeend", browserTip(false));
      $("#ggo", card).onclick = () => { S.seenWelcome = true; save(); done("welcome"); };
    };
  } else {
    const c = coach();
    card.innerHTML = `${coachFace(110, "gface")}<h2 id="gt">Chào ${esc((S.profile.name || "bạn").split(/\s+/).pop())}!</h2><p class="say">“${esc(c.lines.back)}”</p>
      <button type="button" class="btn primary huge" id="ggo">${ICON.play} Chạm để bắt đầu</button><p class="small muted">Bật loa để nghe ${esc(c.name)} hướng dẫn nhé.</p>`;
    card.insertAdjacentHTML("beforeend", browserTip(false));
    $("#ggo", card).onclick = () => done("back");
  }
  const f = card.querySelector("input,button"); if (f) setTimeout(() => f.focus(), 50);
}
