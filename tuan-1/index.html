],"a":0,"why":{"1":"Câu hỏi có 吗 cần trả lời 是/不是, không phải lời chào.","2":"不客气 chỉ dùng để đáp 谢谢."}},{"q":"HSK1 Đọc hiểu – chọn câu đáp phù hợp: 我很高兴认识你！","opts":["我也很高兴！","再见！","不客气。"],"a":0,"why":{"1":"再见 là tạm biệt; người ta đang nói vui được làm quen, nên đáp 'Tôi cũng rất vui!'.","2":"不客气 đáp lời cảm ơn; câu này không phải lời cảm ơn."}}],"shadow":[{"t":"知 吃 诗 日 · 资 次 思 · 机 七 西","py":"zhī chī shī rì · zī cì sī · jī qī xī","focus":"Đọc theo nhóm: zh ch sh r uốn lưỡi; z c s đầu lưỡi phẳng; j q x mặt lưỡi. c và q bật hơi mạnh."},{"t":"什么","py":"shénme","focus":"sh uốn lưỡi; 么 đọc nhẹ."},{"t":"名字","py":"míngzi","focus":"zi đọc 'z + ư', không đọc 'di'; 字 nhẹ."},{"t":"认识","py":"rènshi","focus":"r và sh đều uốn lưỡi; 识 đọc nhẹ."},{"t":"高兴","py":"gāoxìng","focus":"Thanh 1 + thanh 4; x mặt lưỡi, môi dẹt."},{"t":"很高兴。","py":"Hěn gāoxìng.","focus":"很 thanh 3 trước thanh 1 → chỉ đọc nửa thanh 3 (thấp, không vòng lên)."},{"t":"你叫什么名字？","py":"Nǐ jiào shénme míngzi?","focus":"Câu hỏi có 什么 không cần lên giọng ở cuối; giữ thanh của 字 nhẹ."},{"t":"我们很高兴认识你！","py":"Wǒmen hěn gāoxìng rènshi nǐ!","focus":"们 nhẹ; 很 nửa thanh 3; nhấn vào 高兴."}],"dialog":{"title":"Tiệc công ty: làm quen đồng nghiệp mới","partner":"王丽","turns":[{"ai":"你好！","py":"Nǐ hǎo!","vi":"Chào bạn!","model":"你好！","mpy":"Nǐ hǎo!","accept":["你好！","你好","你好。"],"frame":"你好！","hint":"Chào lại: ní hǎo."},{"ai":"你叫什么名字？","py":"Nǐ jiào shénme míngzi?","vi":"Bạn tên là gì?","model":"我叫阮安。你呢？","mpy":"Wǒ jiào Ruǎn Ān. Nǐ ne?","accept":["我叫阮安。你呢？","我叫阮安，你呢？","我叫阮安。","阮安。"],"frame":"我叫___。你呢？","hint":"Nói tên (mẫu là 阮安; có thể thay bằng tên bạn), rồi hỏi lại bằng 你呢？"},{"ai":"我叫王丽。","py":"Wǒ jiào Wáng Lì.","vi":"Mình tên Vương Lệ.","model":"很高兴认识你！","mpy":"Hěn gāoxìng rènshi nǐ!","accept":["很高兴认识你！","很高兴认识你","我很高兴认识你！","认识你很高兴！"],"frame":"很高兴___你！","hint":"Nói 'Rất vui được quen bạn!'"},{"ai":"我也很高兴认识你！再见！","py":"Wǒ yě hěn gāoxìng rènshi nǐ! Zàijiàn!","vi":"Mình cũng rất vui được quen bạn! Tạm biệt!","model":"再见！","mpy":"Zàijiàn!","accept":["再见！","再见","再见。"],"frame":"___！","hint":"Chào tạm biệt lại."}]},"reading":{"text":"你好！我叫王丽。他叫阮明。我们认识阮安。阮安，很高兴认识你！","py":"Nǐ hǎo! Wǒ jiào Wáng Lì. Tā jiào Ruǎn Míng. Wǒmen rènshi Ruǎn Ān. Ruǎn Ān, hěn gāoxìng rènshi nǐ!","vi":"Xin chào! Tôi tên Vương Lệ. Anh ấy tên Nguyễn Minh. Chúng tôi quen Nguyễn An. An ơi, rất vui được quen bạn!","qs":[{"q":"Người viết tên là gì?","opts":["王丽","阮明","阮安"],"a":0,"why":{"1":"阮明 là người được giới thiệu (他叫阮明), không phải người viết.","2":"阮安 là người mà họ quen; người viết là 我叫王丽."}},{"q":"Người đàn ông được giới thiệu (他) tên là gì?","opts":["阮明","阮安","王丽"],"a":0,"why":{"1":"阮安 là người họ quen; câu giới thiệu là 他叫阮明.","2":"王丽 là người viết (我叫王丽)."}},{"q":"Họ quen ai?","opts":["阮安","王经理"],"a":0,"why":{"1":"Bài không nhắc đến 王经理; câu là 我们认识阮安."}},{"q":"Đúng hay sai: 我们不认识阮安。","opts":["Đúng","Sai"],"a":1,"why":{"0":"Bài viết 我们认识阮安 (chúng tôi quen Nguyễn An), không có 不."}},{"q":"Người viết cảm thấy thế nào khi quen 阮安?","opts":["Rất vui (很高兴)","Không vui (不高兴)"],"a":0,"why":{"1":"Câu cuối là 很高兴认识你 — rất vui, không có 不."}}]}},{"id":"w1-thu-4","label":"Thứ 4","title":"Quốc tịch, ngôn ngữ, bạn bè","desc":"Hỏi và nói quốc tịch, nói mình biết tiếng Trung, giới thiệu bạn bè, đồng nghiệp và bạn cùng lớp tiếng Trung.","rule":"Hỏi quốc tịch: 你是哪国人？ (哪 + 国 + 人). 会 + động từ = biết làm (nhờ học). 都 đứng sau chủ ngữ, trước động từ: 我们都是学生.","cards":[{"w":"大家","py":"dàjiā","m":"mọi người","ex":"大家好！","expy":"Dàjiā hǎo!","exm":"Chào mọi người!","n":"⚠ Không phải 'đại gia' (người giàu)! Dùng để chào cả nhóm, cả lớp."},{"w":"看","py":"kàn","m":"nhìn, xem","ex":"看，她是我朋友。","expy":"Kàn, tā shì wǒ péngyou.","exm":"Nhìn này, đây là bạn tôi.","n":"看！ đứng một mình = 'Nhìn kìa!'. Thanh 4."},{"w":"她","py":"tā","m":"cô ấy, bạn ấy (nữ)","ex":"她是我朋友。","expy":"Tā shì wǒ péngyou.","exm":"Cô ấy là bạn tôi.","n":"Đọc giống hệt 他 (tā); chữ có bộ 女 (nữ) → chỉ nữ.","img":"she"},{"w":"他们","py":"tāmen","m":"họ, các bạn ấy","ex":"他们都说汉语。","expy":"Tāmen dōu shuō Hànyǔ.","exm":"Họ đều nói tiếng Trung.","n":"他 + 们. Nhóm có cả nam lẫn nữ cũng dùng 他们."},{"w":"朋友","py":"péngyou","m":"bạn, bạn bè","ex":"她是我朋友。","expy":"Tā shì wǒ péngyou.","exm":"Cô ấy là bạn tôi.","n":"友 đọc nhẹ. 我朋友 = bạn tôi (người sở hữu đứng trước)."},{"w":"同学","py":"tóngxué","m":"bạn cùng lớp, bạn học","ex":"我们是同学。","expy":"Wǒmen shì tóngxué.","exm":"Chúng tôi là bạn cùng lớp.","n":"Khác 朋友: 同学 là bạn học chung lớp/trường — ví dụ bạn cùng lớp tiếng Trung buổi tối ở công ty. Thanh 2 + thanh 2."},{"w":"学生","py":"xuéshēng","m":"học sinh, sinh viên, học viên","ex":"我是学生。","expy":"Wǒ shì xuéshēng.","exm":"Tôi là học viên (đang đi học).","n":"xué: viết u nhưng đọc ü (tròn môi) vì đứng sau x. Dùng cho học sinh, sinh viên và cả người đi làm đang theo một lớp học.","img":"student"},{"w":"中国人","py":"Zhōngguórén","m":"người Trung Quốc","ex":"王丽是中国人。","expy":"Wáng Lì shì Zhōngguórén.","exm":"Vương Lệ là người Trung Quốc.","n":"中国 Zhōngguó = Trung Quốc (国 = nước), 人 rén = người. Tên nước + 人 = người nước đó: 越南人 Yuènán rén = người Việt Nam.","img":"china"},{"w":"外国人","py":"wàiguórén","m":"người nước ngoài","ex":"我是外国人。","expy":"Wǒ shì wàiguórén.","exm":"Tôi là người nước ngoài.","n":"外 wài (ngoài) + 国 guó (nước) + 人 rén (người). Ở Trung Quốc, người Việt là 外国人; ở Việt Nam, đồng nghiệp Trung Quốc là 外国人."},{"w":"会","py":"huì","m":"biết (làm gì, nhờ học mà biết)","ex":"我会说汉语。","expy":"Wǒ huì shuō Hànyǔ.","exm":"Tôi biết nói tiếng Trung.","n":"⚠ Không phải 'hội họp'. 会 + động từ = có kỹ năng nhờ học. Phủ định: 不会 bú huì."},{"w":"说","py":"shuō","m":"nói","ex":"你会说汉语吗？","expy":"Nǐ huì shuō Hànyǔ ma?","exm":"Bạn biết nói tiếng Trung không?","n":"sh uốn lưỡi + uo. 说汉语 = nói tiếng Trung."},{"w":"汉语","py":"Hànyǔ","m":"tiếng Trung (tiếng Hán)","ex":"他们都说汉语。","expy":"Tāmen dōu shuō Hànyǔ.","exm":"Họ đều nói tiếng Trung.","n":"Hán ngữ. Thanh 4 + thanh 3; 语 cuối câu đọc đủ thanh 3."},{"w":"哪","py":"nǎ","m":"nào","ex":"你是哪国人？","expy":"Nǐ shì nǎ guó rén?","exm":"Bạn là người nước nào?","n":"Thanh 3. Đứng trước danh từ cần hỏi: 哪国人 = người nước nào."},{"w":"都","py":"dōu","m":"đều","ex":"我们都是学生。","expy":"Wǒmen dōu shì xuéshēng.","exm":"Chúng tôi đều là học viên.","n":"Đứng sau chủ ngữ số nhiều, trước động từ. 都我们… là sai."}],"scene":{"setting":"Cuối tuần, buổi giao lưu ngôn ngữ ở quán cà phê với đồng nghiệp và bạn nước ngoài. 王丽 giới thiệu 阮安 với cả nhóm; 阮明 nghe An nói tiếng Trung tốt quá nên tưởng cô là người Trung Quốc.","img":"room-live","imgPrompt":"Photo of a weekend language meetup in a café: a small group of Vietnamese adults (an, minh) and foreign friends (wangli) chatting and laughing around a table, blank name tags. No text in image.","lines":[{"who":"王丽","t":"大家好！看，她是我朋友！","py":"Dàjiā hǎo! Kàn, tā shì wǒ péngyou!","vi":"Chào mọi người! Nhìn này, đây là bạn mình!"},{"who":"阮安","t":"大家好！我叫阮安。","py":"Dàjiā hǎo! Wǒ jiào Ruǎn Ān.","vi":"Chào mọi người! Mình tên là Nguyễn An."},{"who":"阮明","t":"你好，阮安！你是中国人吗？","py":"Nǐ hǎo, Ruǎn Ān! Nǐ shì Zhōngguórén ma?","vi":"Chào An! Bạn là người Trung Quốc à? (vì An nói tiếng Trung rất tự nhiên)"},{"who":"阮安","t":"不是，我是越南人。你是哪国人？","py":"Bú shì, wǒ shì Yuènán rén. Nǐ shì nǎ guó rén?","vi":"Không, mình là người Việt Nam. (越南 Yuènán = Việt Nam) Bạn là người nước nào?"},{"who":"阮明","t":"我也是越南人。王丽是中国人，是外国人。","py":"Wǒ yě shì Yuènán rén. Wáng Lì shì Zhōngguórén, shì wàiguórén.","vi":"Mình cũng là người Việt Nam. Vương Lệ là người Trung Quốc — ở đây chị ấy là người nước ngoài."},{"who":"王丽","t":"你们都会说汉语吗？","py":"Nǐmen dōu huì shuō Hànyǔ ma?","vi":"Hai bạn đều biết nói tiếng Trung à?"},{"who":"阮安","t":"会！我是学生。","py":"Huì! Wǒ shì xuéshēng.","vi":"Biết chứ! Mình là học viên (lớp tiếng Trung buổi tối của công ty)."},{"who":"阮明","t":"我也是学生！我们是同学，也是朋友！","py":"Wǒ yě shì xuéshēng! Wǒmen shì tóngxué, yě shì péngyou!","vi":"Mình cũng học lớp đó! Vậy bọn mình là bạn cùng lớp, cũng là bạn bè!"}]},"patterns":[{"t":"Hỏi quốc tịch: 你是哪国人？","f":[["你是","哪","国人？"],["我是","越南","人。"]],"ex":[["你是哪国人？","Bạn là người nước nào?"],["我是越南人。","Tôi là người Việt Nam."],["她是中国人。","Cô ấy là người Trung Quốc."]],"bad":"你是国人哪？","good":"你是哪国人？","why":"哪 (nào) đứng TRƯỚC danh từ nó hỏi: 哪国 = nước nào. Khi trả lời, thay 哪国 bằng tên nước: 越南人, 中国人."},{"t":"会 + động từ: biết làm (nhờ học)","f":[["我","会","说汉语"],["我","不会","说汉语"]],"ex":[["我会说汉语。","Tôi biết nói tiếng Trung."],["她不会说汉语。","Cô ấy không biết nói tiếng Trung."]],"bad":"我会不说汉语。","good":"我不会说汉语。","why":"Phủ định đặt 不 trước 会: 不会 (bú huì) = không biết. 会不说 lại thành 'biết không nói' — sai nghĩa."},{"t":"都 đứng sau chủ ngữ số nhiều","f":[["我们","都","是学生"],["他们","都","说汉语"]],"ex":[["我们都是学生。","Chúng tôi đều là học viên."],["他们都是中国人。","Họ đều là người Trung Quốc."]],"bad":"都他们是中国人。","good":"他们都是中国人。","why":"都 là phó từ: đứng sau chủ ngữ (một nhóm người), trước động từ. Tiếng Việt 'họ ĐỀU là…' cũng cùng vị trí."}],"vocab":[{"q":"中国人 (Zhōngguórén) nghĩa là gì?","opts":["người Trung Quốc","tiếng Trung","người nước ngoài"],"a":0,"why":{"1":"Tiếng Trung là 汉语 (Hànyǔ); 人 trong 中国人 là 'người'.","2":"Người nước ngoài là 外国人 (wàiguórén)."}},{"q":"外国人 (wàiguórén) nghĩa là gì?","opts":["người nước ngoài","người Trung Quốc","bạn cùng lớp"],"a":0,"why":{"1":"Người Trung Quốc là 中国人 (Zhōngguórén); 外 = ngoài.","2":"Bạn cùng lớp là 同学 (tóngxué)."}},{"q":"汉语 (Hànyǔ) nghĩa là gì?","opts":["tiếng Trung","người Trung Quốc","nói"],"a":0,"why":{"1":"Người Trung Quốc là 中国人.","2":"'Nói' là 说 (shuō)."}},{"q":"'Bạn cùng lớp' là từ nào?","opts":["同学","朋友"],"a":0,"why":{"1":"朋友 là bạn bè nói chung, không nhất thiết học cùng lớp."}},{"q":"大家 (dàjiā) nghĩa là gì?","opts":["mọi người","đại gia, người giàu","nhà to"],"a":0,"why":{"1":"⚠ Bẫy Hán Việt! 大家 không phải 'đại gia'. 大家好！ = Chào mọi người!","2":"Từng chữ là 大 (to) + 家 (nhà), nhưng 大家 là một từ = mọi người."}},{"q":"'Cô ấy' viết là chữ nào?","opts":["他","她"],"a":1,"why":{"0":"他 (bộ 亻 nhân đứng) = anh ấy. 她 có bộ 女 (nữ) = cô ấy. Hai chữ đọc giống nhau: tā."}},{"q":"Điền: 你会___汉语吗？(Bạn biết nói tiếng Trung không?)","opts":["说","看","是"],"a":0,"why":{"1":"看 là 'xem/nhìn'; câu cần nghĩa 'nói'.","2":"会 cần một động từ hành động đi sau; 会是汉语 vô nghĩa."}},{"q":"Điền: 我们___是学生。(Chúng tôi đều là học viên.)","opts":["都","也","哪"],"a":0,"why":{"1":"也 = cũng; 我们也是学生 là 'chúng tôi cũng là học viên' — khác nghĩa 'đều'.","2":"哪 = nào, dùng để hỏi, không dùng trong câu kể."}}],"grammar":[{"k":"type","q":"Điền: 你是___国人？(Bạn là người nước nào?)","model":"哪","accept":["哪","na"],"why":"哪国人 = người nước nào; 哪 đứng trước 国."},{"q":"Trả lời 你是哪国人？ (bạn là người Việt Nam):","opts":["我是越南人。","我是哪越南人。","我越南是人。"],"a":0,"why":{"1":"Khi trả lời, thay 哪国 bằng tên nước, bỏ hẳn 哪.","2":"Sai trật tự: 我 + 是 + 越南人."}},{"k":"type","q":"Điền: 我___说汉语。(Tôi biết nói tiếng Trung.)","model":"会","accept":["会","hui"],"why":"会 + động từ = biết làm (nhờ học): 会说汉语."},{"q":"Phủ định câu 我会说汉语。 Câu đúng là?","opts":["我不会说汉语。","我会不说汉语。","不我会说汉语。"],"a":0,"why":{"1":"不 phải đứng trước 会 (不会 = không biết); 会不说 thành 'biết không nói', sai nghĩa.","2":"不 không đứng trước chủ ngữ."}},{"q":"Sắp xếp thành câu đúng: 都 / 我们 / 学生 / 是","opts":["我们都是学生。","都我们是学生。","我们是都学生。"],"a":0,"why":{"1":"都 không đứng trước chủ ngữ; nó đứng sau 我们.","2":"都 phải đứng trước động từ 是, không chen giữa 是 và 学生."}},{"q":"Trả lời ngắn câu 你会说汉语吗？ (bạn biết):","opts":["会。","是。","说。"],"a":0,"why":{"1":"Câu hỏi với 会 thì trả lời bằng chính 会 / 不会; 是 chỉ dùng cho câu hỏi với 是.","2":"Trả lời ngắn lặp lại động từ năng nguyện 会, không lặp 说."}},{"q":"Câu nào đúng?","opts":["她是我朋友。","她是朋友我。"],"a":0,"why":{"1":"Người sở hữu đứng TRƯỚC: 我朋友 = bạn của tôi (ngược với tiếng Việt 'bạn tôi')."}}],"listen":[{"q":"Người nói là người nước nào?","audio":"我是中国人。","opts":["Người Trung Quốc","Người Việt Nam","Người nước ngoài"],"a":0,"why":{"1":"Không nghe thấy 越南 (Yuènán); nghe được 中国人 (Zhōngguórén).","2":"Người nước ngoài là 外国人 (wài…); nghe được 中国人 (Zhōng…)."}},{"q":"Cô ấy là ai?","audio":"她是外国人。","opts":["Người nước ngoài","Người Trung Quốc","Bạn cùng lớp"],"a":0,"why":{"1":"Nghe được wàiguórén (外国人), không phải Zhōngguórén.","2":"Bạn cùng lớp là 同学 (tóngxué) — không có trong câu."}},{"q":"Người nói biết làm gì?","audio":"我会说汉语。","opts":["Nói tiếng Trung","Nói tiếng Việt","Không biết nói tiếng Trung"],"a":0,"why":{"1":"Nghe được 汉语 (Hànyǔ) = tiếng Trung.","2":"Không có 不 trước 会; câu là 我会说汉语."}},{"q":"Họ là ai?","audio":"他们都是学生。","opts":["Đều là học viên/sinh viên","Đều là người Trung Quốc","Là bạn của tôi"],"a":0,"why":{"1":"Không nghe thấy 中国人; nghe được 学生 (xuéshēng).","2":"Không có 朋友 (péngyou) trong câu."}},{"q":"Người nói chào ai?","audio":"大家好！","opts":["Mọi người","Một người bạn","Cấp trên hoặc người lớn tuổi"],"a":0,"why":{"1":"Chào một người bạn sẽ là 你好 (nǐ hǎo).","2":"Chào cấp trên, người lớn tuổi là 您好 (nín hǎo); ở đây là 大家好 = chào cả nhóm."}},{"q":"Cô ấy là ai của người nói?","audio":"她是我同学。","opts":["Bạn cùng lớp","Bạn bè","Mẹ"],"a":0,"why":{"1":"Bạn bè là 朋友 (péngyou); nghe được 同学 (tóngxué).","2":"Mẹ là 妈妈 (māma)."}},{"q":"Người nói hỏi gì?","audio":"你是哪国人？","opts":["Quốc tịch","Tên","Có biết tiếng Trung không"],"a":0,"why":{"1":"Hỏi tên là 你叫什么名字; ở đây nghe được 哪国人.","2":"Hỏi biết tiếng Trung là 你会说汉语吗; ở đây không có 会/说."}}],"hsk":[{"q":"HSK1 Đọc hiểu – chọn từ điền vào chỗ trống: 你是（ ）国人？","opts":["哪","都","会","叫"],"a":0,"why":{"1":"都 = đều, không dùng để hỏi.","2":"会 = biết, phải đi trước một động từ.","3":"叫 = tên là; 叫国人 vô nghĩa."}},{"q":"HSK1 Đọc hiểu – chọn từ điền vào chỗ trống: 你会（ ）汉语吗？","opts":["说","哪","朋友"],"a":0,"why":{"1":"Câu đã có 吗 để hỏi; không cần thêm từ hỏi 哪.","2":"Sau 会 cần một động từ, 朋友 là danh từ."}},{"q":"HSK1 Đọc hiểu – chọn từ điền vào chỗ trống: 我们（ ）是学生。","opts":["都","说","叫"],"a":0,"why":{"1":"Câu đã có động từ 是; 说是学生 vô nghĩa.","2":"叫 + tên; 叫是 là hai động từ dính nhau."}},{"q":"HSK1 Đọc hiểu – chọn từ điền vào chỗ trống: 她是我（ ）。","opts":["朋友","会","都"],"a":0,"why":{"1":"Sau 是我 cần một danh từ (bạn của tôi); 会 là động từ.","2":"都 là phó từ, phải đứng trước động từ, không đứng cuối câu."}},{"q":"HSK1 Đọc hiểu – chọn từ điền vào chỗ trống: 她（ ）说汉语吗？","opts":["会","叫","哪"],"a":0,"why":{"1":"叫 + tên; 叫说 vô nghĩa.","2":"Câu đã có 吗 để hỏi; không dùng thêm từ hỏi 哪."}}],"shadow":[{"t":"中国","py":"Zhōngguó","focus":"zh uốn lưỡi; thanh 1 + thanh 2."},{"t":"汉语","py":"Hànyǔ","focus":"Thanh 4 + thanh 3; 语 cuối câu đọc đủ thanh 3."},{"t":"学生","py":"xuéshēng","focus":"xué = x + üe: viết u nhưng đọc ü, tròn môi."},{"t":"同学","py":"tóngxué","focus":"Hai thanh 2 liền nhau, đều đi lên."},{"t":"说汉语","py":"shuō Hànyǔ","focus":"shuō: sh uốn lưỡi, không đọc 'suô'."},{"t":"不会","py":"bú huì","focus":"不 đứng trước thanh 4 → bú."},{"t":"你是哪国人？","py":"Nǐ shì nǎ guó rén?","focus":"哪 thanh 3 (nǎ), đừng đọc thành 那 nà (thanh 4)."},{"t":"我会说汉语。","py":"Wǒ huì shuō Hànyǔ.","focus":"我 thanh 3 trước thanh 4 → chỉ đọc nửa thanh 3 (thấp)."}],"dialog":{"title":"Gặp bạn mới ở quán cà phê sau giờ làm","partner":"王丽","turns":[{"ai":"大家好！你好！","py":"Dàjiā hǎo! Nǐ hǎo!","vi":"Chào mọi người! Chào bạn!","model":"你好！","mpy":"Nǐ hǎo!","accept":["你好！","你好","你好。"],"frame":"你好！","hint":"Chào lại bạn ấy."},{"ai":"你是哪国人？","py":"Nǐ shì nǎ guó rén?","vi":"Bạn là người nước nào?","model":"我是越南人。","mpy":"Wǒ shì Yuènán rén.","accept":["我是越南人。","我是越南人","越南人。","越南。"],"frame":"我是___人。","hint":"越南 Yuènán = Việt Nam (tên nước, ngoài HSK1)."},{"ai":"你会说汉语吗？","py":"Nǐ huì shuō Hànyǔ ma?","vi":"Bạn biết nói tiếng Trung không?","model":"会，我会说汉语。","mpy":"Huì, wǒ huì shuō Hànyǔ.","accept":["会，我会说汉语。","我会说汉语。","会。","会"],"frame":"会，我会___汉语。","hint":"Trả lời bằng 会 (biết)."},{"ai":"她是你朋友吗？","py":"Tā shì nǐ péngyou ma?","vi":"Chị kia là bạn của bạn à?","model":"是，我们是同学。","mpy":"Shì, wǒmen shì tóngxué.","accept":["是，我们是同学。","我们是同学。","是。","是，她是我朋友。","是，她是我同学。"],"frame":"是，我们是___。","hint":"Tưởng tượng chị ngồi cạnh bạn là bạn cùng lớp tiếng Trung buổi tối: 'Ừ, bọn mình là bạn cùng lớp.'"}]},"reading":{"text":"大家好！我叫阮安，是外国人。我会说汉语。阮明是我同学，也是我朋友。我们都是学生。","py":"Dàjiā hǎo! Wǒ jiào Ruǎn Ān, shì wàiguórén. Wǒ huì shuō Hànyǔ. Ruǎn Míng shì wǒ tóngxué, yě shì wǒ péngyou. Wǒmen dōu shì xuéshēng.","vi":"(An tự giới thiệu trong nhóm chat của các đồng nghiệp Trung Quốc) Chào mọi người! Tôi tên là Nguyễn An, là người nước ngoài. Tôi biết nói tiếng Trung. Nguyễn Minh là bạn cùng lớp của tôi, cũng là bạn của tôi. Chúng tôi đều là học viên.","qs":[{"q":"阮安 có phải người Trung Quốc không?","opts":["Không, cô ấy là người nước ngoài","Phải, cô ấy là người Trung Quốc"],"a":0,"why":{"1":"Bài viết 是外国人 (là người nước ngoài), không phải 中国人."}},{"q":"Đúng hay sai: 阮安不会说汉语。","opts":["Đúng","Sai"],"a":1,"why":{"0":"Bài viết 我会说汉语 — 阮安 biết nói tiếng Trung, không có 不."}},{"q":"阮明 là gì của 阮安?","opts":["Bạn cùng lớp và cũng là bạn","Chỉ là bạn cùng lớp","Anh trai"],"a":0,"why":{"1":"Câu 阮明是我同学，也是我朋友 có 也 (cũng): vừa là bạn cùng lớp, vừa là bạn.","2":"Bài không nói 阮明 là anh trai — hai người chỉ trùng họ 阮 (Nguyễn)."}},{"q":"Họ đều là gì?","opts":["Học viên (学生)","Người Trung Quốc","Người nước ngoài"],"a":0,"why":{"1":"阮安 là người nước ngoài nên họ không 'đều là người Trung Quốc'. Bài viết 我们都是学生.","2":"Chỉ nói 阮安 là người nước ngoài; câu có 都 nói về 学生."}},{"q":"Câu đầu 大家好！ nói với ai?","opts":["Mọi người","Một người bạn"],"a":0,"why":{"1":"Chào một người bạn sẽ là 你好; 大家 = mọi người."}}]}},{"id":"w1-thu-5","label":"Thứ 5","title":"Số đếm, hỏi tuổi","desc":"Đếm 1–99, hỏi và nói tuổi (của mình, đồng nghiệp, con của đồng nghiệp), nói bé học tiểu học hay trung học.","rule":"Nói tuổi không cần 是: 我二十六岁 (không nói 我是二十六岁). Hỏi trẻ dưới 10 tuổi dùng 几岁, hỏi người lớn hơn dùng 多大; 了 cuối câu = 'rồi / nữa' (có thay đổi).","cards":[{"w":"一 二 三 四 五","py":"yī èr sān sì wǔ","m":"1, 2, 3, 4, 5","ex":"一、二、三、四、五！","expy":"Yī, èr, sān, sì, wǔ!","exm":"Một, hai, ba, bốn, năm!","n":"四 sì (s phẳng, thanh 4) — đừng lẫn với 十 shí (10). 一 đứng một mình đọc yī."},{"w":"六 七 八 九","py":"liù qī bā jiǔ","m":"6, 7, 8, 9","ex":"六、七、八、九！","expy":"Liù, qī, bā, jiǔ!","exm":"Sáu, bảy, tám, chín!","n":"七 qī: q bật hơi mạnh. 九 jiǔ thanh 3."},{"w":"十","py":"shí","m":"10, mười","ex":"十二、二十、九十九","expy":"shí'èr, èrshí, jiǔshíjiǔ","exm":"12, 20, 99","n":"Ghép số như tiếng Việt: 十二 = 12, 二十 = 20, 二十九 = 29. shí uốn lưỡi, thanh 2 ≠ 四 sì."},{"w":"几","py":"jǐ","m":"mấy (hỏi số nhỏ)","ex":"小天几岁了？","expy":"Xiǎotiān jǐ suì le?","exm":"Bé Thiên mấy tuổi rồi?","n":"Hỏi số lượng nhỏ (thường dưới 10): hỏi tuổi trẻ con — ví dụ con của đồng nghiệp — dùng 几岁."},{"w":"岁","py":"suì","m":"tuổi","ex":"我二十六岁。","expy":"Wǒ èrshíliù suì.","exm":"Tôi hai mươi sáu tuổi.","n":"Số + 岁, không cần 是. s phẳng; uì đọc gần 'uây'."},{"w":"多","py":"duō","m":"nhiều; bao (nhiêu)","ex":"你多大了？","expy":"Nǐ duō dà le?","exm":"Bạn bao nhiêu tuổi rồi?","n":"多 + tính từ để hỏi mức độ: 多大 = bao nhiêu tuổi (hỏi người từ ~10 tuổi trở lên, đồng nghiệp ngang tuổi). Với cấp trên lớn tuổi, hỏi tuổi thẳng dễ bị coi là bất lịch sự."},{"w":"大","py":"dà","m":"to, lớn; (tuổi) lớn","ex":"阮明，你多大了？","expy":"Ruǎn Míng, nǐ duō dà le?","exm":"Minh ơi, anh bao nhiêu tuổi rồi?","n":"Trái nghĩa với 小. Nhớ: 大家 là 'mọi người', không phải 'nhà to'."},{"w":"小","py":"xiǎo","m":"nhỏ, bé","ex":"我不小了！","expy":"Wǒ bù xiǎo le!","exm":"Tôi không còn nhỏ nữa đâu!","n":"小 + họ/tên = gọi thân mật: 小天 (bé Thiên). Ở công ty Trung Quốc, sếp hay gọi nhân viên trẻ là 小 + họ: 小阮 (cậu/em Nguyễn). 不 trước thanh 3 giữ nguyên bù."},{"w":"了","py":"le","m":"rồi, nữa (trợ từ cuối câu)","ex":"他六岁了。","expy":"Tā liù suì le.","exm":"Bé sáu tuổi rồi.","n":"Cuối câu báo sự thay đổi/tình huống mới: 我不小了 = Tôi không còn nhỏ NỮA. Đọc nhẹ."},{"w":"今年","py":"jīnnián","m":"năm nay","ex":"我今年二十六岁。","expy":"Wǒ jīnnián èrshíliù suì.","exm":"Năm nay tôi hai mươi sáu tuổi.","n":"Từ chỉ thời gian đứng sau chủ ngữ (hoặc đầu câu), trước tuổi."},{"w":"明年","py":"míngnián","m":"năm sau, sang năm","ex":"我明年二十七岁。","expy":"Wǒ míngnián èrshíqī suì.","exm":"Sang năm tôi hai mươi bảy tuổi.","n":"Thanh 2 + thanh 2. Đối lập với 今年 (năm nay)."},{"w":"小学生","py":"xiǎoxuéshēng","m":"học sinh tiểu học","ex":"小天是小学生。","expy":"Xiǎotiān shì xiǎoxuéshēng.","exm":"Bé Thiên (con của chị Vương Lệ) là học sinh tiểu học.","n":"小 (tiểu) + 学生. xué đọc ü tròn môi."},{"w":"中学生","py":"zhōngxuéshēng","m":"học sinh trung học (cấp 2, cấp 3)","ex":"我不是中学生了！","expy":"Wǒ bú shì zhōngxuéshēng le!","exm":"Tôi đâu còn là học sinh trung học nữa!","n":"中 (trung) + 学生. zh uốn lưỡi.","img":"student"}],"scene":{"setting":"Giờ giải lao bên máy pha cà phê. 王丽 trêu 阮安 trông trẻ như học sinh, rồi khoe ảnh sinh nhật của con trai — bé 小天 — trên điện thoại.","img":"colleague","imgPrompt":"Photo of two colleagues, an and wangli, chatting and laughing next to the coffee machine in the office kitchen during a break. No text or numbers in image.","lines":[{"who":"王丽","t":"阮安，你多大了？你很小，是中学生吗？","py":"Ruǎn Ān, nǐ duō dà le? Nǐ hěn xiǎo, shì zhōngxuéshēng ma?","vi":"An ơi, em bao nhiêu tuổi rồi? Trông em trẻ quá, học sinh trung học à? (đùa)"},{"who":"阮安","t":"不是！我不小了！我今年二十六岁。你呢？","py":"Bú shì! Wǒ bù xiǎo le! Wǒ jīnnián èrshíliù suì. Nǐ ne?","vi":"Đâu có! Em không còn nhỏ nữa! Năm nay em hai mươi sáu tuổi. Còn chị?"},{"who":"王丽","t":"我也二十六岁。","py":"Wǒ yě èrshíliù suì.","vi":"Chị cũng hai mươi sáu."},{"who":"阮安","t":"小天呢？小天几岁了？","py":"Xiǎotiān ne? Xiǎotiān jǐ suì le?","vi":"Còn bé Thiên? Bé mấy tuổi rồi?"},{"who":"王丽","t":"看！一、二、三、四、五、六！六岁了！","py":"Kàn! Yī, èr, sān, sì, wǔ, liù! Liù suì le!","vi":"Nhìn này! (đếm nến trên bánh sinh nhật trong ảnh) Một, hai, ba, bốn, năm, sáu! Sáu tuổi rồi!"},{"who":"阮安","t":"六岁？他是小学生吗？","py":"Liù suì? Tā shì xiǎoxuéshēng ma?","vi":"Sáu tuổi à? Bé học tiểu học chưa?"},{"who":"王丽","t":"是，他是小学生。明年七岁！","py":"Shì, tā shì xiǎoxuéshēng. Míngnián qī suì!","vi":"Rồi, bé là học sinh tiểu học. Sang năm bảy tuổi!"},{"who":"阮安","t":"好！小天六岁了！","py":"Hǎo! Xiǎotiān liù suì le!","vi":"Hay quá! Bé Thiên sáu tuổi rồi!"}]},"patterns":[{"t":"Nói tuổi: chủ ngữ + số + 岁 (không cần 是)","f":[["我","二十六","岁"],["小天","六","岁"]],"ex":[["我二十六岁。","Tôi hai mươi sáu tuổi."],["我今年二十六岁。","Năm nay tôi hai mươi sáu tuổi."]],"bad":"我是二十六岁。","good":"我二十六岁。","why":"Khi vị ngữ là số tuổi, tiếng Trung không dùng 是 — giống tiếng Việt 'Tôi hai mươi sáu tuổi' (không nói 'tôi là hai mươi sáu tuổi')."},{"t":"Hỏi tuổi: 几岁 (trẻ nhỏ) / 多大 (người lớn hơn)","f":[["你","几","岁了？"],["你","多大","了？"]],"ex":[["小天，你几岁了？","Bé Thiên, con mấy tuổi rồi?"],["阮明，你多大了？","Minh ơi, anh bao nhiêu tuổi rồi?"]],"bad":"你几大了？","good":"你多大了？","why":"几 đi với 岁 (几岁), 多 đi với 大 (多大). Không trộn thành 几大 hay 多岁."},{"t":"了 cuối câu: có thay đổi, tình huống mới","f":[["我","不小","了"],["他","六岁","了"]],"ex":[["我不小了！","Tôi không còn nhỏ nữa!"],["他今年六岁了。","Năm nay bé sáu tuổi rồi."]],"bad":"我不小！","good":"我不小了！","why":"我不小 chỉ là 'tôi không nhỏ'. Muốn nói 'không còn nhỏ NỮA' (đã thay đổi so với trước) phải thêm 了 cuối câu."},{"t":"Ghép số 11–99","f":[["十","二","= 12"],["二","十","= 20"],["九十","九","= 99"]],"ex":[["十八","18"],["二十九","29"],["七十三","73"]],"bad":"四十 (để nói 14)","good":"十四","why":"Số hàng chục đứng TRƯỚC 十, số đơn vị đứng SAU: 十四 = 14, 四十 = 40. Đảo thứ tự là ra số khác — giống 'mười bốn' và 'bốn mươi'."}],"vocab":[{"q":"Viết 18 bằng chữ Hán:","opts":["十八","八十","一八"],"a":0,"why":{"1":"八十 = 80 (tám chục).","2":"Không ghép chữ số rời như vậy; 18 = 十 (mười) + 八 (tám)."}},{"q":"29 viết là?","opts":["二十九","九十二","二九"],"a":0,"why":{"1":"九十二 = 92 (chín chục hai).","2":"Thiếu 十: phải là 二 + 十 + 九."}},{"q":"73 viết là?","opts":["七十三","三十七","七三十"],"a":0,"why":{"1":"三十七 = 37.","2":"Sai thứ tự: hàng chục 七十, rồi đơn vị 三."}},{"q":"Hỏi tuổi đứa con 5 tuổi của đồng nghiệp, dùng?","opts":["几岁","多大"],"a":0,"why":{"1":"多大 dùng cho người từ khoảng 10 tuổi trở lên; trẻ nhỏ dưới 10 tuổi hỏi bằng 几岁."}},{"q":"Hỏi tuổi bạn bè hay đồng nghiệp ngang tuổi, dùng?","opts":["多大","几岁"],"a":0,"why":{"1":"几 hỏi số nhỏ (dưới 10) — hỏi người lớn bằng 几岁 nghe như coi họ là trẻ con."}},{"q":"今年 / 明年 nghĩa là?","opts":["năm nay / năm sau","năm sau / năm nay","năm ngoái / năm nay"],"a":0,"why":{"1":"Ngược rồi: 今年 (jīnnián) là năm nay, 明年 (míngnián) là năm sau.","2":"明年 là năm sau, không phải năm ngoái."}},{"q":"小学生 (xiǎoxuéshēng) nghĩa là?","opts":["học sinh tiểu học","học sinh trung học","sinh viên đại học"],"a":0,"why":{"1":"Học sinh trung học là 中学生 (zhōng = trung).","2":"小 = tiểu (nhỏ) → tiểu học, không phải đại học."}},{"q":"Từ trái nghĩa của 大 (dà) là?","opts":["小","多","几"],"a":0,"why":{"1":"多 là 'nhiều', trái nghĩa với 'ít', không phải với 'to'.","2":"几 là 'mấy', từ để hỏi."}}],"grammar":[{"q":"Bé Thiên trả lời câu 你几岁了？ (6 tuổi):","opts":["我六岁了。","我是六岁了。","我岁六了。"],"a":0,"why":{"1":"Nói tuổi không dùng 是.","2":"Số đứng TRƯỚC 岁: 六岁."}},{"k":"type","q":"Điền: 你___大了？(hỏi tuổi một đồng nghiệp)","model":"多","accept":["多","duo"],"why":"Hỏi tuổi người từ khoảng 10 tuổi trở lên: 你多大了？ (多 + 大)."},{"k":"type","q":"Điền: 你___岁了？(hỏi đứa con 5 tuổi của đồng nghiệp)","model":"几","accept":["几","ji"],"why":"Hỏi tuổi trẻ dưới 10 tuổi: 你几岁了？ (几 + 岁)."},{"q":"Dịch: Tôi không còn nhỏ nữa!","opts":["我不小了！","我是不小！","我不了小！"],"a":0,"why":{"1":"Không dùng 是 trước tính từ, 不 phải đứng ngay trước 小, và thiếu 了 thì mất nghĩa 'nữa'.","2":"了 đứng CUỐI câu, không chen giữa 不 và 小."}},{"q":"Dịch: Sang năm tôi hai mươi bảy tuổi.","opts":["我明年二十七岁。","我是明年二十七岁。","明年二十七岁我。"],"a":0,"why":{"1":"Nói tuổi không dùng 是.","2":"Chủ ngữ 我 không đứng cuối câu; trật tự: 我 + 明年 + 二十七岁."}},{"q":"Sắp xếp thành câu đúng: 二十六岁 / 今年 / 我","opts":["我今年二十六岁。","二十六岁我今年。","我二十六岁今年。"],"a":0,"why":{"1":"Tuổi là vị ngữ, phải đứng sau chủ ngữ, không đứng đầu câu.","2":"Từ thời gian 今年 đứng TRƯỚC tuổi, không đứng cuối câu như tiếng Việt."}},{"q":"Ở công ty, giám đốc Vương gọi An là 小阮 (Xiǎo Ruǎn). Chữ 小 đứng trước họ có tác dụng gì?","opts":["Gọi thân mật (như 'em Nguyễn', 'cậu Nguyễn')","Nói An là học sinh tiểu học","Nói An rất thấp"],"a":0,"why":{"1":"Học sinh tiểu học là cả từ 小学生; 小 + họ/tên chỉ là cách gọi thân mật người trẻ hơn.","2":"小 + họ/tên không miêu tả chiều cao; đó là cách gọi thân mật."}}],"listen":[{"q":"Người nói bao nhiêu tuổi?","audio":"我二十九岁。","opts":["29","30","28"],"a":0,"why":{"1":"30 là 三十 (sānshí); nghe được èrshíjiǔ = 29.","2":"28 là 二十八 (èrshíbā); chữ cuối nghe được là jiǔ = 9."}},{"q":"Cậu bé (con của đồng nghiệp) năm nay bao nhiêu tuổi?","audio":"他今年十二岁了。","opts":["12","20","2"],"a":0,"why":{"1":"20 là 二十 (èrshí, 二 đứng trước 十); nghe được shí'èr.","2":"Nghe được 十 (shí) trước 二 → 12, không phải 2."}},{"q":"Năm nay người nói mấy tuổi?","audio":"我明年三十岁。","opts":["29","30","31"],"a":0,"why":{"1":"30 là tuổi NĂM SAU (明年 míngnián), không phải năm nay.","2":"Năm sau mới 30 tuổi, nên năm nay là 29, không thể là 31."}},{"q":"Người nói hỏi gì?","audio":"你多大了？","opts":["Tuổi","Tên","Quốc tịch"],"a":0,"why":{"1":"Hỏi tên là 你叫什么名字; nghe được 多大 = bao nhiêu tuổi.","2":"Hỏi quốc tịch là 哪国人; nghe được 多大."}},{"q":"Cô bé (con của đồng nghiệp) là ai?","audio":"她是小学生。","opts":["Học sinh tiểu học","Học sinh trung học"],"a":0,"why":{"1":"Học sinh trung học là zhōngxuéshēng; nghe được xiǎoxuéshēng."}},{"q":"Số vừa nghe là?","audio":"四十四","opts":["44","14","40"],"a":0,"why":{"1":"14 là 十四 (shísì) — chỉ có một 四 sau 十; ở đây có 四 cả trước và sau.","2":"40 là 四十 (sìshí); ở đây còn thêm 四 ở cuối → 44."}},{"q":"Số vừa nghe là?","audio":"十四","opts":["14","40","44"],"a":0,"why":{"1":"40 là 四十 (sìshí) — 四 đứng trước; ở đây 十 (shí) đứng trước.","2":"44 là 四十四; ở đây chỉ có hai âm shí sì."}}],"hsk":[{"q":"HSK1 Nghe – chọn tranh đúng với câu nghe được:","audio":"八岁","opts":["Bánh sinh nhật có 8 ngọn nến","Bánh sinh nhật có 6 ngọn nến","Bánh sinh nhật có 9 ngọn nến"],"a":0,"why":{"1":"6 là 六 (liù); nghe được bā = 8.","2":"9 là 九 (jiǔ); nghe được bā = 8."}},{"q":"HSK1 Nghe – chọn tranh đúng với câu nghe được:","audio":"四十四","opts":["Số 14","Số 44","Số 40"],"a":1,"why":{"0":"14 là 十四 (shísì).","2":"40 là 四十 (sìshí); ở đây có thêm 四 ở cuối."}},{"q":"HSK1 Nghe – chọn tranh đúng với câu nghe được:","audio":"她是小学生。","opts":["Cô giáo","Người mẹ","Bé gái mặc đồng phục tiểu học"],"a":2,"why":{"0":"Câu nói 小学生 (học sinh tiểu học), không phải cô giáo.","1":"Mẹ là 妈妈; câu nói 小学生."}},{"q":"HSK1 Nghe – chọn tranh đúng với câu nghe được:","audio":"他们是中学生。","opts":["Hai cụ già","Hai học sinh cấp hai","Hai em bé"],"a":1,"why":{"0":"中学生 là học sinh trung học, không phải người già.","2":"Em bé chưa đi học trung học; 中学生 là học sinh cấp 2–3."}},{"q":"HSK1 Nghe – chọn tranh đúng với câu nghe được:","audio":"九十九","opts":["Số 19","Số 90","Số 99"],"a":2,"why":{"0":"19 là 十九 (shíjiǔ); ở đây 九 đứng trước 十.","1":"90 là 九十; ở đây còn thêm 九 ở cuối → 99."}}],"shadow":[{"t":"一二三四五六七八九十","py":"yī èr sān sì wǔ liù qī bā jiǔ shí","focus":"Đếm 1 → 10, rồi đếm ngược 10 → 1. Giữ rõ thanh từng số."},{"t":"十四，四十","py":"shísì, sìshí","focus":"shí (sh uốn lưỡi, thanh 2) khác sì (s phẳng, thanh 4)."},{"t":"一岁，十一","py":"yí suì, shíyī","focus":"一 trước thanh 4 → yí suì; 一 ở cuối số giữ yī: shíyī."},{"t":"几岁","py":"jǐ suì","focus":"Thanh 3 + thanh 4: 几 chỉ đọc nửa thanh 3 (thấp)."},{"t":"多大","py":"duō dà","focus":"Thanh 1 + thanh 4: cao bằng rồi rơi mạnh."},{"t":"你今年几岁了？","py":"Nǐ jīnnián jǐ suì le?","focus":"了 đọc nhẹ; không lên giọng cuối câu."},{"t":"我不小了！","py":"Wǒ bù xiǎo le!","focus":"不 trước thanh 3 giữ nguyên bù (chỉ đổi thành bú trước thanh 4)."},{"t":"明年九岁！","py":"Míngnián jiǔ suì!","focus":"Hai thanh 2 đi lên, rồi 九 thấp, 岁 rơi."}],"dialog":{"title":"Giờ giải lao bên máy pha cà phê: hỏi tuổi đồng nghiệp","partner":"王丽","turns":[{"ai":"你今年多大了？","py":"Nǐ jīnnián duō dà le?","vi":"Năm nay bạn bao nhiêu tuổi rồi?","model":"我今年二十六岁。","mpy":"Wǒ jīnnián èrshíliù suì.","accept":["我今年二十六岁。","我二十六岁。","二十六岁。","我今年二十六岁了。"],"frame":"我今年___岁。","hint":"Mẫu là 26 tuổi (二十六); bạn có thể nói tuổi thật của mình. Không cần 是."},{"ai":"你很小！你是中学生吗？","py":"Nǐ hěn xiǎo! Nǐ shì zhōngxuéshēng ma?","vi":"Trông bạn trẻ quá! Bạn là học sinh trung học à? (đùa)","model":"不是，我不小了！","mpy":"Bú shì, wǒ bù xiǎo le!","accept":["不是，我不小了！","不是，我不小了","我不小了！","不是。","不是，我不是中学生。"],"frame":"不是，我不___了！","hint":"Đáp đùa lại: 'Không, tôi không còn nhỏ nữa!' — nhớ 了 ở cuối."},{"ai":"我明年二十七岁！你呢？","py":"Wǒ míngnián èrshíqī suì! Nǐ ne?","vi":"Sang năm mình hai mươi bảy! Còn bạn?","model":"我明年二十七岁。","mpy":"Wǒ míngnián èrshíqī suì.","accept":["我明年二十七岁。","我明年二十七岁！","明年二十七岁。","二十七岁。","我也明年二十七岁。"],"frame":"我明年___岁。","hint":"Năm nay 26 → sang năm 27: 二十七 (èrshíqī). Tuổi khác thì cộng thêm 1."},{"ai":"看！小天六岁了！","py":"Kàn! Xiǎotiān liù suì le!","vi":"Nhìn này! Bé Thiên nhà mình sáu tuổi rồi!","model":"他是小学生吗？","mpy":"Tā shì xiǎoxuéshēng ma?","accept":["他是小学生吗？","他是小学生吗","是小学生吗？","小学生吗？"],"frame":"他是___吗？","hint":"Hỏi bé đã là học sinh tiểu học chưa: 小学生 + 吗."}]},"reading":{"text":"我叫王丽，今年二十六岁。小天六岁了，是小学生。阮明二十七岁。阮安也二十六岁。小天明年七岁！","py":"Wǒ jiào Wáng Lì, jīnnián èrshíliù suì. Xiǎotiān liù suì le, shì xiǎoxuéshēng. Ruǎn Míng èrshíqī suì. Ruǎn Ān yě èrshíliù suì. Xiǎotiān míngnián qī suì!","vi":"Tôi tên là Vương Lệ, năm nay hai mươi sáu tuổi. Bé Thiên (con tôi) sáu tuổi rồi, là học sinh tiểu học. Nguyễn Minh hai mươi bảy tuổi. Nguyễn An cũng hai mươi sáu tuổi. Sang năm bé Thiên bảy tuổi!","qs":[{"q":"小天 mấy tuổi?","opts":["6","7","26"],"a":0,"why":{"1":"7 là tuổi năm sau (明年七岁).","2":"26 là tuổi của 王丽 và 阮安."}},{"q":"小天 là học sinh gì?","opts":["Tiểu học","Trung học"],"a":0,"why":{"1":"Bài viết 小天…是小学生 (tiểu học), không phải 中学生."}},{"q":"阮明 bao nhiêu tuổi?","opts":["27","26","72"],"a":0,"why":{"1":"26 là tuổi của 王丽 và 阮安.","2":"72 là 七十二; bài viết 二十七 (27)."}},{"q":"Sang năm 小天 bao nhiêu tuổi?","opts":["7","6","8"],"a":0,"why":{"1":"6 là tuổi năm nay (了 = đã sáu tuổi rồi).","2":"Câu cuối là 小天明年七岁 — bảy tuổi, không phải tám."}},{"q":"Đúng hay sai: 小天是中学生。","opts":["Đúng","Sai"],"a":1,"why":{"0":"Bài viết 小天…是小学生 (học sinh tiểu học), không phải trung học."}}]}},{"id":"w1-thu-6","label":"Thứ 6","title":"Gia đình, người thân","desc":"Giới thiệu gia đình qua ảnh: nhà có mấy người, có/không có anh chị em, dùng 这/那, 的 và lượng từ 个, 口.","rule":"Phủ định của 有 luôn là 没有, không bao giờ nói 不有. Số 2 trước lượng từ dùng 两 (không dùng 二): 两个哥哥; đếm người trong nhà dùng 口: 我家有五口人.","cards":[{"w":"这 / 那","py":"zhè / nà","m":"này, đây / kia, đó","ex":"这是我爸爸，那是我妈妈。","expy":"Zhè shì wǒ bàba, nà shì wǒ māma.","exm":"Đây là bố tôi, kia là mẹ tôi.","n":"这 chỉ gần, 那 chỉ xa; cả hai thanh 4. Đừng lẫn 那 nà (kia) với 哪 nǎ (nào, thanh 3)."},{"w":"的","py":"de","m":"của (trợ từ)","ex":"这是你的家人吗？","expy":"Zhè shì nǐ de jiārén ma?","exm":"Đây là người nhà của bạn à?","n":"Người sở hữu + 的 + danh từ: 我的朋友. Với người thân có thể bỏ 的: 我妈妈. Đọc nhẹ."},{"w":"家","py":"jiā","m":"nhà, gia đình","ex":"我家有五口人。","expy":"Wǒ jiā yǒu wǔ kǒu rén.","exm":"Nhà tôi có năm người.","n":"我家 = nhà tôi (không cần 的). Thanh 1.","img":"home"},{"w":"家人","py":"jiārén","m":"người nhà, người thân trong gia đình","ex":"这是我的家人。","expy":"Zhè shì wǒ de jiārén.","exm":"Đây là người nhà của tôi.","n":"⚠ Không phải 'gia nhân' (người giúp việc) — 家人 là người thân trong gia đình.","img":"family"},{"w":"有 / 没有","py":"yǒu / méiyǒu","m":"có / không có","ex":"我有哥哥，没有妹妹。","expy":"Wǒ yǒu gēge, méiyǒu mèimei.","exm":"Tôi có anh trai, không có em gái.","n":"Phủ định của 有 là 没有, KHÔNG nói 不有. Trả lời ngắn: 有。/ 没有。 我有 (3+3) đọc wó yǒu."},{"w":"口","py":"kǒu","m":"miệng; (lượng từ đếm người trong nhà)","ex":"你家有几口人？","expy":"Nǐ jiā yǒu jǐ kǒu rén?","exm":"Nhà bạn có mấy người?","n":"Dùng khi nói nhà có mấy người: 几口人？ 五口人. Thanh 3."},{"w":"两个","py":"liǎng gè","m":"hai (cái, người…)","ex":"我有两个儿子。","expy":"Wǒ yǒu liǎng gè érzi.","exm":"Tôi có hai con trai.","n":"个 gè: lượng từ chung (一个 yí gè, 三个…). 两 liǎng: 'hai' khi đứng trước lượng từ — nói 两个, không nói 二个."},{"w":"和","py":"hé","m":"và, với","ex":"那是我姐姐和弟弟。","expy":"Nà shì wǒ jiějie hé dìdi.","exm":"Kia là chị gái và em trai tôi.","n":"Chỉ nối danh từ/người: A 和 B. Không dùng để nối hai câu."},{"w":"哥哥","py":"gēge","m":"anh trai","ex":"我有一个哥哥。","expy":"Wǒ yǒu yí gè gēge.","exm":"Tôi có một anh trai.","n":"Chữ sau đọc nhẹ. 一个 đọc yí gè.","img":"older-brother"},{"w":"姐姐","py":"jiějie","m":"chị gái","ex":"那是我姐姐。","expy":"Nà shì wǒ jiějie.","exm":"Kia là chị gái tôi.","n":"Thanh 3 + thanh nhẹ. Chữ có bộ 女 (nữ).","img":"older-sister"},{"w":"弟弟","py":"dìdi","m":"em trai","ex":"这是我弟弟。","expy":"Zhè shì wǒ dìdi.","exm":"Đây là em trai tôi.","n":"Thanh 4 + thanh nhẹ. Tiếng Việt chỉ nói 'em', tiếng Trung phân biệt: 弟弟 (trai) / 妹妹 (gái).","img":"younger-brother"},{"w":"妹妹","py":"mèimei","m":"em gái","ex":"我没有妹妹。","expy":"Wǒ méiyǒu mèimei.","exm":"Tôi không có em gái.","n":"Thanh 4 + thanh nhẹ. Chữ có bộ 女 (nữ) → em gái.","img":"younger-sister"},{"w":"儿子","py":"érzi","m":"con trai","ex":"小天是王丽的儿子。","expy":"Xiǎotiān shì Wáng Lì de érzi.","exm":"Bé Thiên là con trai của Vương Lệ.","n":"子 đọc nhẹ 'zi'. Khác 哥哥/弟弟 (anh/em trai)."},{"w":"女儿","py":"nǚ'ér","m":"con gái","ex":"王经理有一个女儿。","expy":"Wáng jīnglǐ yǒu yí gè nǚ'ér.","exm":"Giám đốc Vương có một con gái.","n":"nǚ: ü tròn môi. Dấu ' ngăn hai âm tiết nǚ'ér."}],"scene":{"setting":"Giờ nghỉ trưa ở công ty. Em gái của 阮明 là 阮兰 ghé mang cơm trưa cho anh. 阮明 giới thiệu đồng nghiệp 王丽 với em gái, rồi cả ba nói chuyện về gia đình.","img":"she","imgPrompt":"Photo in an office at lunchtime: minh introduces his female colleague wangli to a visitor, his younger sister lan, gesturing toward wangli with an open hand while wangli smiles and waves. No text in image.","lines":[{"who":"阮明","t":"阮兰，这是王丽，她是我的朋友。","py":"Ruǎn Lán, zhè shì Wáng Lì, tā shì wǒ de péngyou.","vi":"Lan ơi, đây là chị Vương Lệ, bạn (đồng nghiệp) của anh. (đưa tay giới thiệu)"},{"who":"王丽","t":"你好！你是阮明的家人吗？","py":"Nǐ hǎo! Nǐ shì Ruǎn Míng de jiārén ma?","vi":"Chào em! Em là người nhà của Minh à? (vẫy tay)"},{"who":"阮兰","t":"是，我是他妹妹。","py":"Shì, wǒ shì tā mèimei.","vi":"Vâng, em là em gái anh ấy."},{"who":"王丽","t":"阮明，你家有几口人？","py":"Ruǎn Míng, nǐ jiā yǒu jǐ kǒu rén?","vi":"Minh ơi, nhà anh có mấy người?"},{"who":"阮明","t":"我家有四口人：爸爸、妈妈、妹妹和我。我没有哥哥，也没有姐姐。","py":"Wǒ jiā yǒu sì kǒu rén: bàba, māma, mèimei hé wǒ. Wǒ méiyǒu gēge, yě méiyǒu jiějie.","vi":"Nhà tôi có bốn người: bố, mẹ, em gái và tôi. Tôi không có anh trai, cũng không có chị gái."},{"who":"王丽","t":"我家有三口人。我有一个儿子。","py":"Wǒ jiā yǒu sān kǒu rén. Wǒ yǒu yí gè érzi.","vi":"Nhà chị có ba người. Chị có một con trai."},{"who":"阮兰","t":"你儿子几岁了？","py":"Nǐ érzi jǐ suì le?","vi":"Con trai chị mấy tuổi rồi ạ?"},{"who":"王丽","t":"六岁了。那是他！我妹妹有两个女儿。","py":"Liù suì le. Nà shì tā! Wǒ mèimei yǒu liǎng gè nǚ'ér.","vi":"Sáu tuổi rồi. Kia là bé đấy! (chỉ ảnh dán trên bàn làm việc) Em gái chị thì có hai con gái."}]},"patterns":[{"t":"有 / 没有: có / không có","f":[["我","有","哥哥"],["我","没有","妹妹"]],"ex":[["我有一个姐姐。","Tôi có một chị gái."],["我没有哥哥。","Tôi không có anh trai."]],"bad":"我不有哥哥。","good":"我没有哥哥。","why":"有 là động từ đặc biệt: phủ định LUÔN là 没有. 不 phủ định các động từ khác (不是, 不会), nhưng không bao giờ đi với 有."},{"t":"Số + lượng từ + danh từ","f":[["一","个","哥哥"],["两","个","妹妹"],["五","口","人"]],"ex":[["我有两个妹妹。","Tôi có hai em gái."],["我家有五口人。","Nhà tôi có năm người."]],"bad":"我有二个妹妹。","good":"我有两个妹妹。","why":"Giữa số và danh từ phải có lượng từ (个, 口). Số 2 đứng trước lượng từ dùng 两 liǎng, không dùng 二 (二 dùng khi đếm 1-2-3 và trong số như 十二, 二十)."},{"t":"的: người sở hữu + 的 + danh từ","f":[["我","的","朋友"],["你","的","家人"]],"ex":[["这是你的家人吗？","Đây là người nhà của bạn à?"],["那是我的朋友。","Kia là bạn của tôi."]],"bad":"这是朋友我。","good":"这是我的朋友。","why":"Tiếng Việt nói 'bạn của tôi' (danh từ trước, người sở hữu sau); tiếng Trung NGƯỢC lại: 我的朋友. Với người thân có thể bỏ 的: 我妈妈."},{"t":"这 / 那 + 是 + người/vật","f":[["gần →","这","是我爸爸"],["xa →","那","是我姐姐"]],"ex":[["这是我弟弟。","Đây là em trai tôi."],["那是我的女儿。","Kia là con gái tôi."]],"bad":"哪是我姐姐。","good":"那是我姐姐。","why":"哪 nǎ (thanh 3) là 'nào', dùng để hỏi; 那 nà (thanh 4) là 'kia'. Viết hoặc đọc nhầm sẽ thành câu vô nghĩa."}],"vocab":[{"q":"哥哥 (gēge) nghĩa là?","opts":["anh trai","em trai","chị gái"],"a":0,"why":{"1":"Em trai là 弟弟 (dìdi).","2":"Chị gái là 姐姐 (jiějie)."}},{"q":"姐姐 (jiějie) nghĩa là?","opts":["chị gái","em gái","mẹ"],"a":0,"why":{"1":"Em gái là 妹妹 (mèimei).","2":"Mẹ là 妈妈 (māma)."}},{"q":"'Em trai' và 'em gái' lần lượt là?","opts":["弟弟 / 妹妹","哥哥 / 姐姐","妹妹 / 弟弟"],"a":0,"why":{"1":"哥哥/姐姐 là anh trai/chị gái (lớn tuổi hơn mình).","2":"Ngược rồi: 妹妹 (có bộ 女) là em gái, 弟弟 là em trai."}},{"q":"儿子 / 女儿 nghĩa là?","opts":["con trai / con gái","con gái / con trai","anh trai / chị gái"],"a":0,"why":{"1":"Ngược rồi: 女 = nữ → 女儿 là con gái.","2":"Anh trai/chị gái là 哥哥/姐姐."}},{"q":"Điền lượng từ: 我家有五___人。","opts":["口","的","两"],"a":0,"why":{"1":"的 là 'của', không đứng giữa số và danh từ.","2":"两 là số 'hai', không phải lượng từ; câu đã có số 五."}},{"q":"Điền lượng từ: 一___哥哥 (một anh trai)","opts":["个","口","的"],"a":0,"why":{"1":"口 chỉ dùng khi nói cả nhà có mấy người (五口人), không dùng cho 'một anh trai'.","2":"的 không phải lượng từ; giữa số và danh từ cần 个."}},{"q":"Điền: ___个妹妹 (hai em gái)","opts":["两","二"],"a":0,"why":{"1":"二 dùng khi đếm/đọc số (一二三, 十二); trước lượng từ 个 phải dùng 两."}},{"q":"家人 (jiārén) nghĩa là?","opts":["người nhà, người thân","người giúp việc (gia nhân)","nhà to"],"a":0,"why":{"1":"⚠ Bẫy Hán Việt: 家人 là người trong gia đình, không phải người giúp việc.","2":"人 = người, không phải 'to'; 家人 là người nhà."}}],"grammar":[{"q":"Sửa lỗi câu 我不有哥哥。","opts":["我没有哥哥。","我有不哥哥。","我不是有哥哥。"],"a":0,"why":{"1":"Vẫn sai: phủ định của 有 là 没有, và 不 không đứng sau động từ.","2":"Không thêm 是; chỉ cần 没有."}},{"q":"Sửa lỗi câu 我有二个妹妹。","opts":["我有两个妹妹。","我有二妹妹。","我两有个妹妹。"],"a":0,"why":{"1":"Vẫn dùng 二 và bỏ mất lượng từ 个 (二妹妹 lại thành 'em gái thứ hai').","2":"Sai trật tự: số + lượng từ + danh từ phải đứng liền nhau sau 有."}},{"k":"type","q":"Điền lượng từ: 我家有四___人。","model":"口","accept":["口","kou"],"why":"Nói cả nhà có mấy người dùng lượng từ 口: 四口人."},{"k":"type","q":"Điền: 这是我___家人。(Đây là người nhà của tôi.)","model":"的","accept":["的","de"],"why":"Người sở hữu + 的 + danh từ: 我的家人."},{"q":"Hỏi 'Bạn có chị gái không?'","opts":["你有姐姐吗？","你是姐姐吗？","你没有姐姐吗？"],"a":0,"why":{"1":"你是姐姐吗 = 'Bạn là chị gái à?' — hỏi bạn có phải là chị không, không hỏi có hay không có.","2":"你没有姐姐吗 = 'Bạn không có chị gái à?' — câu hỏi ngạc nhiên mang ý phủ định, không phải câu hỏi trung tính."}},{"q":"Dịch: Kia là anh trai và em gái tôi.","opts":["那是我哥哥和妹妹。","这是我哥哥和妹妹。","那是哥哥和妹妹我。"],"a":0,"why":{"1":"这 = đây (gần); câu cần 'kia' = 那.","2":"Người sở hữu 我 phải đứng TRƯỚC: 我哥哥."}},{"q":"Câu nào đúng?","opts":["我有一个儿子和一个女儿。","我和有一个儿子一个女儿。"],"a":0,"why":{"1":"和 chỉ nối hai danh từ: 一个儿子 和 一个女儿; không đặt giữa 我 và 有."}}],"listen":[{"q":"Nhà người nói có mấy người?","audio":"我家有三口人。","opts":["3","4","5"],"a":0,"why":{"1":"4 là 四 (sì); nghe được sān = 3.","2":"5 là 五 (wǔ); nghe được sān = 3."}},{"q":"Người nói có ai?","audio":"我有两个哥哥。","opts":["2 anh trai","2 em trai","1 anh trai"],"a":0,"why":{"1":"Em trai là 弟弟 (dìdi); nghe được 哥哥 (gēge).","2":"Nghe được 两个 (liǎng gè) = 2, không phải 一个."}},{"q":"Câu vừa nghe nói gì?","audio":"我没有妹妹。","opts":["Không có em gái","Có một em gái","Không có em trai"],"a":0,"why":{"1":"Có 没有 (méiyǒu) = không có.","2":"Em trai là 弟弟; câu nói 妹妹 (mèimei) = em gái."}},{"q":"Đây là ai?","audio":"这是我弟弟。","opts":["Em trai","Anh trai","Em gái"],"a":0,"why":{"1":"Anh trai là 哥哥 (gēge); nghe được dìdi.","2":"Em gái là 妹妹 (mèimei); nghe được dìdi."}},{"q":"Kia là ai?","audio":"那是我的女儿。","opts":["Con gái","Con trai","Em gái"],"a":0,"why":{"1":"Con trai là 儿子 (érzi); nghe được nǚ'ér.","2":"Em gái là 妹妹 (mèimei); nghe được nǚ'ér."}},{"q":"Người trả lời có chị gái không?","audio":"你有姐姐吗？——有。","opts":["Có","Không"],"a":0,"why":{"1":"Câu trả lời là 有 (yǒu) = có. Nếu không có sẽ nói 没有."}},{"q":"Nhà người nói có mấy người?","audio":"我家有爸爸、妈妈和我。","opts":["3","2","4"],"a":0,"why":{"1":"Đừng quên chính người nói: 爸爸, 妈妈 và 我 = 3.","2":"Không có anh chị em nào khác; chỉ 3 người."}}],"hsk":[{"q":"HSK1 Đọc hiểu – câu 我家有五口人。(Wǒ jiā yǒu wǔ kǒu rén.) hợp với tranh nào?","opts":["Một gia đình 5 người","Bố mẹ với một bé trai và một bé gái","Hai anh trai đứng cạnh em gái"],"a":0,"why":{"1":"Bố mẹ với hai con là 4 người, không phải 五口人 (5 người).","2":"Tranh chỉ có 3 anh em; câu nói cả nhà có 5 người."}},{"q":"HSK1 Đọc hiểu – câu 我有一个儿子和一个女儿。(Wǒ yǒu yí gè érzi hé yí gè nǚ'ér.) hợp với tranh nào?","opts":["Một gia đình 5 người","Bố mẹ với một bé trai và một bé gái","Cô bé 8 tuổi với bánh sinh nhật"],"a":1,"why":{"0":"Câu chỉ nói một con trai và một con gái, không nói cả nhà 5 người.","2":"Câu không nói tuổi hay sinh nhật."}},{"q":"HSK1 Đọc hiểu – câu 我有两个哥哥。(Wǒ yǒu liǎng gè gēge.) hợp với tranh nào?","opts":["Hai anh trai đứng cạnh em gái","Bố mẹ với một bé trai và một bé gái","Chị đồng nghiệp chỉ vào ảnh gia đình trên điện thoại"],"a":0,"why":{"1":"Tranh này về bố mẹ và con, không có 'hai anh trai'.","2":"Tranh này hợp với câu 这是我的家人, không nói về hai anh trai."}},{"q":"HSK1 Đọc hiểu – câu 女儿今年八岁了。(Nǚ'ér jīnnián bā suì le.) hợp với tranh nào?","opts":["Cô bé 8 tuổi với bánh sinh nhật","Cô gái Trung Quốc vẫy tay chào","Một gia đình 5 người"],"a":0,"why":{"1":"Câu nói tuổi của con gái (八岁), không phải lời chào.","2":"Câu chỉ nói về một người — con gái 8 tuổi, không phải cả gia đình."}},{"q":"HSK1 Đọc hiểu – câu 这是我的家人。(Zhè shì wǒ de jiārén.) hợp với tranh nào?","opts":["Chị đồng nghiệp chỉ vào ảnh gia đình trên điện thoại","Cô gái Trung Quốc vẫy tay chào","Hai anh trai đứng cạnh em gái"],"a":0,"why":{"1":"Câu dùng 这是… để chỉ vào người nhà, không phải lời chào.","2":"Câu không nói về số anh em; 'Đây là người nhà tôi' hợp với tranh chỉ vào ảnh."}}],"shadow":[{"t":"哥哥，姐姐，弟弟，妹妹","py":"gēge, jiějie, dìdi, mèimei","focus":"Âm thứ hai của mỗi từ đọc nhẹ, ngắn."},{"t":"两个","py":"liǎng gè","focus":"liǎng có i: l + iang, không đọc 'lǎng'."},{"t":"一个","py":"yí gè","focus":"一 trước thanh 4 → yí."},{"t":"五口人","py":"wǔ kǒu rén","focus":"五口 thanh 3 + thanh 3 → đọc wú kǒu rén."},{"t":"我有","py":"wǒ yǒu","focus":"Thanh 3 + thanh 3 → đọc wó yǒu."},{"t":"没有","py":"méiyǒu","focus":"Thanh 2 + thanh 3: méi đi lên, yǒu xuống thấp."},{"t":"我家有五口人。","py":"Wǒ jiā yǒu wǔ kǒu rén.","focus":"有五口 có ba thanh 3 liền nhau: đọc thành yóu wú kǒu, nhấn vào số 五."},{"t":"那是我姐姐和弟弟。","py":"Nà shì wǒ jiějie hé dìdi.","focus":"那 nà thanh 4 rơi mạnh; 姐姐, 弟弟 âm sau nhẹ."}],"dialog":{"title":"Giờ nghỉ trưa: đồng nghiệp hỏi về gia đình bạn qua ảnh","partner":"王丽","turns":[{"ai":"这是你的家人吗？","py":"Zhè shì nǐ de jiārén ma?","vi":"Đây là người nhà của bạn à? (nhìn ảnh trên điện thoại của bạn)","model":"是，这是我爸爸、妈妈。","mpy":"Shì, zhè shì wǒ bàba, māma.","accept":["是，这是我爸爸、妈妈。","是，这是我爸爸妈妈。","是，这是我的家人。","是。","这是我爸爸、妈妈。"],"frame":"是，这是我___。","hint":"Trả lời 是 rồi chỉ vào ảnh: 这是我爸爸、妈妈."},{"ai":"你家有几口人？","py":"Nǐ jiā yǒu jǐ kǒu rén?","vi":"Nhà bạn có mấy người?","model":"我家有四口人。","mpy":"Wǒ jiā yǒu sì kǒu rén.","accept":["我家有四口人。","四口人。","我家有三口人。","三口人。","我家有五口人。","五口人。","我家有六口人。"],"frame":"我家有___口人。","hint":"Nói số người thật của nhà bạn. Nhớ lượng từ 口."},{"ai":"你有哥哥吗？","py":"Nǐ yǒu gēge ma?","vi":"Bạn có anh trai không?","model":"没有。我有一个弟弟。","mpy":"Méiyǒu. Wǒ yǒu yí gè dìdi.","accept":["没有。我有一个弟弟。","没有。","我没有哥哥。","有。","有，我有一个哥哥。","没有，我有一个妹妹。","没有，我有一个姐姐。"],"frame":"没有。我有一个___。","hint":"Không có thì nói 没有 (không nói 不有). 一个 đọc yí gè."},{"ai":"那是你姐姐吗？","py":"Nà shì nǐ jiějie ma?","vi":"Kia là chị gái bạn à?","model":"不是，那是我妹妹。","mpy":"Bú shì, nà shì wǒ mèimei.","accept":["不是，那是我妹妹。","不是，她是我妹妹。","不是。","是。","是，那是我姐姐。"],"frame":"不是，那是我___。","hint":"Câu hỏi có 是…吗 → trả lời 是 / 不是."}]},"reading":{"text":"我叫阮安。我家有五口人：爸爸、妈妈、哥哥、弟弟和我。我没有姐姐，也没有妹妹。哥哥今年三十岁，他有两个女儿。","py":"Wǒ jiào Ruǎn Ān. Wǒ jiā yǒu wǔ kǒu rén: bàba, māma, gēge, dìdi hé wǒ. Wǒ méiyǒu jiějie, yě méiyǒu mèimei. Gēge jīnnián sānshí suì, tā yǒu liǎng gè nǚ'ér.","vi":"Tôi tên là Nguyễn An. Nhà tôi có năm người: bố, mẹ, anh trai, em trai và tôi. Tôi không có chị gái, cũng không có em gái. Anh trai năm nay ba mươi tuổi, anh ấy có hai con gái.","qs":[{"q":"Nhà 阮安 có mấy người?","opts":["5","4","3"],"a":0,"why":{"1":"Đếm lại: bố, mẹ, anh trai, em trai và 阮安 = 5; bài viết 五口人 (wǔ kǒu rén).","2":"三口人 là nhà của 王丽 trong cảnh phim; bài này viết 五口人, không phải 三口人."}},{"q":"Nhà 阮安 y)."},{"w":"要","py":"yào","m":"muốn; cần, phải; sắp","ex":"我们要晚了！","expy":"Wǒmen yào wǎn le!","exm":"Chúng ta sắp muộn rồi!","n":"要 + động từ = muốn/phải làm: 我要睡. 要…了 = sắp… rồi."},{"w":"不要","py":"búyào","m":"đừng","ex":"不要叫我！","expy":"Búyào jiào wǒ!","exm":"Đừng gọi tôi!","n":"不要 + động từ = đừng làm gì (ra lệnh, khuyên). 不 trước thanh 4 đọc bú."},{"w":"上学","py":"shàngxué","m":"đi học","ex":"小天早上七点半上学。","expy":"Xiǎotiān zǎoshang qī diǎn bàn shàngxué.","exm":"Bé Thiên đi học lúc 7 rưỡi sáng.","n":"上学 = đi học (đến trường hằng ngày). Người đi làm hay dùng khi nói về con: 我儿子七点上学. Thời gian đặt trước 上学."},{"w":"去","py":"qù","m":"đi (đến)","ex":"你几点去学校？","expy":"Nǐ jǐ diǎn qù xuéxiào?","exm":"Mấy giờ chị đến trường (đưa con)?","n":"去 + nơi chốn: 去学校 (không cần thêm 'đến'). q bật hơi, ü viết u."},{"w":"学校","py":"xuéxiào","m":"trường học","ex":"这是小天的学校。","expy":"Zhè shì Xiǎotiān de xuéxiào.","exm":"Đây là trường của bé Thiên.","n":"x + üe (viết ue), xiào thanh 4. 去学校 = đến trường.","img":"school"}],"scene":{"setting":"9 giờ 20 sáng ở văn phòng. 王丽 cầm cốc cà phê, vui vẻ chào 阮明 vừa chạy vào — anh ngủ quên, trong khi 9 rưỡi giám đốc Vương gọi cả nhóm lên họp.","img":"morning","imgPrompt":"Photo of an office worker (wangli) holding a cup of coffee and cheerfully greeting a colleague (minh) in the morning sunlight at the office. No text or numbers in image.","lines":[{"who":"王丽","t":"阮明，早上好！","py":"Ruǎn Míng, zǎoshang hǎo!","vi":"Minh ơi, chào buổi sáng! (tay cầm cốc cà phê)"},{"who":"阮明","t":"早上好！现在几点？","py":"Zǎoshang hǎo! Xiànzài jǐ diǎn?","vi":"Chào buổi sáng! Mấy giờ rồi chị?"},{"who":"王丽","t":"九点二十分了。我八点叫你，你怎么还睡？","py":"Jiǔ diǎn èrshí fēn le. Wǒ bā diǎn jiào nǐ, nǐ zěnme hái shuì?","vi":"9 giờ 20 rồi. 8 giờ chị gọi điện cho em, sao em vẫn còn ngủ?"},{"who":"阮明","t":"我八点二十分起床……你几点起床？","py":"Wǒ bā diǎn èrshí fēn qǐchuáng... Nǐ jǐ diǎn qǐchuáng?","vi":"Em dậy lúc 8 giờ 20… Chị dậy lúc mấy giờ?"},{"who":"王丽","t":"我六点半起床。小天七点半上学。","py":"Wǒ liù diǎn bàn qǐchuáng. Xiǎotiān ì nữa'. Thứ tự đúng: 怎么 + 还 + động từ.","2":"还 phải đứng TRƯỚC động từ 睡, không đứng cuối câu."}},{"q":"Sắp xếp: 七点半 / 去 / 我 / 学校","opts":["我七点半去学校。","我去学校七点半。","七点半去我学校。"],"a":0,"why":{"1":"Giờ không đặt cuối câu như tiếng Việt; phải đứng trước động từ 去.","2":"Chủ ngữ 我 bị đặt giữa động từ và nơi chốn — sai trật tự."}},{"q":"我们要晚了！ nghĩa là?","opts":["Chúng ta sắp muộn rồi!","Chúng ta muốn đi muộn.","Chúng ta không muộn."],"a":0,"why":{"1":"Cấu trúc 要…了 ở đây nghĩa là 'sắp… rồi', không phải 'muốn'.","2":"Câu không có 不 nên không phải câu phủ định."}}],"listen":[{"q":"Bây giờ là mấy giờ?","audio":"现在八点。","opts":["8:00","8:30","7:00"],"a":0,"why":{"1":"Không nghe thấy 半 (rưỡi) ở cuối.","2":"7 là 七 (qī); câu nói 八 (bā)."}},{"q":"Bây giờ là mấy giờ?","audio":"现在六点半。","opts":["6:30","6:00","9:30"],"a":0,"why":{"1":"Có 半 ở cuối = rưỡi, nên không phải 6:00.","2":"9 là 九 (jiǔ); câu nói 六 (liù)."}},{"q":"Người nói dậy lúc mấy giờ?","audio":"我七点起床。","opts":["7:00","7:30","1:00"],"a":0,"why":{"1":"Không có 半 nên không phải 7 rưỡi.","2":"1 là 一 (yī); câu nói 七 (qī) — chú ý âm q bật hơi."}},{"q":"Người nói đến trường (đưa con) lúc mấy giờ?","audio":"我七点四十分去学校。","opts":["7:40","7:14","4:40"],"a":0,"why":{"1":"14 phút là 十四分 (shísì); câu nói 四十 (sìshí) = 40.","2":"Giờ là 七 (7); 四十分 là số phút."}},{"q":"Người nói cảm thấy thế nào?","audio":"你怎么还睡？","opts":["Ngạc nhiên, không vui vì người kia vẫn ngủ","Vui vì người kia ngủ ngon","Hỏi người kia ngủ lúc mấy giờ"],"a":0,"why":{"1":"怎么还…？ thể hiện ngạc nhiên, hơi trách, không phải khen.","2":"Hỏi giờ ngủ phải có 几点; câu này không có."}},{"q":"Người nói bảo gì?","audio":"不要睡了，起床吧！","opts":["Đừng ngủ nữa, dậy đi!","Ngủ tiếp đi!","Đi học đi!"],"a":0,"why":{"1":"不要睡 = đừng ngủ — ngược nghĩa với 'ngủ tiếp'.","2":"Câu không có 上学 hay 去学校."}},{"q":"Người nói muốn gì?","audio":"还早，我要睡。","opts":["Ngủ tiếp","Dậy ngay","Đi làm sớm"],"a":0,"why":{"1":"我要睡 = tôi muốn ngủ, không phải dậy.","2":"还早 (còn sớm) là lý do để ngủ tiếp, không phải để đi làm sớm."}}],"hsk":[{"q":"HSK1 Nghe – phần 3: nghe hội thoại, chọn tranh phù hợp.","audio":"现在几点？——七点。","opts":["Đồng hồ chỉ 7:00, một người đàn ông đang ngáp","Đồng hồ chỉ 9:30, anh nhân viên hốt hoảng chạy vào văn phòng","Người vợ gọi chồng dậy"],"a":0,"why":{"1":"Câu trả lời là 七点 (7 giờ), không phải 九点半 (9:30).","2":"Không nghe thấy 起床 nên không phải cảnh gọi dậy."}},{"q":"HSK1 Nghe – phần 3: nghe hội thoại, chọn tranh phù hợp.","audio":"起床吧！——好，好。","opts":["Đồng hồ chỉ 9:30, anh nhân viên hốt hoảng chạy vào văn phòng","Người vợ gọi chồng dậy","Người mẹ đưa con đến cổng trường, vẫy tay chào"],"a":1,"why":{"0":"Không nhắc đến giờ hay việc sắp muộn.","2":"Không có 去学校 hay 再见 — chưa phải lúc ra khỏi nhà."}},{"q":"HSK1 Nghe – phần 3: nghe hội thoại, chọn tranh phù hợp.","audio":"你去学校吗？——去。再见！","opts":["Hai người lớn chào nhau trước tòa văn phòng","Người mẹ đưa con đến cổng trường, vẫy tay chào","Người vợ gọi chồng dậy"],"a":1,"why":{"0":"Hội thoại nói về việc đến trường (去学校) + 再见, nên hợp với tranh người mẹ đưa con đến cổng trường; tranh hai người lớn trước tòa văn phòng không có trường học.","2":"Không có 起床."}},{"q":"HSK1 Nghe – phần 3: nghe hội thoại, chọn tranh phù hợp.","audio":"现在九点半了？——是，你要晚了！","opts":["Đồng hồ chỉ 7:00, một người đàn ông đang ngáp","Đồng hồ chỉ 9:30, anh nhân viên hốt hoảng chạy vào văn phòng","Một người trùm chăn ngủ"],"a":1,"why":{"0":"Câu nói 九点半 (9:30), không phải 七点.","2":"Có 要晚了 (sắp muộn) — người trong tranh đang hốt hoảng, không phải đang ngủ yên."}},{"q":"HSK1 Nghe – phần 3: nghe hội thoại, chọn tranh phù hợp.","audio":"你怎么还睡？——不要叫我！","opts":["Một người trùm chăn ngủ, không chịu dậy","Hai người lớn chào nhau trước tòa văn phòng","Đồng hồ chỉ 7:00, một người đàn ông đang ngáp"],"a":0,"why":{"1":"Không có lời chào; hội thoại nói về việc vẫn còn ngủ (还睡).","2":"Không nhắc đến giờ; người trả lời 不要叫我 = đang muốn ngủ tiếp."}}],"shadow":[{"t":"起床","py":"qǐchuáng","focus":"q bật hơi mạnh; thanh 3 + thanh 2 (qǐ đọc nửa thanh 3, thấp rồi chuyển sang chuáng đi lên)."},{"t":"现在","py":"xiànzài","focus":"x: mặt lưỡi áp gần ngạc cứng, môi dẹt; z không bật hơi (không đọc thành 'd' tiếng Việt)."},{"t":"几点","py":"jǐ diǎn","focus":"Hai thanh 3 liền nhau: thanh 3 đầu đổi thành thanh 2 → jí diǎn."},{"t":"七点半","py":"qī diǎn bàn","focus":"七 thanh 1 cao, đều; q bật hơi; 半 thanh 4 dứt khoát."},{"t":"还早","py":"hái zǎo","focus":"hái thanh 2 đi lên (đừng đọc thanh 4); zǎo: z không bật hơi."},{"t":"不要","py":"búyào","focus":"不 đứng trước thanh 4 (要) đổi thành bú (thanh 2)."},{"t":"起床吧！","py":"Qǐchuáng ba!","focus":"吧 đọc nhẹ, ngắn, hơi hạ giọng như lời giục."},{"t":"你怎么还睡？","py":"Nǐ zěnme hái shuì?","focus":"怎 z không bật hơi, 么 đọc nhẹ; 睡 sh uốn lưỡi; nhấn vào 还 để thể hiện ngạc nhiên."}],"dialog":{"title":"Đi công tác cùng 王丽; sáng nay chị gọi điện đánh thức bạn","partner":"王丽","turns":[{"ai":"早上好！起床吧！","py":"Zǎoshang hǎo! Qǐchuáng ba!","vi":"Chào buổi sáng! Dậy đi!","model":"现在几点？","mpy":"Xiànzài jǐ diǎn?","accept":["现在几点？","几点？","几点了？","现在几点了？"],"frame":"现在___？","hint":"Hỏi bây giờ mấy giờ: 现在 + 几点."},{"ai":"七点了！","py":"Qī diǎn le!","vi":"7 giờ rồi!","model":"还早……我要睡。","mpy":"Hái zǎo... wǒ yào shuì.","accept":["还早……我要睡。","还早，我要睡。","还早！","我要睡。"],"frame":"还___……我要___。","hint":"Nói 'còn sớm, tôi muốn ngủ': 还早 + 我要睡."},{"ai":"我们几点去？","py":"Wǒmen jǐ diǎn qù?","vi":"Mấy giờ chúng mình đi (đến công ty đối tác)?","model":"七点半。","mpy":"Qī diǎn bàn.","accept":["七点半。","七点半去。","我们七点半去。","八点。","八点半。"],"frame":"___点半。","hint":"Chỉ cần nói giờ: số + 点 (+ 半)."},{"ai":"你怎么还睡？要晚了！","py":"Nǐ zěnme hái shuì? Yào wǎn le!","vi":"Sao bạn vẫn còn ngủ? Sắp muộn rồi!","model":"好，我起床！","mpy":"Hǎo, wǒ qǐchuáng!","accept":["好，我起床！","我起床！","好！","起床！","好，起床。"],"frame":"好，我___！","hint":"Đồng ý dậy: 好 + 我起床."}]},"reading":{"text":"我叫王丽。我早上六点半起床。小天七点二十分起床，七点半去学校。他是小学生。我说：“小天，起床吧！不要晚了！”","py":"Wǒ jiào Wáng Lì. Wǒ zǎoshang liù diǎn bàn qǐchuáng. Xiǎotiān qī diǎn èrshí fēn qǐchuáng, qī diǎn bàn qù xuéxiào. Tā shì xiǎoxuéshēng. Wǒ shuō: “Xiǎotiān, qǐchuáng ba! Búyào wǎn le!”","vi":"Tôi tên là Vương Lệ. Buổi sáng tôi dậy lúc 6 rưỡi. Bé Thiên dậy lúc 7 giờ 20, 7 rưỡi đến trường. Bé là học sinh tiểu học. Tôi nói: “Thiên ơi, dậy đi! Đừng để muộn!”","qs":[{"q":"小天 dậy lúc mấy giờ?","opts":["7:20","7:30","6:30"],"a":0,"why":{"1":"7:30 là giờ 小天 đến trường (七点半去学校).","2":"6:30 là giờ 王丽 dậy."}},{"q":"小天 đến trường lúc mấy giờ?","opts":["7:30","7:20","6:30"],"a":0,"why":{"1":"7:20 là giờ dậy (七点二十分起床).","2":"6:30 là giờ 王丽 dậy."}},{"q":"Ai dậy sớm hơn?","opts":["王丽","小天"],"a":0,"why":{"1":"小天 dậy lúc 7:20, còn 王丽 dậy lúc 6:30 — 王丽 dậy sớm hơn."}},{"q":"Đúng hay sai: 小天是中学生。","opts":["Sai","Đúng"],"a":0,"why":{"1":"Bài viết: 他是小学生 (học sinh tiểu học), không phải 中学生 (học sinh trung học)."}},{"q":"王丽 nói gì với 小天?","opts":["Dậy đi, đừng để muộn!","Ngủ tiếp đi, còn sớm!","Bây giờ mấy giờ?"],"a":0,"why":{"1":"王丽 nói 起床吧 (dậy đi), ngược lại với 'ngủ tiếp'.","2":"王丽 không hỏi giờ; câu của chị không có 几点."}}]}},{"id":"w2-thu-3","label":"Thứ 3","title":"Bữa sáng ở pantry: ăn uống, mời và từ chối","desc":"Gọi tên món ăn sáng, nói muốn ăn/uống gì, mời đồng nghiệp ăn thêm, từ chối lịch sự và đưa đồ cho người khác.","rule":"想 + động từ = muốn làm gì; 太 + tính từ + 了 = …quá; 一点儿 đứng giữa động từ và danh từ: 再喝一点儿牛奶。","cards":[{"w":"坐","py":"zuò","m":"ngồi","ex":"坐，吃早饭吧！","expy":"Zuò, chī zǎofàn ba!","exm":"Ngồi ăn sáng đi!","n":"z không bật hơi. Mời khách: 坐！坐！ Về sau còn nghĩa 'đi (tàu, xe)': 坐飞机."},{"w":"吃","py":"chī","m":"ăn","ex":"我想吃包子。","expy":"Wǒ xiǎng chī bāozi.","exm":"Tôi muốn ăn bánh bao.","n":"ch uốn lưỡi, bật hơi. 吃 + đồ ăn; đồ uống phải dùng 喝."},{"w":"早饭","py":"zǎofàn","m":"bữa sáng","ex":"我七点吃早饭。","expy":"Wǒ qī diǎn chī zǎofàn.","exm":"Tôi ăn sáng lúc 7 giờ.","n":"早 (sớm) + 饭 (cơm) = bữa sáng. Ăn sáng = 吃早饭. Khác 早上 (buổi sáng)."},{"w":"想","py":"xiǎng","m":"muốn; nghĩ","ex":"我想喝水。","expy":"Wǒ xiǎng hē shuǐ.","exm":"Tôi muốn uống nước.","n":"想 + động từ = muốn làm gì; phủ định: 不想. 我想 là 3+3 → đọc wó xiǎng."},{"w":"包子","py":"bāozi","m":"bánh bao","ex":"一个包子，一人一半。","expy":"Yí gè bāozi, yì rén yíbàn.","exm":"Một cái bánh bao, mỗi người một nửa.","n":"⚠ 包子 (bánh bao) ≠ 面包 (bánh mì). 一半 (yíbàn) = một nửa; 一 đọc yí vì đứng trước thanh 4.","img":"baozi"},{"w":"面包","py":"miànbāo","m":"bánh mì","ex":"我爱吃面包和鸡蛋。","expy":"Wǒ ài chī miànbāo hé jīdàn.","exm":"Tôi rất thích ăn bánh mì và trứng.","n":"面 (bột mì) + 包. Thứ tự chữ ngược với 包子 — đừng nhầm.","img":"bread"},{"w":"鸡蛋","py":"jīdàn","m":"trứng gà","ex":"再吃一个鸡蛋吧！","expy":"Zài chī yí gè jīdàn ba!","exm":"Ăn thêm một quả trứng nữa đi!","n":"Đếm: 一个鸡蛋. j không bật hơi, đọc gần 'ch' nhẹ.","img":"egg"},{"w":"牛奶","py":"niúnǎi","m":"sữa bò","ex":"我不爱喝牛奶。","expy":"Wǒ bú ài hē niúnǎi.","exm":"Tôi không thích uống sữa.","n":"Đọc n rõ ở cả hai âm tiết, đừng thành 'liú lǎi'. Thanh 2 + thanh 3.","img":"milk"},{"w":"太","py":"tài","m":"quá","ex":"包子太少了！","expy":"Bāozi tài shǎo le!","exm":"Bánh bao ít quá!","n":"太 + tính từ + 了 = …quá! 少 (shǎo) = ít, trái nghĩa 多 (duō, nhiều)."},{"w":"爱","py":"ài","m":"yêu; rất thích","ex":"我爱吃鸡蛋。","expy":"Wǒ ài chī jīdàn.","exm":"Tôi rất thích ăn trứng.","n":"爱 + động từ = rất thích (làm gì, thói quen): 爱吃, 爱喝. Phủ định: 不爱."},{"w":"喝","py":"hē","m":"uống","ex":"喝水吧！","expy":"Hē shuǐ ba!","exm":"Uống nước đi!","n":"h phát ra từ cổ họng, hơi khàn (không phải 'h' nhẹ tiếng Việt). Đi với 水, 牛奶."},{"w":"再","py":"zài","m":"lại, thêm (lần nữa)","ex":"再喝一点儿牛奶。","expy":"Zài hē yìdiǎnr niúnǎi.","exm":"Uống thêm chút sữa nữa.","n":"再 + động từ = làm thêm/lần nữa. Đã gặp trong 再见 (hẹn gặp lại)."},{"w":"一点儿","py":"yìdiǎnr","m":"một chút","ex":"我喝一点儿水。","expy":"Wǒ hē yìdiǎnr shuǐ.","exm":"Tôi uống một chút nước.","n":"Đọc 2 âm tiết: yì + diǎnr (cuốn lưỡi), KHÔNG đọc tách 'diǎn ér'. Đứng giữa động từ và danh từ."},{"w":"水","py":"shuǐ","m":"nước","ex":"我想喝水。","expy":"Wǒ xiǎng hē shuǐ.","exm":"Tôi muốn uống nước.","n":"sh uốn lưỡi; thanh 3. Một cốc nước = 一杯水."},{"w":"给","py":"gěi","m":"cho, đưa","ex":"给你。","expy":"Gěi nǐ.","exm":"Đây (đưa cho bạn).","n":"给 + người + vật: 王丽给我一个包子. Khi đưa đồ, chỉ cần nói 给你！"},{"w":"杯子","py":"bēizi","m":"cái cốc","ex":"我的杯子呢？","expy":"Wǒ de bēizi ne?","exm":"Cốc của tôi đâu?","n":"Khi đếm đồ uống, 杯 làm lượng từ: 一杯水 (một cốc nước), 一杯牛奶.","img":"cup"}],"scene":{"setting":"8 giờ sáng ở phòng pantry của công ty. 王丽 mang đồ ăn sáng đến mời 阮安; chỉ còn một cái bánh bao, và An lịch sự từ chối sữa.","img":"thanks","imgPrompt":"Photo in the office pantry: a woman (an) smiles gratefully with a hand on her heart as her colleague (wangli) hands her a cup, breakfast on the counter. No text in image.","lines":[{"who":"王丽","t":"阮安，早上好！坐，吃早饭吧！","py":"Ruǎn Ān, zǎoshang hǎo! Zuò, chī zǎofàn ba!","vi":"An ơi, chào buổi sáng! Ngồi đi, ăn sáng nào!"},{"who":"阮安","t":"早上好！有什么？","py":"Zǎoshang hǎo! Yǒu shénme?","vi":"Chào buổi sáng! Có gì thế chị?"},{"who":"王丽","t":"有包子、面包、鸡蛋。你想吃什么？","py":"Yǒu bāozi, miànbāo, jīdàn. Nǐ xiǎng chī shénme?","vi":"Có bánh bao, bánh mì, trứng. Em muốn ăn gì?"},{"who":"阮安","t":"我想吃包子！我爱吃包子。","py":"Wǒ xiǎng chī bāozi! Wǒ ài chī bāozi.","vi":"Em muốn ăn bánh bao! Em thích bánh bao lắm."},{"who":"王丽","t":"包子太少了……我们一人一半吧。","py":"Bāozi tài shǎo le... Wǒmen yì rén yíbàn ba.","vi":"Bánh bao ít quá… Mình chia mỗi người một nửa nhé."},{"who":"王丽","t":"再喝一点儿牛奶吧！","py":"Zài hē yìdiǎnr niúnǎi ba!","vi":"Uống thêm chút sữa đi!"},{"who":"阮安","t":"不喝了，谢谢。我不爱喝牛奶，我想喝水。我的杯子呢？","py":"Bù hē le, xièxie. Wǒ bú ài hē niúnǎi, wǒ xiǎng hē shuǐ. Wǒ de bēizi ne?","vi":"Em không uống đâu, cảm ơn chị. Em không thích sữa, em muốn uống nước. Cốc của em đâu nhỉ?"},{"who":"王丽","t":"给你。","py":"Gěi nǐ.","vi":"Đây em. (đưa cốc nước)"},{"who":"阮安","t":"谢谢你！","py":"Xièxie nǐ!","vi":"Cảm ơn chị! (đặt tay lên ngực)"}]},"patterns":[{"t":"想 + động từ = muốn làm gì","f":[["我","想","吃包子"],["我","不想","喝牛奶"]],"ex":[["我想喝水。","Tôi muốn uống nước."],["我不想喝牛奶。","Tôi không muốn uống sữa."]],"bad":"我想包子。","good":"我想吃包子。","why":"想 + danh từ (không có động từ) nghĩa là 'nhớ ai/cái gì'. Muốn ăn thì phải có động từ: 想 + 吃 + 包子."},{"t":"太 + tính từ + 了 = …quá!","f":[["包子","太","少了！"],["鸡蛋","太","多了！"]],"ex":[["包子太少了！","Bánh bao ít quá!"],["鸡蛋太多了！","Trứng nhiều quá!"]],"bad":"包子少太了！","good":"包子太少了！","why":"太 đứng TRƯỚC tính từ (tiếng Việt nói 'ít quá', tiếng Trung nói 'quá ít'), và 了 đứng cuối câu."},{"t":"(再) + động từ + 一点儿 + danh từ","f":[["再喝","一点儿","牛奶"],["吃","一点儿","面包"]],"ex":[["再喝一点儿牛奶。","Uống thêm chút sữa."],["再吃一点儿吧！","Ăn thêm chút nữa đi!"]],"bad":"再喝牛奶一点儿。","good":"再喝一点儿牛奶。","why":"一点儿 đứng GIỮA động từ và danh từ, không đặt ở cuối như tiếng Việt 'uống sữa một chút'."},{"t":"给 + người + vật; 一杯 + đồ uống","f":[["王丽","给","我一杯水"]],"ex":[["给你。","Đây (đưa cho bạn)."],["王丽给你一杯水。","Vương Lệ đưa bạn một cốc nước."]],"bad":"王丽给一杯水你。","good":"王丽给你一杯水。","why":"Người nhận đứng ngay sau 给, đồ vật đứng sau cùng. 杯 (cốc) được mượn làm lượng từ: 一杯水."}],"vocab":[{"q":"早饭 (zǎofàn) nghĩa là?","opts":["bữa sáng","buổi sáng","bánh mì"],"a":0,"why":{"1":"'Buổi sáng' là 早上 (zǎoshang) — chỉ thời gian, không phải bữa ăn.","2":"'Bánh mì' là 面包 (miànbāo)."}},{"q":"Từ nào nghĩa là 'sữa bò'?","opts":["牛奶","鸡蛋","面包"],"a":0,"why":{"1":"鸡蛋 = trứng gà.","2":"面包 = bánh mì."}},{"q":"包子 và 面包 lần lượt là?","opts":["bánh bao / bánh mì","bánh mì / bánh bao","trứng gà / sữa bò"],"a":0,"why":{"1":"Bị đảo: 包子 mới là bánh bao, 面包 là bánh mì.","2":"Trứng gà là 鸡蛋, sữa bò là 牛奶."}},{"q":"Động từ đi với 水 và 牛奶 là?","opts":["喝","吃","坐"],"a":0,"why":{"1":"吃 dùng cho đồ ăn (包子, 面包), không dùng cho đồ uống.","2":"坐 = ngồi."}},{"q":"Từ trái nghĩa với 多 (duō, nhiều)?","opts":["少","太","半"],"a":0,"why":{"1":"太 = quá, là phó từ đứng trước tính từ, không phải 'ít'.","2":"半 = một nửa, rưỡi."}},{"q":"Điền (muốn): 我___吃包子。","opts":["想","给","坐"],"a":0,"why":{"1":"给 = cho, đưa; 我给吃包子 sai ngữ pháp.","2":"坐 = ngồi, không có nghĩa 'muốn'."}},{"q":"Đưa cốc nước cho bạn, bạn nói:","opts":["给你。","再见。","不客气。"],"a":0,"why":{"1":"再见 = tạm biệt, dùng khi chia tay.","2":"不客气 = không có gì, dùng để đáp lại 谢谢."}},{"q":"Điền (quá): 包子___少了！","opts":["太","很","再"],"a":0,"why":{"1":"很 = rất, dùng trong câu kể bình thường (包子很少); câu cảm thán '…quá!' có 了 cuối câu phải dùng 太…了.","2":"再 = lại, thêm; đứng trước động từ, không đứng trước tính từ 少."}}],"grammar":[{"k":"type","q":"Dịch 'Tôi muốn uống nước.' — điền: 我___喝水。","model":"想","accept":["想","xiang"],"why":"Muốn + động từ = 想 + động từ: 我想喝水。"},{"q":"Câu nào đúng?","opts":["太少了！","少太了！"],"a":0,"why":{"1":"太 phải đứng trước tính từ: 太少了, không phải 少太了."}},{"q":"Dịch: Uống thêm chút sữa.","opts":["再喝一点儿牛奶。","喝再一点儿牛奶。","再喝牛奶一点儿。"],"a":0,"why":{"1":"再 phải đứng TRƯỚC động từ 喝.","2":"一点儿 phải đứng trước danh từ 牛奶, không đặt cuối câu."}},{"k":"type","q":"Điền lượng từ: 一___水 (một cốc nước)","model":"杯","accept":["杯","bei"],"why":"杯 (cốc) mượn làm lượng từ cho đồ uống: 一杯水, 一杯牛奶."},{"q":"Sắp xếp: 给 / 王丽 / 你 / 一杯水","opts":["王丽给你一杯水。","王丽给一杯水你。","你给王丽一杯水。"],"a":0,"why":{"1":"Người nhận (你) phải đứng ngay sau 给, đồ vật đứng cuối.","2":"Sai nghĩa: thành 'bạn đưa Vương Lệ một cốc nước', trong khi người đưa là Vương Lệ."}},{"q":"Phủ định câu 我想喝牛奶。","opts":["我不想喝牛奶。","我想不喝牛奶。","我没想喝牛奶。"],"a":0,"why":{"1":"想不喝 nghe như 'muốn KHÔNG uống' — không phải cách phủ định 'muốn'; phải đặt 不 trước 想.","2":"没 dùng cho 'không có/chưa xảy ra'; phủ định ý muốn dùng 不想."}},{"q":"'Mỗi người một nửa' là?","opts":["一人一半。","一半一人。","一人半。"],"a":0,"why":{"1":"Đảo thứ tự: 一人 (mỗi người) đứng trước, 一半 (một nửa) đứng sau.","2":"Thiếu 一: 'một nửa' là 一半; 一人半 lại thành 'một người rưỡi'."}}],"listen":[{"q":"Người nói muốn ăn gì?","audio":"我想吃面包。","opts":["bánh mì","bánh bao","trứng"],"a":0,"why":{"1":"Bánh bao là 包子 (bāozi); câu nói 面包 (miànbāo) — có âm miàn ở đầu.","2":"Trứng là 鸡蛋 (jīdàn), không có trong câu."}},{"q":"Người nói xin 王丽 cái gì?","audio":"王丽，我要一杯牛奶。","opts":["một cốc sữa","một cốc nước","một cái bánh bao"],"a":0,"why":{"1":"Nước là 水 (shuǐ); câu nói 牛奶 (niúnǎi).","2":"Câu nói 一杯 (một cốc) — là đồ uống, không phải bánh."}},{"q":"Câu này nghĩa là?","audio":"鸡蛋太少了！" ammar":[{"q":"Hỏi: Sách của tôi đâu?","opts":["我的书在哪儿？","我的书是哪儿？","哪儿我的书在？"],"a":0,"why":{"1":"Hỏi vị trí dùng 在, không dùng 是.","2":"Không đảo 哪儿 lên đầu câu; 哪儿 đứng sau 在."}},{"q":"Trả lời: (Nó) ở dưới ghế.","opts":["在椅子下。","在下椅子。","椅子在下。"],"a":0,"why":{"1":"下 phải đứng SAU danh từ: 椅子下.","2":"Sai nghĩa: thành 'cái ghế ở dưới'."}},{"q":"Sắp xếp: 有 / 桌子上 / 一本书","opts":["桌子上有一本书。","一本书有桌子上。","有桌子上一本书。"],"a":0,"why":{"1":"Câu 'ở đâu có gì': nơi chốn đứng đầu, vật đứng sau 有.","2":"有 không đứng đầu câu; nơi chốn phải đứng trước 有."}},{"k":"type","q":"Dịch 'Trong ngăn bàn có mấy thứ này.' — điền: 桌子里___这些东西。","model":"有","accept":["有","you"],"why":"Câu 'ở đâu có gì': nơi chốn + 有 + vật. Dùng 有, không dùng 在."},{"k":"type","q":"Điền: 你找___本书？(quyển nào)","model":"哪","accept":["哪","na"],"why":"哪 + lượng từ + danh từ = … nào: 哪本书. Không dùng 哪儿 (ở đâu)."},{"q":"Dịch: Tôi thấy rồi!","opts":["我看见了！","我看了见！","我了看见！"],"a":0,"why":{"1":"看见 là một từ, không tách ra; 了 đứng sau cả cụm 看见.","2":"了 không đứng trước động từ."}},{"q":"Phủ định câu: 桌子上有书。","opts":["桌子上没有书。","桌子上不有书。","桌子上有不书。"],"a":0,"why":{"1":"有 chỉ phủ định bằng 没: 没有. Không bao giờ nói 不有.","2":"不 không đứng trước danh từ 书."}}],"listen":[{"q":"Sách ở đâu?","audio":"书在桌子上。","opts":["trên bàn","dưới bàn","trong ngăn bàn"],"a":0,"why":{"1":"'Dưới' là 下 (xià); câu nói 上 (shàng).","2":"'Trong' là 里 (lǐ); câu nói 上."}},{"q":"Cái cốc ở đâu?","audio":"我的杯子在椅子下。","opts":["dưới ghế","trên ghế","trên bàn"],"a":0,"why":{"1":"Câu nói 下 (dưới), không phải 上 (trên).","2":"Câu nói 椅子 (ghế), không phải 桌子 (bàn)."}},{"q":"Trong ngăn bàn có mấy quyển sách?","audio":"桌子里有两本书。","opts":["2","3","1"],"a":0,"why":{"1":"3 là 三 (sān); câu nói 两 (liǎng) = 2.","2":"1 là 一; câu nói 两."}},{"q":"Người nói muốn nói gì?","audio":"这儿没有，那儿也没有。","opts":["Chỗ này, chỗ kia đều không có","Chỗ này có, chỗ kia không có","Ở đây có rất nhiều"],"a":0,"why":{"1":"这儿没有 = chỗ này KHÔNG có.","2":"Câu có 没有 hai lần — không có ở đâu cả."}},{"q":"Người thứ hai đang tìm gì?","audio":"你找什么？——我找我的书。","opts":["sách","cốc","ghế"],"a":0,"why":{"1":"Cốc là 杯子 (bēizi); câu nói 书 (shū).","2":"Ghế là 椅子 (yǐzi)."}},{"q":"Người nói báo điều gì?","audio":"我看见了，在那儿！","opts":["Thấy rồi, ở chỗ kia","Thấy rồi, ở chỗ này","Chưa thấy"],"a":0,"why":{"1":"'Chỗ này' là 这儿 (zhèr); câu nói 那儿 (nàr).","2":"看见了 = đã thấy rồi."}},{"q":"Câu này nghĩa là?","audio":"这些东西都是我的。","opts":["Những đồ này đều là của tôi","Những đồ này không phải của tôi","Tôi đang tìm đồ"],"a":0,"why":{"1":"Câu không có 不; 都是我的 = đều là của tôi.","2":"Câu không có 找 (tìm)."}}],"hsk":[{"q":"HSK1 Nghe – phần 4: nghe câu và câu hỏi, chọn đáp án.","audio":"我的书在桌子上。——书在哪儿？","opts":["桌子上","椅子下","桌子里"],"a":0,"why":{"1":"Câu nói 桌子 (bàn) + 上 (trên), không phải dưới ghế.","2":"Câu nói 上 (trên), không phải 里 (trong)."}},{"q":"HSK1 Nghe – phần 4: nghe câu và câu hỏi, chọn đáp án.","audio":"王丽，我找我的杯子。——他找什么？","opts":["书","杯子","椅子"],"a":1,"why":{"0":"Câu nói 杯子 (cốc), không phải 书 (sách).","2":"椅子 (ghế) không được nhắc đến."}},{"q":"HSK1 Nghe – phần 4: nghe câu và câu hỏi, chọn đáp án.","audio":"桌子里有三本书。——桌子里有几本书？","opts":["两本","三本","四本"],"a":1,"why":{"0":"两 (liǎng) = 2; câu nói 三 (sān) = 3.","2":"四 (sì) = 4; đừng nhầm sān với sì."}},{"q":"HSK1 Nghe – phần 4: nghe câu và câu hỏi, chọn đáp án.","audio":"我看见了，你的东西在那儿。——东西在哪儿？","opts":["这儿","那儿","学校"],"a":1,"why":{"0":"这儿 (zhèr) = chỗ này; câu nói 那儿 (nàr).","2":"学校 không được nhắc đến."}},{"q":"HSK1 Nghe – phần 4: nghe câu và câu hỏi, chọn đáp án.","audio":"桌子上有两个包子。——桌子上有什么？","opts":["面包","鸡蛋","包子"],"a":2,"why":{"0":"面包 (miànbāo) là bánh mì; câu nói 包子 (bāozi) — không có âm miàn.","1":"鸡蛋 (trứng) không được nhắc đến."}}],"shadow":[{"t":"在哪儿","py":"zài nǎr","focus":"nǎr cuốn lưỡi thành một âm tiết; thanh 4 + thanh 3."},{"t":"这儿 / 那儿","py":"zhèr / nàr","focus":"Cuốn lưỡi ngay trong âm, không đọc tách 'zhè ér', 'nà ér'."},{"t":"桌子","py":"zhuōzi","focus":"zh uốn lưỡi + uo; 子 đọc nhẹ, ngắn."},{"t":"椅子","py":"yǐzi","focus":"yǐ thanh 3 xuống thấp, 子 nhẹ."},{"t":"找书","py":"zhǎo shū","focus":"Thanh 3 + thanh 1: zhǎo đọc nửa thanh 3 (thấp), shū cao đều; cả hai đều uốn lưỡi."},{"t":"东西","py":"dōngxi","focus":"西 đọc nhẹ = đồ vật (đọc dōngxī là 'đông tây')."},{"t":"我的书在哪儿？","py":"Wǒ de shū zài nǎr?","focus":"的 nhẹ; lên giọng nhẹ ở 哪儿 khi hỏi."},{"t":"这儿、那儿都没有！","py":"Zhèr, nàr dōu méiyǒu!","focus":"Ngắt nhẹ sau 这儿; nhấn vào 都没有."}],"dialog":{"title":"Tìm cốc nước trong văn phòng (王丽 giúp bạn tìm)","partner":"王丽","turns":[{"ai":"你找什么？","py":"Nǐ zhǎo shénme?","vi":"Bạn tìm gì thế?","model":"我找我的杯子。","mpy":"Wǒ zhǎo wǒ de bēizi.","accept":["我找我的杯子。","我找杯子。","找杯子。","我的杯子。","杯子。"],"frame":"我找我的___。","hint":"我找 + đồ vật bạn tìm."},{"ai":"在桌子上吗？","py":"Zài zhuōzi shàng ma?","vi":"Ở trên bàn à?","model":"没有。这儿、那儿都没有！","mpy":"Méiyǒu. Zhèr, nàr dōu méiyǒu!","accept":["没有。这儿、那儿都没有！","没有。","不在。","桌子上没有。","这儿没有。"],"frame":"没有。这儿、那儿都___！","hint":"Nói không có: 没有; chỗ nào cũng không có: 这儿、那儿都没有."},{"ai":"椅子下呢？","py":"Yǐzi xià ne?","vi":"Thế dưới ghế thì sao?","model":"我看见了！在椅子下！","mpy":"Wǒ kànjiàn le! Zài yǐzi xià!","accept":["我看见了！在椅子下！","我看见了！","看见了！","在椅子下！"],"frame":"我看见了！在___！","hint":"Thấy rồi: 我看见了; vị trí: 在 + 椅子下."},{"ai":"那本书也是你的吗？","py":"Nà běn shū yě shì nǐ de ma?","vi":"Quyển sách kia cũng là của bạn à?","model":"不是，是阮明的。","mpy":"Bú shì, shì Ruǎn Míng de.","accept":["不是，是阮明的。","不是。","不是我的。","是我的。","是。","不是，是我朋友的。"],"frame":"不是，是___的。","hint":"Không phải: 不是; của ai: 是 + người + 的 (ví dụ 阮明的)."}]},"reading":{"text":"桌子上有三本书，两本是我的，一本是王丽的。椅子下有一个杯子。桌子里有这些东西：两个面包和一个鸡蛋。","py":"Zhuōzi shang yǒu sān běn shū, liǎng běn shì wǒ de, yì běn shì Wáng Lì de. Yǐzi xià yǒu yí gè bēizi. Zhuōzi li yǒu zhèxiē dōngxi: liǎng gè miànbāo hé yí gè jīdàn.","vi":"(Bàn làm việc của tôi ở công ty) Trên bàn có ba quyển sách, hai quyển là của tôi, một quyển là của Vương Lệ. Dưới ghế có một cái cốc. Trong ngăn bàn có những thứ này: hai cái bánh mì và một quả trứng.","qs":[{"q":"Trên bàn có mấy quyển sách?","opts":["3","2","1"],"a":0,"why":{"1":"2 là số sách của người viết, không phải tổng số.","2":"1 là số sách của 王丽."}},{"q":"Quyển sách không phải của người viết là của ai?","opts":["王丽","阮明","王经理"],"a":0,"why":{"1":"阮明 không được nhắc đến; bài viết 一本是王丽的.","2":"王经理 không được nhắc đến; quyển còn lại là của 王丽."}},{"q":"Dưới ghế có gì?","opts":["một cái cốc","một quyển sách","hai cái bánh mì"],"a":0,"why":{"1":"Sách ở trên bàn (桌子上), không ở dưới ghế.","2":"Bánh mì ở trong ngăn bàn (桌子里)."}},{"q":"Trong ngăn bàn có gì?","opts":["2 cái bánh mì và 1 quả trứng","1 cái bánh mì và 2 quả trứng","2 cái bánh bao và 1 quả trứng"],"a":0,"why":{"1":"Đảo số: bài viết là 两个面包 (2 bánh mì) và 一个鸡蛋 (1 trứng).","2":"Bài viết nói 面包 (bánh mì), không phải 包子 (bánh bao)."}},{"q":"Đúng hay sai: 椅子上有一个杯子。","opts":["Sai","Đúng"],"a":0,"why":{"1":"Cái cốc ở 椅子下 (dưới ghế), không phải 椅子上 (trên ghế)."}}]}},{"id":"w2-thu-5","label":"Thứ 5","title":"Lớp tiếng Trung buổi tối: nghe, đọc, viết chữ Hán","desc":"Dùng câu lệnh trong lớp tiếng Trung buổi tối ở công ty, nói bài thứ mấy, hỏi chữ này đọc/viết thế nào và nói 'trước/sau khi…'.","rule":"第 + số = thứ tự (第五课); 怎么 + động từ hỏi cách làm (这个字怎么读？); 前, 后 đứng SAU sự việc: 下课后.","cards":[{"w":"上课","py":"shàngkè","m":"vào học, lên lớp","ex":"上课了！","expy":"Shàngkè le!","exm":"Vào học rồi!","n":"了 cuối câu báo tình huống mới. Trái nghĩa: 下课 (tan học). sh uốn lưỡi, k bật hơi."},{"w":"说话","py":"shuōhuà","m":"nói chuyện","ex":"不要说话！","expy":"Búyào shuōhuà!","exm":"Không được nói chuyện!","n":"说 (nói) + 话 (lời). Đã có 话 nên không thêm tân ngữ: ✗ 说话汉语 → ✓ 说汉语."},{"w":"第","py":"dì","m":"thứ (số thứ tự)","ex":"我们学第五课。","expy":"Wǒmen xué dì wǔ kè.","exm":"Chúng ta học bài thứ 5.","n":"第 + số = thứ tự: 第一, 第五. 课 (kè) = bài học: 第五课 = bài 5. Hỏi: 第几课？"},{"w":"老师","py":"lǎoshī","m":"giáo viên, thầy/cô","ex":"老师，这个字怎么读？","expy":"Lǎoshī, zhège zì zěnme dú?","exm":"Thưa cô, chữ này đọc thế nào ạ?","n":"Thanh 3 + 1. Gọi thầy/cô trực tiếp chỉ cần nói 老师！","img":"teacher"},{"w":"男","py":"nán","m":"nam","ex":"男同学读。","expy":"Nán tóngxué dú.","exm":"Các anh (học viên nam) đọc.","n":"男同学 = bạn học nam. Đọc n rõ, đừng thành l."},{"w":"女","py":"nǚ","m":"nữ","ex":"女同学写。","expy":"Nǚ tóngxué xiě.","exm":"Các chị (học viên nữ) viết.","n":"nǚ: chu tròn môi như 'uy' giữ nguyên môi. Đã gặp trong 女儿 (con gái)."},{"w":"读","py":"dú","m":"đọc (thành tiếng)","ex":"你们听我读。","expy":"Nǐmen tīng wǒ dú.","exm":"Mọi người nghe tôi đọc.","n":"读 = đọc to thành tiếng. Hỏi cách đọc: 怎么读？"},{"w":"听","py":"tīng","m":"nghe","ex":"听老师读。","expy":"Tīng lǎoshī dú.","exm":"Nghe cô giáo đọc.","n":"t bật hơi, thanh 1 cao đều. 听 + người/vật: 听我读."},{"w":"下课","py":"xiàkè","m":"tan học, hết giờ","ex":"下课了！","expy":"Xiàkè le!","exm":"Tan học rồi!","n":"Trái nghĩa với 上课. 下课后 = sau khi tan học."},{"w":"前","py":"qián","m":"trước","ex":"上课前读中文。","expy":"Shàngkè qián dú Zhōngwén.","exm":"Trước giờ học đọc tiếng Trung.","n":"Sự việc + 前 = trước khi…: 下课前. q bật hơi."},{"w":"写","py":"xiě","m":"viết","ex":"这个字怎么写？","expy":"Zhège zì zěnme xiě?","exm":"Chữ này viết thế nào?","n":"x + ie, thanh 3. Hỏi cách viết: 怎么写？"},{"w":"汉字","py":"Hànzì","m":"chữ Hán","ex":"我写十个汉字。","expy":"Wǒ xiě shí gè Hànzì.","exm":"Tôi viết mười chữ Hán.","n":"字 (zì) = chữ: 这个字 = chữ này. ⚠ 汉字 (chữ viết) ≠ 汉语 (tiếng Trung)."},{"w":"后","py":"hòu","m":"sau","ex":"下课后写汉字。","expy":"Xiàkè hòu xiě Hànzì.","exm":"Sau khi tan học viết chữ Hán.","n":"Sự việc + 后 = sau khi…. Trái nghĩa 前."},{"w":"学习","py":"xuéxí","m":"học, học tập","ex":"我学习中文。","expy":"Wǒ xuéxí Zhōngwén.","exm":"Tôi học tiếng Trung.","n":"学 (xué) đứng một mình cũng = học: 学第五课, 学写汉字. x + üe (viết ue)."},{"w":"中文","py":"Zhōngwén","m":"tiếng Trung","ex":"下课前读中文。","expy":"Xiàkè qián dú Zhōngwén.","exm":"Trước khi tan học đọc tiếng Trung.","n":"中文 ≈ 汉语 (đều là tiếng Trung); 中文 hay dùng khi nói về chữ viết, môn học."},{"w":"这个","py":"zhège","m":"cái này","ex":"这个字怎么读？","expy":"Zhège zì zěnme dú?","exm":"Chữ này đọc thế nào?","n":"这 + 个 + danh từ = … này. 个 đọc nhẹ."}],"scene":{"setting":"Lớp tiếng Trung buổi tối ở công ty. 阮明 vừa ngồi xuống thì thấy 王丽 cũng đăng ký lớp (chị học thêm cách dạy chữ Hán cho đồng nghiệp Việt). Cô 李老师 bước vào khi hai người còn đang nói chuyện.","img":"scene-zh-classroom","imgPrompt":"Photo of a small adult language class with a blank whiteboard: minh and wangli seated at desks turned towards each other, chatting before class; the teacher (teacher) is off-frame at the front. No text in image.","lines":[{"who":"阮明","t":"王丽，你好！你也上课吗？","py":"Wáng Lì, nǐ hǎo! Nǐ yě shàngkè ma?","vi":"Chào chị Lệ! Chị cũng đi học à?"},{"who":"王丽","t":"是！我们是同学了！","py":"Shì! Wǒmen shì tóngxué le!","vi":"Ừ! Giờ chúng mình là bạn cùng lớp rồi!"},{"who":"李老师","t":"上课了！不要说话！","py":"Shàngkè le! Búyào shuōhuà!","vi":"Vào học rồi! Không nói chuyện nữa nhé!"},{"who":"李老师","t":"我们学第五课。你们听我读。","py":"Wǒmen xué dì-wǔ kè. Nǐmen tīng wǒ dú.","vi":"Chúng ta học bài 5. Mọi người nghe tôi đọc."},{"who":"阮明","t":"老师，这个字怎么读？","py":"Lǎoshī, zhège zì zěnme dú?","vi":"Thưa cô, chữ này đọc thế nào ạ?"},{"who":"李老师","t":"读“学”，学习的学。","py":"Dú “xué”, xuéxí de xué.","vi":"Đọc là “xué”, chữ xué trong xuéxí (học tập)."},{"who":"阮明","t":"这个字怎么写？","py":"Zhège zì zěnme xiě?","vi":"Chữ này viết thế nào ạ?"},{"who":"李老师","t":"你看，我写。男同学读，女同学写！","py":"Nǐ kàn, wǒ xiě. Nán tóngxué dú, nǚ tóngxué xiě!","vi":"Anh xem này, tôi viết. Các anh đọc, các chị viết!"},{"who":"王丽","t":"老师，下课后呢？","py":"Lǎoshī, xiàkè hòu ne?","vi":"Thưa cô, thế sau giờ học thì sao ạ?"},{"who":"李老师","t":"下课后写十个汉字！","py":"Xiàkè hòu xiě shí gè Hànzì!","vi":"Sau giờ học, mỗi người viết mười chữ Hán!"}]},"patterns":[{"t":"第 + số = số thứ tự","f":[["我们学","第","五课"],["我们学","第几","课？"]],"ex":[["我们学第五课。","Chúng ta học bài 5."],["我们学第几课？","Chúng ta học bài mấy?"]],"bad":"我们学五第课。","good":"我们学第五课。","why":"第 luôn đứng TRƯỚC số: 第五 = thứ năm. Hỏi số thứ tự: 第几."},{"t":"怎么 + động từ？ hỏi cách làm","f":[["这个字","怎么","读？"],["这个字","怎么","写？"]],"ex":[["这个字怎么读？","Chữ này đọc thế nào?"],["你怎么还睡？","Sao bạn vẫn còn ngủ? (怎么 = sao, học Thứ 2)"]],"bad":"这个字读怎么？","good":"这个字怎么读？","why":"怎么 đứng TRƯỚC động từ (tiếng Việt nói 'đọc thế nào', tiếng Trung nói 'thế nào đọc'). Lưu ý: 怎么 + động từ = thế nào; 怎么还 + động từ = sao vẫn còn."},{"t":"Sự việc + 前 / 后 = trước / sau khi…","f":[["下课","后","写汉字"],["上课","前","读中文"]],"ex":[["下课后写汉字。","Sau khi tan học viết chữ Hán."],["上课前读中文。","Trước giờ học đọc tiếng Trung."]],"bad":"后下课写汉字。","good":"下课后写汉字。","why":"前/后 đứng SAU sự việc (下课后 = tan học + sau), ngược với tiếng Việt 'sau khi tan học'."},{"t":"了 cuối câu báo tình huống mới; 不要 + V = không được","f":[["上课","了！"],["不要","说话！"]],"ex":[["上课了！","Vào học rồi!"],["不要说话！","Không được nói chuyện!"]],"bad":"不说话！(muốn ra lệnh)","good":"不要说话！","why":"不说话 chỉ là câu kể '(tôi) không nói'. Muốn ra lệnh 'đừng/không được' phải dùng 不要 + động từ."}],"vocab":[{"q":"老师 (lǎoshī) nghĩa là?","opts":["giáo viên","học sinh","bạn học"],"a":0,"why":{"1":"'Học sinh' là 学生 (xuéshēng).","2":"'Bạn học' là 同学 (tóngxué)."}},{"q":"上课 / 下课 lần lượt là?","opts":["vào học / tan học","tan học / vào học","lên lầu / xuống lầu"],"a":0,"why":{"1":"Bị đảo: 上课 = vào học, 下课 = tan học.","2":"Có 课 (bài học) nên nói về giờ học, không phải lên/xuống lầu."}},{"q":"汉字 (Hànzì) nghĩa là?","opts":["chữ Hán","tiếng Trung (ngôn ngữ nói)","người Trung Quốc"],"a":0,"why":{"1":"Tiếng Trung là 汉语 / 中文; 汉字 là chữ viết.","2":"'Người Trung Quốc' là 中国人."}},{"q":"写 và 读 lần lượt là?","opts":["viết / đọc","đọc / viết","nghe / nói"],"a":0,"why":{"1":"Bị đảo: 写 (xiě) = viết, 读 (dú) = đọc.","2":"'Nghe / nói' là 听 / 说."}},{"q":"Từ trái nghĩa với 前 (qián, trước)?","opts":["后","下","里"],"a":0,"why":{"1":"下 = dưới, là trái nghĩa của 上 (trên).","2":"里 = trong."}},{"q":"女同学 nghĩa là?","opts":["bạn nữ (cùng lớp)","bạn nam (cùng lớp)","cô giáo"],"a":0,"why":{"1":"'Bạn nam' là 男同学 (nán).","2":"'Cô giáo' là 老师."}},{"q":"Điền: 我们学___五课。","opts":["第","个","本"],"a":0,"why":{"1":"个 là lượng từ, không tạo số thứ tự.","2":"本 là lượng từ cho sách (一本书), không đứng trước số để chỉ thứ tự."}},{
