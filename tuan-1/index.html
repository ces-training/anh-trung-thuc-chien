bạn nghe 'seven' /ˈsevn/ = 7."},"audio":"I get up at seven o'clock."},{"q":"Nghe: cuộc họp lúc mấy giờ?","opts":["7:14","4:07","7:40"],"a":2,"why":{"0":"Sai: forty (40) nhấn âm ĐẦU 'FOR-ty'; fourteen (14) nhấn âm SAU 'four-TEEN'.","1":"Sai: tiếng Anh nói giờ trước, phút sau: seven forty = 7 giờ 40."},"audio":"The meeting is at seven forty."},{"q":"Nghe: người nói cảm thấy thế nào?","opts":["Ngạc nhiên, không vui vì người kia vẫn nằm trên giường","Vui vì người kia dậy sớm","Hỏi người kia muốn ăn gì"],"a":0,"why":{"1":"Sai: 'still in bed' = vẫn còn trên giường, nghĩa là chưa dậy.","2":"Sai: câu không có từ nào về ăn uống; 'Why…?' là hỏi 'tại sao'."},"audio":"Why are you still in bed?"},{"q":"Nghe: người nói bảo người kia làm gì?","opts":["Ngủ tiếp đi","Dậy đi","Đi ngủ sớm"],"a":1,"why":{"0":"Sai: 'Don't sleep' = ĐỪNG ngủ – ngược lại.","2":"Sai: 'Get up' = thức dậy, không phải đi ngủ."},"audio":"Don't sleep! Get up!"},{"q":"Nghe: người nói muốn gì?","opts":["Đi học ngay","Ăn sáng","Ngủ tiếp"],"a":2,"why":{"0":"Sai: người nói bảo 'still early' (còn sớm) nên chưa muốn đi.","1":"Sai: 'I want to sleep' = muốn ngủ, không nhắc đến bữa sáng."},"audio":"It's still early. I want to sleep."}],"hsk":[{"q":"TOEIC Bridge – Hỏi & đáp: nghe câu hỏi, chọn câu đáp phù hợp nhất.","opts":["It's seven o'clock.","I'm twelve.","Yes, it is."],"a":0,"why":{"1":"Sai: đây là trả lời tuổi (How old are you?), không phải giờ.","2":"Sai: câu hỏi bắt đầu bằng What (câu hỏi Wh-) nên không trả lời Yes/No."},"audio":"What time is it?"},{"q":"TOEIC Bridge – Hỏi & đáp: nghe câu nói (mẹ gọi An dậy), chọn câu đáp phù hợp nhất.","opts":["Nice to meet you.","OK, Mum.","Goodbye!"],"a":1,"why":{"0":"Sai: câu này dùng khi gặp người lạ lần đầu, không dùng để đáp lời gọi dậy.","2":"Sai: tạm biệt không phải câu đáp khi mẹ gọi dậy."},"audio":"Get up, An! It's seven o'clock!"},{"q":"TOEIC Bridge – Hỏi & đáp: nghe câu hỏi, chọn câu đáp phù hợp nhất.","opts":["At school.","Yes, it is.","At half past eight."],"a":2,"why":{"0":"Sai: câu hỏi 'What time' hỏi GIỜ, còn 'At school' trả lời nơi chốn.","1":"Sai: câu hỏi Wh- (What time…) không trả lời Yes/No."},"audio":"What time is the meeting?"},{"q":"TOEIC Bridge – Hỏi & đáp: nghe câu nói, chọn câu đáp phù hợp nhất.","opts":["Oh no! I'm late!","I'm nine.","Good morning! Nice to meet you."],"a":0,"why":{"1":"Bẫy âm: nghe thấy 'nine' nhưng câu nói là về GIỜ (9:30), không hỏi tuổi.","2":"Sai: câu chào làm quen không hợp khi nghe báo đã 9 rưỡi."},"audio":"It's half past nine!"},{"q":"TOEIC Bridge – Hỏi & đáp: nghe câu hỏi, chọn câu đáp phù hợp nhất.","opts":["Yes, I am.","It's still early!","At school."],"a":1,"why":{"0":"Sai: câu hỏi 'Why…?' (tại sao) cần một lý do, không trả lời Yes/No.","2":"Sai: 'At school' trả lời câu hỏi Where (ở đâu), không trả lời Why."},"audio":"Why are you still in bed?"}],"shadow":[{"t":"get up","focus":"Nối âm get‿up → 'ghe-tắp': âm /t/ chuyển sang âm u, không tách 'ghét – ắp'. Nhấn vào 'up'."},{"t":"What time is it?","focus":"Nối time‿is‿it → 'tai-mi-zít'. Câu hỏi Wh- nên XUỐNG giọng ở cuối, không lên giọng."},{"t":"o'clock","focus":"/əˈklɒk/: âm đầu 'ơ' rất nhẹ, nhấn 'CLÓC'. Giữ cụm /kl/, không đọc thành 'ô-cờ-lốc'."},{"t":"half past seven","focus":"half /hɑːf/: chữ l CÂM. past /pɑːst/ giữ /st/ cuối. seven /ˈsevn/ có /v/ (răng chạm môi dưới), không đọc 'xe-ven'."},{"t":"It's seven twenty.","focus":"Nhớ /s/ trong It's. twenty nhấn âm đầu 'TWEN-ty'; đừng nhầm với twelve."},{"t":"Don't call me!","focus":"call /kɔːl/ có âm /l/ cuối – cong đầu lưỡi lên, không đọc thành 'con'. /t/ trong don't rất nhẹ."},{"t":"Why are you still in bed?","focus":"still /stɪl/: /t/ sau /s/ KHÔNG bật hơi, không chèn 'xờ' ('xờ-tiu'). Nối still‿in → 'sti-lin'. bed có /d/ cuối."},{"t":"Let's go to the meeting!","focus":"Let's kết thúc bằng /ts/. meeting /ˈmiːtɪŋ/: i dài, giữ /ŋ/ cuối (không bật 'g'), không đọc 'mít-tinh'."}],"dialog":{"title":"Bạn cùng phòng trọ gọi bạn dậy đi làm","partner":"Linh","turns":[{"ai":"Good morning! Get up!","vi":"Chào buổi sáng! Dậy đi!","model":"What time is it?","accept":["What time is it?","What time is it now?","What's the time?","Good morning! What time is it?"],"frame":"What ___ is it?","hint":"Hỏi bây giờ là mấy giờ."},{"ai":"It's seven o'clock!","vi":"Bảy giờ rồi!","model":"It's still early. I want to sleep.","accept":["It's still early. I want to sleep.","It's still early.","It's early. I want to sleep.","I want to sleep."],"frame":"It's still ___. I want to ___.","hint":"Nói là vẫn còn sớm, bạn muốn ngủ."},{"ai":"What time is the meeting?","vi":"Mấy giờ họp?","model":"At half past seven.","accept":["At half past seven.","Half past seven.","At seven thirty.","It's at half past seven.","The meeting is at half past seven."],"frame":"At half ___ seven.","hint":"Trả lời: 7 giờ rưỡi (nhớ 'at' trước giờ)."},{"ai":"Why are you still in bed? You're late!","vi":"Sao bạn vẫn còn nằm trên giường? Muộn rồi đấy!","model":"OK, I'm up! Let's go!","accept":["OK, I'm up! Let's go!","OK, I'm up!","OK! Let's go!","OK, let's go!"],"frame":"OK, I'm ___! Let's ___!","hint":"Nói: được rồi, mình dậy rồi, đi thôi!"}]},"reading":{"text":"My name is Kevin. I get up at seven twenty in the morning. The meeting is at half past eight. My son, Ben, gets up at half past six. He says, \"Dad, get up! Don't be late!\"","vi":"Tôi tên là Kevin. Buổi sáng tôi dậy lúc bảy giờ hai mươi. Cuộc họp lúc tám giờ rưỡi. Con trai tôi, bé Ben, dậy lúc sáu giờ rưỡi. Cháu nói: “Bố ơi, dậy đi! Đừng đi muộn!”","qs":[{"q":"Kevin dậy lúc mấy giờ?","opts":["8:30","6:30","7:20"],"a":2,"why":{"0":"Sai: 8:30 (half past eight) là giờ họp.","1":"Sai: 6:30 là giờ bé Ben dậy."}},{"q":"Cuộc họp lúc mấy giờ?","opts":["8:30","7:20","6:30"],"a":0,"why":{"1":"Sai: 7:20 là giờ Kevin thức dậy.","2":"Sai: 6:30 là giờ Ben dậy."}},{"q":"Bé Ben dậy lúc mấy giờ?","opts":["7:20","6:30","8:30"],"a":1,"why":{"0":"Sai: đó là giờ Kevin dậy.","2":"Sai: đó là giờ họp."}},{"q":"Ai dậy sớm hơn?","opts":["Kevin","Hai người dậy cùng giờ","Ben"],"a":2,"why":{"0":"Sai: Kevin dậy 7:20, muộn hơn Ben (6:30).","1":"Sai: 6:30 và 7:20 là hai giờ khác nhau."}},{"q":"Đúng hay sai: \"Ben gets up at seven twenty.\"","opts":["Đúng","Sai"],"a":1,"why":{"0":"Không đúng: Ben dậy lúc half past six (6:30); seven twenty (7:20) là giờ Kevin dậy."}}]}},{"id":"w2-thu-3","label":"Thứ 3","title":"Bữa sáng: mời và nhường","desc":"Gọi tên đồ ăn sáng, nói mình muốn ăn/uống gì, mời bằng Would you like…?, nhận/từ chối lịch sự (Yes, please / No, thanks) và đưa đồ bằng Here you are – qua cảnh ăn sáng ở pantry công ty.","rule":"Mời: Would you like some milk? – Đáp: Yes, please. / No, thanks. Muốn làm gì: I want TO + động từ (I want to drink water); milk, water, bread không đếm được nên không dùng 'a'.","cards":[{"w":"breakfast","m":"bữa sáng","ex":"Let's have breakfast!","exm":"Ăn sáng thôi!","n":"Thường nói 'have breakfast' (ăn sáng); không có 'a/the': have breakfast. Đọc /ˈbrekfəst/ – 'BRẾC-fợst'.","img":"breakfast"},{"w":"eat","m":"ăn","ex":"I want to eat a bun.","exm":"Tôi muốn ăn một cái bánh bao.","n":"eat đi với đồ ăn (bun, bread, egg). Đồ uống dùng drink – không nói 'eat milk'."},{"w":"drink","m":"uống","ex":"Drink some water!","exm":"Uống chút nước đi!","n":"drink đi với water, milk. Người Việt hay nói 'drink' thành 'đrinh' – nhớ /ŋk/ cuối."},{"w":"bun","m":"bánh bao (steamed bun)","ex":"There's only one bun!","exm":"Chỉ còn một cái bánh bao!","n":"Đếm được: a bun, two buns. bun /bʌn/ ≠ bread (bánh mì)."},{"w":"bread","m":"bánh mì","ex":"I love bread and eggs.","exm":"Tôi rất thích bánh mì và trứng.","n":"Không đếm được: KHÔNG nói 'a bread' hay 'breads'. Nói some bread / a piece of bread.","img":"bread"},{"w":"egg","m":"quả trứng","ex":"Have an egg!","exm":"Ăn một quả trứng đi!","n":"Đếm được, bắt đầu bằng nguyên âm nên dùng AN: an egg (không nói 'a egg'). Nhiều: two eggs.","img":"egg"},{"w":"milk","m":"sữa","ex":"Would you like a little milk?","exm":"Bạn uống một chút sữa không?","n":"Không đếm được: không nói 'a milk'. Nói some milk / a cup of milk / a little milk.","img":"milk"},{"w":"water","m":"nước","ex":"No milk, thanks. Water, please.","exm":"Không uống sữa đâu, cảm ơn. Cho tôi nước nhé.","n":"Không đếm được: some water, a cup of water. Đọc /ˈwɔːtə/ – 'UÔ-tơ', nhấn âm đầu."},{"w":"a little","m":"một chút, một ít","ex":"Have a little milk!","exm":"Uống một chút sữa đi!","n":"Dùng với danh từ KHÔNG đếm được: a little milk / water / bread. Với đồ đếm được nói 'one more egg'."},{"w":"half","m":"một nửa","ex":"Half for you, half for Linh.","exm":"Một nửa cho bạn, một nửa cho Linh.","n":"half /hɑːf/ – chữ l câm. Đã gặp trong 'half past seven' (thứ 2)."},{"w":"Would you like …?","m":"Bạn có muốn …? (lời mời lịch sự)","ex":"Would you like an egg?","exm":"Bạn ăn trứng không?","n":"Cách mời lịch sự ở công sở, với sếp, khách hàng. Would you like + danh từ (an egg) hoặc + TO + động từ (to eat). Đáp: Yes, please. / No, thanks."},{"w":"Here you are.","m":"Đây (đưa cho bạn).","ex":"Here you are. Have some water!","exm":"Của bạn đây. Uống nước đi!","n":"Nói khi đưa đồ cho ai. Không nói 'You are here' (= bạn ở đây rồi) hay 'Here are you'."}],"scene":{"setting":"8 giờ sáng ở pantry (phòng ăn nhỏ) của văn phòng. Kevin mang đồ ăn sáng đến mời mọi người; chỉ còn một cái bánh bao nên anh chia đôi cho An và Linh. An lịch sự từ chối sữa và xin nước.","img":"thanks","imgPrompt":"A small office pantry with a coffee machine and mugs on the shelves: kevin, in an olive-green shirt, hands a yellow cup to an, in a blue top, who smiles with one hand on her chest to say thank you; city view through the window.","lines":[{"who":"Kevin","t":"Good morning! Let's have breakfast. We have buns, bread and eggs.","vi":"Chào buổi sáng! Ăn sáng thôi. Có bánh bao, bánh mì và trứng nhé."},{"who":"An","t":"Thank you! I want a bun, please.","vi":"Cảm ơn anh! Cho em một cái bánh bao ạ."},{"who":"Kevin","t":"Oh, there's only one bun! Half for you, half for Linh.","vi":"Ồ, chỉ còn một cái bánh bao! Một nửa cho em, một nửa cho Linh."},{"who":"Kevin","t":"Would you like some milk?","vi":"Em uống sữa không?"},{"who":"An","t":"No, thanks. I want to drink water.","vi":"Dạ không, em cảm ơn. Em muốn uống nước."},{"who":"Kevin","t":"Here you are. Have a little water… and an egg!","vi":"Của em đây. Uống chút nước… và ăn thêm quả trứng nhé!"},{"who":"An","t":"Thank you, Kevin!","vi":"Em cảm ơn anh Kevin!"}]},"patterns":[{"t":"Mời lịch sự: Would you like + đồ ăn/uống? – Yes, please. / No, thanks.","f":[["(mời)","Would you like","an egg?"],["(nhận)","Yes,","please."],["(từ chối)","No,","thanks."]],"ex":[["Would you like some milk? – No, thanks.","Bạn uống sữa không? – Không, cảm ơn."],["Would you like a bun? – Yes, please.","Ăn bánh bao không? – Vâng, cho tôi một cái."]],"bad":"Would you like eat an egg?","good":"Would you like an egg?","why":"Người Việt dịch 'bạn có muốn ĂN trứng không' nên chèn 'eat' ngay sau 'like' – sai. Would you like + danh từ (an egg), hoặc + TO + động từ (Would you like to eat an egg?). Đáp lại: 'Yes, please' (không nói 'Yes, I like' – đó là 'tôi thích')."},{"t":"Muốn gì / muốn làm gì: I want + danh từ / I want to + động từ","f":[["I","want","a bun."],["I","want to","drink water."]],"ex":[["I want a bun!","Tôi muốn bánh bao!"],["I want to drink water.","Tôi muốn uống nước."],["I don't want milk.","Tôi không muốn sữa."]],"bad":"I want drink milk.","good":"I want to drink milk.","why":"Hai động từ đứng cạnh nhau thì động từ sau cần 'to': want TO drink. Tiếng Trung (我想喝) và tiếng Việt không có 'to' nên rất hay quên. Phủ định: I don't want…, không nói 'I not want' hay 'I no want'."},{"t":"Đếm được và không đếm được: an egg / a little milk","f":[["Have","an","egg."],["Have","a little","milk."]],"ex":[["an egg, two eggs, a bun, two buns","1 quả trứng, 2 quả trứng, 1 cái bánh bao, 2 cái"],["some bread, a little water, a cup of milk","ít bánh mì, chút nước, một cốc sữa"]],"bad":"I want a milk.","good":"I want a little milk.","why":"milk, water, bread là danh từ KHÔNG đếm được: không dùng a/an, không thêm -s (không nói 'a milk', 'breads'). Dùng some / a little / a cup of. egg, bun đếm được: an egg (trước nguyên âm dùng an), two buns. Trong tiếng Trung đây giống lượng từ mượn 一杯水 = a cup of water."}],"vocab":[{"q":"'breakfast' nghĩa là:","opts":["bữa tối","bữa sáng","bánh mì"],"a":1,"why":{"0":"Sai: bữa tối là dinner.","2":"Sai: bánh mì là bread; breakfast là bữa ăn, không phải món ăn."}},{"q":"'milk' nghĩa là:","opts":["nước","trứng","sữa"],"a":2,"why":{"0":"Sai: nước là water.","1":"Sai: trứng là egg."}},{"q":"Động từ nào đi với 'water' và 'milk'?","opts":["drink","eat","sleep"],"a":0,"why":{"1":"Sai: eat dùng cho đồ ăn (bread, bun, egg); không nói 'eat water'.","2":"Sai: sleep = ngủ, không đi với đồ uống."}},{"q":"'bánh bao' tiếng Anh là:","opts":["bread","bun","egg"],"a":1,"why":{"0":"Sai: bread = bánh mì; bánh bao hấp là (steamed) bun.","2":"Sai: egg = quả trứng."}},{"q":"'egg' là:","opts":["cái cốc","sữa","quả trứng"],"a":2,"why":{"0":"Sai: cái cốc là cup.","1":"Sai: sữa là milk."}},{"q":"Điền: There's only one bun. ___ for you, half for Linh.","opts":["Half","A little","Here"],"a":0,"why":{"1":"Sai: a little dùng với danh từ không đếm được (a little milk); ở đây là chia đôi cái bánh.","2":"Sai: 'Here for you' không có nghĩa 'một nửa cho bạn'."}},{"q":"Khi đưa đồ cho ai, bạn nói:","opts":["You are here.","Here you are.","Here are you."],"a":1,"why":{"0":"Sai: 'You are here' = bạn đang ở đây (chỉ vị trí), không phải 'đây, cầm lấy'.","2":"Sai trật tự: cụm cố định là 'Here you are'."}}],"grammar":[{"q":"Câu MỜI lịch sự nào đúng?","opts":["You like milk?","Would you like drink milk?","Would you like some milk?"],"a":2,"why":{"0":"Sai: câu này hỏi 'bạn thích sữa à?' (sở thích), không phải lời mời; lại thiếu 'Do'.","1":"Sai: sau 'Would you like' muốn thêm động từ phải có 'to': Would you like TO drink milk?"}},{"q":"Kevin hỏi: 'Would you like an egg?' – Bạn muốn nhận. Đáp:","opts":["Yes, please.","Yes, I like.","Yes, here you are."],"a":0,"why":{"1":"Sai: 'like' cần tân ngữ, và 'I like' = tôi thích (sở thích), không phải nhận lời mời.","2":"Sai: 'Here you are' dùng khi BẠN đưa đồ cho người khác."}},{"k":"type","q":"Điền 1 từ: I want ___ drink water. (Tôi muốn uống nước.)","model":"to","accept":["to"],"why":"want + TO + động từ: I want to drink. Tiếng Việt/tiếng Trung không có từ này nên người Việt rất hay bỏ sót."},{"q":"Chọn từ đúng: I want ___ milk.","opts":["a","a little","two"],"a":1,"why":{"0":"Sai: milk không đếm được nên không dùng 'a'.","2":"Sai: không đếm milk bằng số trực tiếp; phải nói two cups of milk."}},{"q":"Chọn từ đúng: Have ___ egg!","opts":["a","two","an"],"a":2,"why":{"0":"Sai: egg bắt đầu bằng nguyên âm /e/ nên dùng 'an', không phải 'a'.","1":"Sai: 'two' đi với số nhiều 'two eggs'; 'two egg' thiếu -s."}},{"q":"Phủ định của 'I want milk.' là:","opts":["I don't want milk.","I not want milk.","I no want milk."],"a":0,"why":{"1":"Sai: tiếng Anh phủ định động từ thường bằng don't/doesn't, không đặt 'not' trực tiếp trước động từ (lỗi dịch 'tôi không muốn').","2":"Sai: 'no' không dùng để phủ định động từ."}}],"listen":[{"q":"Nghe: người nói muốn ăn gì?","opts":["Bánh bao","Bánh mì","Trứng"],"a":1,"why":{"0":"Sai: bánh bao là 'bun'; bạn nghe 'bread'.","2":"Sai: trứng là 'egg', không có trong câu."},"audio":"I want some bread."},{"q":"Nghe: người nói xin gì?","opts":["Một cốc nước","Một quả trứng","Một cốc sữa"],"a":2,"why":{"0":"Sai: nước là 'water'; bạn nghe 'milk'.","1":"Sai: 'a cup of' = một cốc, đi với đồ uống, không phải trứng."},"audio":"Kevin, I want a cup of milk."},{"q":"Nghe: câu này nói gì?","opts":["Chỉ có một quả trứng","Có nhiều trứng","Không có trứng"],"a":0,"why":{"1":"Sai: 'only one' = chỉ một.","2":"Sai: vẫn có 'one egg' – một quả."},"audio":"There's only one egg!"},{"q":"Nghe: người nói thích uống gì?","opts":["Sữa","Nước","Cả sữa và nước"],"a":1,"why":{"0":"Sai: 'I don't like milk' = không thích sữa.","2":"Sai: người nói KHÔNG thích sữa, chỉ thích nước."},"audio":"I don't like milk. I like water."},{"q":"Nghe: người nói đang làm gì?","opts":["Xin thêm đồ ăn cho mình","Bảo người kia đi ngủ","Mời người kia ăn/uống thêm"],"a":2,"why":{"0":"Sai: 'Have…!' là câu mời người khác, không phải 'cho tôi thêm'.","1":"Sai: câu không có 'sleep' hay 'go to bed'."},"audio":"Have a little more!"},{"q":"Nghe: người nói làm gì?","opts":["Mời ngồi và đưa bánh bao","Bảo người kia đứng dậy","Hỏi mua bánh bao"],"a":0,"why":{"1":"Sai: 'Sit down' = ngồi xuống, ngược với đứng dậy.","2":"Sai: 'Here's a bun for you' = đây là bánh bao cho bạn – đưa, không phải mua."},"audio":"Sit down. Here's a bun for you."},{"q":"Nghe: bánh bao được chia thế nào?","opts":["Cho Linh cả cái","Chia đôi cho hai người","Chỉ cho bạn"],"a":1,"why":{"0":"Sai: 'half for you, half for Linh' – mỗi người một nửa.","2":"Sai: Linh cũng được một nửa."},"audio":"Half for you, half for Linh."}],"hsk":[{"q":"TOEIC Bridge – Đọc câu ngắn: \"I don't drink milk in the morning. I drink water.\" ★ What does he drink in the morning?","opts":["milk","a cup","water"],"a":2,"why":{"0":"Sai: câu nói 'I don't drink milk' – anh ấy KHÔNG uống sữa.","1":"Sai: cup là cái cốc, không phải đồ uống."}},{"q":"TOEIC Bridge – Đọc: \"There's only one bun. Let's have half each.\" ★ The buns:","opts":["There's only one.","There are ten.","There are no buns."],"a":0,"why":{"1":"Sai: câu nói 'only one bun' – chỉ một cái.","2":"Sai: vẫn còn một cái, nên mới chia đôi."}},{"q":"TOEIC Bridge – Đọc: \"Sarah gets up at seven and has breakfast at half past seven.\" ★ What time does Sarah have breakfast?","opts":["At seven.","At half past seven.","At eight."],"a":1,"why":{"0":"Sai: 7:00 là giờ Sarah DẬY (gets up).","2":"Sai: câu không nhắc đến 8 giờ."}},{"q":"TOEIC Bridge – Đọc: \"I love eggs, and I love bread too.\" ★ What does he love?","opts":["buns","milk","eggs and bread"],"a":2,"why":{"0":"Sai: bun không có trong câu.","1":"Sai: milk không có trong câu."}},{"q":"TOEIC Bridge – Đọc: \"Linh, have a little more water!\" ★ Linh should:","opts":["drink water","eat a bun","get up"],"a":0,"why":{"1":"Sai: câu nói về water (nước), không phải bun.","2":"Sai: câu không bảo thức dậy."}}],"shadow":[{"t":"breakfast","focus":"/ˈbrekfəst/: 'BRẾC-fợst' – nhấn âm đầu, âm 'fast' đọc nhẹ thành 'fợst'. Giữ /st/ cuối, không đọc 'brếch-phát'."},{"t":"milk","focus":"/mɪlk/: i ngắn, có /l/ (cong lưỡi) rồi /k/ nhẹ cuối. Đừng đọc thành 'mít'."},{"t":"an egg","focus":"Nối âm an‿egg → 'ơ-néc': n chuyển sang egg. /g/ cuối nhẹ, không thêm 'ơ'."},{"t":"a little water","focus":"little /ˈlɪtl/: 'LI-tồ', kết thúc bằng /l/. water /ˈwɔːtə/: nhấn 'UÔ'."},{"t":"Would you like some milk?","focus":"would‿you nối thành 'wu-đʒu'. 'l' trong would câm. Câu hỏi Yes/No nên LÊN giọng ở cuối."},{"t":"Here you are.","focus":"Đọc liền 'hia-yu-A', nhấn vào 'are'. Nói khi đưa đồ, giọng thân thiện."},{"t":"I want a bun!","focus":"Nối want‿a → 'won-tơ'. bun /bʌn/ có /n/ cuối rõ, âm 'ă' ngắn."},{"t":"Half for you, half for Linh.","focus":"half: l câm /hɑːf/. Nhấn 'HALF' và 'YOU', 'LINH' để thể hiện chia đều."}],"dialog":{"title":"Ăn sáng ở pantry công ty – đồng nghiệp mời bạn","partner":"Kevin","turns":[{"ai":"Good morning! Sit down. Let's have breakfast!","vi":"Chào bạn! Ngồi đi. Ăn sáng nào!","model":"Thank you!","accept":["Thank you!","Thanks!","Thank you very much!","Good morning! Thank you!"],"frame":"___ you!","hint":"Cảm ơn lời mời."},{"ai":"What would you like? A bun or some bread?","vi":"Bạn muốn ăn gì? Bánh bao hay bánh mì?","model":"A bun, please.","accept":["A bun, please.","I want a bun, please.","I'd like a bun, please.","Some bread, please.","Bread, please."],"frame":"A ___, please.","hint":"Chọn một món, nhớ thêm 'please'."},{"ai":"Would you like some milk?","vi":"Bạn uống sữa không?","model":"No, thanks. A little water, please.","accept":["No, thanks. A little water, please.","No, thanks.","No, thank you. Water, please.","Yes, please."],"frame":"No, ___. A little water, please.","hint":"Từ chối lịch sự và xin một chút nước."},{"ai":"Here you are. Have an egg too!","vi":"Của bạn đây. Ăn thêm quả trứng nữa nhé!","model":"OK, thank you!","accept":["OK, thank you!","Thank you!","Thanks!","Yes, please. Thank you!"],"frame":"OK, ___ you!","hint":"Nhận và cảm ơn."}]},"reading":{"text":"At seven o'clock, I have breakfast with Linh. Linh loves buns. I love bread and eggs. I don't like milk. Linh says, \"Have a little milk!\"","vi":"Lúc bảy giờ, tôi ăn sáng với Linh. Linh rất thích bánh bao. Tôi rất thích bánh mì và trứng. Tôi không thích sữa. Linh nói: “Uống một chút sữa đi!”","qs":[{"q":"Mấy giờ người viết và Linh ăn sáng?","opts":["7:30","7:00","6:00"],"a":1,"why":{"0":"Sai: bài viết nói 'at seven o'clock' = 7 giờ đúng.","2":"Sai: không có 'six' trong bài."}},{"q":"Linh thích ăn gì?","opts":["Bánh mì","Trứng","Bánh bao"],"a":2,"why":{"0":"Sai: bánh mì (bread) là món người viết thích.","1":"Sai: trứng (eggs) là món người viết thích."}},{"q":"Người viết thích ăn gì?","opts":["Bánh mì và trứng","Bánh bao","Sữa"],"a":0,"why":{"1":"Sai: bánh bao là món Linh thích.","2":"Sai: 'I don't like milk' – không thích sữa."}},{"q":"Đúng hay sai: \"Linh loves bread.\"","opts":["Đúng","Sai"],"a":1,"why":{"0":"Không đúng: Linh thích buns (bánh bao); bread là món người viết thích."}},{"q":"Linh bảo người viết làm gì?","opts":["Ăn thêm trứng","Đi làm đi","Uống một chút sữa"],"a":2,"why":{"0":"Sai: Linh nói 'Have a little milk' – về sữa, không phải trứng.","1":"Sai: câu của Linh không nhắc đến đi làm."}}]}},{"id":"w2-thu-4","label":"Thứ 4","title":"Đồ vật, vị trí: tìm đồ","desc":"Hỏi đồ vật ở đâu (Where is my book / cup / phone?), trả lời với on / under / in, nói 'có' bằng There is / There are – qua cảnh Linh tìm đồ ở khu làm việc.","rule":"Where is my book? – It's ON / UNDER / IN + the + đồ vật (on the table). Giới từ đứng TRƯỚC danh từ (ngược tiếng Trung 桌子上). 'Ở đâu đó có…' dùng There is (1) / There are (nhiều), không dùng 'have'.","cards":[{"w":"Where is …?","m":"… ở đâu?","ex":"Kevin, where's my book?","exm":"Anh Kevin, quyển sách của em đâu?","n":"Where's = Where is. Số nhiều: Where are my things? Câu hỏi xuống giọng ở cuối.","img":"where"},{"w":"look for","m":"tìm","ex":"I'm looking for my book.","exm":"Tôi đang tìm quyển sách.","n":"look FOR = tìm; look AT = nhìn vào; see = nhìn thấy. Đừng quên 'for': không nói 'I look my book'."},{"w":"book","m":"quyển sách","ex":"Which book? Is it on the table?","exm":"Quyển nào? Có trên bàn không?","n":"a book, two books. 'my English book' = sách tiếng Anh của mình. Đọc /bʊk/ u ngắn.","img":"book"},{"w":"table","m":"cái bàn","ex":"The cup is on the table.","exm":"Cái cốc ở trên bàn.","n":"Bàn làm việc ở văn phòng thường gọi là desk; 'in the desk' = trong ngăn bàn.","img":"table"},{"w":"chair","m":"cái ghế","ex":"It's under the chair!","exm":"Nó ở dưới ghế!","n":"chair /tʃeə/ – 'che-ơ', không đọc thành 'che'. Số nhiều: chairs.","img":"chair"},{"w":"bag","m":"cái túi, cái cặp","ex":"My things are in my bag.","exm":"Đồ của tôi ở trong túi.","n":"bag /bæɡ/ – a mở rộng miệng; khác back /bæk/ (lưng, quay lại).","img":"bag"},{"w":"on","m":"ở trên (chạm mặt)","ex":"The book is on the table.","exm":"Quyển sách ở trên bàn.","n":"on + the + đồ vật: on the table. Không nói 'on table' (thiếu the) hay 'table on' (kiểu tiếng Trung)."},{"w":"under","m":"ở dưới","ex":"Your cup is under the chair.","exm":"Cốc của bạn ở dưới ghế.","n":"Nhấn âm đầu: UN-der. Trái nghĩa: on."},{"w":"in","m":"ở trong","ex":"There are two books in my bag.","exm":"Trong túi tôi có hai quyển sách.","n":"in the bag, in the desk (trong ngăn bàn). in + the + đồ vật."},{"w":"here / there","m":"ở đây / ở kia","ex":"It's not here, and it's not there!","exm":"Chỗ này không có, chỗ kia cũng không!","n":"Không thêm 'in' hay 'at': không nói 'in here' khi trả lời đơn giản 'ở đây'. 'over there' = ở đằng kia."},{"w":"see","m":"nhìn thấy","ex":"I see it! It's under the chair!","exm":"Thấy rồi! Nó ở dưới ghế!","n":"see = nhìn thấy (có kết quả); look = nhìn (hành động). Giống 看见 khác 看 trong tiếng Trung."},{"w":"There is / There are","m":"Có (ở đâu đó)","ex":"There are some things in your desk.","exm":"Trong ngăn bàn của bạn có mấy thứ này.","n":"There is + 1 vật; There are + nhiều vật. Không dùng 'have' để nói 'có' ở một chỗ."}],"scene":{"setting":"Sáng thứ Tư ở khu làm việc chung. Linh sắp đi họp nhưng không tìm thấy quyển sách tiếng Anh; Kevin ngồi đối diện giúp tìm, rồi phát hiện trong túi Linh còn có cả cốc và điện thoại.","img":"work","imgPrompt":"A busy open-plan office with long shared desks: linh, in a mustard-yellow top, works on a laptop with notebooks beside her, while kevin, in glasses and a navy shirt, sits across the desk; colleagues at laptops in the background, large windows.","lines":[{"who":"Linh","t":"Kevin, where's my English book?","vi":"Anh Kevin, quyển sách tiếng Anh của em đâu rồi?"},{"who":"Kevin","t":"Which book? Is it on the table?","vi":"Quyển nào? Trên bàn không có à?"},{"who":"Linh","t":"No! I'm looking for it… It's not here, and it's not there!","vi":"Không có! Em đang tìm… Chỗ này không có, chỗ kia cũng không!"},{"who":"Kevin","t":"I see it! It's under the chair!","vi":"Anh thấy rồi! Ở dưới ghế kìa!"},{"who":"Kevin","t":"And there are two cups and a phone in your bag. Are they your things too?","vi":"Trong túi em còn có hai cái cốc và một cái điện thoại. Cũng là đồ của em à?"},{"who":"Linh","t":"…Yes, they're my things. Thanks, Kevin!","vi":"… Dạ, đồ của em ạ. Em cảm ơn anh Kevin!"}]},"patterns":[{"t":"Hỏi vị trí: Where is …? – It's + on / under / in + the + N","f":[["Where","is","my book?"],["It's","on","the table."],["It's","under","the chair."]],"ex":[["Where's my cup? – It's under the chair.","Cốc của tôi đâu? – Ở dưới ghế."],["Where are my things? – They're in the bag.","Đồ của tôi đâu? – Ở trong túi."]],"bad":"It's table on.","good":"It's on the table.","why":"Tiếng Trung đặt từ chỉ vị trí SAU danh từ (桌子上 = bàn + trên), nhưng tiếng Anh đặt giới từ TRƯỚC: on the table. Người Việt còn hay quên 'the' (It's on table) vì tiếng Việt không có mạo từ. Số nhiều đổi is → are, it → they."},{"t":"Có cái gì ở đâu: There is / There are + vật + nơi chốn","f":[["There","is","a book on the table."],["There","are","two books in my bag."]],"ex":[["There is a cup under the chair.","Dưới ghế có một cái cốc."],["There are two buns on the table.","Trên bàn có hai cái bánh bao."],["There isn't a book on the table.","Trên bàn không có quyển sách nào."]],"bad":"The table has two books.","good":"There are two books on the table.","why":"Người Việt dịch 'có' thành 'have/has' – nhưng 'có ở một chỗ' (tồn tại) phải dùng There is (1 vật) / There are (nhiều vật). Giống câu 有 tồn hiện trong tiếng Trung (桌子上有一本书), nhưng tiếng Anh đưa nơi chốn ra CUỐI câu."},{"t":"Hỏi có/không: Is it + vị trí? – Yes, it is. / No, it isn't.","f":[["Is it","on","the table?"],["No,","it isn't.","It's under the chair."]],"ex":[["Is it in your bag? – Yes, it is.","Có trong túi không? – Có."],["Is it on the chair? – No, it isn't.","Có trên ghế không? – Không."]],"bad":"Is on the table?","good":"Is it on the table?","why":"Tiếng Việt bỏ chủ ngữ ('có trên bàn không?') nhưng tiếng Anh luôn cần chủ ngữ 'it'. Trả lời ngắn: Yes, it is. / No, it isn't (không trả lời 'Yes, it's' – không viết tắt ở cuối câu)."}],"vocab":[{"q":"'table' và 'chair' nghĩa là:","opts":["cái bàn / cái ghế","cái ghế / cái bàn","quyển sách / cái cặp"],"a":0,"why":{"1":"Sai: đảo ngược – table là cái bàn, chair là cái ghế.","2":"Sai: quyển sách là book, cái cặp là bag."}},{"q":"'under' nghĩa là:","opts":["ở trên","ở dưới","ở trong"],"a":1,"why":{"0":"Sai: ở trên là on.","2":"Sai: ở trong là in."}},{"q":"'look for' nghĩa là:","opts":["nhìn thấy","nhìn vào","tìm"],"a":2,"why":{"0":"Sai: nhìn thấy là see (I see it!).","1":"Sai: nhìn vào là look at; look FOR là tìm."}},{"q":"'here / there' nghĩa là:","opts":["ở đây / ở kia","ở kia / ở đây","ở đâu / ở đây"],"a":0,"why":{"1":"Sai: đảo ngược – here là ở đây, there là ở kia.","2":"Sai: 'ở đâu' là where."}},{"q":"'Em thấy rồi!' nói thế nào?","opts":["I look for it!","I see it!","I look it!"],"a":1,"why":{"0":"Sai: look for = tìm (đang tìm, chưa thấy).","2":"Sai: look cần giới từ (look at/for) và nghĩa là 'nhìn', không phải 'nhìn thấy'."}},{"q":"Điền: The book is ___ the table. (trên bàn)","opts":["under","in","on"],"a":2,"why":{"0":"Sai: under = dưới; câu cần nghĩa 'trên'.","1":"Sai: in = trong (trong ngăn bàn), không phải trên mặt bàn."}},{"q":"Điền: ___ is my book?","opts":["Where","What","Who"],"a":0,"why":{"1":"Sai: What = cái gì; hỏi vị trí phải dùng Where.","2":"Sai: Who = ai, dùng hỏi người."}},{"q":"'bag' nghĩa là:","opts":["cái bàn","cái cặp, cái túi","cái cốc"],"a":1,"why":{"0":"Sai: cái bàn là table.","2":"Sai: cái cốc là cup."}}],"grammar":[{"q":"Câu nào ĐÚNG?","opts":["The book is the table on.","On the table the book.","The book is on the table."],"a":2,"why":{"0":"Sai: giới từ phải đứng TRƯỚC danh từ (on the table) – đây là trật tự kiểu tiếng Trung 桌子上.","1":"Sai: thiếu động từ 'is' và sai trật tự câu."}},{"k":"type","q":"Điền 1 từ: There ___ two books in my bag.","model":"are","accept":["are"],"why":"Nhiều vật (two books) dùng There ARE; một vật dùng There IS."},{"q":"'Trên bàn có một quyển sách.' – chọn câu đúng:","opts":["There is a book on the table.","There are a book on the table.","The table have a book."],"a":0,"why":{"1":"Sai: 'a book' là một vật nên dùng 'is', không dùng 'are'.","2":"Sai: 'có ở một chỗ' dùng There is, không dùng have; lại sai 'have' với chủ ngữ số ít."}},{"q":"Chọn từ đúng: Where ___ my things?","opts":["is","are","am"],"a":1,"why":{"0":"Sai: things là số nhiều nên dùng are.","2":"Sai: am chỉ đi với I."}},{"q":"Phủ định của 'There is a book on the table.':","opts":["There not a book on the table.","There no is a book on the table.","There isn't a book on the table."],"a":2,"why":{"0":"Sai: thiếu động từ – phải là isn't (is not).","1":"Sai: 'no' không đặt trước 'is'; phủ định là is not / isn't."}},{"k":"type","q":"Điền 1 từ: It's ___ the chair. (Ở dưới ghế.)","model":"under","accept":["under"],"why":"Ở dưới = under; ở trên = on; ở trong = in. Giới từ đứng trước 'the chair'."}],"listen":[{"q":"Nghe: quyển sách ở đâu?","opts":["Trên bàn","Dưới ghế","Trong cặp"],"a":0,"why":{"1":"Sai: bạn nghe 'on the table', không phải 'under the chair'.","2":"Sai: không có 'in the bag' trong câu."},"audio":"The book is on the table."},{"q":"Nghe: cái cốc ở đâu?","opts":["Trên ghế","Dưới ghế","Trên bàn"],"a":1,"why":{"0":"Sai: 'under' = dưới, không phải 'on' (trên).","2":"Sai: câu nói 'chair' (ghế), không phải 'table'."},"audio":"My cup is under the chair."},{"q":"Nghe: trong ngăn bàn có mấy quyển sách?","opts":["3 quyển","1 quyển","2 quyển"],"a":2,"why":{"0":"Sai: three = 3; bạn nghe 'two'.","1":"Sai: 'are' và 'books' (số nhiều) cho thấy nhiều hơn một quyển."},"audio":"There are two books in the desk."},{"q":"Nghe: tìm thấy đồ chưa?","opts":["Chưa – chỗ này chỗ kia đều không có","Có, ở chỗ này","Có, ở chỗ kia"],"a":0,"why":{"1":"Sai: 'It's not here' = không có ở đây.","2":"Sai: 'it's not there' = cũng không ở kia."},"audio":"It's not here, and it's not there."},{"q":"Nghe: người nói đang tìm gì?","opts":["Cái cốc","Quyển sách","Cái cặp"],"a":1,"why":{"0":"Sai: cốc là 'cup'; bạn nghe 'book'.","2":"Sai: cặp là 'bag'."},"audio":"I'm looking for my book."},{"q":"Nghe: câu này có nghĩa là gì?","opts":["Không thấy đâu cả","Ở ngay đây","Thấy rồi, ở đằng kia"],"a":2,"why":{"0":"Sai: 'I see it' = mình nhìn thấy rồi.","1":"Sai: 'over there' = ở đằng kia, không phải 'here'."},"audio":"I see it! It's over there!"},{"q":"Nghe: câu này có nghĩa là gì?","opts":["Mấy thứ này đều là đồ của mình","Mấy thứ này là đồ của Kevin","Mấy thứ này không phải của mình"],"a":0,"why":{"1":"Sai: câu nói 'my things' = đồ của MÌNH, không nhắc đến Kevin.","2":"Sai: câu khẳng định 'These are…', không có 'not'."},"audio":"These are all my things."}],"hsk":[{"q":"Movers – Listening: nghe và trả lời câu hỏi. Where is the book?","opts":["Under the chair.","On the table.","In the desk."],"a":1,"why":{"0":"Sai: bài nghe nói 'on the table'.","2":"Sai: không nhắc đến 'desk'."},"audio":"My book is on the table. Where is the book?"},{"q":"Movers – Listening: nghe và trả lời câu hỏi. What is she looking for?","opts":["Her book.","A chair.","Her cup."],"a":2,"why":{"0":"Sai: bạn nghe 'my cup', không phải book.","1":"Sai: chair không có trong câu."},"audio":"Kevin, I'm looking for my cup. What is she looking for?"},{"q":"Movers – Listening: nghe và trả lời câu hỏi. How many books are in the desk?","opts":["Three.","Two.","Four."],"a":0,"why":{"1":"Sai: bạn nghe 'three' (θ: lưỡi giữa răng), không phải 'two'.","2":"Sai: four = 4."},"audio":"There are three books in the desk. How many books are in the desk?"},{"q":"Movers – Listening: nghe và trả lời câu hỏi. Where is the bag?","opts":["Here.","Over there.","At school."],"a":1,"why":{"0":"Sai: 'over there' = ở đằng kia, ngược với here.","2":"Sai: không nhắc đến school."},"audio":"I see it! Your bag is over there. Where is the bag?"},{"q":"Movers – Listening: nghe và trả lời câu hỏi. What is on the table?","opts":["Two eggs.","Some bread.","Two buns."],"a":2,"why":{"0":"Sai: bạn nghe 'buns' (bánh bao), không phải eggs.","1":"Sai: bread không có trong câu."},"audio":"There are two buns on the table. What is on the table?"}],"shadow":[{"t":"Where's my book?","focus":"Where's /weəz/ kết thúc bằng /z/ rung. book /bʊk/: u ngắn, /k/ nhẹ cuối. Xuống giọng cuối câu."},{"t":"on the table","focus":"the /ðə/: đặt đầu lưỡi giữa hai răng, không đọc 'dờ'. table /ˈteɪbl/ – 'TÂY-bồ', kết thúc /l/."},{"t":"under the chair","focus":"under nhấn âm đầu 'ĂN-đơ'. chair /tʃeə/ – 'che-ơ', không cụt thành 'che'."},{"t":"in the bag","focus":"bag /bæɡ/: mở rộng miệng như giữa 'a' và 'e'; /g/ cuối nhẹ – khác 'back'."},{"t":"It's not here.","focus":"here /hɪə/ – 'hia'. /t/ trong not nhẹ, không bật thành 'nót-tờ'."},{"t":"I see it!","focus":"Nối see‿it → 'si-dít'. Nhấn 'SEE' thể hiện vui mừng."},{"t":"There are two books.","focus":"Nối There‿are → 'the-ra' (th rung /ð/). books có /s/ cuối – đừng bỏ âm số nhiều."},{"t":"It's under the chair!","focus":"Nối It's‿under → 'it-sắn-đơ'. Nhấn 'UN-der' và 'CHAIR'."}],"dialog":{"title":"Tìm cái cốc ở văn phòng","partner":"Kevin","turns":[{"ai":"What are you looking for?","vi":"Bạn đang tìm gì thế?","model":"I'm looking for my cup.","accept":["I'm looking for my cup.","My cup.","My cup. Where is it?","Where's my cup?"],"frame":"I'm looking for my ___.","hint":"Nói bạn đang tìm cái cốc (cup)."},{"ai":"Is it on the table?","vi":"Có trên bàn không?","model":"No, it isn't. It's not here, and it's not there!","accept":["No, it isn't. It's not here, and it's not there!","No, it isn't.","No.","No, it isn't here."],"frame":"No, it ___.","hint":"Trả lời không có: No, it isn't."},{"ai":"Look under the chair!","vi":"Nhìn dưới ghế xem!","model":"I see it! It's under the chair!","accept":["I see it! It's under the chair!","I see it!","It's under the chair!","Yes! It's under the chair."],"frame":"I ___ it! It's under the ___!","hint":"Bạn nhìn thấy rồi – ở dưới ghế."},{"ai":"Is that book your book too?","vi":"Quyển sách kia cũng là của bạn à?","model":"No, it isn't. It's Linh's.","accept":["No, it isn't. It's Linh's.","No, it's Linh's book.","No, it's Linh's.","No, it isn't."],"frame":"No, it isn't. It's ___'s.","hint":"Nói không phải – là của Linh (Linh's)."}]},"reading":{"text":"There are three books on the table. Two are my books, and one is Linh's book. There is a cup under the chair. In my desk, there are these things: two buns and an egg.","vi":"Trên bàn có ba quyển sách. Hai quyển là của tôi, một quyển là của Linh. Dưới ghế có một cái cốc. Trong ngăn bàn của tôi có mấy thứ này: hai cái bánh bao và một quả trứng.","qs":[{"q":"Trên bàn có mấy quyển sách?","opts":["3","2","1"],"a":0,"why":{"1":"Sai: 2 là số sách của người viết; tổng cộng là 'three books'.","2":"Sai: 1 là số sách của Linh."}},{"q":"Mấy quyển là của người viết?","opts":["3","2","1"],"a":1,"why":{"0":"Sai: 3 là tổng số sách trên bàn.","2":"Sai: 1 quyển là của Linh."}},{"q":"Quyển còn lại là của ai?","opts":["Kevin","Sarah","Linh (Linh's)"],"a":2,"why":{"0":"Sai: bài viết nói 'Linh's book', không nhắc đến Kevin.","1":"Sai: không nhắc đến Sarah."}},{"q":"Dưới ghế có gì?","opts":["Một cái cốc","Một quyển sách","Hai cái bánh bao"],"a":0,"why":{"1":"Sai: sách ở trên bàn (on the table).","2":"Sai: bánh bao ở trong ngăn bàn (in my desk)."}},{"q":"Đúng hay sai: \"There is a cup on the chair.\"","opts":["Đúng","Sai"],"a":1,"why":{"0":"Không đúng: cái cốc ở DƯỚI ghế (under the chair), không phải TRÊN ghế (on)."}}]}},{"id":"w2-thu-5","label":"Thứ 5","title":"Lớp tiếng Anh buổi tối: đọc và viết","desc":"Nói về giờ học ở lớp tiếng Anh buổi tối của công ty (Lesson Five, read, write, listen), hỏi cô giáo cách đọc và cách viết một từ, dùng before/after class.","rule":"Hỏi cách đọc: How do you say this word? – cách viết: How do you spell it? (không nói 'How to say…?'). before / after đứng TRƯỚC danh từ: after class (ngược tiếng Trung 下课后).","cards":[{"w":"classroom","m":"phòng học, lớp học","ex":"We are in the classroom.","exm":"Chúng tôi đang ở trong phòng học.","n":"classroom = căn phòng; class = lớp (nhóm học sinh) hoặc giờ học: after class = sau giờ học.","img":"classroom"},{"w":"teacher","m":"giáo viên","ex":"Ms Chen is our teacher.","exm":"Cô Chen là giáo viên của chúng tôi.","n":"Gọi giáo viên bằng Ms/Mr + họ (Ms Chen), không gọi 'Teacher!' như dịch từ 'cô ơi/thầy ơi' (老师).","img":"teacher"},{"w":"lesson","m":"bài học","ex":"Today we learn Lesson Five.","exm":"Hôm nay chúng ta học bài 5.","n":"Lesson + số đếm (Lesson Five) = the fifth lesson. Không nói 'five lesson'."},{"w":"read","m":"đọc","ex":"Linh, read the words, please.","exm":"Linh, đọc các từ nhé.","n":"read /riːd/ – i dài. Đọc to = read aloud."},{"w":"write","m":"viết","ex":"Kevin, write the words.","exm":"Kevin, viết các từ nhé.","n":"w-r-i-t-e: chữ w câm, đọc /raɪt/ giống 'right'."},{"w":"listen","m":"nghe","ex":"Listen to me, please.","exm":"Cả lớp nghe cô nói nhé.","n":"listen TO + người/vật. Chữ t câm: /ˈlɪsn/. Khác hear (nghe thấy)."},{"w":"talk","m":"nói chuyện","ex":"Kevin, don't talk, please!","exm":"Kevin, đừng nói chuyện nhé!","n":"talk /tɔːk/ – chữ l câm. 'Don't talk!' = không được nói chuyện (trong lớp)."},{"w":"word","m":"từ","ex":"How do you say this word?","exm":"Từ này đọc thế nào ạ?","n":"word /wɜːd/ – khác world /wɜːld/ (thế giới). Số nhiều: words."},{"w":"spell","m":"đánh vần (viết từng chữ cái)","ex":"How do you spell it? – L-E-A-R-N.","exm":"Viết/đánh vần thế nào ạ? – L-E-A-R-N.","n":"Tiếng Anh hỏi cách viết bằng 'spell' (đánh vần từng chữ cái), tương đương 怎么写 khi hỏi chữ Hán."},{"w":"boys and girls","m":"các bạn nam và các bạn nữ","ex":"Boys read, and girls write.","exm":"Bạn nam đọc, bạn nữ viết.","n":"Trong lớp người lớn, giáo viên vẫn hay gọi vui cả lớp là 'boys and girls' (các bạn nam / các bạn nữ). boy /bɔɪ/ – 'boi'; girl /ɡɜːl/ – có /l/ cuối, không đọc 'gơ'.","img":"student"},{"w":"before class","m":"trước giờ học","ex":"Read the new words before class.","exm":"Đọc từ mới trước giờ học.","n":"before đứng TRƯỚC danh từ: before class. Tiếng Trung ngược lại: 上课前."},{"w":"after class","m":"sau giờ học, tan học","ex":"After class, write the words ten times!","exm":"Sau giờ học, viết các từ mười lần!","n":"after class = sau giờ học. Không nói 'class after'."}],"scene":{"setting":"6 giờ tối thứ Năm, lớp tiếng Anh buổi tối ở phòng họp của công ty. Cô Chen nhắc Kevin trật tự rồi dạy bài 5; Linh hỏi cách đọc, Kevin hỏi cách đánh vần một từ.","img":"teacher","imgPrompt":"An evening English class in a bright company meeting room: teacher, in a navy floral blouse, stands at a blank whiteboard and gestures toward it with a marker; linh, in a mustard-yellow top, takes notes; kevin and another colleague sit across the table with notebooks; city view through the windows; no readable text.","lines":[{"who":"Ms Chen","t":"OK, class! Let's begin. Kevin, don't talk, please!","vi":"Nào cả lớp! Bắt đầu học. Kevin, không nói chuyện nhé!"},{"who":"Ms Chen","t":"Today we learn Lesson Five. Listen to me, please.","vi":"Hôm nay chúng ta học bài 5. Cả lớp nghe cô đọc nhé."},{"who":"Linh","t":"Ms Chen, how do you say this word?","vi":"Thưa cô, từ này đọc thế nào ạ?"},{"who":"Ms Chen","t":"It's 'learn' – learn English.","vi":"Đọc là 'learn' – trong 'learn English' (học tiếng Anh)."},{"who":"Kevin","t":"How do you spell it?","vi":"Đánh vần thế nào ạ?"},{"who":"Ms Chen","t":"L-E-A-R-N. Boys, read. Girls, write.","vi":"L-E-A-R-N. Các bạn nam đọc. Các bạn nữ viết."},{"who":"Ms Chen","t":"After class, write the words ten times. And read Lesson Six before class!","vi":"Sau giờ học, viết mỗi từ mười lần. Và đọc trước bài 6 trước buổi học sau nhé!"}]},"patterns":[{"t":"Hỏi cách đọc / cách viết: How do you + say / spell + …?","f":[["How do you","say","this word?"],["How do you","spell","it?"]],"ex":[["How do you say this word? – It's 'learn'.","Từ này đọc thế nào? – Đọc là 'learn'."],["How do you spell it? – W-R-I-T-E.","Viết thế nào? – W-R-I-T-E."]],"bad":"How to say this word?","good":"How do you say this word?","why":"Người Việt dịch 'nói thế nào' thành 'How to say…?' – đây không phải câu hỏi hoàn chỉnh (chỉ dùng làm tiêu đề). Câu hỏi cần 'do you': How do you say…? 'you' ở đây là 'người ta nói chung', không phải riêng 'bạn'. Chú ý: How = thế nào (cách làm), khác Why = tại sao (Why are you still in bed? – thứ 2) – tiếng Trung cả hai đều là 怎么."},{"t":"Bài số mấy: Lesson + số đếm = the + số thứ tự + lesson","f":[["Lesson","Five","(bài 5)"],["the","fifth","lesson"]],"ex":[["Today we learn Lesson Three.","Hôm nay chúng ta học bài 3."],["It's the first lesson.","Đây là bài đầu tiên."]],"bad":"Today we learn five lesson.","good":"Today we learn Lesson Five.","why":"Giống 第五课: số đứng SAU 'Lesson' và dùng số đếm (Five), viết hoa vì là tên bài. Nếu số đứng trước thì phải là số thứ tự + the: the fifth lesson. 'five lesson' sai vì nghĩa là 'năm bài học' và còn thiếu -s."},{"t":"Trước / sau khi: before / after + danh từ","f":[["Read","before","class."],["Write","after","class."]],"ex":[["Read the new words before class.","Đọc từ mới trước giờ học."],["After class, let's eat buns!","Tan học mình đi ăn bánh bao nhé!"]],"bad":"Class after, I write words.","good":"After class, I write words.","why":"Tiếng Trung nói 下课后 (tan học + sau) – danh từ trước, 'sau' đứng sau; tiếng Anh ngược lại: before/after đứng TRƯỚC danh từ. Câu cấm trong lớp dùng Don't + V: Don't talk!"}],"vocab":[{"q":"'teacher' nghĩa là:","opts":["học viên, học sinh","lớp học","giáo viên"],"a":2,"why":{"0":"Sai: học viên, học sinh là student.","1":"Sai: lớp học là classroom."}},{"q":"'read / write' nghĩa là:","opts":["đọc / viết","viết / đọc","nghe / nói"],"a":0,"why":{"1":"Sai: đảo ngược – read là đọc, write là viết.","2":"Sai: nghe là listen, nói chuyện là talk."}},{"q":"'classroom' nghĩa là:","opts":["giáo viên","phòng học","bài học"],"a":1,"why":{"0":"Sai: giáo viên là teacher.","2":"Sai: bài học là lesson."}},{"q":"Từ trái nghĩa với 'before' là:","opts":["class","now","after"],"a":2,"why":{"0":"Sai: class = lớp/giờ học, không phải trái nghĩa của 'trước'.","1":"Sai: now = bây giờ."}},{"q":"'boys / girls' nghĩa là:","opts":["các bạn nam / các bạn nữ","các bạn nữ / các bạn nam","giáo viên / học sinh"],"a":0,"why":{"1":"Sai: đảo ngược – boys là nam, girls là nữ.","2":"Sai: giáo viên là teacher, học sinh là student."}},{"q":"Điền: Please ___ to me. (Cả lớp nghe cô nói nhé.)","opts":["read","listen","write"],"a":1,"why":{"0":"Sai: 'read to me' = đọc cho cô nghe – ngược ý.","2":"Sai: 'write to me' = viết thư cho cô."}},{"q":"'spell' nghĩa là:","opts":["đọc to","nói chuyện","đánh vần, viết từng chữ cái"],"a":2,"why":{"0":"Sai: đọc là read; spell là nói/viết từng chữ cái.","1":"Sai: nói chuyện là talk."}},{"q":"Điền: Don't ___! (Không được nói chuyện!)","opts":["talk","listen","spell"],"a":0,"why":{"1":"Sai: 'Don't listen!' = đừng nghe – giáo viên không nói vậy.","2":"Sai: 'Don't spell' = đừng đánh vần – không hợp tình huống."}}],"grammar":[{"q":"'bài thứ ba' nói thế nào?","opts":["Lesson Third","Lesson Three","Three Lesson"],"a":1,"why":{"0":"Sai: sau 'Lesson' dùng số đếm (Three); số thứ tự chỉ dùng với 'the … lesson'.","2":"Sai: 'three lesson' = ba bài học (và thiếu -s), không phải bài số 3."}},{"q":"Hỏi 'Từ này đọc thế nào?' – câu ĐÚNG:","opts":["How to say this word?","How you say this word?","How do you say this word?"],"a":2,"why":{"0":"Sai: 'How to…' không phải câu hỏi hoàn chỉnh – thiếu 'do you'. Lỗi dịch từng chữ rất phổ biến.","1":"Sai: thiếu trợ động từ 'do'."}},{"k":"type","q":"Điền 1 từ: How do you ___ it? (Viết/đánh vần thế nào?)","model":"spell","accept":["spell"],"why":"Hỏi cách viết một từ tiếng Anh dùng 'spell' (đánh vần). 'How do you write it?' cũng hiểu được nhưng 'spell' là cách hỏi chuẩn."},{"q":"'Sau giờ học, viết các từ.' – câu ĐÚNG:","opts":["After class, write the words.","Class after, write the words.","After write the words class."],"a":0,"why":{"1":"Sai: đây là trật tự tiếng Trung 下课后; tiếng Anh 'after' đứng trước 'class'.","2":"Sai: 'after class' phải đi liền nhau."}},{"q":"'Không được nói chuyện!' (lệnh trong lớp):","opts":["You don't talk.","Don't talk!","Not talk!"],"a":1,"why":{"0":"Sai: đây là câu kể 'bạn không nói chuyện', không phải lời ra lệnh.","2":"Sai: câu cấm phải có 'Don't' + động từ."}},{"k":"type","q":"Điền 1 từ: ___ class, read the new words. (Trước giờ học)","model":"Before","accept":["Before","before"],"why":"Trước giờ học = before class; sau giờ học = after class. before/after đứng trước danh từ."},{"q":"Câu nào hỏi CÁCH làm (thế nào)?","opts":["Why are you still in bed?","Where is my book?","How do you spell it?"],"a":2,"why":{"0":"Sai: 'Why' hỏi LÝ DO (tại sao), không hỏi cách làm. Tiếng Trung cả hai đều dùng 怎么 nên dễ nhầm.","1":"Sai: 'Where' hỏi nơi chốn."}}],"listen":[{"q":"Nghe: cô giáo nói gì?","opts":["Bắt đầu vào học","Tan học","Nghỉ giải lao"],"a":0,"why":{"1":"Sai: tan học sẽ là 'class is over' hoặc 'after class'; 'Let's begin' = bắt đầu.","2":"Sai: câu không có ý nghỉ."},"audio":"OK, class! Let's begin!"},{"q":"Nghe: hôm nay học bài mấy?","opts":["Bài 7","Bài 6","Bài 16"],"a":1,"why":{"0":"Sai: seven = 7; bạn nghe 'six'.","2":"Sai: sixteen (16) có đuôi '-teen' kéo dài; bạn nghe 'six'."},"audio":"Today we learn Lesson Six."},{"q":"Nghe: người nói hỏi gì?","opts":["Hỏi nghĩa của từ","Hỏi giờ","Hỏi cách viết (đánh vần) từ"],"a":2,"why":{"0":"Sai: hỏi nghĩa sẽ là 'What does it mean?'; 'spell' = đánh vần.","1":"Sai: không có 'What time'."},"audio":"Ms Chen, how do you spell this word?"},{"q":"Nghe: tan học họ định làm gì?","opts":["Đi ăn bánh bao","Đi học","Viết chữ"],"a":0,"why":{"1":"Sai: 'after class' = sau giờ học, họ không đi học nữa.","2":"Sai: câu nói 'eat buns' = ăn bánh bao."},"audio":"After class, let's eat buns!"},{"q":"Nghe: ai làm gì?","opts":["Nam nghe, nữ đọc","Nam đọc, nữ nghe","Cả lớp viết"],"a":1,"why":{"0":"Sai: đảo ngược – 'Boys read' = nam đọc.","2":"Sai: không có 'write' trong câu."},"audio":"Boys read, girls listen."},{"q":"Nghe: học viên phải làm gì?","opts":["Nói chuyện","Viết bài","Nghe cô giáo"],"a":2,"why":{"0":"Sai: 'Don't talk' = KHÔNG được nói chuyện.","1":"Sai: câu nói 'Listen to the teacher', không có 'write'."},"audio":"Don't talk. Listen to the teacher."},{"q":"Nghe: người nói học gì?","opts":["Học tiếng Anh và học viết từ tiếng Anh","Chỉ học nói tiếng Anh","Dạy tiếng Anh"],"a":0,"why":{"1":"Sai: câu có 'learn to write' = học viết.","2":"Sai: 'learn' = học, không phải 'teach' = dạy."},"audio":"I learn English, and I learn to write English words."}],"hsk":[{"q":"Movers – Reading & Writing: chọn từ điền chỗ trống (Lesson, say, talk, before, Ms Chen, write). \"Today we learn ___ Five.\"","opts":["say","before","Lesson","talk"],"a":2,"why":{"0":"Sai: 'say Five' không có nghĩa; trước số bài cần danh từ 'Lesson'.","1":"Sai: 'learn before Five' không có nghĩa trong câu này.","3":"Sai: talk là động từ 'nói chuyện', không đứng trước số bài."}},{"q":"Movers – chọn từ điền chỗ trống: \"How do you ___ this word? – You say 'learn'.\"","opts":["talk","Lesson","say"],"a":2,"why":{"0":"Sai: talk = nói chuyện (với ai), không dùng để hỏi cách đọc một từ.","1":"Sai: sau 'do you' cần động từ, Lesson là danh từ."}},{"q":"Movers – chọn từ điền chỗ trống: \"It's class time. Don't ___!\"","opts":["talk","say","before"],"a":0,"why":{"1":"Sai: 'say' cần tân ngữ (say something); 'Don't say!' không đứng một mình.","2":"Sai: before là giới từ, không đứng sau Don't."}},{"q":"Movers – chọn từ điền chỗ trống: \"Read the new words ___ class.\"","opts":["Lesson","before","talk"],"a":1,"why":{"0":"Sai: 'Lesson class' không có nghĩa.","2":"Sai: 'words talk class' sai ngữ pháp; cần giới từ chỉ thời gian."}},{"q":"Movers – chọn từ điền chỗ trống: \"___, how do you spell it?\"","opts":["before","say","Ms Chen"],"a":2,"why":{"0":"Sai: chỗ trống ở đầu câu là người được gọi (cô giáo).","1":"Sai: 'Say, how do you spell it?' không phải cách gọi cô giáo."}}],"shadow":[{"t":"teacher","focus":"/ˈtiːtʃə/: nhấn 'TI', i dài; ch /tʃ/ bật hơi, chu môi. Âm cuối 'ơ' nhẹ, không đọc 'ti-chơ' nặng."},{"t":"classroom","focus":"/ˈklɑːsruːm/: giữ cụm /kl/ (không thêm 'cờ-lát'), nhấn âm đầu 'CLAS'. /m/ cuối ngậm môi."},{"t":"Lesson Five","focus":"lesson /ˈlesn/ – 'LE-sn'. Five /faɪv/: nhớ /v/ cuối (răng trên chạm môi dưới) – người Việt hay bỏ."},{"t":"How do you spell it?","focus":"do you đọc nhẹ, nhanh 'đơ-yu'. spell: /p/ sau /s/ không bật hơi; nối spell‿it → 'spe-lít'. Xuống giọng cuối."},{"t":"read and write","focus":"read /riːd/ i dài, /d/ cuối. 'and' đọc nhẹ 'ờn'. write /raɪt/: w câm, /t/ cuối nhẹ."},{"t":"Don't talk!","focus":"talk /tɔːk/: l câm, đọc 'tooc'. Không đọc 'tôn' hay 'tan'."},{"t":"Listen to me, please.","focus":"listen /ˈlɪsn/: t câm. please /pliːz/ có /z/ cuối rung."},{"t":"After class, write the words.","focus":"After nhấn 'ÁP'. words /wɜːdz/: kết thúc /dz/ – đừng bỏ âm số nhiều."}],"dialog":{"title":"Hỏi cô giáo trong lớp tiếng Anh buổi tối","partner":"Ms Chen","turns":[{"ai":"OK, class! Let's begin. Don't talk, please!","vi":"Nào cả lớp! Bắt đầu học. Không nói chuyện nhé!","model":"OK. Which lesson is it today?","accept":["OK. Which lesson is it today?","Which lesson is it today?","Which lesson is it?","What lesson is it today?"],"frame":"OK. Which ___ is it today?","hint":"Hỏi hôm nay học bài mấy."},{"ai":"Lesson Seven.","vi":"Bài 7.","model":"Ms Chen, how do you say this word?","accept":["Ms Chen, how do you say this word?","How do you say this word?","How do you say it?","How do you read this word?"],"frame":"How do you ___ this word?","hint":"Hỏi cô cách đọc từ này."},{"ai":"It's 'write' – write a word.","vi":"Đọc là 'write' – write a word (viết một từ).","model":"How do you spell it?","accept":["How do you spell it?","How do you spell 'write'?","How do you spell this word?","Ms Chen, how do you spell it?"],"frame":"How do you ___ it?","hint":"Hỏi cách viết (đánh vần)."},{"ai":"W-R-I-T-E. After class, write it ten times!","vi":"W-R-I-T-E. Sau giờ học, viết mười lần nhé!","model":"OK! Thank you, Ms Chen.","accept":["OK! Thank you, Ms Chen.","OK, thank you!","Thank you, Ms Chen.","OK, thanks!"],"frame":"OK! ___ you, Ms Chen.","hint":"Nhận lời và cảm ơn cô."}]},"reading":{"text":"My name is Linh. Class begins, and our teacher, Ms Chen, says, \"Don't talk!\" Today we learn Lesson Nine. The boys read in English, and the girls write English words. After class, I write ten words.","vi":"Tôi tên là Linh. Vào giờ học, cô giáo của chúng tôi – cô Chen – nói: “Không được nói chuyện!” Hôm nay chúng tôi học bài 9. Các bạn nam đọc tiếng Anh, các bạn nữ viết từ tiếng Anh. Sau giờ học, tôi viết mười từ.","qs":[{"q":"Hôm nay học bài mấy?","opts":["Bài 9","Bài 5","Bài 10"],"a":0,"why":{"1":"Sai: bài viết nói 'Lesson Nine'.","2":"Sai: ten (10) là số từ người viết viết sau giờ học."}},{"q":"Các bạn nam làm gì?","opts":["Viết từ","Đọc tiếng Anh","Nói chuyện"],"a":1,"why":{"0":"Sai: viết từ là việc của các bạn nữ.","2":"Sai: cô giáo bảo 'Don't talk!'."}},{"q":"Các bạn nữ làm gì?","opts":["Đọc tiếng Anh","Nghe cô giáo hát","Viết từ tiếng Anh"],"a":2,"why":{"0":"Sai: đọc là việc của các bạn nam.","1":"Sai: không có trong bài."}},{"q":"Sau giờ học người viết làm gì?","opts":["Viết mười từ","Đọc mười bài","Đi ăn tối"],"a":0,"why":{"1":"Sai: bài viết nói 'write ten words' – viết, không phải đọc.","2":"Sai: không nhắc đến ăn uống."}},{"q":"Cô giáo nói gì?","opts":["Viết mười từ","Không được nói chuyện","Đi về đi"],"a":1,"why":{"0":"Sai: viết mười từ là việc người viết tự làm sau giờ học, không phải câu cô nói.","2":"Sai: không có trong bài."}}]}},{"id":"w2-thu-6","label":"Thứ 6","title":"Ngày tháng, thứ, buổi trong ngày, phương tiện","desc":"Hỏi và nói ngày tháng, thứ, buổi chiều/tối, đi bằng phương tiện gì (by train, by bus, by car, by plane) khi lên kế hoạch công tác – qua cảnh Linh và Kevin xem bản đồ chuẩn bị đi Đà Nẵng.","rule":"Ngày đọc bằng số thứ tự: the sixth of September. Hỏi: What's the date? / What day is it? Phương tiện: by + xe, không có 'the' (by train, by bus). on Sunday, in the evening, at ten – nhưng tomorrow/today không có giới từ.","cards":[{"w":"today","m":"hôm nay","ex":"Is Sarah back today?","exm":"Hôm nay chị Sarah có về không?","n":"Không thêm giới từ: không nói 'in today' hay 'on today'. Nhấn âm 2: to-DAY."},{"w":"tomorrow","m":"ngày mai","ex":"She comes back tomorrow afternoon.","exm":"Chiều mai chị ấy về.","n":"tomorrow afternoon = chiều mai (không có 'in'). Viết 1 chữ m, 2 chữ r."},{"w":"come back","m":"trở về","ex":"Sarah comes back by train.","exm":"Chị Sarah về bằng tàu hỏa.","n":"he/she + comes back (thêm -s). 'Sarah is back' = chị Sarah đã về."},{"w":"afternoon","m":"buổi chiều","ex":"I'm home at five in the afternoon.","exm":"Năm giờ chiều tôi về đến nhà.","n":"in the afternoon (có in the). Nhấn âm cuối: after-NOON. Chào: Good afternoon."},{"w":"evening","m":"buổi tối","ex":"It's evening now. Let's go home!","exm":"Tối rồi. Về nhà thôi!","n":"in the evening. Good evening = chào buổi tối; Good night = chúc ngủ ngon / tạm biệt buổi tối."},{"w":"What's the date?","m":"Hôm nay ngày mấy?","ex":"What's the date today? – It's the fifth of September.","exm":"Hôm nay ngày mấy? – Ngày mùng 5 tháng 9.","n":"Đọc ngày bằng số thứ tự: the fifth, the sixth, the twentieth. Viết: 5 September / 5th September.","img":"calendar"},{"w":"Sunday","m":"Chủ nhật","ex":"Tomorrow is Sunday.","exm":"Mai là Chủ nhật.","n":"Thứ trong tuần viết hoa: Monday (T2), Tuesday (T3), Wednesday (T4), Thursday (T5), Friday (T6), Saturday (T7), Sunday (CN). Đi với 'on': on Sunday."},{"w":"September","m":"tháng Chín","ex":"It's the sixth of September.","exm":"Hôm nay là ngày 6 tháng 9.","n":"Tháng viết hoa: January … December. Nhấn âm 2: sep-TEM-ber. Hỏi 'tháng mấy' không như tiếng Việt 'tháng + số'."},{"w":"by train","m":"bằng tàu hỏa","ex":"She comes back by train, not by plane.","exm":"Chị ấy về bằng tàu hỏa, không phải máy bay.","n":"by + phương tiện, KHÔNG có the/a: by train, by plane (máy bay). Nhưng đi bộ là on foot."},{"w":"by bus","m":"bằng xe buýt","ex":"I go to work by bus.","exm":"Tôi đi làm bằng xe buýt.","n":"bus /bʌs/ – 'bắt-s', không đọc 'buýt'. Số nhiều: buses.","img":"bus"},{"w":"by car","m":"bằng ô tô","ex":"Kevin goes to work by car.","exm":"Kevin đi làm bằng ô tô.","n":"car /kɑː/ – 'ca' dài. Xe máy là motorbike (by motorbike).","img":"car"},{"w":"go to bed","m":"đi ngủ","ex":"Don't turn on the TV. Go to bed!","exm":"Đừng bật tivi. Đi ngủ đi!","n":"go to bed (không có 'the'). 'turn on the TV' = bật tivi; 'I know!' = biết rồi!"}],"scene":{"setting":"Chiều thứ Sáu, trên con phố gần văn phòng. Linh và Kevin xem bản đồ, lên kế hoạch cho chuyến công tác Đà Nẵng tuần sau. Chị Sarah (quản lý) đang đi công tác, sắp về.","img":"where","imgPrompt":"A sunny Hanoi street outside the office, motorbikes passing behind: linh, in a mustard-yellow top, points at a large paper map that kevin, in a blue polo shirt, holds open; both smile as they plan a business trip.","lines":[{"who":"Linh","t":"Is Sarah back today? Is she coming by plane?","vi":"Hôm nay chị Sarah có về không anh? Chị ấy đi máy bay à?"},{"who":"Kevin","t":"No, she comes back tomorrow afternoon, by train.","vi":"Không, chiều mai chị ấy mới về. Chị ấy về bằng tàu hỏa."},{"who":"Linh","t":"What's the date tomorrow? What day is it?","vi":"Mai là ngày mấy tháng mấy? Thứ mấy anh nhỉ?"},{"who":"Kevin","t":"It's Sunday, the sixth of September. On Monday, we go to Da Nang by plane.","vi":"Chủ nhật, ngày 6 tháng 9. Thứ Hai mình bay đi Đà Nẵng."},{"who":"Linh","t":"By plane? Not by car or by bus?","vi":"Đi máy bay ạ? Không đi ô tô hay xe buýt à?"},{"who":"Kevin","t":"By plane! Sunday evening, don't turn on the TV. Go to bed early!","vi":"Máy bay! Tối Chủ nhật đừng xem tivi nhé. Đi ngủ sớm đi!"},{"who":"Linh","t":"I know, I know!","vi":"Em biết rồi, biết rồi!"}]},"patterns":[{"t":"Ngày và thứ: What's the date? – It's the + số thứ tự + of + tháng / What day is it? – It's + thứ","f":[["What's","the date","today?"],["It's","the sixth","of September."],["What","day","is it?"],["It's","Sunday."]],"ex":[["What's the date today? – It's the fifth of September.","Hôm nay ngày mấy? – Ngày 5 tháng 9."],["What day is it today? – It's Monday.","Hôm nay thứ mấy? – Thứ Hai."]],"bad":"It's six September.","good":"It's the sixth of September.","why":"Ngày phải đọc bằng SỐ THỨ TỰ (the sixth), không dùng số đếm (six), dù viết là 6 September. Thứ tự ngày → tháng giống tiếng Việt (6/9), ngược tiếng Trung (九月六号: tháng trước). Phân biệt câu hỏi: 'What's the date?' hỏi ngày tháng, 'What day is it?' hỏi thứ."},{"t":"Phương tiện: by + xe (không có the/a)","f":[["She comes back","by","train."],["I go to work","by","bus."]],"ex":[["Sarah comes back by train.","Chị Sarah về bằng tàu hỏa."],["I go to work by bus.","Tôi đi làm bằng xe buýt."],["Kevin goes to work by car.","Kevin đi làm bằng ô tô."]],"bad":"I go to work by the bus.","good":"I go to work by bus.","why":"Sau 'by' dùng danh từ trơn, không có the/a/my. Tiếng Trung đặt phương tiện TRƯỚC động từ (坐火车回来), tiếng Anh đặt SAU: comes back by train. Riêng đi bộ là 'on foot'."},{"t":"Giới từ thời gian: at + giờ, on + thứ, in the + buổi; today/tomorrow không có giới từ","f":[["She's back","tomorrow","afternoon."],["I go to bed","at","ten in the evening."],["We go home","on","Sunday."]],"ex":[["Sarah comes back tomorrow afternoon.","Chiều mai chị Sarah về."],["I go to bed at ten in the evening.","Tôi đi ngủ lúc 10 giờ tối."]],"bad":"She comes back in tomorrow afternoon.","good":"She comes back tomorrow afternoon.","why":"today, tomorrow, tomorrow afternoon KHÔNG đi với in/on/at. Còn lại: at + giờ (at ten), on + thứ (on Sunday), in the + buổi (in the evening). Thời gian thường đặt ở cuối câu, không đặt trước động từ như tiếng Trung (她明天下午到)."}],"vocab":[{"q":"'today / tomorrow' nghĩa là:","opts":["ngày mai / hôm nay","hôm qua / hôm nay","hôm nay / ngày mai"],"a":2,"why":{"0":"Sai: đảo ngược – today là hôm nay.","1":"Sai: hôm qua là yesterday."}},{"q":"'afternoon / evening' nghĩa là:","opts":["buổi chiều / buổi tối","buổi sáng / buổi chiều","buổi tối / buổi chiều"],"a":0,"why":{"1":"Sai: buổi sáng là morning.","2":"Sai: đảo ngược – afternoon là buổi chiều."}},{"q":"'train / plane' nghĩa là:","opts":["máy bay / tàu hỏa","tàu hỏa / máy bay","xe buýt / ô tô"],"a":1,"why":{"0":"Sai: đảo ngược – train là tàu hỏa.","2":"Sai: xe buýt là bus, ô tô là car."}},{"q":"'Sunday' là:","opts":["Thứ Bảy","Thứ Hai","Chủ nhật"],"a":2,"why":{"0":"Sai: Thứ Bảy là Saturday.","1":"Sai: Thứ Hai là Monday."}},{"q":"'go to bed' nghĩa là:","opts":["đi ngủ","thức dậy","đi học"],"a":0,"why":{"1":"Sai: thức dậy là get up (học thứ 2).","2":"Sai: đi học là go to school."}},{"q":"Điền: I ___ he is a teacher. (Tôi biết anh ấy là giáo viên.)","opts":["can","know","see"],"a":1,"why":{"0":"Sai: can = có thể / biết LÀM (kỹ năng): I can speak English. Biết THÔNG TIN thì dùng know (giống 知道 vs 会).","2":"Sai: see = nhìn thấy."}},{"q":"Điền: Don't turn ___ the TV. (Đừng bật tivi.)","opts":["in","at","on"],"a":2,"why":{"0":"Sai: bật thiết bị là 'turn on'; 'turn in' không có nghĩa này.","1":"Sai: 'turn at' không có nghĩa 'bật'."}},{"q":"Điền: She comes back ___ train.","opts":["by","on","in"],"a":0,"why":{"1":"Sai: 'on the train' = ở trên tàu (phải có the); nói phương tiện dùng 'by train'.","2":"Sai: 'in train' sai; phương tiện công cộng dùng 'by'."}}],"grammar":[{"q":"Ngày 6 tháng 9 đọc là:","opts":["the six of September","the sixth of September","September the six"],"a":1,"why":{"0":"Sai: ngày phải dùng số thứ tự (sixth), không dùng số đếm (six).","2":"Sai: 'six' là số đếm; nếu nói tháng trước thì phải là 'September the sixth'."}},{"q":"Hỏi 'Hôm nay ngày mấy?' – câu ĐÚNG:","opts":["What date today?","What day date is today?","What's the date today?"],"a":2,"why":{"0":"Sai: thiếu động từ 'is' (lỗi bỏ to be của người Việt).","1":"Sai: thừa từ, sai trật tự; 'What day' hỏi thứ, 'What's the date' hỏi ngày."}},{"k":"type","q":"Điền 1 từ: What ___ is it today? – It's Monday.","model":"day","accept":["day"],"why":"Hỏi thứ: What day is it? Hỏi ngày tháng: What's the date?"},{"q":"'Chị Sarah về bằng tàu hỏa.' – câu ĐÚNG:","opts":["Sarah comes back by train.","Sarah comes back by the train.","Sarah by train comes back."],"a":0,"why":{"1":"Sai: sau 'by' không dùng 'the'.","2":"Sai: đây là trật tự tiếng Trung (坐火车回来); tiếng Anh đặt 'by train' sau động từ."}},{"q":"Chọn giới từ: She comes back ___ Sunday.","opts":["in","on","at"],"a":1,"why":{"0":"Sai: 'in' dùng cho buổi (in the evening), tháng, năm; thứ trong tuần dùng 'on'.","2":"Sai: 'at' dùng cho giờ (at ten)."}},{"q":"'Chiều mai chị ấy đến.' – câu ĐÚNG:","opts":["She comes in tomorrow afternoon.","She tomorrow afternoon comes.","She comes tomorrow afternoon."],"a":2,"why":{"0":"Sai: 'tomorrow' không đi với giới từ 'in'.","1":"Sai: thời gian không đứng giữa chủ ngữ và động từ như tiếng Trung (她明天下午到)."}},{"q":"'Biết rồi!' (tôi biết thông tin đó rồi) nói thế nào?","opts":["I know!","I can!","I see it!"],"a":0,"why":{"1":"Sai: 'I can' = tôi có thể / tôi làm được – không phải 'biết rồi'.","2":"Sai: 'I see it!' = tôi nhìn thấy nó rồi (học thứ 4)."}}],"listen":[{"q":"Nghe: hôm nay ngày mấy?","opts":["6/9","5/9 (ngày 5 tháng 9)","9/5 (ngày 9 tháng 5)"],"a":1,"why":{"0":"Sai: bạn nghe 'fifth' (5), không phải 'sixth' (6).","2":"Sai: September là tháng 9; 'the fifth' là ngày 5."},"audio":"Today is the fifth of September."},{"q":"Nghe: ngày mai là thứ mấy?","opts":["Thứ Bảy","Thứ Hai","Chủ nhật"],"a":2,"why":{"0":"Sai: Thứ Bảy là Saturday; bạn nghe 'Sunday'.","1":"Sai: Thứ Hai là Monday."},"audio":"Tomorrow is Sunday."},{"q":"Nghe: chị Sarah về lúc nào, bằng gì?","opts":["Chiều mai, bằng máy bay","Chiều nay, bằng tàu hỏa","Sáng mai, bằng máy bay"],"a":0,"why":{"1":"Sai: 'tomorrow' = ngày mai; 'plane' = máy bay.","2":"Sai: 'afternoon' = buổi chiều, không phải buổi sáng (morning)."},"audio":"Sarah comes back tomorrow afternoon, by plane."},{"q":"Nghe: người nói đi ngủ lúc mấy giờ?","opts":["10 giờ sáng","10 giờ tối","2 giờ chiều"],"a":1,"why":{"0":"Sai: 'in the evening' = buổi tối.","2":"Sai: ten = 10, không phải two (2)."},"audio":"I go to bed at ten in the evening."},{"q":"Nghe: người nói bảo gì?","opts":["Bật tivi lên","Đi xem tivi đi","Đừng bật tivi"],"a":2,"why":{"0":"Sai: 'Don't turn on' = ĐỪNG bật.","1":"Sai: câu có 'Don't' – là lời cấm."},"audio":"It's evening. Don't turn on the TV."},{"q":"Nghe: anh ấy đi làm bằng gì?","opts":["Ô tô","Xe buýt","Tàu hỏa"],"a":1,"why":{"0":"Sai: ô tô là car; bạn nghe 'bus'.","2":"Sai: tàu hỏa là train."},"audio":"He comes to work by bus."},{"q":"Nghe: ngày nào?","opts":["Thứ Ba, 20/8","Thứ Tư, 12/8","Thứ Tư, 20/8"],"a":2,"why":{"0":"Sai: Thứ Ba là Tuesday; bạn nghe 'Wednesday' (đọc 'WENZ-day', chữ d đầu tiên câm).","1":"Sai: twentieth (20) khác twelfth (12)."},"audio":"Wednesday, the twentieth of August."}],"hsk":[{"q":"TOEIC qi!","accept":["不客气！","不客气","不客气。"],"frame":"___！","hint":"Đáp lời cảm ơn: 'Không có gì!'"},{"ai":"再见！","py":"Zàijiàn!","vi":"Tạm biệt nhé!","model":"再见！","mpy":"Zàijiàn!","accept":["再见！","再见","再见。","王经理，再见！"],"frame":"___！","hint":"Chào tạm biệt lại."}]},"reading":{"text":"你好！我叫阮安。我不是王丽。王丽是妈妈。王经理是爸爸吗？是。谢谢王经理！","py":"Nǐ hǎo! Wǒ jiào Ruǎn Ān. Wǒ bú shì Wáng Lì. Wáng Lì shì māma. Wáng jīnglǐ shì bàba ma? Shì. Xièxie Wáng jīnglǐ!","vi":"Xin chào! Tôi tên là Nguyễn An. Tôi không phải Vương Lệ. Vương Lệ là mẹ (chị ấy có con rồi). Giám đốc Vương là bố à? Đúng vậy. Cảm ơn giám đốc Vương!","qs":[{"q":"Người viết tên là gì?","opts":["阮安","王丽","王经理"],"a":0,"why":{"1":"Bài viết 我不是王丽 — người viết nói rõ mình KHÔNG phải 王丽.","2":"王经理 là người được cảm ơn ở cuối bài; người viết tự giới thiệu 我叫阮安."}},{"q":"Theo bài, 王丽 là gì?","opts":["một người mẹ","một người bố","chính người viết"],"a":0,"why":{"1":"Bố là 爸爸; bài viết 王丽是妈妈 — là mẹ.","2":"Người viết nói 我不是王丽, nên 王丽 không phải người viết."}},{"q":"王经理 là gì?","opts":["một người bố","một người mẹ","chính người viết"],"a":0,"why":{"1":"Câu hỏi 王经理是爸爸吗？ được trả lời 是 — ông ấy là bố, không phải mẹ.","2":"Người viết là 阮安 (我叫阮安)."}},{"q":"阮安 cảm ơn ai?","opts":["王经理","王丽"],"a":0,"why":{"1":"Câu cuối là 谢谢王经理 — cảm ơn giám đốc Vương, không phải 王丽."}},{"q":"Đúng hay sai: 王丽是爸爸。","opts":["Đúng","Sai"],"a":1,"why":{"0":"Bài viết 王丽是妈妈 — 王丽 là mẹ, không phải bố."}}]}},{"id":"w1-thu-3","label":"Thứ 3","title":"Hỏi tên, làm quen","desc":"Hỏi và nói tên, hỏi lại 'còn bạn?', nói 'rất vui được làm quen' và luyện nhóm âm zh ch sh r / z c s / j q x.","rule":"Câu hỏi với 什么 giữ nguyên trật tự câu kể: 什么 đứng đúng chỗ của câu trả lời (你叫什么名字？→ 我叫阮安). 也 luôn đứng sau chủ ngữ: 我也很高兴.","cards":[{"w":"什么","py":"shénme","m":"gì, cái gì","ex":"你叫什么名字？","expy":"Nǐ jiào shénme míngzi?","exm":"Bạn tên là gì?","n":"Đặt 什么 đúng chỗ thông tin muốn hỏi, không đưa lên đầu câu. sh uốn lưỡi; 么 đọc nhẹ.","img":"what"},{"w":"名字","py":"míngzi","m":"tên","ex":"你叫什么名字？","expy":"Nǐ jiào shénme míngzi?","exm":"Bạn tên là gì?","n":"字 đọc nhẹ 'zi' (z + ư), không đọc 'di'.","img":"name"},{"w":"他","py":"tā","m":"anh ấy, cậu ấy, ông ấy","ex":"他是阮明。","expy":"Tā shì Ruǎn Míng.","exm":"Anh ấy là Nguyễn Minh.","n":"Chữ có bộ 亻 (nhân đứng), dùng cho nam. Thanh 1.","img":"person"},{"w":"您","py":"nín","m":"ông, bà, cô, chú (cách gọi kính trọng)","ex":"王经理，您好！","expy":"Wáng jīnglǐ, nín hǎo!","exm":"Chào giám đốc Vương ạ!","n":"Dùng với cấp trên, khách hàng, người lớn tuổi — người cần tôn trọng. Là chữ 你 có thêm 心 (tim) bên dưới.","img":"polite"},{"w":"们","py":"men","m":"các, những (số nhiều cho người)","ex":"你们好！","expy":"Nǐmen hǎo!","exm":"Chào mọi người!","n":"Chỉ gắn sau đại từ/danh từ chỉ người: 我们, 你们. Luôn đọc nhẹ."},{"w":"我们","py":"wǒmen","m":"chúng tôi, chúng mình","ex":"我们很高兴！","expy":"Wǒmen hěn gāoxìng!","exm":"Chúng tôi rất vui!","n":"我 + 们. 们 đọc nhẹ.","img":"team"},{"w":"你们","py":"nǐmen","m":"các bạn, các anh chị","ex":"你们好！","expy":"Nǐmen hǎo!","exm":"Chào các anh chị!","n":"Chào nhiều người cùng lúc: 你们好！"},{"w":"呢","py":"ne","m":"còn … thì sao?","ex":"我叫王丽。你呢？","expy":"Wǒ jiào Wáng Lì. Nǐ ne?","exm":"Tôi tên Vương Lệ. Còn bạn?","n":"Hỏi lại đúng câu vừa nói mà không cần lặp lại: 你呢？ = Còn bạn? Đọc nhẹ."},{"w":"很","py":"hěn","m":"rất","ex":"我很高兴。","expy":"Wǒ hěn gāoxìng.","exm":"Tôi rất vui.","n":"Trước tính từ thường có 很: nói 我很高兴, không nói 我是高兴. Trước thanh 1 chỉ đọc nửa thanh 3 (thấp, không vòng lên)."},{"w":"高兴","py":"gāoxìng","m":"vui, vui mừng","ex":"很高兴认识你！","expy":"Hěn gāoxìng rènshi nǐ!","exm":"Rất vui được quen bạn!","n":"Thanh 1 + thanh 4. x mặt lưỡi."},{"w":"认识","py":"rènshi","m":"quen, quen biết (một người)","ex":"我们认识阮明。","expy":"Wǒmen rènshi Ruǎn Míng.","exm":"Chúng tôi quen Nguyễn Minh.","n":"⚠ Âm Hán Việt 'nhận thức' nhưng nghĩa là QUEN BIẾT. r và sh đều uốn lưỡi; 识 đọc nhẹ.","img":"handshake"},{"w":"也","py":"yě","m":"cũng","ex":"我也很高兴！","expy":"Wǒ yě hěn gāoxìng!","exm":"Tôi cũng rất vui!","n":"Đứng sau chủ ngữ, trước động từ/tính từ: 我也…, không nói 也我….","img":"also"}],"scene":{"setting":"Buổi giao lưu Việt – Trung do công ty tổ chức, hội trường treo đèn lồng đỏ. 阮安 làm quen với đồng nghiệp người Trung Quốc 王丽; 王丽 chỉ cho cô biết anh đồng nghiệp ở góc phòng tên là gì.","img":"scene-zh-networking","imgPrompt":"Photo of an and wangli meeting for the first time at a Vietnamese–Chinese exchange event in a hall decorated with red lanterns, both waving hello and smiling. No text in image.","lines":[{"who":"王丽","t":"你好！你叫什么名字？","py":"Nǐ hǎo! Nǐ jiào shénme míngzi?","vi":"Chào bạn! Bạn tên là gì?"},{"who":"阮安","t":"我叫阮安。你呢？","py":"Wǒ jiào Ruǎn Ān. Nǐ ne?","vi":"Mình tên Nguyễn An. Còn bạn?"},{"who":"王丽","t":"我叫王丽。很高兴认识你！","py":"Wǒ jiào Wáng Lì. Hěn gāoxìng rènshi nǐ!","vi":"Mình tên Vương Lệ. Rất vui được quen bạn!"},{"who":"阮安","t":"我也很高兴认识你！他呢？他叫什么名字？","py":"Wǒ yě hěn gāoxìng rènshi nǐ! Tā ne? Tā jiào shénme míngzi?","vi":"Mình cũng rất vui được quen bạn! Còn anh kia? Anh ấy tên gì? (chỉ về góc phòng)"},{"who":"王丽","t":"他叫阮明。你认识他吗？","py":"Tā jiào Ruǎn Míng. Nǐ rènshi tā ma?","vi":"Anh ấy tên Nguyễn Minh. Bạn quen anh ấy không?"},{"who":"阮安","t":"不认识。","py":"Bú rènshi.","vi":"Không quen."},{"who":"王丽","t":"我们认识他！阮安，我们很高兴认识你！","py":"Wǒmen rènshi tā! Ruǎn Ān, wǒmen hěn gāoxìng rènshi nǐ!","vi":"Bọn mình quen anh ấy! An ơi, cả nhóm bọn mình rất vui được quen bạn!"},{"who":"阮安","t":"谢谢！我也很高兴！","py":"Xièxie! Wǒ yě hěn gāoxìng!","vi":"Cảm ơn! Mình cũng rất vui!"}]},"patterns":[{"t":"Câu hỏi với 什么: giữ trật tự câu kể","f":[["你叫","什么","名字？"],["我叫","阮安","。"]],"ex":[["你叫什么名字？","Bạn tên là gì?"],["他叫什么名字？","Anh ấy tên là gì?"]],"bad":"什么你叫名字？","good":"你叫什么名字？","why":"Tiếng Trung không đưa từ để hỏi lên đầu câu như tiếng Anh (What is…?). 什么 đứng đúng chỗ mà câu trả lời sẽ đứng — giống tiếng Việt 'Bạn tên là gì?'."},{"t":"…呢？ hỏi lại 'còn … thì sao?'","f":[["你","呢","？"],["他","呢","？"]],"ex":[["我叫王丽。你呢？","Tôi tên Vương Lệ. Còn bạn?"],["我很高兴。你呢？","Tôi rất vui. Còn bạn?"]],"bad":"我叫王丽。你吗？","good":"我叫王丽。你呢？","why":"吗 cần cả một câu kể đứng trước (你是阮安吗？). Chỉ có một đại từ/tên mà muốn hỏi 'còn bạn?' thì dùng 呢."},{"t":"很 + tính từ (không dùng 是)","f":[["我","很","高兴"],["我们","很","高兴"]],"ex":[["我很高兴。","Tôi rất vui."],["很高兴认识你！","Rất vui được quen bạn!"]],"bad":"我是高兴。","good":"我很高兴。","why":"Tính từ (高兴) tự làm vị ngữ, không cần 是 — giống tiếng Việt nói 'tôi vui', không nói 'tôi là vui'. Thường thêm 很 trước tính từ."},{"t":"也 đứng sau chủ ngữ","f":[["我","也","很高兴"],["我们","也","认识阮明"]],"ex":[["我也很高兴。","Tôi cũng rất vui."],["我也认识他。","Tôi cũng quen anh ấy."]],"bad":"也我很高兴。","good":"我也很高兴。","why":"也 là phó từ: đứng sau chủ ngữ, trước động từ/tính từ. Tiếng Việt cũng nói 'tôi CŨNG vui', không nói 'cũng tôi vui'."}],"vocab":[{"q":"什么 (shénme) nghĩa là gì?","opts":["cái gì","tên","rất"],"a":0,"why":{"1":"'Tên' là 名字 (míngzi).","2":"'Rất' là 很 (hěn)."}},{"q":"名字 (míngzi) nghĩa là gì?","opts":["tên","chữ","bạn"],"a":0,"why":{"1":"Chữ 字 đứng riêng có nghĩa 'chữ', nhưng 名字 là cả một từ = tên.","2":"'Bạn' là 你 (nǐ)."}},{"q":"Chào giám đốc lớn tuổi của công ty (ví dụ 王经理), nên dùng câu nào?","opts":["你好！","您好！"],"a":1,"why":{"0":"你 dùng với người ngang hàng, đồng nghiệp thân; với cấp trên, khách hàng, người lớn tuổi nên dùng 您 để tỏ sự kính trọng."}},{"q":"'Chúng tôi' và 'các bạn' lần lượt là?","opts":["我们 / 你们","你们 / 我们","我 / 你"],"a":0,"why":{"1":"Ngược rồi: 你们 là 'các bạn', 我们 là 'chúng tôi'.","2":"我/你 là số ít (tôi/bạn); số nhiều phải thêm 们."}},{"q":"认识 (rènshi) nghĩa là gì?","opts":["quen biết (một người)","nhận thức, suy nghĩ","cảm ơn"],"a":0,"why":{"1":"⚠ Bẫy Hán Việt: âm 'nhận thức' nhưng 认识 nghĩa là quen biết. 很高兴认识你 = rất vui được quen bạn.","2":"Cảm ơn là 谢谢 (xièxie)."}},{"q":"Điền: 我很___认识你。(Tôi rất vui được quen bạn.)","opts":["高兴","名字","什么"],"a":0,"why":{"1":"名字 là 'tên' — danh từ, không đi sau 很.","2":"什么 là từ để hỏi; câu này là câu kể, không hỏi."}},{"q":"Điền: 我叫阮安，你___？(Còn bạn?)","opts":["呢","吗","也"],"a":0,"why":{"1":"吗 cần một câu kể đầy đủ đứng tr
